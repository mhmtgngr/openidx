    # --- Vault ---
    VaultSecretCreate:
      type: object
      required: [name, type, value]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [password, api_key, ssh_key, generic]
        description:
          type: string
        value:
          type: string
          writeOnly: true
        metadata:
          type: object
          additionalProperties: true

    SecretMeta:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [password, api_key, ssh_key, generic]
        description:
          type: string
        current_version:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SecretDetail:
      allOf:
        - $ref: '#/components/schemas/SecretMeta'
        - type: object
          properties:
