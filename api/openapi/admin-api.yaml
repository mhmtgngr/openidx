components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: The request was malformed or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid bearer token was presented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource in the caller's organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: A short machine-readable reason
        details:
          type: string
          description: Operator-facing detail, when the handler has one
    Dashboard:
      type: object
      properties:
        total_users:
          type: integer
        active_users:
          type: integer
        total_groups:
          type: integer
        total_applications:
          type: integer
        active_sessions:
          type: integer
        pending_reviews:
          type: integer
        security_alerts:
          type: integer
        recent_activity:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              message:
                type: string
              actor_id:
                type: string
              actor_name:
                type: string
              timestamp:
                type: string
                format: date-time
        auth_stats:
          type: object
          properties:
            total_logins:
              type: integer
            successful_logins:
              type: integer
            failed_logins:
              type: integer
            mfa_usage:
              type: integer
            logins_by_method:
              type: object
              additionalProperties:
                type: integer
            logins_by_day:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  count:
                    type: integer
        security_alert_details:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              count:
                type: integer
              timestamp:
                type: string
                format: date-time

    Settings:
      type: object
      properties:
        general:
          type: object
          properties:
            organization_name:
              type: string
            support_email:
              type: string
              format: email
            default_language:
              type: string
            default_timezone:
              type: string
        security:
          type: object
          properties:
            password_policy:
              type: object
              properties:
                min_length:
                  type: integer
                require_uppercase:
                  type: boolean
                require_lowercase:
                  type: boolean
                require_numbers:
                  type: boolean
                require_special:
                  type: boolean
                max_age:
                  type: integer
                  description: Days until password expires
                history:
                  type: integer
                  description: Number of previous passwords to remember
            session_timeout:
              type: integer
              description: Minutes
            max_failed_logins:
              type: integer
            lockout_duration:
              type: integer
              description: Minutes
            require_mfa:
              type: boolean
            allowed_ip_ranges:
              type: array
              items:
                type: string
        authentication:
          type: object
          properties:
            allow_registration:
              type: boolean
            require_email_verify:
              type: boolean
            allowed_domains:
              type: array
              items:
                type: string
            social_providers:
              type: array
              items:
                type: string
            mfa_methods:
              type: array
              items:
                type: string
        branding:
          type: object
          properties:
            logo_url:
              type: string
            favicon_url:
              type: string
            primary_color:
              type: string
            secondary_color:
              type: string
            custom_css:
              type: string
            login_page_title:
              type: string
            login_page_message:
              type: string

    Application:
      type: object
      properties:
        id:
          type: string
        client_id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [web, native, service]
        protocol:
          type: string
          enum: [oidc, saml]
        base_url:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationCreate:
      type: object
      required: [name, type, protocol]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [web, native, service]
        protocol:
          type: string
          enum: [oidc, saml]
        base_url:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true

    ApplicationUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        base_url:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    ApplicationSSOSettings:
      type: object
      properties:
        id:
          type: string
        application_id:
          type: string
        enabled:
          type: boolean
        use_refresh_tokens:
          type: boolean
        access_token_lifetime:
          type: integer
          description: Seconds
        refresh_token_lifetime:
          type: integer
          description: Seconds
        require_consent:
          type: boolean

    DirectoryIntegration:
