          type: string
        created_at:
          type: string
          format: date-time

    VaultGrantCreate:
      type: object
      required: [principal_type, principal_id, actions]
      properties:
        principal_type:
          type: string
        principal_id:
          type: string
        actions:
          type: array
          items:
            type: string
            enum: [use, reveal, rotate]
        expires_at:
          type: string
          format: date-time
          nullable: true

    VaultGrant:
      type: object
      properties:
        id:
          type: string
        secret_id:
          type: string
        principal_type:
          type: string
        principal_id:
          type: string
        actions:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        granted_by:
          type: string

    VaultCheckout:
      type: object
