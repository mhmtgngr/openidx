openapi: 3.0.3
info:
  title: OpenIDX Admin API
  description: |
    The OpenIDX administration API, served by cmd/admin-api: dashboard and
    system settings, users, service accounts and invitations, applications
    and SSO, directory integrations, MFA configuration, the credential vault
    and rotation engine, governance (attestation campaigns, entitlements,
    lifecycle policies, delegations), identity security posture (ISPM),
    AI agents, intelligence and recommendations, privacy and DSAR, audit
    archival and retention, analytics, notifications, organizations and
    tenant administration.

    Every route cmd/admin-api mounts appears here, and nothing that is not
    mounted does: test/openapi/admin_api_coverage_test.go compares this file
    against the live route table in both directions and fails the build on a
    difference. Operations carry an `x-openidx-handler` extension naming the
    Go handler that serves them.

    Operations whose request and response bodies are shown as free-form JSON
    objects are documented at the route level only: the endpoint, its method,
    its path parameters and its status codes are exact, the payload shape is
    not yet pinned. That is stated rather than guessed.
  version: 1.34.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8005
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: AI Agents
  - name: AI Intelligence
  - name: AI Recommendations
  - name: API Keys
  - name: Access Attestation
  - name: Analytics
  - name: Applications
  - name: Audit Archival
  - name: Audit Log
  - name: Audit Retention
  - name: Bulk Operations
  - name: Compliance Posture
  - name: Continuous Authentication
  - name: Credential Rotation
  - name: Dashboard
  - name: Delegations
  - name: Developer Tools
  - name: Devices
  - name: Directories
  - name: Email Branding
  - name: Email Templates
  - name: Entitlements
  - name: Error Catalog
  - name: Federation
  - name: IP Threats
  - name: ISPM
  - name: Identity Threat Detection
  - name: Invitations
  - name: Lifecycle Policies
  - name: Login History
  - name: MFA Configuration
  - name: Me
  - name: Notifications
  - name: OAuth Keys
  - name: Organizations
  - name: PAM
  - name: Privacy
  - name: Risk Analytics
  - name: SSO Settings
  - name: Security Alerts
  - name: Self-heal
  - name: Service Accounts
  - name: Sessions
  - name: Settings
  - name: Settings History
  - name: Social Providers
  - name: System Health
  - name: Tenants
  - name: Users
  - name: Vault
  - name: Webhooks

paths:
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics
      operationId: getDashboard
      responses:
        '200':
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'

  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Get system settings
      operationId: getSettings
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      tags: [Settings]
      summary: Update system settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Settings updated

  /api/v1/applications:
    get:
      tags: [Applications]
      summary: List applications
      operationId: listApplications
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of applications
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
    post:
      tags: [Applications]
      summary: Create application
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'

  /api/v1/applications/{id}:
    get:
      tags: [Applications]
      summary: Get application
      operationId: getApplication
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Application not found
    put:
      tags: [Applications]
      summary: Update application
      operationId: updateApplication
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Application updated
    delete:
      tags: [Applications]
      summary: Delete application
      operationId: deleteApplication
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Application deleted
        '404':
          description: Application not found

  /api/v1/applications/{id}/sso-settings:
    get:
      tags: [SSO Settings]
      summary: Get application SSO settings
      operationId: getApplicationSSOSettings
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: SSO settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSSOSettings'
    put:
      tags: [SSO Settings]
      summary: Update application SSO settings
      operationId: updateApplicationSSOSettings
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSSOSettings'
      responses:
        '200':
          description: SSO settings updated

  /api/v1/directories:
    get:
      tags: [Directories]
      summary: List directory integrations
      operationId: listDirectories
      responses:
        '200':
          description: Directory integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryIntegration'
    post:
      tags: [Directories]
      summary: Create directory integration
      operationId: createDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryIntegrationCreate'
      responses:
        '201':
          description: Directory created

  /api/v1/directories/{id}/sync:
    post:
      tags: [Directories]
      summary: Trigger directory sync
      operationId: syncDirectory
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Sync started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: syncing
        '404':
          description: Directory not found

  # --- Vault ---
  /api/v1/vault/secrets:
    post:
      tags: [Vault]
      summary: Create vault secret
      operationId: createVaultSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultSecretCreate'
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretMeta'
    get:
      tags: [Vault]
      summary: List vault secrets
      operationId: listVaultSecrets
      responses:
        '200':
          description: List of vault secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecretMeta'

  /api/v1/vault/secrets/{id}:
    get:
      tags: [Vault]
      summary: Get vault secret detail
      operationId: getVaultSecret
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Secret metadata and version history (no plaintext value)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretDetail'
        '404':
          description: Secret not found
    delete:
      tags: [Vault]
      summary: Delete vault secret (crypto-erase)
      operationId: deleteVaultSecret
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Secret crypto-erased
        '404':
          description: Secret not found

  /api/v1/vault/secrets/{id}/version:
    put:
      tags: [Vault]
      summary: Add new secret version
      operationId: addVaultSecretVersion
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  writeOnly: true
      responses:
        '200':
          description: New version stored
        '404':
          description: Secret not found

  /api/v1/vault/secrets/{id}/reveal:
    post:
      tags: [Vault]
      summary: Reveal secret value (one-shot, audited)
      operationId: revealVaultSecret
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Plaintext value (one-shot, access logged)
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
        '403':
          description: Forbidden
        '404':
          description: Secret not found

  /api/v1/vault/secrets/{id}/grants:
    post:
      tags: [Vault]
      summary: Grant access to a secret
      operationId: createVaultGrant
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultGrantCreate'
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '404':
          description: Secret not found
    get:
      tags: [Vault]
      summary: List grants for a secret
      operationId: listVaultGrants
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaultGrant'
        '404':
          description: Secret not found

  /api/v1/vault/secrets/{id}/grants/{grantId}:
    delete:
      tags: [Vault]
      summary: Revoke a grant
      operationId: deleteVaultGrant
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: grantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Grant revoked
        '404':
          description: Grant not found

  /api/v1/vault/secrets/{id}/checkouts:
    get:
      tags: [Vault]
      summary: List checkouts for a secret
      operationId: listVaultCheckouts
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of checkouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaultCheckout'
        '404':
          description: Secret not found

  /api/v1/vault/secrets/{id}/rotate:
    post:
      tags: [Credential Rotation]
      summary: Rotate a secret immediately
      operationId: rotateVaultSecret
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Rotation run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationRun'
        '404':
          description: Secret not found or no rotation policy attached

  /api/v1/vault/secrets/{id}/rotations:
    get:
      tags: [Credential Rotation]
      summary: List rotation run history for a secret
      operationId: listVaultSecretRotations
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Rotation run history
          content:
            application/json:
              schema:
                type: object
                properties:
                  rotations:
                    type: array
                    items:
                      $ref: '#/components/schemas/RotationRun'
        '404':
          description: Secret not found

  # --- Credential Rotation ---
  /api/v1/vault/rotation-policies:
    post:
      tags: [Credential Rotation]
      summary: Create rotation policy
      operationId: createRotationPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotationPolicyInput'
      responses:
        '201':
          description: Rotation policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationPolicy'
    get:
      tags: [Credential Rotation]
      summary: List rotation policies
      operationId: listRotationPolicies
      responses:
        '200':
          description: List of rotation policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/RotationPolicy'

  /api/v1/vault/rotation-policies/{id}:
    get:
      tags: [Credential Rotation]
      summary: Get rotation policy
      operationId: getRotationPolicy
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Rotation policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationPolicy'
        '404':
          description: Policy not found
    put:
      tags: [Credential Rotation]
      summary: Update rotation policy
      operationId: updateRotationPolicy
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotationPolicyInput'
      responses:
        '200':
          description: Rotation policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationPolicy'
        '404':
          description: Policy not found
    delete:
      tags: [Credential Rotation]
      summary: Delete rotation policy
      operationId: deleteRotationPolicy
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Rotation policy deleted
        '404':
          description: Policy not found

  /api/v1/mfa/methods:
    get:
      tags: [MFA Configuration]
      summary: List enabled MFA methods
      operationId: listMFAMethods
      responses:
        '200':
          description: List of enabled MFA methods
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["totp", "webauthn", "sms"]
    put:
      tags: [MFA Configuration]
      summary: Update enabled MFA methods
      operationId: updateMFAMethods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              example: ["totp", "webauthn"]
      responses:
        '200':
          description: MFA methods updated

  /api/v1/ai-agents:
    get:
      tags: [AI Agents]
      summary: List AI agents
      operationId: listAIAgents
      x-openidx-handler: internal/admin.(*Service).handleListAIAgents
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [AI Agents]
      summary: Create AI agent
      operationId: createAIAgent
      x-openidx-handler: internal/admin.(*Service).handleCreateAIAgent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/ai-agents/analytics:
    get:
      tags: [AI Agents]
      summary: AI agent analytics
      operationId: aiAgentAnalytics
      x-openidx-handler: internal/admin.(*Service).handleAIAgentAnalytics
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/ai-agents/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [AI Agents]
      summary: Delete AI agent
      operationId: deleteAIAgent
      x-openidx-handler: internal/admin.(*Service).handleDeleteAIAgent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [AI Agents]
      summary: Get AI agent
      operationId: getAIAgent
      x-openidx-handler: internal/admin.(*Service).handleGetAIAgent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [AI Agents]
      summary: Update AI agent
      operationId: updateAIAgent
      x-openidx-handler: internal/admin.(*Service).handleUpdateAIAgent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/ai-agents/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [AI Agents]
      summary: Activate AI agent
      operationId: activateAIAgent
      x-openidx-handler: internal/admin.(*Service).handleActivateAIAgent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/ai-agents/{id}/activity:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [AI Agents]
      summary: List AI agent activity
      operationId: listAIAgentActivity
      x-openidx-handler: internal/admin.(*Service).handleListAIAgentActivity
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/ai-agents/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [AI Agents]
      summary: List AI agent permissions
      operationId: listAIAgentPermissions
      x-openidx-handler: internal/admin.(*Service).handleListAIAgentPermissions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [AI Agents]
      summary: Grant AI agent permission
      operationId: grantAIAgentPermission
      x-openidx-handler: internal/admin.(*Service).handleGrantAIAgentPermission
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/ai-agents/{id}/permissions/{permId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: permId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [AI Agents]
      summary: Revoke AI agent permission
      operationId: revokeAIAgentPermission
      x-openidx-handler: internal/admin.(*Service).handleRevokeAIAgentPermission
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/ai-agents/{id}/rotate-credentials:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [AI Agents]
      summary: Rotate AI agent credentials
      operationId: rotateAIAgentCredentials
      x-openidx-handler: internal/admin.(*Service).handleRotateAIAgentCredentials
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/ai-agents/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [AI Agents]
      summary: Suspend AI agent
      operationId: suspendAIAgent
      x-openidx-handler: internal/admin.(*Service).handleSuspendAIAgent
      requestBody:
        required: false
        content:
          application/json:
            schema:
