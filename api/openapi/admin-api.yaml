          type: string
        secret_id:
          type: string
        principal_type:
          type: string
        principal_id:
          type: string
        mode:
          type: string
        reason:
          type: string
        status:
          type: string
        leased_at:
          type: string
          format: date-time
        returned_at:
          type: string
          format: date-time
          nullable: true

