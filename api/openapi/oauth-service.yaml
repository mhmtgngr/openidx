components:
  responses:
    BadRequest:
      description: The request was malformed or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid bearer token was presented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource in the caller's organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: A short machine-readable reason
        error_description:
          type: string
          description: Operator-facing detail, when the handler has one
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until expiration
        refresh_token:
          type: string
        scope:
          type: string
        id_token:
          type: string
          description: OIDC ID token (when openid scope requested)

    UserInfo:
      type: object
      description: >-
        The claims the PRESENTED ACCESS TOKEN'S SCOPE grants (OpenID Connect
        Core §5.4), not everything the issuer knows. `sub` is always present.
        `name`, `given_name`, `family_name` and `preferred_username` require the
        `profile` scope; `email` and `email_verified` require `email`. A claim
        whose scope was not granted is ABSENT rather than empty, so a relying
        party cannot mistake "you did not ask" for "the user has no name".
      required: [sub]
      properties:
        sub:
          type: string
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
          description: >-
            Three answers, and only one of them is silent: absent means the
            `email` scope was not granted, false means it was and the address is
            NOT verified, true means it was and the address is. Do not read an
            absent value as false.
        preferred_username:
          type: string
        picture:
          type: string
          format: uri
        roles:
          type: array
          items:
            type: string

    OAuthClient:
      type: object
      properties:
        id:
          type: string
        client_id:
          type: string
        name:
          type: string
        description:
          type: string
        client_type:
          type: string
          enum: [public, confidential]
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        require_pkce:
          type: boolean
        back_channel_logout_uri:
          type: string
          format: uri
          description: >-
            Where this relying party receives an OpenID Connect Back-Channel
            Logout 1.0 logout token when a session it took part in ends.
            Empty means it is not told. https, or http on localhost.
        post_logout_redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: >-
            Where this relying party may be sent after an RP-initiated logout
            (RP-Initiated Logout 1.0 §2). A registered list is matched
            exactly, including path and query. Absent or empty leaves the
            client on the origin rule derived from `redirect_uris`, which
            accepts any path on the same host.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    OAuthClientCreate:
      type: object
      required: [name, client_type, redirect_uris]
      properties:
        name:
          type: string
        description:
          type: string
        client_type:
          type: string
          enum: [public, confidential]
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
          default: [authorization_code]
        scopes:
          type: array
          items:
            type: string
          default: [openid, profile, email]
        require_pkce:
          type: boolean
          default: false
        back_channel_logout_uri:
          type: string
          format: uri
          description: >-
            Optional. The relying party's back-channel logout endpoint
            (OpenID Connect Back-Channel Logout 1.0). Also accepted as
            `backchannel_logout_uri` at `POST /oauth/register`.
        post_logout_redirect_uris:
          type: array
          items:
            type: string
            format: uri
          description: >-
            Optional. Absolute URIs this client may be redirected to after an
            RP-initiated logout; matched exactly. Also accepted under the same
            name at `POST /oauth/register`. Registering none leaves the client
            on the looser origin rule.
        enabled:
          type: boolean
          default: true
