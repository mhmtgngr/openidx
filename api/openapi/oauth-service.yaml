components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: A short machine-readable reason
        error_description:
          type: string
          description: Operator-facing detail, when the handler has one
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until expiration
        refresh_token:
          type: string
        scope:
          type: string
        id_token:
          type: string
          description: OIDC ID token (when openid scope requested)

    UserInfo:
      type: object
      properties:
        sub:
          type: string
        name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        preferred_username:
          type: string
        roles:
          type: array
          items:
            type: string

    OAuthClient:
      type: object
      properties:
        id:
          type: string
        client_id:
          type: string
        name:
          type: string
        description:
          type: string
        client_type:
          type: string
          enum: [public, confidential]
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        require_pkce:
          type: boolean
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    OAuthClientCreate:
      type: object
      required: [name, client_type, redirect_uris]
      properties:
        name:
          type: string
        description:
          type: string
        client_type:
          type: string
          enum: [public, confidential]
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
          default: [authorization_code]
        scopes:
          type: array
          items:
            type: string
          default: [openid, profile, email]
        require_pkce:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
