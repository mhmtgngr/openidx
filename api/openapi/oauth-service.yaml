openapi: 3.0.3
info:
  title: OpenIDX OAuth/OIDC Service
  description: |
    OAuth 2.0 authorization server with OpenID Connect and SAML 2.0 support.

    Every route cmd/oauth-service mounts appears here, and nothing
    that is not mounted does: test/openapi/service_spec_coverage_test.go compares
    this file against the live route table in both directions. Operations carry an
    `x-openidx-handler` extension naming the Go handler that serves them; where a
    payload shape is not yet pinned the body is shown as a free-form JSON object
    rather than invented.
  version: 1.36.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8006
    description: Local development

tags:
  - name: Authorization
  - name: Client Management
  - name: Device Authorization
  - name: Discovery
  - name: Dynamic Client Registration
  - name: Logout
  - name: OIDC Discovery
  - name: Passwordless
  - name: SAML
  - name: SSF / CAEP
  - name: Social Login
  - name: Step-up and MFA
  - name: Token
  - name: Tokens
  - name: UserInfo

paths:
  # --- OIDC Discovery ---
  /.well-known/openid-configuration:
    get:
      tags: [OIDC Discovery]
      summary: OpenID Connect discovery document
      operationId: getDiscovery
      security: []
      responses:
        '200':
          description: OIDC configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
                  userinfo_endpoint:
                    type: string
                  jwks_uri:
                    type: string
                  introspection_endpoint:
                    type: string
                  revocation_endpoint:
                    type: string
                  response_types_supported:
                    type: array
                    items:
                      type: string
                  grant_types_supported:
                    type: array
                    items:
                      type: string
                  subject_types_supported:
                    type: array
                    items:
                      type: string
                  id_token_signing_alg_values_supported:
                    type: array
                    items:
                      type: string
                  scopes_supported:
                    type: array
                    items:
                      type: string
                  code_challenge_methods_supported:
                    type: array
                    items:
                      type: string

  /.well-known/jwks.json:
    get:
      tags: [OIDC Discovery]
      summary: JSON Web Key Set
      operationId: getJWKS
      security: []
      responses:
        '200':
          description: Public keys for JWT verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty:
                          type: string
                        use:
                          type: string
                        n:
                          type: string
                        e:
                          type: string
                        alg:
                          type: string
                        kid:
                          type: string

  # --- Authorization ---
  /oauth/authorize:
    get:
      tags: [Authorization]
      summary: Authorization endpoint
      operationId: authorize
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          schema:
            type: string
            example: openid profile email
        - name: state
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          schema:
            type: string
        - name: code_challenge_method
          in: query
          schema:
            type: string
            enum: [S256]
        - name: prompt
          in: query
          description: >-
            OIDC Core §3.1.2.1, space-delimited. `none` never shows UI: with a
            usable browser session the code is issued, otherwise the request is
            answered at the `redirect_uri` with `login_required` (no session,
            or one older than `max_age`) or `consent_required`. `login` forces
            re-authentication even when a session exists. `consent` and
            `select_account` take the interactive login path. `none` combined
            with any other value, or an unrecognised value, is
            `invalid_request`.
          schema:
            type: string
            example: none
        - name: max_age
          in: query
          description: >-
            Maximum age of the browser session's authentication, in seconds. A
            session authenticated longer ago than this re-authenticates (under
            `prompt=none`, `login_required`). Non-integer or negative values
            are `invalid_request`.
          schema:
            type: integer
            minimum: 0
      responses:
        '302':
          description: >-
            Three different redirects, and the `Location` says which.


            **Single sign-on** — the client's `redirect_uri` with `code` and
            `state`, issued without a login page when the browser presents an
            `openidx_sso` cookie that resolves to a live, unrevoked, unexpired
            session of this tenant and the client's assignment and consent
            gates pass. The cookie is set by the login flow's code issuance
            (same-origin only, see docs/OAUTH-OIDC.md).


            **Login** — the login UI (OAUTH_LOGIN_URL, default
            `<issuer>/login`) with a `login_session` query parameter. Every
            client gets this, public and confidential alike; the server used to
            render its own login form for public clients and no longer does. A
            cookie that resolves to nothing is cleared on this response. When
            the cookie named a live session that could not be carried straight
            to a code because the login UI has a screen to show (consent
            outstanding, or `prompt=consent`), the URL also carries `resume=1`
            and the login UI first asks `POST /oauth/login/resume` to complete
            the request from that session.


            **Request error** — the client's registered `redirect_uri`, with
            `error`, `error_description` and the request's `state`, per RFC 6749
            §4.1.2.1. `invalid_scope` is returned when a requested scope is not
            registered for the client; it is checked here rather than after the
            user has entered a password on a request that could never succeed.
            `login_required` and `consent_required` are the `prompt=none`
            answers of OIDC Core §3.1.2.6.
          headers:
            Location:
              description: >-
                The client's `redirect_uri` carrying `?code=...&state=...`, the
                login UI carrying `?login_session=...`, or the client's
                `redirect_uri` carrying `?error=...&error_description=...`.
              schema:
                type: string
                format: uri
        '400':
          description: >-
            Invalid request that cannot be reported to the client:
            `client_id` missing or unknown, or a `redirect_uri` that is not
            registered. Redirecting an error to an unvalidated `redirect_uri`
            would be an open redirect, so these are answered in-band.
    post:
      tags: [Authorization]
      summary: Authorization consent
      operationId: authorizeConsent
      security: []
      responses:
        '302':
          description: Redirect to client with code

  /oauth/login:
    post:
      tags: [Authorization]
      summary: Resource owner login
      description: >-
        The login UI posts the credentials it collected, together with the
        `login_session` the authorize redirect handed it, and gets back the
        redirect that carries the authorization code. This is a JSON API, not a
        form post: the server-rendered login that submitted a form was deleted,
        and this endpoint is the single remaining credential entry point.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, login_session]
              properties:
                username:
                  type: string
                password:
                  type: string
                login_session:
                  type: string
      responses:
        '200':
          description: >-
            Authenticated. Either the authorization code (as `redirect_url`, the
            client redirect_uri with `?code=`), or an MFA challenge the caller
            must complete at `/oauth/mfa-verify` before a code is issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url:
                    type: string
                    format: uri
                  mfa_required:
                    type: boolean
                  mfa_session:
                    type: string
                  available_methods:
                    type: array
                    items:
                      type: string
        '400':
          description: Missing or expired login_session
        '401':
          description: Invalid credentials
        '403':
          description: >-
            Refused by a gate rather than by the credentials: the user is not
            assigned to an application whose `require_assignment` is set and
            `ACCESS_ASSIGNMENT_ENFORCE` is on, an ABAC policy denied under
            `ABAC_ENFORCE=enforce`, or the login is blocked by country or device
            trust. Body carries `error: access_denied`.
        '503':
          description: >-
            Under `ACCESS_ASSIGNMENT_ENFORCE=true`, the assignment could not be
            verified (the gate fails closed rather than issuing a code).

  /oauth/callback:
    get:
      tags: [Authorization]
      summary: OAuth callback handler
      operationId: callback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to application

  # --- Token ---
  /oauth/token:
    post:
      tags: [Token]
      summary: Token endpoint
      operationId: token
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token, client_credentials]
                code:
                  type: string
                  description: Required for authorization_code grant
                redirect_uri:
                  type: string
                  description: Required for authorization_code grant
                client_id:
                  type: string
                client_secret:
                  type: string
                refresh_token:
                  type: string
                  description: Required for refresh_token grant
                code_verifier:
                  type: string
                  description: PKCE code verifier
                agent_id:
                  type: string
                  description: >-
                    Optional, authorization_code grant, native clients only. The
                    enrolled device this session belongs to. The server binds the
                    refresh-token family to it only if the agent is one it records
                    as enrolled by the same user and not revoked, so that revoking
                    the device revokes this session. A claim that does not check
                    out is ignored and the session is left unbound; it is not an
                    authentication of the device.
                scope:
                  type: string
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
        '401':
          description: Invalid client credentials

  /oauth/introspect:
    post:
      tags: [Token]
      summary: Token introspection
      operationId: introspect
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
      responses:
        '200':
          description: Token introspection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  scope:
                    type: string
                  client_id:
                    type: string
                  sub:
                    type: string
                  exp:
                    type: integer
                  iat:
                    type: integer
                  iss:
                    type: string
                  token_type:
                    type: string

  /oauth/revoke:
    post:
      tags: [Token]
      summary: Token revocation
      operationId: revoke
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                token_type_hint:
                  type: string
                  enum: [access_token, refresh_token]
      responses:
        '200':
          description: Token revoked

  # --- UserInfo ---
  /oauth/userinfo:
    get:
      tags: [UserInfo]
      summary: Get user info (GET)
      description: >-
        Returns the claims the presented access token's own `scope` grants. A
        token granted only `openid` is answered with `sub` and nothing else.
      operationId: getUserInfoGet
      responses:
        '200':
          description: User profile claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
    post:
      tags: [UserInfo]
      summary: Get user info (POST)
      operationId: getUserInfoPost
      responses:
        '200':
          description: User profile claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'

  # --- Client Management ---
  /api/v1/oauth/clients:
    get:
      tags: [Client Management]
      summary: List OAuth clients
      operationId: listClients
      responses:
        '200':
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthClient'
    post:
      tags: [Client Management]
      summary: Create OAuth client
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientCreate'
      responses:
        '201':
          description: Client created (includes client_secret)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'

  /api/v1/oauth/clients/{id}:
    get:
      tags: [Client Management]
      summary: Get OAuth client
      operationId: getClient
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Client details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
    put:
      tags: [Client Management]
      summary: Update OAuth client
      operationId: updateClient
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientCreate'
      responses:
        '200':
          description: Client updated
    delete:
      tags: [Client Management]
      summary: Delete OAuth client
      operationId: deleteClient
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Client deleted

  /api/v1/oauth/clients/{id}/regenerate-secret:
    post:
      tags: [Client Management]
      summary: Regenerate client secret
      operationId: regenerateClientSecret
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: New secret generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_secret:
                    type: string

  /.well-known/apple-app-site-association:
    get:
      tags: [Discovery]
      summary: Apple app site association
      operationId: appleAppSiteAssociation
      x-openidx-handler: internal/oauth.(*Service).handleAppleAppSiteAssociation
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /.well-known/assetlinks.json:
    get:
      tags: [Discovery]
      summary: Android asset links
      operationId: androidAssetLinks
      x-openidx-handler: internal/oauth.(*Service).handleAndroidAssetLinks
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /.well-known/jwks.json:
    options:
      tags: [Discovery]
      summary: JWKS
      operationId: jwks
      x-openidx-handler: internal/oauth.(*Service).handleJWKS
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /.well-known/openid-configuration:
    options:
      tags: [Discovery]
      summary: Discovery
      operationId: discovery
      x-openidx-handler: internal/oauth.(*Service).handleDiscovery
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /.well-known/ssf-configuration:
    get:
      tags: [Discovery]
      summary: SSF configuration
      operationId: ssfConfiguration
      x-openidx-handler: internal/oauth.(*Service).handleSSFConfiguration
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/saml/service-providers:
    get:
      tags: [SAML]
      summary: List SAML service providers
      operationId: listSAMLServiceProviders
      x-openidx-handler: internal/oauth.(*Service).handleListSAMLServiceProviders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [SAML]
      summary: Create SAML service provider
      operationId: createSAMLServiceProvider
      x-openidx-handler: internal/oauth.(*Service).handleCreateSAMLServiceProvider
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/saml/service-providers/import-metadata:
    post:
      tags: [SAML]
      summary: Import SAML metadata
      operationId: importSAMLMetadata
      x-openidx-handler: internal/oauth.(*Service).handleImportSAMLMetadata
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/saml/service-providers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    delete:
      tags: [SAML]
      summary: Delete SAML service provider
      operationId: deleteSAMLServiceProvider
      x-openidx-handler: internal/oauth.(*Service).handleDeleteSAMLServiceProvider
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [SAML]
      summary: Get SAML service provider
      operationId: getSAMLServiceProvider
      x-openidx-handler: internal/oauth.(*Service).handleGetSAMLServiceProvider
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [SAML]
      summary: Update SAML service provider
      operationId: updateSAMLServiceProvider
      x-openidx-handler: internal/oauth.(*Service).handleUpdateSAMLServiceProvider
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/saml/service-providers/{id}/rotate-certificate:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [SAML]
      summary: Rotate sp certificate
      operationId: rotateSPCertificate
      x-openidx-handler: internal/oauth.(*Service).handleRotateSPCertificate
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /oauth/authorize/v2:
    get:
      tags: [Authorization]
      summary: Authorize V 2
      description: >-
        The authorization endpoint the mobile authenticator's browser-login
        fallback opens. PKCE is required for public clients. It reads the
        `openidx_sso` cookie exactly as `/oauth/authorize` does: a live session
        of this tenant that passes the assignment and consent gates is
        redirected to the client with a code, anything less goes to the login
        UI, and `prompt` / `max_age` have the same meaning and the same
        `prompt=none` answers.
      operationId: authorizeV2
      x-openidx-handler: internal/oauth.(*Service).handleAuthorizeV2
      parameters:
        - name: prompt
          in: query
          description: >-
            OIDC Core §3.1.2.1, as on `/oauth/authorize`: `none` never shows
            UI (`login_required` / `consent_required` at the `redirect_uri`
            without a usable session), `login` forces re-authentication,
            `consent` and `select_account` take the interactive path;
            `none` with another value or an unknown value is `invalid_request`.
          schema:
            type: string
        - name: max_age
          in: query
          description: >-
            Maximum age of the browser session's authentication in seconds;
            older re-authenticates. Non-integer or negative is `invalid_request`.
          schema:
            type: integer
            minimum: 0
      responses:
        '302':
          description: >-
            The client's `redirect_uri` with `code` and `state` (single
            sign-on), the login UI with `login_session`, or the client's
            `redirect_uri` with `error` and `error_description`.
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Authorization]
      summary: Authorize consent V 2
      description: >-
        Issues the code for a stored v2 authorization request as the
        authenticated caller. `session_id` is optional and, when present, must
        be a live session of the caller in this tenant: it is bound to the code
        and the token endpoint reads `sid`, `amr` and `auth_time` from it, so
        another user's session id — or the caller's own once revoked or
        expired — is refused with `400 invalid_request`, never silently
        dropped.
      operationId: authorizeConsentV2
      x-openidx-handler: internal/oauth.(*Service).handleAuthorizeConsentV2
      requestBody:
