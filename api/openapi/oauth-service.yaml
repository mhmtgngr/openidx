  /oauth/logout:
    get:
      tags: [Logout]
      summary: Logout
      description: >-
        Ends the user's sessions identified by `id_token_hint` or a bearer
        token, and — regardless of either — the browser session named by the
        `openidx_sso` cookie: that session is revoked, its mapping deleted and
        the cookie cleared, so the next /oauth/authorize cannot ride it. Every
        relying party a revoked session reached (the client it was created
        for, and every client holding a refresh token bound to it) that
        registered a `back_channel_logout_uri` is sent an OpenID Connect
        Back-Channel Logout 1.0 logout token (`sid` = the session, `sub` as
        in its ID token) in the background; delivery is best-effort and
        never delays this response.


        RP-Initiated Logout 1.0 §2: `post_logout_redirect_uri` is followed
        only when it is registered for the client — exactly, against that
        client's `post_logout_redirect_uris`, or, for a client that has
        registered none, by origin against its `redirect_uris`. `state` is
        returned on that redirect. `client_id` identifies the relying party
        when no `id_token_hint` is sent, and must match the hint's audience
        when both are present.
      operationId: logout
      x-openidx-handler: internal/oauth.(*Service).handleLogout
      parameters:
        - name: id_token_hint
          in: query
          required: false
          schema: {type: string}
          description: >-
            An ID token previously issued to the relying party. Its signature
            is verified (an expired token is still accepted, per the spec);
            its `sub` names the user whose sessions end and its `aud` names
            the client whose registered landing pages may be redirected to.
        - name: post_logout_redirect_uri
          in: query
          required: false
          schema: {type: string, format: uri}
          description: >-
            Where to send the browser once the logout has happened. Refused
            with `400 invalid_request` when it is not registered for the
            client; the logout itself has already taken effect either way.
        - name: state
          in: query
          required: false
          schema: {type: string}
          description: >-
            Opaque value returned unchanged as the `state` query parameter on
            the redirect to `post_logout_redirect_uri`.
        - name: client_id
          in: query
          required: false
          schema: {type: string}
          description: >-
            The relying party asking for the logout. Required to get a
            redirect when no `id_token_hint` is sent; refused with
            `400 invalid_request` when both are sent and they disagree.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Logout]
      summary: Logout
      operationId: logout2
      x-openidx-handler: internal/oauth.(*Service).handleLogout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

