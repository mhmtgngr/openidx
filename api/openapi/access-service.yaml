        every PAM target. End users read /guacamole/my-connections instead,
        which returns the launcher's PAM flags without the infrastructure.
      operationId: listGuacamoleConnections
      responses:
        '200':
          description: The calling organization's Guacamole connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuacamoleConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/access/guacamole/connections/{routeId}/connect:
    post:
      tags: [Guacamole]
      summary: Connect to Guacamole session
      description: >
        Any authenticated user; the connection must belong to the caller's
        organization. Applies the connection's PAM gates in order — pre-session
        approval, live moderation — then injects the configured vault
        credential server-side and returns a broker connect URL. A routeId
        outside the caller's organization is 404, not 403: the connection is
        not theirs to know about.
      operationId: connectGuacamole
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Guacamole connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuacamoleConnectResponse'
        '403':
          description: >
            No organization on the request, the pre-session approval is missing
            or spent, or the injected credential is unavailable.
        '428':
          description: The session requires a moderator to join before it can start.
        '404':
          $ref: '#/components/responses/NotFound'

  # --- PAM: connection manager (folders, typed entries, ACL) ---
  /api/v1/access/pam/entry-types:
    get:
      tags: [PAM Entries]
      summary: List supported entry types
      description: The catalog of entry types (sessions, credentials, secure info records). Any authenticated user.
      operationId: pamListEntryTypes
      responses:
        '200':
          description: Entry-type catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamEntryType'

  /api/v1/access/pam/folders:
    get:
      tags: [PAM Entries]
      summary: List folders
      description: The org's folder tree with per-folder entry counts. Any authenticated user.
      operationId: pamListFolders
      responses:
        '200':
          description: Folder list
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamFolder'
    post:
      tags: [PAM Entries]
      summary: Create folder
      description: Admin only.
      operationId: pamCreateFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamFolderRequest'
      responses:
        '201':
          description: Folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/folders/{id}:
    put:
      tags: [PAM Entries]
      summary: Update folder
      description: Admin only. A folder cannot be its own parent.
      operationId: pamUpdateFolder
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamFolderRequest'
      responses:
        '200':
          description: Folder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [PAM Entries]
      summary: Delete folder
      description: Admin only. Child folders are re-parented, entries keep their rows.
      operationId: pamDeleteFolder
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Folder deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries:
    get:
      tags: [PAM Entries]
      summary: List entries
      description: Admins see every entry in the org; other callers see only entries they hold a grant on (any action). Secret material is never included.
      operationId: pamListEntries
      parameters:
        - name: folder_id
          in: query
          schema: {type: string, format: uuid}
        - name: type
          in: query
          schema: {type: string}
        - name: q
          in: query
          description: Substring search
          schema: {type: string}
        - name: favorites
          in: query
          description: When truthy, only the caller's favorites
          schema: {type: string}
      responses:
        '200':
          description: Entry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamEntry'
    post:
      tags: [PAM Entries]
      summary: Create entry
      description: Admin only. A supplied `secret` seeds vault version 1 (envelope-encrypted); it is never returned.
      operationId: pamCreateEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamEntryUpsertRequest'
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/entries/{id}:
    get:
      tags: [PAM Entries]
      summary: Get entry
      description: Requires a `view` grant (or admin). Never returns secret material.
      operationId: pamGetEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [PAM Entries]
      summary: Update entry
      description: Requires an `edit` grant (or admin). A supplied `secret` appends a new vault version.
      operationId: pamUpdateEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamEntryUpsertRequest'
      responses:
        '200':
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [PAM Entries]
      summary: Delete entry
      description: Admin only. Deletes the vault secret (cryptographic erasure) and the per-entry broker connection; tears down any Ziti reach service.
      operationId: pamDeleteEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Entry deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries/{id}/favorite:
    post:
      tags: [PAM Entries]
      summary: Mark entry as favorite
      operationId: pamFavoriteEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Favorite set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamFavoriteResponse'
    delete:
      tags: [PAM Entries]
      summary: Remove favorite
      operationId: pamUnfavoriteEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Favorite cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamFavoriteResponse'

  /api/v1/access/pam/entries/{id}/grants:
    get:
      tags: [PAM Entries]
      summary: List entry grants
      description: Admin only. The per-entry ACL (view/connect/edit/reveal per principal).
      operationId: pamListEntryGrants
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Grant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamEntryGrant'
    post:
      tags: [PAM Entries]
      summary: Add entry grant
      description: Admin only.
      operationId: pamAddEntryGrant
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamEntryGrantRequest'
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/entries/{id}/grants/{grantId}:
    delete:
      tags: [PAM Entries]
      summary: Remove entry grant
      description: Admin only.
      operationId: pamRemoveEntryGrant
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: grantId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Grant removed
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries/{id}/reveal:
    post:
      tags: [PAM Entries]
      summary: Reveal entry secret
      description: >
        Returns the secret plaintext once. Double-gated: the entry must have
        `allow_reveal=true` (enforced for admins too) and non-admin callers need
        a `reveal` grant. Subject to the checkout controls (dual control,
        exclusivity) and, for step-up-flagged secrets, a recent step-up MFA
        (403 with `X-Step-Up-Required`). Every reveal is reason-stamped,
        ledgered in vault_checkouts, and audited.
      operationId: pamRevealEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamReasonRequest'
      responses:
        '200':
          description: Secret plaintext (returned once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamRevealResponse'
        '202':
          description: Dual control — awaiting a second-person authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamDualControlPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Entry exclusively checked out by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamExclusivityConflict'

  # --- PAM: launch, approval workflow, session ledger ---
  /api/v1/access/pam/entries/{id}/connect:
    post:
      tags: [PAM Launch]
      summary: Launch entry session
      description: >
        Brokered launch with server-side credential injection — the caller never
        sees the secret. Requires a `connect` grant (or admin); entries with
        `require_approval` need an approved access request; checkout controls
        (dual control, exclusivity) apply. Website entries return a URL launch
        instead of a brokered connection.
      operationId: pamConnectEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Launch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamLaunchResponse'
        '202':
          description: Dual control — awaiting a second-person authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamDualControlPending'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Exclusive checkout held by another user, or broker conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamExclusivityConflict'

  /api/v1/access/pam/entries/{id}/ws:
    get:
      tags: [PAM Launch]
      summary: Clientless SSH relay (WebSocket)
      description: >
        WebSocket upgrade for the in-browser wasm-ssh terminal
        (`?proto=ssh`). Same grant and approval gates as connect.
      operationId: pamEntryWebSocket
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: proto
          in: query
          schema:
            type: string
            enum: [ssh]
      responses:
        '101':
          description: Switching protocols (WebSocket session established)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries/{id}/request:
    post:
      tags: [PAM Launch]
      summary: Request access to an entry
      description: Opens a single-use access request for a `require_approval` entry. The requester must hold the `connect` grant.
      operationId: pamRequestEntryAccess
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        '201':
          description: Request opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id: {type: string, format: uuid}
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entry-requests:
    get:
      tags: [PAM Launch]
      summary: List pending access requests
      description: Admin only. The approval queue.
      operationId: pamListEntryRequests
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamAccessRequestList'

  /api/v1/access/pam/entry-requests/{id}/approve:
    post:
      tags: [PAM Launch]
      summary: Approve access request
      description: Admin only.
      operationId: pamApproveEntryRequest
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamRequestDecisionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The launch request's hour has passed (`launch_request_expired`):
            an approval would never be honoured at launch, so the requester
            files a new one

  /api/v1/access/pam/entry-requests/{id}/deny:
    post:
      tags: [PAM Launch]
      summary: Deny access request
      description: Admin only.
      operationId: pamDenyEntryRequest
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamRequestDecisionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/my-entry-requests:
    get:
      tags: [PAM Launch]
      summary: List my access requests
      description: The caller's own requests and their outcomes.
      operationId: pamListMyEntryRequests
      responses:
        '200':
          description: The caller's requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamAccessRequestList'

  /api/v1/access/pam/sessions:
    get:
      tags: [PAM Launch]
      summary: List entry sessions
      description: Admin only. The recent-launch ledger with recording availability.
      operationId: pamListSessions
      responses:
        '200':
          description: Session ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamEntrySession'

  /api/v1/access/pam/sessions/{id}/end:
    post:
      tags: [PAM Launch]
      summary: End entry session
      description: The launcher, or an admin, force-ends a live session.
      operationId: pamEndSession
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamEndedResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/import/rdm:
    post:
      tags: [PAM Launch]
      summary: Import a Devolutions RDM export
      description: Admin only. Imports folders and entries; plaintext passwords in the export are sealed into the vault. Everything imported is tagged `rdm-import`.
      operationId: pamImportRDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  description: The RDM export JSON, as a string
                folder_id:
                  type: string
                  format: uuid
                  description: Optional root folder to import under
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  # --- PAM: checkout controls (dual control, exclusivity, break-glass) ---
  /api/v1/access/pam/entries/{id}/break-glass:
    post:
      tags: [PAM Checkout Controls]
      summary: Break-glass emergency reveal
      description: >
        Emergency bypass of the dual-control wait and exclusivity hold, allowed
        only on entries with `break_glass_enabled` for callers who could
        normally reveal. Requires a justification of at least 10 characters and
        raises a high-severity `pam.break_glass` audit event.
      operationId: pamBreakGlass
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamReasonRequest'
      responses:
        '200':
          description: Secret plaintext (break-glass)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamBreakGlassResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries/{id}/checkin:
    post:
      tags: [PAM Checkout Controls]
      summary: Release checkout lease
      description: Releases the caller's live checkout lease; an admin may release any principal's lease on the entry.
      operationId: pamCheckin
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lease(s) released
          content:
            application/json:
              schema:
                type: object
                properties:
                  released:
                    type: integer
                    description: Number of leases released
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/checkout-authorizations:
    get:
      tags: [PAM Checkout Controls]
      summary: List pending dual-control authorizations
      description: Admin only. Second-person requests awaiting an approver.
      operationId: pamListCheckoutAuthorizations
      responses:
        '200':
          description: Pending authorizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamCheckoutAuthorization'

  /api/v1/access/pam/checkout-authorizations/{id}/{decision}:
    post:
      tags: [PAM Checkout Controls]
      summary: Decide dual-control authorization
      description: Admin only. The approver may not be the requester.
      operationId: pamDecideCheckoutAuthorization
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: decision
          in: path
          required: true
          schema:
            type: string
            enum: [approve, deny]
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [approved, denied]}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Authorization already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/checkouts/active:
    get:
      tags: [PAM Checkout Controls]
      summary: List active checkouts
      description: Admin only. The live "who holds what right now" ledger (expired leases are retired first).
      operationId: pamListActiveCheckouts
      responses:
        '200':
          description: Active checkouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamActiveCheckout'

  # --- PAM: moderated sessions (four-eyes) ---
  /api/v1/access/pam/moderation/request:
    post:
      tags: [PAM Moderation]
      summary: Request session moderation
      description: >
        Opens (or idempotently reuses) a pending moderation request for a
        `require_moderator` connection. The client polls the status endpoint
        and retries the connect once active.
      operationId: pamRequestModeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route_id]
              properties:
                route_id: {type: string}
                reason: {type: string}
      responses:
        '200':
          description: Existing pending request reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamModerationOpened'
        '201':
          description: Moderation request opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamModerationOpened'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/moderation/pending:
    get:
      tags: [PAM Moderation]
      summary: List pending moderation requests
      description: Admin/moderator queue of pending, unexpired requests.
      operationId: pamListPendingModeration
      responses:
        '200':
          description: Pending queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamModerationPendingItem'

  /api/v1/access/pam/moderation/{id}:
    get:
      tags: [PAM Moderation]
      summary: Get moderation status
      description: >-
        Requester or moderator polls until `active` (or a terminal state).
        Answers the requester, the moderator and an administrator; anyone
        else gets 404, as for an unknown id.
      operationId: pamGetModerationStatus
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamModerationStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/moderation/{id}/join:
    post:
      tags: [PAM Moderation]
      summary: Join as moderator
      description: Admin/moderator claims the pending request (unblocking the requester's connect). The requester cannot moderate their own session.
      operationId: pamJoinModeration
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Moderation active
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [active]}
                  moderator_id: {type: string, format: uuid}
        '409':
          description: Not pending, already claimed, expired, or caller is the requester
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/moderation/{id}/end:
    post:
      tags: [PAM Moderation]
      summary: End moderated session
      description: Requester or moderator ends the session (moderator end acts as a kill switch).
      operationId: pamEndModeration
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamEndedResponse'
        '409':
          description: Session is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- PAM: SSH CA + brokered sessions + cloud JIT ---
  /api/v1/access/pam/ssh-ca/init:
    post:
      tags: [PAM SSH & Brokering]
      summary: Initialize org SSH CA
      description: Admin only. Generates the org CA keypair; the private key is sealed into the vault and never returned.
      operationId: pamInitSSHCA
      responses:
        '200':
          description: CA already initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHCAPublicKey'
        '201':
          description: CA created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHCAPublicKey'

  /api/v1/access/pam/ssh-ca:
    get:
      tags: [PAM SSH & Brokering]
      summary: Get org SSH CA public key
      description: The value to install as `TrustedUserCAKeys` on target hosts. No secret material.
      operationId: pamGetSSHCA
      responses:
        '200':
          description: CA public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHCAPublicKey'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/connect/ssh:
    post:
      tags: [PAM SSH & Brokering]
      summary: Issue short-lived SSH certificate
      description: >
        Signs a short-lived SSH user certificate (10 min default, 60 min cap)
        for the caller and records the brokered session. Without a supplied
        public key an ephemeral keypair is generated and the private key
        returned once (never stored).
      operationId: pamSSHConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSHConnectRequest'
      responses:
        '200':
          description: Certificate issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHConnectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '428':
          description: SSH CA not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/connect/cloud:
    post:
      tags: [PAM SSH & Brokering]
      summary: Broker short-lived cloud credentials (JIT)
      description: >
        STS AssumeRole via a vault-held broker credential; returns short-lived
        keys (TTL clamped to 15–720 minutes) and optionally a federated console
        URL. Recorded in the brokered-session ledger; auto-expires, nothing to
        revoke.
      operationId: pamCloudConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudConnectRequest'
      responses:
        '200':
          description: Credentials issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudConnectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/access/pam/brokered-sessions:
    post:
      tags: [PAM SSH & Brokering]
      summary: Record brokered DB/K8s session
      description: >-
        Admin only. Registers a brokered `db` or `k8s` session (SSH goes through
        `/pam/connect/ssh`). The target is free text that names no PAM entry
        and no grant, and nothing is issued, so only an administrator may
        record one.
      operationId: pamBrokerSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerSessionRequest'
      responses:
        '201':
          description: Session recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string, format: uuid}
                  expires_at: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The caller is not an administrator, or the step-up gate wants a fresh second factor
    get:
      tags: [PAM SSH & Brokering]
      summary: List brokered sessions
      description: Admin only. Expired sessions are retired first so the list is live-accurate.
      operationId: pamListBrokeredSessions
      responses:
        '200':
          description: Brokered-session ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrokeredSession'

  /api/v1/access/pam/brokered-sessions/{id}/end:
    post:
      tags: [PAM SSH & Brokering]
      summary: End brokered session
      operationId: pamEndBrokeredSession
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Session marked ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamEndedResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- PAM: privilege graph ---
  /api/v1/access/pam/privilege-graph/secret/{id}:
    get:
      tags: [PAM Privilege Graph]
      summary: Who can reach this vault secret
      description: Admin only. Effective-access blast radius across IAM+IGA+PAM.
      operationId: pamSecretPrivilegeGraph
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reachers of the secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePrivilegeGraph'

  /api/v1/access/pam/privilege-graph/entry/{id}:
    get:
      tags: [PAM Privilege Graph]
      summary: Who can reach this PAM entry
      description: Admin only.
      operationId: pamEntryPrivilegeGraph
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reachers of the entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePrivilegeGraph'

  /api/v1/access/pam/privilege-graph/user/{id}:
    get:
      tags: [PAM Privilege Graph]
      summary: What this user can reach
      description: Admin only. Secrets and PAM entries reachable by the user, with the path that grants each.
      operationId: pamUserPrivilegeGraph
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reachable resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrivilegeGraph'

  # --- PAM: broker status + Ziti reach mode ---
  /api/v1/access/pam/broker/status:
    get:
      tags: [PAM Ziti Reach]
      summary: Broker capability probe
      operationId: pamBrokerStatus
      responses:
        '200':
          description: Available launch paths
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: {type: boolean}
                  reach_modes:
                    type: array
                    items: {type: string, enum: [direct, ziti]}
                  direct_broker: {type: boolean}
                  ziti_broker: {type: boolean}
                  require_ztna:
                    type: string
                    enum: [off, observe, enforce]
                    description: >-
                      The PAM_REQUIRE_ZTNA mode as the service will apply it, so a
                      launcher can refuse before the click rather than after the 403.
                      In `enforce`, a launch is refused unless the entry's reach_mode
                      is `ziti`, and a website entry is refused outright. An
                      unrecognised setting is reported as `off`, matching what the
                      gate does with it. `observe` refuses nothing.

  /api/v1/access/pam/broker/ziti-bindings:
    get:
      tags: [PAM Ziti Reach]
      summary: List broker Ziti bindings
      description: >-
        The tunneler binding list plus the dialer role. Install
        administrator only: admin or super_admin of the default
        organization, because one broker tunnel serves every
        organization's entries. An organization's admin gets 403 platform
        administrator required.
      operationId: pamZitiBindings
      responses:
        '200':
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamZitiBinding'
                  dialer_role: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/access/pam/entries/{id}/ziti/enable:
    post:
      tags: [PAM Ziti Reach]
      summary: Enable Ziti reach for entry
      description: Admin only. Provisions an overlay service for the target hop and flips the entry to `reach_mode=ziti`.
      operationId: pamEnableZiti
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Ziti reach enabled (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  reach_mode: {type: string, enum: [ziti]}
                  ziti_service_name: {type: string}
                  ziti_intercept_port: {type: integer}
        '409':
          description: No free broker loopback port available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/entries/{id}/ziti/disable:
    post:
      tags: [PAM Ziti Reach]
      summary: Disable Ziti reach for entry
      description: >-
        Admin only. Tears down the overlay service and reverts to direct reach.
        Under `PAM_REQUIRE_ZTNA=enforce` an entry on the overlay is not
        reverted (`409`, `ztna_required_direct_reach`): it could no longer be
        launched. Under `observe` the revert is audited as one enforce would
        refuse.
      operationId: pamDisableZiti
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reverted to direct reach
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  reach_mode: {type: string, enum: [direct]}
        '409':
          description: "`ztna_required_direct_reach`: under `PAM_REQUIRE_ZTNA=enforce` the entry stays on the overlay"

  # --- PAM: Windows application delivery (RemoteApp) ---
  /api/v1/access/pam/apps:
    get:
      tags: [Windows Apps]
      summary: List Windows apps (operator view)
      description: >-
        Apps, pools, host state, and host-agent links in one payload. Operators
        and above only; an end user's launchable apps are
        /api/v1/access/pam/my-apps.
      operationId: pamListWindowsApps
      responses:
        '403': { description: Not an operator, admin or super_admin }
        '200':
          description: App catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/WindowsApp'
                  pools:
                    type: array
                    items:
                      $ref: '#/components/schemas/WindowsAppPool'
                  host_state: {type: object, additionalProperties: true}
                  host_agents: {type: object, additionalProperties: true}
    post:
      tags: [Windows Apps]
      summary: Create Windows app
      description: Admin only. Targets a host entry or a pool.
      operationId: pamCreateWindowsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsAppInput'
      responses:
        '201':
          description: App created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Duplicate alias on host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/my-apps:
    get:
      tags: [Windows Apps]
      summary: List my launchable apps
      description: Active apps whose host (or any pool member) the caller may connect to — the same `connect` grant the launch endpoint gates on. Powers the end-user portal tiles.
      operationId: pamMyWindowsApps
      responses:
        '200':
          description: Launchable apps
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyWindowsApp'

  /api/v1/access/pam/apps/{id}:
    put:
      tags: [Windows Apps]
      summary: Update Windows app
      description: Admin only.
      operationId: pamUpdateWindowsApp
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsAppInput'
      responses:
        '200':
          description: App updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Windows Apps]
      summary: Delete Windows app
      description: Admin only.
      operationId: pamDeleteWindowsApp
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: App deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/apps/{id}/launch:
    post:
      tags: [Windows Apps]
      summary: Launch Windows app
      description: >
        RemoteApp launch through the same brokered path as entry connect (ACL +
        approval gates + placement across pool hosts). `?replace=<session_id>`
        replaces the caller's existing session on the chosen host.
      operationId: pamLaunchWindowsApp
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: replace
          in: query
          description: Session id to replace on the chosen host
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Launch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowsAppLaunchResponse'
        '202':
          description: Dual control — awaiting a second-person authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamDualControlPending'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No placeable host (capacity, or caller session conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/apps/{id}/icon:
    get:
      tags: [Windows Apps]
      summary: Get app icon
      operationId: pamWindowsAppIcon
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: PNG icon
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/app-import:
    post:
      tags: [Windows Apps]
      summary: Import discovered apps
      description: Admin only. Imports a discovery report of installed apps for a host; apps present in the host's TSAppAllowList are marked verified.
      operationId: pamImportWindowsApps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_entry_id, data]
              properties:
                host_entry_id: {type: string, format: uuid}
                data:
                  type: string
                  description: The discovery report JSON, as a string
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps_created: {type: integer}
                  apps_updated: {type: integer}
                  host_updated: {type: boolean}
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/app-pools:
    get:
      tags: [Windows Apps]
      summary: List app host pools
      description: Operators and above only.
      operationId: pamListAppPools
      responses:
        '403': { description: Not an operator, admin or super_admin }
        '200':
          description: Pools with members
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools:
                    type: array
                    items:
                      $ref: '#/components/schemas/WindowsAppPool'
    post:
      tags: [Windows Apps]
      summary: Create app host pool
      description: Admin only. Placement defaults to `least_loaded` (or `round_robin`).
      operationId: pamCreateAppPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsAppPoolInput'
      responses:
        '201':
          description: Pool created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/app-pools/{id}:
    put:
      tags: [Windows Apps]
      summary: Update app host pool
      description: Admin only.
      operationId: pamUpdateAppPool
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsAppPoolInput'
      responses:
        '200':
          description: Pool updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Windows Apps]
      summary: Delete app host pool
      description: Admin only.
      operationId: pamDeleteAppPool
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Pool deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/app-pools/{id}/members:
    post:
      tags: [Windows Apps]
      summary: Add pool member
      description: Admin only. Adds a host entry to the pool with a session cap.
      operationId: pamAddAppPoolMember
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_entry_id]
              properties:
                host_entry_id: {type: string, format: uuid}
                max_sessions: {type: integer, minimum: 1, default: 1}
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Host already in pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/app-pools/{id}/members/{memberId}:
    delete:
      tags: [Windows Apps]
      summary: Remove pool member
      description: Admin only.
      operationId: pamRemoveAppPoolMember
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: memberId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Member removed
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/app-hosts/{entryId}/agent:
    post:
      tags: [Windows Apps]
      summary: Link agent to app host
      description: Admin only. Binds an enrolled agent to a `windows_app_host` entry so its discovery reports route to that host.
      operationId: pamLinkAppHostAgent
      parameters:
        - name: entryId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Agent linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  host_entry_id: {type: string, format: uuid}
                  agent_id: {type: string}
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Windows Apps]
      summary: Unlink agent from app host
      description: Admin only.
      operationId: pamUnlinkAppHostAgent
      parameters:
        - name: entryId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Agent unlinked
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/agent/apk-info:
    get:
      tags: [Agent Enrollment]
      summary: Handle apk info
      operationId: handleAPKInfo
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleAPKInfo
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/access/agent/config:
    get:
      tags: [Agent Enrollment]
      summary: Handle config
      description: >-
        The device's posture-check list, report cadence and enforcement policy,
        plus what the server currently allows it to do. Authenticated with the
        agent's own credential (X-Agent-ID + X-Auth-Token). A revoked agent is
        answered 403.
      operationId: handleConfig
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleConfig
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  enrollment_status:
                    type: string
                    enum: [pending, active, suspended]
                    description: >-
                      What the server allows this device to do. Absent when the
                      server cannot resolve the agent (it then serves defaults);
                      a client must treat that as unknown rather than active.
                      Revoked is not a value here — it is the 403.
                  device_trusted:
                    type: boolean
                    description: >-
                      The IAM device-trust flag on the linked known_devices row,
                      which the overlay's #device-trusted attribute follows.
                      Only meaningful alongside enrollment_status=active.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/access/agent/device-key:
    post:
      tags: [Agent Enrollment]
      summary: Register the device key
      description: >-
        An enrolled agent with no device key on record offers the public half
        of its key (base64 PKIX DER of an ECDSA P-256 key; kind tpm, software
        or file), authenticated with its agent credential and signed with that
        same key in X-Agent-Key-Timestamp and X-Agent-Key-Signature. The same
        key again answers 200; a different key answers 409, because replacing a
        device's key is what enrolment is for. Once a key is bound, the
        device's posture reports must carry its signature.
      operationId: handleRegisterDeviceKey
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleRegisterDeviceKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, kind]
              properties:
                public_key:
                  type: string
                  description: Base64 of the PKIX DER encoding of an ECDSA P-256 public key
                kind:
                  type: string
                  enum: [tpm, software, file]
      responses:
        '200':
          description: The same key is already bound
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '201':
          description: The key is now bound to the device
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The device already holds a different key; enrol it again to replace it
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/access/agent/enroll:
    post:
      tags: [Agent Enrollment]
      summary: Handle enroll
      operationId: handleEnroll
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleEnroll
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/access/agent/enroll/oauth:
    post:
      tags: [Agent Enrollment]
      summary: Handle enroll O auth
      operationId: handleEnrollOAuth
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleEnrollOAuth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/access/agent/enroll/session:
    post:
      tags: [Agent Enrollment]
      summary: Handle create enroll session
      operationId: handleCreateEnrollSession
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleCreateEnrollSession
