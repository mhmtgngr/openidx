components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: A short machine-readable reason
        error_description:
          type: string
          description: Operator-facing detail, when the handler has one
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

    # --- Auth ---
    SessionInfo:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        authenticated:
          type: boolean

    IdpSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider_type:
          type: string
        enabled:
          type: boolean

    # --- Routes ---
    ProxyRoute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        from_url:
          type: string
        to_url:
          type: string
        preserve_host:
          type: boolean
        require_auth:
          type: boolean
        allowed_roles:
          type: array
          items:
            type: string
        allowed_groups:
          type: array
          items:
            type: string
        policy_ids:
          type: array
          items:
            type: string
        idle_timeout:
          type: integer
          description: Idle timeout in seconds
        absolute_timeout:
          type: integer
          description: Absolute timeout in seconds
        cors_allowed_origins:
          type: array
          items:
            type: string
        custom_headers:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
        priority:
          type: integer
        ziti_enabled:
          type: boolean
        ziti_service_name:
          type: string
        idp_id:
          type: string
        route_type:
          type: string
        remote_host:
          type: string
        remote_port:
          type: integer
        reverify_interval:
          type: integer
          description: Re-verification interval in seconds
        posture_check_ids:
          type: array
          items:
            type: string
        inline_policy:
          type: object
        require_device_trust:
          type: boolean
        allowed_countries:
          type: array
          items:
            type: string
        max_risk_score:
          type: number
        guacamole_connection_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProxyRouteCreate:
      type: object
      required: [name, from_url, to_url]
      properties:
        name:
          type: string
        description:
          type: string
        from_url:
          type: string
        to_url:
          type: string
        preserve_host:
          type: boolean
        require_auth:
          type: boolean
        allowed_roles:
          type: array
          items:
            type: string
        allowed_groups:
          type: array
          items:
            type: string
        policy_ids:
          type: array
          items:
            type: string
        idle_timeout:
          type: integer
        absolute_timeout:
          type: integer
        cors_allowed_origins:
          type: array
          items:
            type: string
        custom_headers:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
        ziti_enabled:
          type: boolean
        ziti_service_name:
          type: string
        idp_id:
          type: string
        route_type:
          type: string
        remote_host:
          type: string
        remote_port:
          type: integer
        reverify_interval:
          type: integer
        posture_check_ids:
          type: array
          items:
            type: string
        inline_policy:
          type: object
        require_device_trust:
          type: boolean
        allowed_countries:
          type: array
          items:
            type: string
        max_risk_score:
          type: number
        guacamole_connection_id:
          type: string

    # --- Sessions ---
    ProxySession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        route_id:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        started_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        device_fingerprint:
          type: string
        risk_score:
          type: number
        auth_methods:
          type: array
          items:
            type: string
        location:
          type: string
        device_trusted:
          type: boolean

    # --- Ziti ---
    ZitiStatus:
      type: object
      properties:
        connected:
          type: boolean
        controller_url:
          type: string
        version:
          type: string
        status:
          type: string

    ZitiService:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        encryption_required:
          type: boolean
        created_at:
          type: string
          format: date-time

    ZitiServiceCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        encryption_required:
          type: boolean

    ZitiIdentity:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        is_online:
          type: boolean
        enrollment_status:
          type: string
        created_at:
          type: string
          format: date-time

    ZitiIdentityCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string

    # --- Fabric ---
    FabricOverview:
      type: object
      properties:
        controller_version:
          type: string
        router_count:
          type: integer
        service_count:
          type: integer
        identity_count:
          type: integer
        session_count:
          type: integer

    EdgeRouter:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hostname:
          type: string
        is_online:
          type: boolean
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    FabricHealth:
      type: object
      properties:
        healthy:
          type: boolean
        controller_status:
          type: string
        router_statuses:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              online:
                type: boolean

    FabricMetrics:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        sessions_active:
          type: integer
        data_transferred_bytes:
          type: integer
        connections_active:
          type: integer

    ServicePolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        service_roles:
          type: array
          items:
            type: string
        identity_roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    # --- Posture ---
    PostureCheck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        parameters:
          type: object
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PostureCheckCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        parameters:
          type: object
        enabled:
          type: boolean
          default: true

    IdentityPosture:
      type: object
      properties:
        identity_id:
          type: string
        checks:
          type: array
          items:
            type: object
            properties:
              check_id:
                type: string
              name:
                type: string
              passing:
                type: boolean
              last_evaluated:
                type: string
                format: date-time
        overall_passing:
          type: boolean

    PostureEvaluation:
      type: object
      properties:
        identity_id:
          type: string
        passing:
          type: boolean
        results:
          type: array
          items:
            type: object
            properties:
              check_id:
                type: string
              name:
                type: string
              passing:
                type: boolean
              reason:
                type: string

    PostureSummary:
      type: object
      properties:
        total_identities:
          type: integer
        passing:
          type: integer
        failing:
          type: integer
        unknown:
          type: integer
        checks_defined:
          type: integer

    # --- Policy Sync ---
    PolicySyncState:
      type: object
      properties:
        id:
          type: string
          format: uuid
        governance_policy_id:
          type: string
        ziti_policy_id:
          type: string
        status:
          type: string
          enum: [synced, pending, error]
        last_synced_at:
          type: string
          format: date-time
        error_message:
          type: string

    PolicySyncRequest:
      type: object
      required: [governance_policy_id]
      properties:
        governance_policy_id:
          type: string

    # --- Certificates ---
    Certificate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        issuer:
          type: string
        serial_number:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        fingerprint:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string

    CertificateExpiryAlert:
      type: object
      properties:
        certificate_id:
          type: string
        subject:
          type: string
        not_after:
          type: string
          format: date-time
        days_until_expiry:
          type: integer
        severity:
          type: string
          enum: [info, warning, critical]

    # --- BrowZer ---
    BrowzerStatus:
      type: object
      properties:
        enabled:
          type: boolean
        bootstrapper_url:
          type: string
        version:
          type: string
        services_enabled:
          type: integer

    # --- Auth Decision ---
    AuthDecisionRequest:
      type: object
      properties:
        uri:
          type: string
        method:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string

    AuthDecisionResponse:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
        user_id:
          type: string
        required_action:
          type: string

    # --- Policy Validation ---
    PolicyValidationRequest:
      type: object
      properties:
        inline_policy:
          type: object
        allowed_roles:
          type: array
          items:
            type: string
        allowed_groups:
          type: array
          items:
            type: string
        require_device_trust:
          type: boolean
        allowed_countries:
          type: array
          items:
            type: string
        max_risk_score:
          type: number

    PolicyValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    # --- Guacamole PAM ---
    GuacSessionRequest:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        connection_id:
          type: string
        requester_id:
          type: string
        reason:
          type: string
        status:
          type: string
        approver_id:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    GuacActiveSession:
      type: object
      properties:
        identifier:
          type: string
        connectionIdentifier:
          type: string
        username:
          type: string
        remoteHost:
          type: string
        startDate:
          type: integer
          description: Session start time as epoch milliseconds

    GuacSessionRow:
      type: object
      properties:
        id:
          type: string
        connection_id:
          type: string
        user_id:
          type: string
          nullable: true
        guac_session_uuid:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        transcript_available:
          type: boolean
        transcript_generated_at:
          type: string
          format: date-time
          nullable: true

    # --- Guacamole ---
    GuacamoleConnection:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        protocol:
          type: string
          enum: [rdp, ssh, vnc, telnet]
        hostname:
          type: string
        port:
          type: integer
        route_id:
          type: string
        active_connections:
          type: integer

    GuacamoleConnectResponse:
      type: object
      properties:
        connection_id:
          type: string
        websocket_url:
          type: string
        token:
          type: string

    # --- PAM ---
    IdResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid

    PamEntryType:
      type: object
      properties:
        type:
          type: string
        kind:
          type: string
          enum: [session, credential, info]
        label:
          type: string
        protocol:
          type: string
          description: Broker protocol for launchable session types (rdp, ssh, vnc, telnet)
        secret_label:
          type: string

    PamFolder:
      type: object
      properties:
        id: {type: string, format: uuid}
        parent_id: {type: string, format: uuid}
        name: {type: string}
        icon: {type: string}
        description: {type: string}
        entry_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    PamFolderRequest:
      type: object
      required: [name]
      properties:
        parent_id: {type: string, format: uuid}
        name: {type: string}
        icon: {type: string}
        description: {type: string}

    PamEntry:
      type: object
      description: An entry row. Carries no secret material — `has_secret` / `credential_entry_id` say where the secret lives, never what it is.
      properties:
        id: {type: string, format: uuid}
        folder_id: {type: string, format: uuid}
        name: {type: string}
        entry_type: {type: string}
        kind: {type: string, enum: [session, credential, info]}
        description: {type: string}
        tags:
          type: array
          items: {type: string}
        hostname: {type: string}
        port: {type: integer}
        username: {type: string}
        domain: {type: string}
        url: {type: string}
        settings:
          type: object
          additionalProperties: true
        has_secret: {type: boolean}
        credential_entry_id: {type: string, format: uuid}
        credential_entry_name: {type: string}
        allow_reveal: {type: boolean}
        require_approval: {type: boolean}
        dual_control_required: {type: boolean}
        exclusive_checkout: {type: boolean}
        break_glass_enabled: {type: boolean}
        record_session: {type: boolean}
        reach_mode: {type: string, enum: [direct, ziti]}
        renderer: {type: string, enum: [guacamole, wasm-ssh, novnc, support]}
        ziti_enabled: {type: boolean}
        favorite: {type: boolean}
        last_connected_at: {type: string, format: date-time}
        connect_count: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    PamEntryUpsertRequest:
      type: object
      required: [name, entry_type]
      properties:
        folder_id: {type: string, format: uuid}
        name: {type: string}
        entry_type: {type: string}
        description: {type: string}
        tags:
          type: array
          items: {type: string}
        hostname:
          type: string
          description: Required for broker-protocol session types
        port:
          type: integer
          description: 0 selects the protocol default (rdp 3389, ssh 22, vnc 5900, telnet 23)
        username: {type: string}
        domain: {type: string}
        url:
          type: string
          description: Required for website entries
        settings:
          type: object
          additionalProperties: true
        secret:
          type: string
          description: Write-only. Seeds vault version 1 on create; appends a new version on update. Never returned.
        credential_entry_id:
          type: string
          format: uuid
          description: Linked shared-credential entry
        allow_reveal: {type: boolean}
        require_approval: {type: boolean}
        dual_control_required: {type: boolean}
        exclusive_checkout: {type: boolean}
        break_glass_enabled: {type: boolean}
        record_session: {type: boolean}
        renderer:
          type: string
          description: wasm-ssh only for ssh entries; unrecognized values fall back to guacamole

    PamFavoriteResponse:
      type: object
      properties:
        favorite: {type: boolean}

    PamEntryGrant:
      type: object
      properties:
        id: {type: string, format: uuid}
        principal_type: {type: string, enum: [user, role, group]}
        principal_id: {type: string}
        actions:
          type: array
          items: {type: string, enum: [view, connect, edit, reveal]}
        expires_at: {type: string, format: date-time}
        granted_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}

    PamEntryGrantRequest:
      type: object
      required: [principal_type, principal_id, actions]
      properties:
        principal_type: {type: string, enum: [user, role, group]}
        principal_id: {type: string}
        actions:
          type: array
          minItems: 1
          items: {type: string, enum: [view, connect, edit, reveal]}
        expires_at: {type: string, format: date-time}

    PamReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Audited justification (break-glass requires at least 10 characters)

    PamRevealResponse:
      type: object
      properties:
        value:
          type: string
          description: The secret plaintext

    PamBreakGlassResponse:
      type: object
      properties:
        value:
          type: string
          description: The secret plaintext
        break_glass:
          type: boolean
          enum: [true]

    PamDualControlPending:
      type: object
      properties:
        status: {type: string, enum: [awaiting_authorization]}
        message: {type: string}
        authorization_id: {type: string, format: uuid}

    PamExclusivityConflict:
      type: object
      properties:
        error: {type: string}
        held_by:
          type: string
          format: uuid
          description: Principal currently holding the exclusive checkout
        break_glass:
          type: boolean
          description: Whether break-glass is enabled on the entry

    PamLaunchResponse:
      type: object
      description: Brokered launch (`launch_type=guacamole`) or URL launch for website entries (`launch_type=url`, with `url` instead of the broker fields).
      properties:
        launch_type: {type: string, enum: [guacamole, url]}
        connect_url: {type: string}
        url: {type: string}
        entry_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        credential_injected: {type: boolean}
        recorded: {type: boolean}
        reach_mode: {type: string, enum: [direct, ziti]}

    PamAccessRequest:
      type: object
      properties:
        id: {type: string, format: uuid}
        entry_id: {type: string, format: uuid}
        entry_name: {type: string}
        entry_type: {type: string}
        requester_id: {type: string, format: uuid}
        reason: {type: string}
        status: {type: string, enum: [pending, approved, denied]}
        approver_id: {type: string, format: uuid}
        decided_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    PamAccessRequestList:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/PamAccessRequest'

    PamRequestDecisionResponse:
      type: object
      properties:
        request_id: {type: string, format: uuid}
        status: {type: string, enum: [approved, denied]}

    PamEntrySession:
      type: object
      properties:
        id: {type: string, format: uuid}
        entry_id: {type: string, format: uuid}
        entry_name: {type: string}
        user_id: {type: string, format: uuid}
        protocol: {type: string}
        credential_injected: {type: boolean}
        recording_available: {type: boolean}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        status: {type: string}

    PamEndedResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [ended]}

    PamImportResult:
      type: object
      properties:
        folders_created: {type: integer}
        entries_created: {type: integer}
        secrets_stored: {type: integer}
        by_type:
          type: object
          additionalProperties: {type: integer}
        skipped:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              reason: {type: string}

    PamCheckoutAuthorization:
      type: object
      properties:
        id: {type: string, format: uuid}
        entry_id: {type: string, format: uuid}
        entry_name: {type: string}
        requester_id: {type: string, format: uuid}
        action: {type: string}
        reason: {type: string}
        status: {type: string, enum: [pending, approved, denied, consumed]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}

    PamActiveCheckout:
      type: object
      properties:
        id: {type: string, format: uuid}
        entry_id: {type: string, format: uuid}
        entry_name: {type: string}
        principal_id: {type: string, format: uuid}
        action: {type: string}
        reason: {type: string}
        break_glass: {type: boolean}
        leased_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}

    PamModerationOpened:
      type: object
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending]}
        expires_at: {type: string, format: date-time}
        reused:
          type: boolean
          description: Present (true) when an existing pending request was returned

    PamModerationPendingItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        connection_id: {type: string}
        requester_id: {type: string, format: uuid}
        reason: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        connection:
          type: string
          description: Target hostname of the connection

    PamModerationStatus:
      type: object
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, active, ended, expired]}
        moderator_id: {type: string, format: uuid}
        active_conn_id: {type: string}
        joined_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}

    SSHCAPublicKey:
      type: object
      properties:
        public_key:
          type: string
          description: authorized_keys-format CA public key
        key_type: {type: string, example: ssh-ed25519}
        trusted_ca_line:
          type: string
          description: Ready-to-install `@cert-authority` line (GET only)
        already_initialized:
          type: boolean
          description: Present (true) when init found an existing CA

    SSHConnectRequest:
      type: object
      required: [host, principal]
      properties:
        host: {type: string}
        principal:
          type: string
          description: The login name on the target host
        public_key:
          type: string
          description: Optional BYO public key (authorized_keys line); omitted → an ephemeral keypair is generated
        reason: {type: string}
        ttl_minutes:
          type: integer
          description: Certificate lifetime (default 10, hard cap 60)

    SSHConnectResponse:
      type: object
      properties:
        session_id: {type: string, format: uuid}
        certificate:
          type: string
          description: The signed SSH user certificate (authorized_keys format)
        principal: {type: string}
        expires_at: {type: string, format: date-time}
        private_key:
          type: string
          description: Ephemeral private key PEM — returned once, only when no public key was supplied; never stored

    BrokerSessionRequest:
      type: object
      required: [target_type, target, principal]
      properties:
        target_type: {type: string, enum: [db, k8s]}
        target: {type: string}
        principal: {type: string}
        reason: {type: string}
        ttl_minutes: {type: integer}

    BrokeredSession:
      type: object
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        target_type: {type: string, enum: [ssh, db, k8s, cloud]}
        target: {type: string}
        principal: {type: string}
        reason: {type: string}
        status: {type: string}
        started_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}

    CloudConnectRequest:
      type: object
      required: [role_arn, secret_id]
      properties:
        provider:
          type: string
          description: '"aws" (default); GCP/Azure reserved'
        role_arn: {type: string}
        region: {type: string, default: us-east-1}
        secret_id:
          type: string
          format: uuid
          description: Vault secret holding the broker credentials (JSON access_key_id/secret_access_key)
        reason: {type: string}
        ttl_minutes:
          type: integer
          description: Clamped to 15–720
        console:
          type: boolean
          description: Also return a federated console URL

    CloudConnectResponse:
      type: object
      properties:
        session_id: {type: string, format: uuid}
        provider: {type: string, enum: [aws]}
        role_arn: {type: string}
        region: {type: string}
        access_key_id: {type: string}
        secret_access_key: {type: string}
        session_token: {type: string}
        expires_at: {type: string, format: date-time}
        console_url: {type: string}
        console_error: {type: string}

    PrivilegeReacher:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
        via:
          type: string
          description: Grant mechanism (direct grant, role, group…)
        path:
          type: string
          description: Human-readable grant path
        actions:
          type: array
          items: {type: string}

    ResourcePrivilegeGraph:
      type: object
      properties:
        kind: {type: string, enum: [secret, pam_entry]}
        resource_id: {type: string, format: uuid}
        reacher_count: {type: integer}
        reachers:
          type: array
          items:
            $ref: '#/components/schemas/PrivilegeReacher'

    UserPrivilegeGraph:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        resource_count: {type: integer}
        resources:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [secret, pam_entry]}
              resource_id: {type: string, format: uuid}
              name: {type: string}
              via: {type: string}
              path: {type: string}
              actions:
                type: array
                items: {type: string}

    PamZitiBinding:
      type: object
      properties:
        service_name: {type: string}
        entry_id: {type: string, format: uuid}
        intercept_port: {type: integer}

    WindowsApp:
      type: object
      properties:
        id: {type: string, format: uuid}
        host_entry_id: {type: string, format: uuid}
        host_name: {type: string}
        pool_id: {type: string, format: uuid}
        pool_name: {type: string}
        alias: {type: string}
        display_name: {type: string}
        exec_path: {type: string}
        args: {type: string}
        working_dir: {type: string}
        has_icon: {type: boolean}
        source: {type: string, enum: [manual, tsapp, app_paths, start_menu, appx]}
        verified: {type: boolean}
        status: {type: string}
        require_approval: {type: boolean}
        record_session: {type: boolean}
        created_at: {type: string}
        updated_at: {type: string}

    WindowsAppInput:
      type: object
      required: [alias, display_name]
      properties:
        host_entry_id:
          type: string
          format: uuid
          description: Single-host target (mutually exclusive with pool_id)
        pool_id: {type: string, format: uuid}
        alias:
          type: string
          description: RemoteApp alias (without the `||` prefix)
        display_name: {type: string}
        exec_path: {type: string}
        args:
          type: string
          description: Must not contain secret material (visible in the target's process list)
        working_dir: {type: string}
        require_approval: {type: boolean}
        record_session: {type: boolean}

    MyWindowsApp:
      type: object
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        alias: {type: string}
        host_name: {type: string}
        pool_name: {type: string}
        has_icon: {type: boolean}
        require_approval: {type: boolean}

    WindowsAppLaunchResponse:
      type: object
      properties:
        launch_type: {type: string, enum: [guacamole]}
        connect_url: {type: string}
        app_id: {type: string, format: uuid}
        host_entry_id: {type: string, format: uuid}
        host_name: {type: string}
        session_id: {type: string, format: uuid}
        recorded: {type: boolean}

    WindowsAppPool:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        placement: {type: string, enum: [least_loaded, round_robin]}
        members:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              host_entry_id: {type: string, format: uuid}
              host_name: {type: string}
              max_sessions: {type: integer}
              active_sessions: {type: integer}
        created_at: {type: string}
        updated_at: {type: string}

    WindowsAppPoolInput:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        placement:
          type: string
          enum: [least_loaded, round_robin]
          default: least_loaded
