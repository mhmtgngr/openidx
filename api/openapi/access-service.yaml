  # --- Auth Decision ---
  /api/v1/access/auth/decide:
    post:
      tags: [Auth Decision]
      summary: Auth decision endpoint (POST)
      description: >-
        Forward-auth. Allowing, it answers the headers the edge is to put on
        the upstream request in place of the caller's: `X-Forwarded-User`,
        `X-Forwarded-Email`, `X-Forwarded-Name`, `X-Forwarded-Roles`,
        `X-Forwarded-Route` and `X-Risk-Score`, empty where there is no
        identity; the caller's `Cookie` without the proxy's
        `_openidx_proxy_session`, when the caller sent it; and an empty
        `Authorization` when the access service authenticated the request with
        it. The edge must copy all of them onto the upstream request. A proxy
        session is accepted for the host in `X-Forwarded-Host` only when it
        was issued for that host. Refusing sign-in, it redirects to
        `/access/.auth/login`.
      operationId: authDecidePost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDecisionRequest'
      responses:
        '200':
          description: Auth decision result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Auth Decision]
      summary: Auth decision endpoint (GET)
      description: >-
        Forward-auth. Allowing, it answers the headers the edge is to put on
        the upstream request in place of the caller's: `X-Forwarded-User`,
        `X-Forwarded-Email`, `X-Forwarded-Name`, `X-Forwarded-Roles`,
        `X-Forwarded-Route` and `X-Risk-Score`, empty where there is no
        identity; the caller's `Cookie` without the proxy's
        `_openidx_proxy_session`, when the caller sent it; and an empty
        `Authorization` when the access service authenticated the request with
        it. The edge must copy all of them onto the upstream request. A proxy
        session is accepted for the host in `X-Forwarded-Host` only when it
        was issued for that host. Refusing sign-in, it redirects to
        `/access/.auth/login`.
      operationId: authDecideGet
      parameters:
        - name: uri
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Auth decision result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

