  /api/v1/access/routes/bulk:
    post:
      tags: [Proxy Routes]
      summary: Bulk routes
      description: >-
        Every route is created enabled. A list naming a host an enabled route
        already serves, or one host twice, is refused as a whole with 409,
        listing the conflicts; nothing is created. A conflict with another
        organization's route names only the host.
        Admin role. Creates one route per entry of `routes` and per host of
        `subnet`. A Ziti route's service is named `openidx-<route name>`; a
        route whose service name is another organization's or one of the
        install's own services is not created, and its name is listed in
        `name_conflicts`.
      operationId: bulkRoutes
      x-openidx-handler: internal/access.(*Service).handleBulkRoutes
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  created:
                    type: integer
                  requested:
                    type: integer
                  name_conflicts:
                    type: array
                    items:
                      type: string
                    description: The routes not created because their Ziti service name is taken
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Hosts the list cannot have; nothing was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  conflicts:
                    type: array
                    items:
                      type: object
                      properties:
                        host:
                          type: string
                        reason:
                          type: string
                        route:
                          type: string
                          description: The caller's own route that serves the host; absent for another organization's
        '500':
          $ref: '#/components/responses/ServerError'

