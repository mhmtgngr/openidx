openapi: 3.0.3
info:
  title: OpenIDX Access Service
  description: |
    Zero Trust access proxy with route management, session control, OpenZiti network overlay, posture checks, BrowZer, Guacamole integration, and Privileged Access Management (vault-backed entries, brokered launch with credential injection, checkout controls, session moderation, SSH CA, cloud JIT, Windows app delivery).

    Every route cmd/access-service mounts appears here, and nothing that is not
    mounted does: test/openapi/spec_census_test.go compares this file against the
    live route table in both directions. Operations carry an `x-openidx-handler`
    extension naming the Go handler that serves them; where a payload shape is not
    yet pinned the body is shown as a free-form JSON object rather than invented.
  version: 1.40.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8007
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Agent Downloads
  - name: Agent Enrollment
  - name: Agent Fleet
  - name: Assignment Report
  - name: Auth
  - name: Auth Decision
  - name: BrowZer
  - name: Certificates
  - name: Devices
  - name: Guacamole
  - name: Integration Health
  - name: Kiosk Mode
  - name: MCP Gateway
  - name: My Access
  - name: OpenZiti Overlay
  - name: Overview
  - name: PAM Checkout Controls
  - name: PAM Entries
  - name: PAM Launch
  - name: PAM Moderation
  - name: PAM Privilege Graph
  - name: PAM SSH & Brokering
  - name: PAM Ziti Reach
  - name: Policy
  - name: Policy Sync
  - name: Posture Checks
  - name: Proxy Routes
  - name: Published Applications
  - name: Quick Links
  - name: Remote Support
  - name: Routes
  - name: Services
  - name: Session Brokering
  - name: Session Recording
  - name: Sessions
  - name: Temporary Access
  - name: Unified Audit
  - name: Users
  - name: Windows Apps
  - name: Ziti Fabric
  - name: Ziti Identities
  - name: Ziti Services
  - name: Ziti Status

paths:
  # --- Auth (session-based, no bearer auth) ---
  /access/.auth/login:
    get:
      tags: [Auth]
      summary: Login page
      description: >-
        Starts signing in to the proxied application on this host. After
        sign-in the callback sends the browser to `redirect_url` when it is a
        path on the same host (one leading slash, not two, and no backslash),
        or an http(s) URL with no user information whose host is the access
        service's own (`ACCESS_PROXY_DOMAIN`, with or without the service's
        port) or the host of one of the organization's enabled proxy routes,
        compared exactly. Any other target, and a missing one, lands on
        `/access/.auth/session`; with `idp`, on `/`.
      operationId: loginPage
      x-openidx-handler: internal/access.(*Service).handleLogin
      security: []
      parameters:
        - name: redirect_url
          in: query
          description: Where to send the browser after sign-in, held to the rule above.
          schema:
            type: string
        - name: idp
          in: query
          description: The id of one of the organization's identity providers to sign in with.
          schema:
            type: string
      responses:
        '200':
          description: Login page rendered
        '302':
          description: Redirect to identity provider

  /access/.auth/callback:
    get:
      tags: [Auth]
      summary: OAuth callback
      description: >-
        With `code` and `state`, completes sign-in: it sets the proxy session
        cookie, which is good on this host only, and redirects to the target
        the login stored, checked again against the login's rule. With
        `login_session`, serves a sign-in form for that pending OAuth request,
        but only for the shape the OAuth service mints (44 characters of
        padded base64url); anything else is a 400. The form is served under its
        own Content-Security-Policy: a per-response nonce for its script and
        style, `connect-src` the OAuth issuer, and `form-action`, `base-uri`,
        `object-src` and `frame-ancestors` set to `'none'`.
      operationId: oauthCallback
      x-openidx-handler: internal/access.(*Service).handleCallback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: login_session
          in: query
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}=$'
      responses:
        '200':
          description: The sign-in form for a pending login_session
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect after successful authentication
        '400':
          $ref: '#/components/responses/BadRequest'

  /access/.auth/logout:
    get:
      tags: [Auth]
      summary: Logout
      description: >-
        Ends the proxy session the cookie names, clears the cookie and
        redirects to `redirect_url` when it passes the login's rule, and to
        `/access/.auth/login` otherwise.
      operationId: logout
      x-openidx-handler: internal/access.(*Service).handleLogout
      security: []
      parameters:
        - name: redirect_url
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to login after logout

  /access/.auth/session:
    get:
      tags: [Auth]
      summary: Get current session info
      description: >-
        Reports the proxy session the cookie names. A session is good on the
        host whose sign-in set its cookie, on any port, and nowhere else: on
        another host the answer is 401.
      operationId: getSessionInfo
      x-openidx-handler: internal/access.(*Service).handleSessionInfo
      security: []
      responses:
        '200':
          description: Current session information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /access/.auth/idps:
    get:
      tags: [Auth]
      summary: List identity providers
      operationId: listIdps
      x-openidx-handler: internal/access.(*Service).handleIDPDiscovery
      security: []
      responses:
        '200':
          description: Available identity providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdpSummary'

  # --- Routes ---
  /api/v1/access/upstream-pools:
    get:
      tags: [Upstream Pools]
      summary: List upstream pools
      description: >-
        Admin only: a pool's members are the addresses behind the routes on it.
        Every pool in the caller's organization, with its backends, how many
        routes point at it, and whether it is actually serving. A pool with no
        usable backend is not rendered into the data plane — an upstream with no
        node would black-hole the route — so routes on it fall back to the single
        address in their target URL. `in_effect` reports that, and
        `not_in_effect_reason` says which case it is.
      operationId: listUpstreamPools
      responses:
        '200':
          description: Upstream pools
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools:
                    type: array
                    items:
                      $ref: '#/components/schemas/UpstreamPool'
                  total: { type: integer }
        '403': { description: Not an admin, or no organization context }
    post:
      tags: [Upstream Pools]
      summary: Create an upstream pool
      description: >-
        Admin only. Backends may be supplied inline; the pool and its members are
        written in one transaction, so a refused create leaves nothing behind. A
        new pool serves nothing until a route sets `upstream_pool_id` to it.
      operationId: createUpstreamPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                algorithm: { type: string, enum: [roundrobin, chash], default: roundrobin }
                hash_on: { type: string, enum: [vars, header, cookie], default: vars }
                hash_key: { type: string, default: remote_addr }
                health_check_enabled: { type: boolean, default: true }
                health_check_path: { type: string, default: / }
                healthy_threshold: { type: integer, minimum: 1, maximum: 10, default: 2 }
                unhealthy_threshold: { type: integer, minimum: 1, maximum: 10, default: 3 }
                health_check_interval: { type: integer, minimum: 1, maximum: 300, default: 5 }
                health_check_timeout: { type: integer, minimum: 1, maximum: 60, default: 3 }
                retries:
                  type: integer
                  minimum: 0
                  maximum: 10
                  nullable: true
                  description: Omit to let the data plane decide (member count - 1).
                members:
                  type: array
                  items:
                    $ref: '#/components/schemas/UpstreamPoolMemberInput'
      responses:
        '201': { description: Created }
        '400': { description: A value the pool cannot carry; the message names the field }
        '409': { description: The name is taken, or a backend is listed twice }
  /api/v1/access/upstream-pools/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Upstream Pools]
      summary: Get an upstream pool
      description: Admin only, like the list.
      operationId: getUpstreamPool
      responses:
        '200':
          description: The pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamPool'
        '403': { description: Not an admin }
        '404': { description: Not found in this organization }
    put:
      tags: [Upstream Pools]
      summary: Update an upstream pool
      description: >-
        Admin only. Fields left out are unchanged. `retries` is tri-state: absent
        keeps it, `retries_set: false` clears it back to the data plane default,
        a number sets it.
      operationId: updateUpstreamPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                algorithm: { type: string, enum: [roundrobin, chash] }
                hash_on: { type: string, enum: [vars, header, cookie] }
                hash_key: { type: string }
                health_check_enabled: { type: boolean }
                health_check_path: { type: string }
                healthy_threshold: { type: integer, minimum: 1, maximum: 10 }
                unhealthy_threshold: { type: integer, minimum: 1, maximum: 10 }
                health_check_interval: { type: integer, minimum: 1, maximum: 300 }
                health_check_timeout: { type: integer, minimum: 1, maximum: 60 }
                retries: { type: integer, minimum: 0, maximum: 10 }
                retries_set: { type: boolean }
      responses:
        '200':
          description: The updated pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamPool'
        '400': { description: A value the pool cannot carry }
        '404': { description: Not found in this organization }
        '409': { description: The name is taken }
    delete:
      tags: [Upstream Pools]
      summary: Delete an upstream pool
      description: >-
        Admin only, and refused while any route still names the pool. The foreign
        key is ON DELETE SET NULL, so deleting one would move every route on it
        back to a single backend with no health checking — a traffic change the
        caller did not ask for. The 409 names the routes to detach first.
      operationId: deleteUpstreamPool
      responses:
        '200': { description: Deleted }
        '404': { description: Not found in this organization }
        '409':
          description: Routes still use this pool
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  detail: { type: string }
                  routes:
                    type: array
                    items: { type: string }
  /api/v1/access/upstream-pools/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Upstream Pools]
      summary: Add a backend to a pool
      operationId: addUpstreamPoolMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpstreamPoolMemberInput'
      responses:
        '201': { description: Added }
        '400': { description: A value the backend cannot carry; the message names the field }
        '404': { description: Pool not found in this organization }
        '409': { description: That backend is already a member — listing it twice would double its share }
  /api/v1/access/upstream-pools/{id}/members/{memberId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Upstream Pools]
      summary: Drain, restore or reweight a backend
      description: >-
        Admin only. The response carries the pool's resulting state, because
        disabling or draining the last usable backend does not stop the routes on
        the pool — it sends them back to their single target.
      operationId: updateUpstreamPoolMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                weight:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  description: 0 drains the backend without removing it.
                enabled:
                  type: boolean
                  description: false removes it from the rendered upstream entirely, so it is not even health-checked.
      responses:
        '200':
          description: Updated, with the pool's resulting state
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  pool:
                    $ref: '#/components/schemas/UpstreamPool'
        '400': { description: Nothing to change, or a weight out of range }
        '404': { description: Member not found in this organization }
    delete:
      tags: [Upstream Pools]
      summary: Remove a backend from a pool
      operationId: deleteUpstreamPoolMember
      responses:
        '200':
          description: Removed, with the pool's resulting state
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  pool:
                    $ref: '#/components/schemas/UpstreamPool'
        '404': { description: Member not found in this organization }
  /api/v1/access/routes:
    get:
      tags: [Routes]
      summary: List proxy routes
      description: >-
        Admin only, like every route below. A route's definition names its
        upstream, the headers it adds and the rules that decide who reaches it.
      operationId: listRoutes
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of proxy routes
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxyRoute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Routes]
      summary: Create proxy route
      description: >-
        Admin only. `custom_headers` may not name a header the proxy writes from
        the signed-in session (`X-Forwarded-User`, `X-Forwarded-Email`,
        `X-Forwarded-Name`, `X-Forwarded-Roles`, `X-Forwarded-Groups`,
        `X-Forwarded-Preferred-Username`, `X-Forwarded-Access-Token`,
        `X-Forwarded-Route`, `X-Risk-Score`, `X-Ziti-Identity` or any
        `X-Auth-Request-*`), in any case; such a route is refused with 400.
        A host is served by one enabled route in the whole installation: a
        `from_url` whose host another enabled route serves is refused with 409.
      operationId: createRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRouteCreate'
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/RouteHostTaken'

  /api/v1/access/routes/{id}:
    get:
      tags: [Routes]
      summary: Get proxy route
      description: Admin only.
      operationId: getRoute
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Route details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRoute'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Routes]
      summary: Update proxy route
      description: >-
        Admin only. `custom_headers` is held to the same rule as on create: a
        header the proxy writes from the signed-in session is refused with 400.
        A new `from_url`, or enabling the route, is held to the same rule: 409
        when another enabled route serves the host.
      operationId: updateRoute
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRouteCreate'
      responses:
        '200':
          description: Route updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RouteHostTaken'
    delete:
      tags: [Routes]
      summary: Delete proxy route
      description: Admin only.
      operationId: deleteRoute
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Route deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Sessions ---
  /api/v1/access/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions
      description: >-
        Admin only. Every live proxy session in the caller's organization, with
        the user it belongs to.
      operationId: listSessions
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of active sessions
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/access/sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Revoke session
      description: >-
        Admin only. Ends the session at once: the proxy and forward-auth refuse
        its cookie on the next request. A user ends their own proxy session by
        signing out (`GET /access/.auth/logout`).
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Session revoked
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: >-
            The session is marked revoked but its live session could not be
            deleted, so it still works; retrying finishes the revocation.

  # --- Ziti Status ---
  /api/v1/access/ziti/status:
    get:
      tags: [Ziti Status]
      summary: Get Ziti controller status
      description: >-
        Any signed-in user. Whether OpenZiti is configured and the
        controller answers, with the organization's own service and
        identity counts. The controller's version, management endpoints,
        console URL and error text go to an install administrator (admin
        or super_admin of the default organization) only.
      operationId: getZitiStatus
      responses:
        '200':
          description: Ziti controller status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZitiStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- Ziti Services ---
  /api/v1/access/ziti/services:
    get:
      tags: [Ziti Services]
      summary: List Ziti services
      description: >-
        Operator tier or above. The organization's Ziti services, with the
        internal host and port each one forwards to.
      operationId: listZitiServices
      responses:
        '200':
          description: List of Ziti services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZitiService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Ziti Services]
      summary: Create Ziti service
      description: >-
        Admin role. 409 when the name is another organization's or one of
        the install's own services, or -- for anyone but an install
        administrator -- already a service on the controller: the service
        would be adopted and rewritten. For anyone but an install
        administrator, 409 too when intercept_address is one a service
        another organization or the install holds intercepts; 403 when
        dial_roles name identities of another organization or an
        attribute OpenIDX gives users of every organization, or when
        attributes are managed by OpenIDX, another organization's or the
        install's service name, or named by a policy the organization does
        not own.
      operationId: createZitiService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZitiServiceCreate'
      responses:
        '201':
          description: Ziti service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZitiService'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The service name is another organization's or the install's, or already on the controller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/ziti/services/{id}:
    delete:
      tags: [Ziti Services]
      summary: Delete Ziti service
      operationId: deleteZitiService
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Ziti service deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Ziti Identities ---
  /api/v1/access/ziti/identities:
    get:
      tags: [Ziti Identities]
      summary: List Ziti identities
      description: Operator tier or above; the list names every user who has an identity.
      operationId: listZitiIdentities
      responses:
        '200':
          description: List of Ziti identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZitiIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Ziti Identities]
      summary: Create Ziti identity
      description: >-
        Admin role. For anyone but an install administrator, an attribute
        OpenIDX manages (access-proxy-clients, browzer-users,
        enrolled-users, device-trusted, quarantined, org- and app- markers
        and the like) cannot be added or removed, and an attribute that a
        policy the organization does not own grants cannot be added: 403.
      operationId: createZitiIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZitiIdentityCreate'
      responses:
        '201':
          description: Ziti identity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZitiIdentity'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/ziti/identities/{id}:
    delete:
      tags: [Ziti Identities]
      summary: Delete Ziti identity
      operationId: deleteZitiIdentity
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Ziti identity deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/ziti/identities/{id}/enrollment-jwt:
    get:
      tags: [Ziti Identities]
      summary: Get enrollment JWT for identity
      operationId: getEnrollmentJwt
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Enrollment JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Ziti Route Integration ---
  /api/v1/access/ziti/routes/{id}/enable:
    post:
      tags: [Ziti Services]
      summary: Enable Ziti on route
      description: >-
        Admin role. 409 when service_name is another organization's or one
        of the install's own services.
      operationId: enableZitiOnRoute
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Ziti enabled on route
          content:
            application/json:
              schema:
