openapi: 3.0.3
info:
  title: OpenIDX Access Service
  description: |
    Zero Trust access proxy with route management, session control, OpenZiti network overlay, posture checks, BrowZer, Guacamole integration, and Privileged Access Management (vault-backed entries, brokered launch with credential injection, checkout controls, session moderation, SSH CA, cloud JIT, Windows app delivery).

    Every route cmd/access-service mounts appears here, and nothing that is not
    mounted does: test/openapi/spec_census_test.go compares this file against the
    live route table in both directions. Operations carry an `x-openidx-handler`
    extension naming the Go handler that serves them; where a payload shape is not
    yet pinned the body is shown as a free-form JSON object rather than invented.
  version: 1.34.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8007
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Agent Downloads
  - name: Agent Enrollment
  - name: Agent Fleet
  - name: Assignment Report
  - name: Auth
  - name: Auth Decision
  - name: BrowZer
  - name: Certificates
  - name: Devices
  - name: Guacamole
  - name: Integration Health
  - name: Kiosk Mode
  - name: MCP Gateway
  - name: My Access
  - name: OpenZiti Overlay
  - name: Overview
  - name: PAM Checkout Controls
  - name: PAM Entries
  - name: PAM Launch
  - name: PAM Moderation
  - name: PAM Privilege Graph
  - name: PAM SSH & Brokering
  - name: PAM Ziti Reach
  - name: Policy
  - name: Policy Sync
  - name: Posture Checks
  - name: Proxy Routes
  - name: Published Applications
  - name: Quick Links
  - name: Remote Support
  - name: Routes
  - name: Services
  - name: Session Brokering
  - name: Session Recording
  - name: Sessions
  - name: Temporary Access
  - name: Unified Audit
  - name: Users
  - name: Windows Apps
  - name: Ziti Fabric
  - name: Ziti Identities
  - name: Ziti Services
  - name: Ziti Status

paths:
  # --- Auth (session-based, no bearer auth) ---
  /access/.auth/login:
    get:
      tags: [Auth]
      summary: Login page
      operationId: loginPage
      x-openidx-handler: internal/access.(*Service).handleLogin
      security: []
      responses:
        '200':
          description: Login page rendered
        '302':
          description: Redirect to identity provider

  /access/.auth/callback:
    get:
      tags: [Auth]
      summary: OAuth callback
      operationId: oauthCallback
      x-openidx-handler: internal/access.(*Service).handleCallback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect after successful authentication
        '400':
          $ref: '#/components/responses/BadRequest'

  /access/.auth/logout:
    get:
      tags: [Auth]
      summary: Logout
      operationId: logout
      x-openidx-handler: internal/access.(*Service).handleLogout
      security: []
      responses:
        '302':
          description: Redirect to login after logout

  /access/.auth/session:
    get:
      tags: [Auth]
      summary: Get current session info
      operationId: getSessionInfo
      x-openidx-handler: internal/access.(*Service).handleSessionInfo
      security: []
      responses:
        '200':
          description: Current session information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /access/.auth/idps:
    get:
      tags: [Auth]
      summary: List identity providers
      operationId: listIdps
      x-openidx-handler: internal/access.(*Service).handleIDPDiscovery
      security: []
      responses:
        '200':
          description: Available identity providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdpSummary'

  # --- Routes ---
  /api/v1/access/routes:
    get:
      tags: [Routes]
      summary: List proxy routes
      operationId: listRoutes
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of proxy routes
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxyRoute'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Routes]
      summary: Create proxy route
      operationId: createRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRouteCreate'
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/access/routes/{id}:
    get:
      tags: [Routes]
      summary: Get proxy route
      operationId: getRoute
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Route details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRoute'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Routes]
      summary: Update proxy route
      operationId: updateRoute
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRouteCreate'
      responses:
        '200':
          description: Route updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Routes]
      summary: Delete proxy route
      operationId: deleteRoute
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Route deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Sessions ---
  /api/v1/access/sessions:
    get:
      tags: [Sessions]
      summary: List active sessions
      operationId: listSessions
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of active sessions
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProxySession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/access/sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Revoke session
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Session revoked
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Ziti Status ---
  /api/v1/access/ziti/status:
    get:
      tags: [Ziti Status]
      summary: Get Ziti controller status
      operationId: getZitiStatus
      responses:
        '200':
          description: Ziti controller status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZitiStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- Ziti Services ---
  /api/v1/access/ziti/services:
    get:
      tags: [Ziti Services]
      summary: List Ziti services
      operationId: listZitiServices
      responses:
        '200':
          description: List of Ziti services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZitiService'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Ziti Services]
      summary: Create Ziti service
      operationId: createZitiService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZitiServiceCreate'
      responses:
        '201':
          description: Ziti service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZitiService'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/ziti/services/{id}:
    delete:
      tags: [Ziti Services]
      summary: Delete Ziti service
      operationId: deleteZitiService
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Ziti service deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Ziti Identities ---
  /api/v1/access/ziti/identities:
    get:
      tags: [Ziti Identities]
      summary: List Ziti identities
      operationId: listZitiIdentities
      responses:
        '200':
          description: List of Ziti identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZitiIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Ziti Identities]
      summary: Create Ziti identity
      operationId: createZitiIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZitiIdentityCreate'
      responses:
        '201':
          description: Ziti identity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZitiIdentity'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/ziti/identities/{id}:
    delete:
      tags: [Ziti Identities]
      summary: Delete Ziti identity
      operationId: deleteZitiIdentity
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Ziti identity deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/ziti/identities/{id}/enrollment-jwt:
    get:
      tags: [Ziti Identities]
      summary: Get enrollment JWT for identity
      operationId: getEnrollmentJwt
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Enrollment JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Ziti Route Integration ---
  /api/v1/access/ziti/routes/{id}/enable:
    post:
      tags: [Ziti Services]
      summary: Enable Ziti on route
      operationId: enableZitiOnRoute
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Ziti enabled on route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRoute'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/ziti/routes/{id}/disable:
    post:
      tags: [Ziti Services]
      summary: Disable Ziti on route
      operationId: disableZitiOnRoute
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Ziti disabled on route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyRoute'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Ziti Fabric ---
  /api/v1/access/ziti/fabric/overview:
    get:
      tags: [Ziti Fabric]
      summary: Get fabric overview
      operationId: getFabricOverview
      responses:
        '200':
          description: Fabric overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/access/ziti/fabric/routers:
    get:
      tags: [Ziti Fabric]
      summary: List edge routers
      operationId: listEdgeRouters
      responses:
        '200':
          description: List of edge routers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EdgeRouter'

  /api/v1/access/ziti/fabric/routers/{id}:
    get:
      tags: [Ziti Fabric]
      summary: Get edge router
      operationId: getEdgeRouter
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Edge router details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgeRouter'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/ziti/fabric/health:
    get:
      tags: [Ziti Fabric]
      summary: Get fabric health
      operationId: getFabricHealth
      responses:
        '200':
          description: Fabric health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricHealth'

  /api/v1/access/ziti/fabric/reconnect:
    post:
      tags: [Ziti Fabric]
      summary: Reconnect to Ziti controller
      operationId: reconnectFabric
      responses:
        '200':
          description: Reconnection initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /api/v1/access/ziti/fabric/metrics:
    get:
      tags: [Ziti Fabric]
      summary: Get fabric metrics
      operationId: getFabricMetrics
      responses:
        '200':
          description: Fabric metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FabricMetrics'

  /api/v1/access/ziti/fabric/service-policies:
    get:
      tags: [Ziti Fabric]
      summary: List service policies
      operationId: listServicePolicies
      responses:
        '200':
          description: List of service policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePolicy'

  # --- Posture Checks ---
  /api/v1/access/ziti/posture/checks:
    get:
      tags: [Posture Checks]
      summary: List posture checks
      operationId: listPostureChecks
      responses:
        '200':
          description: List of posture checks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostureCheck'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Posture Checks]
      summary: Create posture check
      operationId: createPostureCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostureCheckCreate'
      responses:
        '201':
          description: Posture check created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostureCheck'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/ziti/posture/checks/{id}:
    put:
      tags: [Posture Checks]
      summary: Update posture check
      operationId: updatePostureCheck
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostureCheckCreate'
      responses:
        '200':
          description: Posture check updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostureCheck'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Posture Checks]
      summary: Delete posture check
      operationId: deletePostureCheck
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Posture check deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/ziti/posture/identities/{id}:
    get:
      tags: [Posture Checks]
      summary: Get identity posture
      operationId: getIdentityPosture
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Identity posture status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityPosture'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/ziti/posture/identities/{id}/evaluate:
    post:
      tags: [Posture Checks]
      summary: Evaluate identity posture
      operationId: evaluateIdentityPosture
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Posture evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostureEvaluation'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/ziti/posture/summary:
    get:
      tags: [Posture Checks]
      summary: Get posture summary
      operationId: getPostureSummary
      responses:
        '200':
          description: Posture summary across all identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostureSummary'

  # --- Policy Sync ---
  /api/v1/access/ziti/policy-sync:
    get:
      tags: [Policy Sync]
      summary: List policy sync states
      operationId: listPolicySyncStates
      responses:
        '200':
          description: List of policy sync states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicySyncState'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Policy Sync]
      summary: Sync governance policy to Ziti
      operationId: syncGovernancePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySyncRequest'
      responses:
        '200':
          description: Policy sync initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySyncState'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/ziti/policy-sync/{id}/trigger:
    post:
      tags: [Policy Sync]
      summary: Trigger policy sync
      operationId: triggerPolicySync
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Policy sync triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySyncState'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/ziti/policy-sync/{id}:
    delete:
      tags: [Policy Sync]
      summary: Delete policy sync state
      operationId: deletePolicySyncState
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Policy sync state deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Certificates ---
  /api/v1/access/ziti/certificates:
    get:
      tags: [Certificates]
      summary: List certificates
      operationId: listCertificates
      responses:
        '200':
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Certificate'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/access/ziti/certificates/expiry-alerts:
    get:
      tags: [Certificates]
      summary: Get certificate expiry alerts
      operationId: getCertificateExpiryAlerts
      responses:
        '200':
          description: Certificates approaching expiry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateExpiryAlert'

  /api/v1/access/ziti/certificates/{id}/rotate:
    post:
      tags: [Certificates]
      summary: Rotate certificate
      operationId: rotateCertificate
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Certificate rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- BrowZer ---
  /api/v1/access/ziti/browzer/status:
    get:
      tags: [BrowZer]
      summary: Get BrowZer status
      operationId: getBrowzerStatus
      responses:
        '200':
          description: BrowZer status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowzerStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/access/ziti/browzer/enable:
    post:
      tags: [BrowZer]
      summary: Enable BrowZer
      operationId: enableBrowzer
      responses:
        '200':
          description: BrowZer enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowzerStatus'

  /api/v1/access/ziti/browzer/disable:
    post:
      tags: [BrowZer]
      summary: Disable BrowZer
      operationId: disableBrowzer
      responses:
        '200':
          description: BrowZer disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowzerStatus'

  /api/v1/access/ziti/browzer/services/{id}/enable:
    post:
      tags: [BrowZer]
      summary: Enable BrowZer on service
      operationId: enableBrowzerOnService
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: BrowZer enabled on service
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/ziti/browzer/services/{id}/disable:
    post:
      tags: [BrowZer]
      summary: Disable BrowZer on service
      operationId: disableBrowzerOnService
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: BrowZer disabled on service
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Auth Decision ---
  /api/v1/access/auth/decide:
    post:
      tags: [Auth Decision]
      summary: Auth decision endpoint (POST)
      operationId: authDecidePost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDecisionRequest'
      responses:
        '200':
          description: Auth decision result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Auth Decision]
      summary: Auth decision endpoint (GET)
      operationId: authDecideGet
      parameters:
        - name: uri
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Auth decision result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDecisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Policy Validation ---
  /api/v1/access/routes/validate-policy:
    post:
      tags: [Policy]
      summary: Validate route policy
      operationId: validateRoutePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyValidationRequest'
      responses:
        '200':
          description: Policy validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # --- Guacamole ---
  /api/v1/access/guacamole/session-requests:
    get:
      tags: [Guacamole]
      summary: List Guacamole privileged session requests
      operationId: listGuacSessionRequests
      responses:
        '200':
          description: List of session requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuacSessionRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/access/guacamole/session-requests/{id}/approve:
    post:
      tags: [Guacamole]
      summary: Approve a Guacamole session request
      operationId: approveGuacSessionRequest
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Request approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  status:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/guacamole/session-requests/{id}/deny:
    post:
      tags: [Guacamole]
      summary: Deny a Guacamole session request
      operationId: denyGuacSessionRequest
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Request denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  status:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/guacamole/sessions:
    get:
      tags: [Guacamole]
      summary: List active Guacamole sessions
      operationId: listGuacActiveSessions
      responses:
        '200':
          description: List of active Guacamole sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuacActiveSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Guacamole not configured

  /api/v1/access/guacamole/sessions/{id}/terminate:
    post:
      tags: [Guacamole]
      summary: Terminate an active Guacamole session
      operationId: terminateGuacSession
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Session terminated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  active_conn_id:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/guacamole/sessions/{id}/share:
    post:
      tags: [Guacamole]
      summary: Generate a share link for an active Guacamole session
      operationId: shareGuacSession
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Share URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  share_url:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: Guacamole server does not support session sharing

  /api/v1/access/guacamole/session-history:
    get:
      tags: [Guacamole]
      summary: List Guacamole session history
      operationId: listGuacSessionHistory
      responses:
        '200':
          description: Session history records
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuacSessionRow'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/access/guacamole/sessions/{id}/transcript:
    get:
      tags: [Guacamole]
      summary: Download session transcript
      operationId: getGuacSessionTranscript
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Transcript content
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/guacamole/connections:
    get:
      tags: [Guacamole]
      summary: List the organization's Guacamole connections
      description: >
        Admin only. Returns the brokered connection definitions of the calling
        organization — hostname, port, protocol and connection parameters of
        every PAM target. End users read /guacamole/my-connections instead,
        which returns the launcher's PAM flags without the infrastructure.
      operationId: listGuacamoleConnections
      responses:
        '200':
          description: The calling organization's Guacamole connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuacamoleConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/access/guacamole/connections/{routeId}/connect:
    post:
      tags: [Guacamole]
      summary: Connect to Guacamole session
      description: >
        Any authenticated user; the connection must belong to the caller's
        organization. Applies the connection's PAM gates in order — pre-session
        approval, live moderation — then injects the configured vault
        credential server-side and returns a broker connect URL. A routeId
        outside the caller's organization is 404, not 403: the connection is
        not theirs to know about.
      operationId: connectGuacamole
      parameters:
        - name: routeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Guacamole connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuacamoleConnectResponse'
        '403':
          description: >
            No organization on the request, the pre-session approval is missing
            or spent, or the injected credential is unavailable.
        '428':
          description: The session requires a moderator to join before it can start.
        '404':
          $ref: '#/components/responses/NotFound'

  # --- PAM: connection manager (folders, typed entries, ACL) ---
  /api/v1/access/pam/entry-types:
    get:
      tags: [PAM Entries]
      summary: List supported entry types
      description: The catalog of entry types (sessions, credentials, secure info records). Any authenticated user.
      operationId: pamListEntryTypes
      responses:
        '200':
          description: Entry-type catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamEntryType'

  /api/v1/access/pam/folders:
    get:
      tags: [PAM Entries]
      summary: List folders
      description: The org's folder tree with per-folder entry counts. Any authenticated user.
      operationId: pamListFolders
      responses:
        '200':
          description: Folder list
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamFolder'
    post:
      tags: [PAM Entries]
      summary: Create folder
      description: Admin only.
      operationId: pamCreateFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamFolderRequest'
      responses:
        '201':
          description: Folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/folders/{id}:
    put:
      tags: [PAM Entries]
      summary: Update folder
      description: Admin only. A folder cannot be its own parent.
      operationId: pamUpdateFolder
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamFolderRequest'
      responses:
        '200':
          description: Folder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [PAM Entries]
      summary: Delete folder
      description: Admin only. Child folders are re-parented, entries keep their rows.
      operationId: pamDeleteFolder
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Folder deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries:
    get:
      tags: [PAM Entries]
      summary: List entries
      description: Admins see every entry in the org; other callers see only entries they hold a grant on (any action). Secret material is never included.
      operationId: pamListEntries
      parameters:
        - name: folder_id
          in: query
          schema: {type: string, format: uuid}
        - name: type
          in: query
          schema: {type: string}
        - name: q
          in: query
          description: Substring search
          schema: {type: string}
        - name: favorites
          in: query
          description: When truthy, only the caller's favorites
          schema: {type: string}
      responses:
        '200':
          description: Entry list
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamEntry'
    post:
      tags: [PAM Entries]
      summary: Create entry
      description: Admin only. A supplied `secret` seeds vault version 1 (envelope-encrypted); it is never returned.
      operationId: pamCreateEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamEntryUpsertRequest'
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/entries/{id}:
    get:
      tags: [PAM Entries]
      summary: Get entry
      description: Requires a `view` grant (or admin). Never returns secret material.
      operationId: pamGetEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [PAM Entries]
      summary: Update entry
      description: Requires an `edit` grant (or admin). A supplied `secret` appends a new vault version.
      operationId: pamUpdateEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamEntryUpsertRequest'
      responses:
        '200':
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [PAM Entries]
      summary: Delete entry
      description: Admin only. Deletes the vault secret (cryptographic erasure) and the per-entry broker connection; tears down any Ziti reach service.
      operationId: pamDeleteEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Entry deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries/{id}/favorite:
    post:
      tags: [PAM Entries]
      summary: Mark entry as favorite
      operationId: pamFavoriteEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Favorite set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamFavoriteResponse'
    delete:
      tags: [PAM Entries]
      summary: Remove favorite
      operationId: pamUnfavoriteEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Favorite cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamFavoriteResponse'

  /api/v1/access/pam/entries/{id}/grants:
    get:
      tags: [PAM Entries]
      summary: List entry grants
      description: Admin only. The per-entry ACL (view/connect/edit/reveal per principal).
      operationId: pamListEntryGrants
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Grant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamEntryGrant'
    post:
      tags: [PAM Entries]
      summary: Add entry grant
      description: Admin only.
      operationId: pamAddEntryGrant
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamEntryGrantRequest'
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/entries/{id}/grants/{grantId}:
    delete:
      tags: [PAM Entries]
      summary: Remove entry grant
      description: Admin only.
      operationId: pamRemoveEntryGrant
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: grantId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Grant removed
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries/{id}/reveal:
    post:
      tags: [PAM Entries]
      summary: Reveal entry secret
      description: >
        Returns the secret plaintext once. Double-gated: the entry must have
        `allow_reveal=true` (enforced for admins too) and non-admin callers need
        a `reveal` grant. Subject to the checkout controls (dual control,
        exclusivity) and, for step-up-flagged secrets, a recent step-up MFA
        (403 with `X-Step-Up-Required`). Every reveal is reason-stamped,
        ledgered in vault_checkouts, and audited.
      operationId: pamRevealEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamReasonRequest'
      responses:
        '200':
          description: Secret plaintext (returned once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamRevealResponse'
        '202':
          description: Dual control — awaiting a second-person authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamDualControlPending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Entry exclusively checked out by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamExclusivityConflict'

  # --- PAM: launch, approval workflow, session ledger ---
  /api/v1/access/pam/entries/{id}/connect:
    post:
      tags: [PAM Launch]
      summary: Launch entry session
      description: >
        Brokered launch with server-side credential injection — the caller never
        sees the secret. Requires a `connect` grant (or admin); entries with
        `require_approval` need an approved access request; checkout controls
        (dual control, exclusivity) apply. Website entries return a URL launch
        instead of a brokered connection.
      operationId: pamConnectEntry
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Launch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamLaunchResponse'
        '202':
          description: Dual control — awaiting a second-person authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamDualControlPending'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Exclusive checkout held by another user, or broker conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamExclusivityConflict'

  /api/v1/access/pam/entries/{id}/ws:
    get:
      tags: [PAM Launch]
      summary: Clientless SSH relay (WebSocket)
      description: >
        WebSocket upgrade for the in-browser wasm-ssh terminal
        (`?proto=ssh`). Same grant and approval gates as connect.
      operationId: pamEntryWebSocket
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: proto
          in: query
          schema:
            type: string
            enum: [ssh]
      responses:
        '101':
          description: Switching protocols (WebSocket session established)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries/{id}/request:
    post:
      tags: [PAM Launch]
      summary: Request access to an entry
      description: Opens a single-use access request for a `require_approval` entry. The requester must hold the `connect` grant.
      operationId: pamRequestEntryAccess
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        '201':
          description: Request opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id: {type: string, format: uuid}
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entry-requests:
    get:
      tags: [PAM Launch]
      summary: List pending access requests
      description: Admin only. The approval queue.
      operationId: pamListEntryRequests
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamAccessRequestList'

  /api/v1/access/pam/entry-requests/{id}/approve:
    post:
      tags: [PAM Launch]
      summary: Approve access request
      description: Admin only.
      operationId: pamApproveEntryRequest
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamRequestDecisionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entry-requests/{id}/deny:
    post:
      tags: [PAM Launch]
      summary: Deny access request
      description: Admin only.
      operationId: pamDenyEntryRequest
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamRequestDecisionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/my-entry-requests:
    get:
      tags: [PAM Launch]
      summary: List my access requests
      description: The caller's own requests and their outcomes.
      operationId: pamListMyEntryRequests
      responses:
        '200':
          description: The caller's requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamAccessRequestList'

  /api/v1/access/pam/sessions:
    get:
      tags: [PAM Launch]
      summary: List entry sessions
      description: Admin only. The recent-launch ledger with recording availability.
      operationId: pamListSessions
      responses:
        '200':
          description: Session ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamEntrySession'

  /api/v1/access/pam/sessions/{id}/end:
    post:
      tags: [PAM Launch]
      summary: End entry session
      description: The launcher, or an admin, force-ends a live session.
      operationId: pamEndSession
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamEndedResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/import/rdm:
    post:
      tags: [PAM Launch]
      summary: Import a Devolutions RDM export
      description: Admin only. Imports folders and entries; plaintext passwords in the export are sealed into the vault. Everything imported is tagged `rdm-import`.
      operationId: pamImportRDM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  description: The RDM export JSON, as a string
                folder_id:
                  type: string
                  format: uuid
                  description: Optional root folder to import under
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  # --- PAM: checkout controls (dual control, exclusivity, break-glass) ---
  /api/v1/access/pam/entries/{id}/break-glass:
    post:
      tags: [PAM Checkout Controls]
      summary: Break-glass emergency reveal
      description: >
        Emergency bypass of the dual-control wait and exclusivity hold, allowed
        only on entries with `break_glass_enabled` for callers who could
        normally reveal. Requires a justification of at least 10 characters and
        raises a high-severity `pam.break_glass` audit event.
      operationId: pamBreakGlass
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PamReasonRequest'
      responses:
        '200':
          description: Secret plaintext (break-glass)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamBreakGlassResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/entries/{id}/checkin:
    post:
      tags: [PAM Checkout Controls]
      summary: Release checkout lease
      description: Releases the caller's live checkout lease; an admin may release any principal's lease on the entry.
      operationId: pamCheckin
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lease(s) released
          content:
            application/json:
              schema:
                type: object
                properties:
                  released:
                    type: integer
                    description: Number of leases released
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/checkout-authorizations:
    get:
      tags: [PAM Checkout Controls]
      summary: List pending dual-control authorizations
      description: Admin only. Second-person requests awaiting an approver.
      operationId: pamListCheckoutAuthorizations
      responses:
        '200':
          description: Pending authorizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizations:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamCheckoutAuthorization'

  /api/v1/access/pam/checkout-authorizations/{id}/{decision}:
    post:
      tags: [PAM Checkout Controls]
      summary: Decide dual-control authorization
      description: Admin only. The approver may not be the requester.
      operationId: pamDecideCheckoutAuthorization
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: decision
          in: path
          required: true
          schema:
            type: string
            enum: [approve, deny]
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [approved, denied]}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Authorization already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/checkouts/active:
    get:
      tags: [PAM Checkout Controls]
      summary: List active checkouts
      description: Admin only. The live "who holds what right now" ledger (expired leases are retired first).
      operationId: pamListActiveCheckouts
      responses:
        '200':
          description: Active checkouts
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkouts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamActiveCheckout'

  # --- PAM: moderated sessions (four-eyes) ---
  /api/v1/access/pam/moderation/request:
    post:
      tags: [PAM Moderation]
      summary: Request session moderation
      description: >
        Opens (or idempotently reuses) a pending moderation request for a
        `require_moderator` connection. The client polls the status endpoint
        and retries the connect once active.
      operationId: pamRequestModeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route_id]
              properties:
                route_id: {type: string}
                reason: {type: string}
      responses:
        '200':
          description: Existing pending request reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamModerationOpened'
        '201':
          description: Moderation request opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamModerationOpened'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/moderation/pending:
    get:
      tags: [PAM Moderation]
      summary: List pending moderation requests
      description: Admin/moderator queue of pending, unexpired requests.
      operationId: pamListPendingModeration
      responses:
        '200':
          description: Pending queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamModerationPendingItem'

  /api/v1/access/pam/moderation/{id}:
    get:
      tags: [PAM Moderation]
      summary: Get moderation status
      description: Requester or moderator polls until `active` (or a terminal state).
      operationId: pamGetModerationStatus
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamModerationStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/moderation/{id}/join:
    post:
      tags: [PAM Moderation]
      summary: Join as moderator
      description: Admin/moderator claims the pending request (unblocking the requester's connect). The requester cannot moderate their own session.
      operationId: pamJoinModeration
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Moderation active
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [active]}
                  moderator_id: {type: string, format: uuid}
        '409':
          description: Not pending, already claimed, expired, or caller is the requester
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/moderation/{id}/end:
    post:
      tags: [PAM Moderation]
      summary: End moderated session
      description: Requester or moderator ends the session (moderator end acts as a kill switch).
      operationId: pamEndModeration
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamEndedResponse'
        '409':
          description: Session is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # --- PAM: SSH CA + brokered sessions + cloud JIT ---
  /api/v1/access/pam/ssh-ca/init:
    post:
      tags: [PAM SSH & Brokering]
      summary: Initialize org SSH CA
      description: Admin only. Generates the org CA keypair; the private key is sealed into the vault and never returned.
      operationId: pamInitSSHCA
      responses:
        '200':
          description: CA already initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHCAPublicKey'
        '201':
          description: CA created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHCAPublicKey'

  /api/v1/access/pam/ssh-ca:
    get:
      tags: [PAM SSH & Brokering]
      summary: Get org SSH CA public key
      description: The value to install as `TrustedUserCAKeys` on target hosts. No secret material.
      operationId: pamGetSSHCA
      responses:
        '200':
          description: CA public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHCAPublicKey'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/connect/ssh:
    post:
      tags: [PAM SSH & Brokering]
      summary: Issue short-lived SSH certificate
      description: >
        Signs a short-lived SSH user certificate (10 min default, 60 min cap)
        for the caller and records the brokered session. Without a supplied
        public key an ephemeral keypair is generated and the private key
        returned once (never stored).
      operationId: pamSSHConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSHConnectRequest'
      responses:
        '200':
          description: Certificate issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSHConnectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '428':
          description: SSH CA not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/connect/cloud:
    post:
      tags: [PAM SSH & Brokering]
      summary: Broker short-lived cloud credentials (JIT)
      description: >
        STS AssumeRole via a vault-held broker credential; returns short-lived
        keys (TTL clamped to 15–720 minutes) and optionally a federated console
        URL. Recorded in the brokered-session ledger; auto-expires, nothing to
        revoke.
      operationId: pamCloudConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudConnectRequest'
      responses:
        '200':
          description: Credentials issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudConnectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/access/pam/brokered-sessions:
    post:
      tags: [PAM SSH & Brokering]
      summary: Record brokered DB/K8s session
      description: Registers a brokered `db` or `k8s` session (SSH goes through `/pam/connect/ssh`).
      operationId: pamBrokerSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerSessionRequest'
      responses:
        '201':
          description: Session recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: {type: string, format: uuid}
                  expires_at: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [PAM SSH & Brokering]
      summary: List brokered sessions
      description: Admin only. Expired sessions are retired first so the list is live-accurate.
      operationId: pamListBrokeredSessions
      responses:
        '200':
          description: Brokered-session ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrokeredSession'

  /api/v1/access/pam/brokered-sessions/{id}/end:
    post:
      tags: [PAM SSH & Brokering]
      summary: End brokered session
      operationId: pamEndBrokeredSession
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Session marked ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamEndedResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- PAM: privilege graph ---
  /api/v1/access/pam/privilege-graph/secret/{id}:
    get:
      tags: [PAM Privilege Graph]
      summary: Who can reach this vault secret
      description: Admin only. Effective-access blast radius across IAM+IGA+PAM.
      operationId: pamSecretPrivilegeGraph
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reachers of the secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePrivilegeGraph'

  /api/v1/access/pam/privilege-graph/entry/{id}:
    get:
      tags: [PAM Privilege Graph]
      summary: Who can reach this PAM entry
      description: Admin only.
      operationId: pamEntryPrivilegeGraph
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reachers of the entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePrivilegeGraph'

  /api/v1/access/pam/privilege-graph/user/{id}:
    get:
      tags: [PAM Privilege Graph]
      summary: What this user can reach
      description: Admin only. Secrets and PAM entries reachable by the user, with the path that grants each.
      operationId: pamUserPrivilegeGraph
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reachable resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrivilegeGraph'

  # --- PAM: broker status + Ziti reach mode ---
  /api/v1/access/pam/broker/status:
    get:
      tags: [PAM Ziti Reach]
      summary: Broker capability probe
      operationId: pamBrokerStatus
      responses:
        '200':
          description: Available launch paths
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: {type: boolean}
                  reach_modes:
                    type: array
                    items: {type: string, enum: [direct, ziti]}
                  direct_broker: {type: boolean}
                  ziti_broker: {type: boolean}

  /api/v1/access/pam/broker/ziti-bindings:
    get:
      tags: [PAM Ziti Reach]
      summary: List broker Ziti bindings
      description: Admin only. The tunneler binding list plus the dialer role.
      operationId: pamZitiBindings
      responses:
        '200':
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings:
                    type: array
                    items:
                      $ref: '#/components/schemas/PamZitiBinding'
                  dialer_role: {type: string}

  /api/v1/access/pam/entries/{id}/ziti/enable:
    post:
      tags: [PAM Ziti Reach]
      summary: Enable Ziti reach for entry
      description: Admin only. Provisions an overlay service for the target hop and flips the entry to `reach_mode=ziti`.
      operationId: pamEnableZiti
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Ziti reach enabled (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  reach_mode: {type: string, enum: [ziti]}
                  ziti_service_name: {type: string}
                  ziti_intercept_port: {type: integer}
        '409':
          description: No free broker loopback port available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/entries/{id}/ziti/disable:
    post:
      tags: [PAM Ziti Reach]
      summary: Disable Ziti reach for entry
      description: Admin only. Tears down the overlay service and reverts to direct reach.
      operationId: pamDisableZiti
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reverted to direct reach
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  reach_mode: {type: string, enum: [direct]}

  # --- PAM: Windows application delivery (RemoteApp) ---
  /api/v1/access/pam/apps:
    get:
      tags: [Windows Apps]
      summary: List Windows apps (operator view)
      description: Apps, pools, host state, and host-agent links in one payload.
      operationId: pamListWindowsApps
      responses:
        '200':
          description: App catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/WindowsApp'
                  pools:
                    type: array
                    items:
                      $ref: '#/components/schemas/WindowsAppPool'
                  host_state: {type: object, additionalProperties: true}
                  host_agents: {type: object, additionalProperties: true}
    post:
      tags: [Windows Apps]
      summary: Create Windows app
      description: Admin only. Targets a host entry or a pool.
      operationId: pamCreateWindowsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsAppInput'
      responses:
        '201':
          description: App created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Duplicate alias on host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/my-apps:
    get:
      tags: [Windows Apps]
      summary: List my launchable apps
      description: Active apps whose host (or any pool member) the caller may connect to — the same `connect` grant the launch endpoint gates on. Powers the end-user portal tiles.
      operationId: pamMyWindowsApps
      responses:
        '200':
          description: Launchable apps
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyWindowsApp'

  /api/v1/access/pam/apps/{id}:
    put:
      tags: [Windows Apps]
      summary: Update Windows app
      description: Admin only.
      operationId: pamUpdateWindowsApp
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsAppInput'
      responses:
        '200':
          description: App updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Windows Apps]
      summary: Delete Windows app
      description: Admin only.
      operationId: pamDeleteWindowsApp
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: App deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/apps/{id}/launch:
    post:
      tags: [Windows Apps]
      summary: Launch Windows app
      description: >
        RemoteApp launch through the same brokered path as entry connect (ACL +
        approval gates + placement across pool hosts). `?replace=<session_id>`
        replaces the caller's existing session on the chosen host.
      operationId: pamLaunchWindowsApp
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: replace
          in: query
          description: Session id to replace on the chosen host
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Launch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindowsAppLaunchResponse'
        '202':
          description: Dual control — awaiting a second-person authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PamDualControlPending'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No placeable host (capacity, or caller session conflict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/apps/{id}/icon:
    get:
      tags: [Windows Apps]
      summary: Get app icon
      operationId: pamWindowsAppIcon
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: PNG icon
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/app-import:
    post:
      tags: [Windows Apps]
      summary: Import discovered apps
      description: Admin only. Imports a discovery report of installed apps for a host; apps present in the host's TSAppAllowList are marked verified.
      operationId: pamImportWindowsApps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_entry_id, data]
              properties:
                host_entry_id: {type: string, format: uuid}
                data:
                  type: string
                  description: The discovery report JSON, as a string
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps_created: {type: integer}
                  apps_updated: {type: integer}
                  host_updated: {type: boolean}
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/app-pools:
    get:
      tags: [Windows Apps]
      summary: List app host pools
      operationId: pamListAppPools
      responses:
        '200':
          description: Pools with members
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools:
                    type: array
                    items:
                      $ref: '#/components/schemas/WindowsAppPool'
    post:
      tags: [Windows Apps]
      summary: Create app host pool
      description: Admin only. Placement defaults to `least_loaded` (or `round_robin`).
      operationId: pamCreateAppPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsAppPoolInput'
      responses:
        '201':
          description: Pool created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/access/pam/app-pools/{id}:
    put:
      tags: [Windows Apps]
      summary: Update app host pool
      description: Admin only.
      operationId: pamUpdateAppPool
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowsAppPoolInput'
      responses:
        '200':
          description: Pool updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Windows Apps]
      summary: Delete app host pool
      description: Admin only.
      operationId: pamDeleteAppPool
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Pool deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/app-pools/{id}/members:
    post:
      tags: [Windows Apps]
      summary: Add pool member
      description: Admin only. Adds a host entry to the pool with a session cap.
      operationId: pamAddAppPoolMember
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_entry_id]
              properties:
                host_entry_id: {type: string, format: uuid}
                max_sessions: {type: integer, minimum: 1, default: 1}
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Host already in pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/access/pam/app-pools/{id}/members/{memberId}:
    delete:
      tags: [Windows Apps]
      summary: Remove pool member
      description: Admin only.
      operationId: pamRemoveAppPoolMember
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: memberId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Member removed
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/pam/app-hosts/{entryId}/agent:
    post:
      tags: [Windows Apps]
      summary: Link agent to app host
      description: Admin only. Binds an enrolled agent to a `windows_app_host` entry so its discovery reports route to that host.
      operationId: pamLinkAppHostAgent
      parameters:
        - name: entryId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Agent linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  host_entry_id: {type: string, format: uuid}
                  agent_id: {type: string}
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Windows Apps]
      summary: Unlink agent from app host
      description: Admin only.
      operationId: pamUnlinkAppHostAgent
      parameters:
        - name: entryId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Agent unlinked
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/access/agent/apk-info:
    get:
      tags: [Agent Enrollment]
      summary: Handle apk info
      operationId: handleAPKInfo
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleAPKInfo
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/access/agent/config:
    get:
      tags: [Agent Enrollment]
      summary: Handle config
      operationId: handleConfig
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleConfig
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/access/agent/enroll:
    post:
      tags: [Agent Enrollment]
      summary: Handle enroll
      operationId: handleEnroll
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleEnroll
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/access/agent/enroll/oauth:
    post:
      tags: [Agent Enrollment]
      summary: Handle enroll O auth
      operationId: handleEnrollOAuth
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleEnrollOAuth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/v1/access/agent/enroll/session:
    post:
      tags: [Agent Enrollment]
      summary: Handle create enroll session
      operationId: handleCreateEnrollSession
      x-openidx-handler: internal/access.(*AgentAPIHandler).HandleCreateEnrollSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
