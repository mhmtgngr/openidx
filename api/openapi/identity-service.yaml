  /api/v1/identity/invitations/{token}/mfa:
    post:
      tags: [Public]
      summary: Confirm an external invitation's authenticator
      description: >
        The second step of an external (vendor) user's invitation (invariant
        I4). The account the accepted invitation made cannot sign in until its
        owner confirms an authenticator-app code for the secret it was shown;
        the account then becomes `active`.
      operationId: completeExternalInvitationMFA
      x-openidx-handler: internal/identity.(*Service).handleCompleteInvitationMFA
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, code]
              properties:
                secret: {type: string}
                code: {type: string}
      responses:
        '200':
          description: The authenticator is confirmed and the account is active
        '400':
          description: >
            The secret or the code is missing, the token is not an accepted
            external invitation that still answers, or the code does not verify

  /api/v1/identity/vendor-orgs:
    get:
      tags: [Vendor Organizations]
      summary: List vendor organizations
      description: The organization's vendors, with their status, contract end and closed-list switch.
      operationId: listVendorOrganizations
      x-openidx-handler: internal/identity.(*Service).handleListVendorOrgs
      responses:
        '200':
          description: The vendor organizations
    post:
      tags: [Vendor Organizations]
      summary: Create a vendor organization
      description: >
        A supplier whose people can be invited as external users. The name is
        unique in the organization; allowed e-mail domains are normalised; the
        default account lifetime is at most a year.
      operationId: createVendorOrganization
      x-openidx-handler: internal/identity.(*Service).handleCreateVendorOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: The vendor organization
        '400':
          description: The request is not valid
        '409':
          description: A vendor organization of that name exists

  /api/v1/identity/vendor-orgs/{id}:
    get:
      tags: [Vendor Organizations]
      summary: Get a vendor organization
      operationId: getVendorOrganization
      x-openidx-handler: internal/identity.(*Service).handleGetVendorOrg
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The vendor organization
        '404':
          description: Not found
    put:
      tags: [Vendor Organizations]
      summary: Update a vendor organization
      description: A closed vendor organization cannot be edited (`409`, `vendor_org_closed`).
      operationId: updateVendorOrganization
      x-openidx-handler: internal/identity.(*Service).handleUpdateVendorOrg
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The vendor organization
        '404':
          description: Not found
        '409':
          description: The vendor organization is closed

  /api/v1/identity/vendor-orgs/{id}/close:
    post:
      tags: [Vendor Organizations]
      summary: Close a vendor organization
      description: >
        Final. Disables every external user of the vendor and severs their
        access; needs a reason, which goes to the audit trail.
      operationId: closeVendorOrganization
      x-openidx-handler: internal/identity.(*Service).handleCloseVendorOrg
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Closed, with the number of users disabled
        '400':
          description: No reason given
        '409':
          description: Already closed

  /api/v1/identity/vendor-orgs/{id}/targets:
    get:
      tags: [Vendor Organizations]
      summary: List what a vendor on a closed list may reach
      description: The PAM entries, applications and network services opened to the vendor (invariant I11), with their names.
      operationId: listVendorTargets
      x-openidx-handler: internal/identity.(*Service).handleListVendorTargets
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The targets
    post:
      tags: [Vendor Organizations]
      summary: Open a target to a vendor
      description: The target must be one of the organization's PAM entries, applications or network services (`404` otherwise).
      operationId: addVendorTarget
      x-openidx-handler: internal/identity.(*Service).handleAddVendorTarget
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id]
              properties:
                target_type: {type: string, enum: [pam_entry, application, network_service]}
                target_id: {type: string, format: uuid}
      responses:
        '201':
          description: The target is open
        '400':
          description: The target type or id is not valid
        '404':
          description: No such vendor organization, or no such target in the organization
        '409':
          description: The target is already open, or the vendor organization is closed

  /api/v1/identity/vendor-orgs/{id}/targets/{targetId}:
    delete:
      tags: [Vendor Organizations]
      summary: Withdraw a target from a vendor
      operationId: removeVendorTarget
      x-openidx-handler: internal/identity.(*Service).handleRemoveVendorTarget
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: targetId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Withdrawn
        '404':
          description: Not found

  /api/v1/identity/external-users:
    get:
      tags: [External Users]
      summary: List external users
      description: Each external account with its vendor, sponsor, status, end date and second factor; `vendor_org_id` narrows the list to one vendor.
      operationId: listExternalUsers
      x-openidx-handler: internal/identity.(*Service).handleListExternalUsers
      parameters:
        - name: vendor_org_id
          in: query
          required: false
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The external users

  /api/v1/identity/external-users/{id}/suspend:
    post:
      tags: [External Users]
      summary: Suspend an external user
      description: >
        Severs the account's access; a new sponsor may reactivate it within the
        grace period (decision D5). Needs a reason. The tenant's SSF receivers
        are told `session-revoked`.
      operationId: suspendExternalUser
      x-openidx-handler: internal/identity.(*Service).handleSuspendExternalUser
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Suspended
        '409':
          description: The account's state does not allow it (`external_status_conflict`)

  /api/v1/identity/external-users/{id}/disable:
    post:
      tags: [External Users]
      summary: Disable an external user
      description: Final; the account comes back only as a new invitation. Needs a reason. The tenant's SSF receivers are told `account-disabled`.
      operationId: disableExternalUser
      x-openidx-handler: internal/identity.(*Service).handleDisableExternalUser
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200':
          description: Disabled
        '409':
          description: The account's state does not allow it (`external_status_conflict`)

  /api/v1/identity/external-users/{id}/extend:
    post:
      tags: [External Users]
      summary: Move an external user's end
      description: Within a year from now and the vendor's contract, and only while the vendor is active (invariant I1). An external user cannot extend their own account (I12).
      operationId: extendExternalUser
      x-openidx-handler: internal/identity.(*Service).handleExtendExternalUser
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
                account_expires_at: {type: string, format: date-time}
                extend_days: {type: integer}
      responses:
        '200':
          description: The account's new end
        '403':
          description: Past the limits, or the vendor is not active
        '409':
          description: The account's state does not allow it

  /api/v1/identity/external-users/{id}/reactivate:
    post:
      tags: [External Users]
      summary: Reactivate a suspended external user
      description: Needs a valid new sponsor, an active vendor and the grace period (decision D5).
      operationId: reactivateExternalUser
      x-openidx-handler: internal/identity.(*Service).handleReactivateExternalUser
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, sponsor_user_id]
              properties:
                reason: {type: string}
                sponsor_user_id: {type: string, format: uuid}
      responses:
        '200':
          description: Reactivated
        '403':
          description: The sponsor or the vendor does not qualify
        '409':
          description: Not suspended, or past the grace period

  /api/v1/identity/external-users/{id}/sponsor:
    post:
      tags: [External Users]
      summary: Change an external user's sponsor
      description: The new sponsor must be an enabled, active internal user of the organization.
      operationId: changeExternalUserSponsor
      x-openidx-handler: internal/identity.(*Service).handleChangeExternalSponsor
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, sponsor_user_id]
              properties:
                reason: {type: string}
                sponsor_user_id: {type: string, format: uuid}
      responses:
        '200':
          description: The sponsor is changed
        '403':
          description: The sponsor does not qualify
        '409':
          description: The account is not live

components:
  responses:
    BadRequest:
      description: The request was malformed or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid bearer token was presented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FactorProofRefused:
      description: |
        The change needs proof from the account holder, and the request carried
        none, or a wrong one. `accepts` lists the proofs this account can give
        for this change; resend the request with one of them in the body.
        `reauthentication_locked` means too many wrong attempts (the password's
        refusals count against the sign-in lockout, a code's against the TOTP
        lockout); `reauthentication_unavailable` means the change needs a
        password the account does not have here, which an administrator can set.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FactorProofRefusal'
    NotFound:
      description: No such resource in the caller's organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: A short machine-readable reason
        error_description:
          type: string
          description: Operator-facing detail, when the handler has one
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        enabled:
          type: boolean
        email_verified:
          type: boolean
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [username, email, first_name, last_name]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        password:
          type: string
          minLength: 12
        enabled:
          type: boolean
          default: true

    FactorProof:
      type: object
      description: |
        Proof that the account holder is making a change to their second
        factors or their address. One is checked per request: the password
        when given, otherwise a TOTP code where the change accepts one (it
        removes or replaces the TOTP credential). A code is accepted once.
      properties:
        current_password:
          type: string
          format: password
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'

    PushDeviceEnrollment:
      type: object
      required: [device_token, platform]
      properties:
        device_token:
          type: string
        platform:
          type: string
          enum: [ios, android, web]
        device_name:
          type: string
        device_model:
          type: string
        os_version:
          type: string
        app_version:
          type: string

    FactorProofRefusal:
      type: object
      properties:
        error:
          type: string
          enum: [reauthentication_required, reauthentication_failed, reauthentication_locked, reauthentication_unavailable]
        error_description:
          type: string
        accepts:
          type: array
          items:
            type: string
            enum: [current_password, totp_code]

    ProfileUpdate:
      type: object
      description: |
        A field left out keeps its value. A new `email` needs
        `current_password`, and leaves the address unverified until the link
        sent to it is followed.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        enabled:
          type: boolean
        current_password:
          type: string
          format: password

    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        enabled:
          type: boolean

    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        composite:
          type: boolean
        created_at:
          type: string
          format: date-time

    RoleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        parent_id:
          type: string
        member_count:
          type: integer
        created_at:
          type: string
          format: date-time

    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        parent_id:
          type: string

    Session:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        started_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    IdentityProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider_type:
          type: string
          enum: [oidc, saml]
        issuer_url:
          type: string
        client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    # --- Additional Schemas ---
    PersonalAccessToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        token:
          type: string
          description: Full token (only returned on creation)
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    UserConsent:
      type: object
      properties:
        client_id:
          type: string
        client_name:
          type: string
        scopes:
          type: array
          items:
            type: string
        granted_at:
          type: string
          format: date-time

    PrivacyConsent:
      type: object
      properties:
        consent_type:
          type: string
          enum: [analytics, marketing, essential]
        granted:
          type: boolean
        granted_at:
          type: string
          format: date-time
          nullable: true

    DSARRequest:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        request_type:
          type: string
          enum: [export, delete, restrict]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        download_url:
          type: string
          format: uri
          nullable: true

    IdentityLink:
      type: object
      properties:
        link_id:
          type: string
        provider_id:
          type: string
        provider_name:
          type: string
        external_user_id:
          type: string
        linked_at:
          type: string
          format: date-time

    RoleAssignment:
      type: object
      properties:
        id:
          type: string
        role_id:
          type: string
        role_name:
          type: string
        user_id:
          type: string
        assigned_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        assigned_by:
          type: string
        timebound:
          type: boolean
        reason:
          type: string

    LoginBranding:
      type: object
      properties:
        logo_url:
          type: string
          format: uri
        company_name:
          type: string
        primary_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        background_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        custom_css:
          type: string

    RiskAssessment:
      type: object
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
        level:
          type: string
          enum: [low, medium, high, critical]
        factors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              impact:
                type: string
                enum: [positive, neutral, negative]
        recommended_action:
          type: string
          enum: [allow, challenge, block]
        assessed_at:
          type: string
          format: date-time

    TrustedBrowser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        fingerprint:
          type: string
        user_agent:
          type: string
        ip_address:
          type: string
        trusted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time

    Invitation:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, accepted, expired, canceled]
        token:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true

    InvitationCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        redirect_uri:
          type: string
          format: uri
        expires_in_hours:
          type: integer
          default: 168
        custom_message:
          type: string


    IdentityProviderCreate:
      type: object
      required: [name, provider_type, client_id]
      properties:
        name:
          type: string
        provider_type:
          type: string
          enum: [oidc, saml]
