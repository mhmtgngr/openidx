        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: A short machine-readable reason
        error_description:
          type: string
          description: Operator-facing detail, when the handler has one
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        enabled:
          type: boolean
        email_verified:
          type: boolean
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [username, email, first_name, last_name]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        password:
          type: string
          minLength: 12
        enabled:
          type: boolean
          default: true

    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        enabled:
          type: boolean

    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        composite:
          type: boolean
        created_at:
          type: string
          format: date-time

    RoleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        parent_id:
          type: string
        member_count:
          type: integer
        created_at:
          type: string
          format: date-time

    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        parent_id:
          type: string

    Session:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        started_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    IdentityProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider_type:
          type: string
          enum: [oidc, saml]
        issuer_url:
          type: string
        client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    # --- Additional Schemas ---
    PersonalAccessToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        token:
          type: string
          description: Full token (only returned on creation)
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    UserConsent:
      type: object
      properties:
        client_id:
          type: string
        client_name:
          type: string
        scopes:
          type: array
          items:
            type: string
        granted_at:
          type: string
          format: date-time

    PrivacyConsent:
      type: object
      properties:
        consent_type:
          type: string
          enum: [analytics, marketing, essential]
        granted:
          type: boolean
        granted_at:
          type: string
          format: date-time
          nullable: true

    DSARRequest:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        request_type:
          type: string
          enum: [export, delete, restrict]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        download_url:
          type: string
          format: uri
          nullable: true

    IdentityLink:
      type: object
      properties:
        link_id:
          type: string
        provider_id:
          type: string
        provider_name:
          type: string
        external_user_id:
          type: string
        linked_at:
          type: string
          format: date-time

    RoleAssignment:
      type: object
      properties:
        id:
          type: string
        role_id:
          type: string
        role_name:
          type: string
        user_id:
          type: string
        assigned_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        assigned_by:
          type: string
        timebound:
          type: boolean
        reason:
          type: string

    LoginBranding:
      type: object
      properties:
        logo_url:
          type: string
          format: uri
        company_name:
          type: string
        primary_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        background_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        custom_css:
          type: string

    RiskAssessment:
      type: object
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
        level:
          type: string
          enum: [low, medium, high, critical]
        factors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              impact:
                type: string
                enum: [positive, neutral, negative]
        recommended_action:
          type: string
          enum: [allow, challenge, block]
        assessed_at:
          type: string
          format: date-time

    TrustedBrowser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        fingerprint:
          type: string
        user_agent:
          type: string
        ip_address:
          type: string
        trusted_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time

    Invitation:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, accepted, expired, canceled]
        token:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true

    InvitationCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        redirect_uri:
          type: string
          format: uri
        expires_in_hours:
          type: integer
          default: 168
        custom_message:
          type: string


    IdentityProviderCreate:
      type: object
      required: [name, provider_type, client_id]
      properties:
        name:
          type: string
        provider_type:
          type: string
          enum: [oidc, saml]
        issuer_url:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        scopes:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    # --- Additional Schemas ---
    PersonalAccessToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        token:
          type: string
          description: Full token (only returned on creation)
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    UserConsent:
      type: object
      properties:
        client_id:
          type: string
        client_name:
          type: string
        scopes:
          type: array
          items:
            type: string
        granted_at:
          type: string
          format: date-time

    PrivacyConsent:
      type: object
      properties:
        consent_type:
          type: string
          enum: [analytics, marketing, essential]
        granted:
          type: boolean
        granted_at:
          type: string
          format: date-time
          nullable: true

    DSARRequest:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        request_type:
          type: string
          enum: [export, delete, restrict]
        status:
          type: string
