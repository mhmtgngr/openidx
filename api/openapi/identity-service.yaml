  /api/v1/identity/mfa/sms/verify:
    post:
      tags: [MFA - SMS]
      summary: Verify SMS enrollment
      description: |
        Confirms the number with the code sent to it, which makes it a second
        factor. Needs the account's password (`current_password`) when the account already has a second factor; a first factor needs none.
      operationId: verifySMSEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [code]
                  properties:
                    code:
                      type: string
                - $ref: '#/components/schemas/FactorProof'
      responses:
        '200':
          description: SMS verified
        '400':
          description: Invalid code
        '403':
          $ref: '#/components/responses/FactorProofRefused'

  /api/v1/identity/mfa/sms/status:
