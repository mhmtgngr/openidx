        expires_at:
          type: string
          format: date-time
          nullable: true
        assigned_by:
          type: string
        timebound:
          type: boolean
        reason:
          type: string

    LoginBranding:
      type: object
      properties:
        logo_url:
          type: string
          format: uri
        company_name:
          type: string
        primary_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        background_color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        custom_css:
          type: string

    RiskAssessment:
      type: object
      properties:
        score:
          type: number
          minimum: 0
          maximum: 100
        level:
          type: string
          enum: [low, medium, high, critical]
        factors:
          type: array
