            schema:
              type: object
              required: [name, expires_in_days]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 365
      responses:
