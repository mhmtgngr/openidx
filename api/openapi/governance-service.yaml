components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: A short machine-readable reason
        error_description:
          type: string
          description: Operator-facing detail, when the handler has one
    AccessReview:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [user_access, role_assignment, application_access, privileged_access]
        status:
          type: string
          enum: [pending, in_progress, completed, expired, canceled]
        reviewer_id:
          type: string
        scope:
          $ref: '#/components/schemas/ReviewScope'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        total_items:
          type: integer
        reviewed_items:
          type: integer

    AccessReviewCreate:
      type: object
      required: [name, type, reviewer_id, start_date, end_date]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [user_access, role_assignment, application_access, privileged_access]
        reviewer_id:
          type: string
        scope:
          $ref: '#/components/schemas/ReviewScope'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time

    ReviewScope:
      type: object
      properties:
        users:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        applications:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string

    ReviewItem:
      type: object
      properties:
        id:
          type: string
        review_id:
          type: string
        user_id:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        resource_name:
          type: string
        decision:
          type: string
          enum: [pending, approved, revoked, flagged]
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        comments:
          type: string

    Policy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [separation_of_duty, risk_based, timebound, location]
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
        enabled:
          type: boolean
        priority:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PolicyCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [separation_of_duty, risk_based, timebound, location]
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          default: 0

    PolicyRule:
      type: object
      properties:
        id:
          type: string
        condition:
          type: object
          additionalProperties: true
        effect:
          type: string
          enum: [allow, deny]
        priority:
          type: integer

    # --- JIT Access Requests ---
    AccessRequestCreate:
      type: object
      required: [resource_type, resource_id]
      properties:
        resource_type:
          type: string
          enum: [application, role, group, vault_credential]
          description: |
            Type of resource being requested. `vault_credential` requires `resource_id`
            to be an existing vault secret id and `duration` to be non-empty.
        resource_id:
          type: string
        justification:
          type: string
        duration:
          type: string
          description: >-
            Access window as a short duration string (e.g. `4h`, `8h`, `1d`, `7d`, `30d`);
            empty means permanent. Required (non-empty) when resource_type is vault_credential.
          example: 4h

    AccessRequest:
      type: object
      properties:
        id:
          type: string
        requester_id:
          type: string
        resource_type:
          type: string
          enum: [application, role, group, vault_credential]
        resource_id:
          type: string
        justification:
          type: string
        duration:
          type: string
        status:
          type: string
          enum: [pending, approved, denied, fulfilled, expired, returned]
        approver_id:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
