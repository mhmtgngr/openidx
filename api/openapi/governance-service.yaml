openapi: 3.0.3
info:
  title: OpenIDX Governance Service
  description: |
    Access reviews, certification campaigns, and policy management.

    Every route cmd/governance-service mounts appears here, and nothing
    that is not mounted does: test/openapi/service_spec_coverage_test.go compares
    this file against the live route table in both directions. Operations carry an
    `x-openidx-handler` extension naming the Go handler that serves them; where a
    payload shape is not yet pinned the body is shown as a free-form JSON object
    rather than invented.
  version: 1.34.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8002
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: ABAC Policies
  - name: Access Reviews
  - name: Approvals
  - name: Campaigns
  - name: Entitlements
  - name: JIT Access Requests
  - name: Policies
  - name: Privileged Accounts
  - name: Requests
  - name: Review Items
  - name: Separation of Duties

paths:
  # --- JIT Access Requests ---
  /api/v1/governance/requests:
    post:
      tags: [JIT Access Requests]
      summary: Create JIT access request
      description: |
        Submit a just-in-time access request. When `resource_type` is `vault_credential`,
        `resource_id` must be an existing vault secret id and `duration` must be non-empty.
      operationId: createAccessRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
      responses:
        '201':
          description: Access request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
        '400':
          description: Bad request

  /api/v1/governance/requests/{id}/credential:
    post:
      tags: [JIT Access Requests]
      summary: Retrieve checked-out vault credential (one-shot)
      description: Returns the plaintext credential value for a fulfilled vault_credential request. Requester-only; single use; access is audited.
      operationId: getRequestCredential
      responses:
    BadRequest:
      description: The request was malformed or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid bearer token was presented
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource in the caller's organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: The request could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Credential value
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
        '403':
          description: Request has expired or does not belong to the caller
        '409':
          description: Request not yet fulfilled
        '503':
          description: Vault not configured

  /api/v1/governance/requests/{id}/return:
    post:
      tags: [JIT Access Requests]
      summary: Return a checked-out vault credential early
      operationId: returnRequestCredential
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Credential returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '409':
          description: Credential is not currently checked out

  /api/v1/governance/reviews:
    get:
      tags: [Access Reviews]
      summary: List access reviews
      operationId: listReviews
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, expired, canceled]
      responses:
        '200':
          description: Paginated list of reviews
          headers:
            X-Total-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessReview'
    post:
      tags: [Access Reviews]
      summary: Create access review campaign
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessReviewCreate'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReview'

  /api/v1/governance/reviews/{id}:
    get:
      tags: [Access Reviews]
      summary: Get access review
      operationId: getReview
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Review details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessReview'
        '404':
          description: Review not found
    put:
      tags: [Access Reviews]
      summary: Update access review
      operationId: updateReview
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessReviewCreate'
      responses:
        '200':
          description: Review updated

  /api/v1/governance/reviews/{id}/status:
    patch:
      tags: [Access Reviews]
      summary: Update review status
      operationId: updateReviewStatus
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [in_progress, completed, canceled]
      responses:
        '200':
          description: Status updated

  /api/v1/governance/reviews/{id}/items:
    get:
      tags: [Review Items]
      summary: List review items
      operationId: listReviewItems
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: List of items to review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewItem'

  /api/v1/governance/reviews/{id}/items/{itemId}/decision:
    post:
      tags: [Review Items]
      summary: Submit decision on review item
      operationId: submitDecision
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, revoked, flagged]
                comments:
                  type: string
      responses:
        '200':
          description: Decision recorded

  /api/v1/governance/reviews/{id}/items/batch-decision:
    post:
      tags: [Review Items]
      summary: Submit batch decisions
      operationId: batchDecision
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  items:
                    type: object
                    required: [item_id, decision]
                    properties:
                      item_id:
                        type: string
                      decision:
                        type: string
                        enum: [approved, revoked, flagged]
                      comments:
                        type: string
      responses:
        '200':
          description: Decisions recorded

  /api/v1/governance/policies:
    get:
      tags: [Policies]
      summary: List policies
      operationId: listPolicies
      responses:
