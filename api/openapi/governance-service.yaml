          description: Policy updated
    delete:
      tags: [Policies]
      summary: Delete policy
      operationId: deletePolicy
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Policy deleted

  /api/v1/governance/policies/{id}/evaluate:
    post:
      tags: [Policies]
      summary: Evaluate policy against context
      operationId: evaluatePolicy
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                resource_id:
                  type: string
                action:
                  type: string
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string

