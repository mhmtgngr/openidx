# nfpm config for the OpenIDX agent Linux packages (.deb / .rpm).
# Build:  VERSION=<v> ARCH=amd64 nfpm pkg -f packaging/nfpm.yaml -p deb -t dist/pkg/
name: openidx-agent
arch: ${ARCH}
version: ${VERSION}
section: net
priority: optional
maintainer: OpenIDX <support@openidx.io>
description: |
  OpenIDX Zero Trust endpoint agent. Enrolls the device into the OpenIDX
  ZTNA overlay and reports device posture.
vendor: OpenIDX
homepage: https://openidx.tdv.org
license: Apache-2.0
contents:
  # A fixed path, not ./dist/openidx-agent-linux-${ARCH}: nfpm expands
  # environment variables in a known set of top-level fields (name, arch,
  # version, maintainer, ...) and NOT inside `contents`, so the glob was taken
  # literally and every invocation died with
  #   glob failed: ./dist/openidx-agent-linux-${ARCH}: no matching files
  # -- which nobody saw, because no workflow ever ran `make package-linux`.
  # The Makefile stages the arch-specific binary to this path before calling
  # nfpm.
  - src: ./dist/openidx-agent-linux
    dst: /usr/local/bin/openidx-agent
    file_info:
      mode: 0755
  - src: ./packaging/openidx.desktop
    dst: /usr/share/applications/openidx.desktop
    file_info:
      mode: 0644
scripts:
  postinstall: ./packaging/postinstall.sh
