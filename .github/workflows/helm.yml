name: Helm Chart

on:
  push:
    branches: [main]
    paths:
      - 'deployments/kubernetes/helm/**'
      - '.github/workflows/helm.yml'
      # kind-install builds the tools image from this tree and runs `migrate
      # up` inside the cluster, so a change to any of these changes what the
      # job proves.
      - 'deployments/docker/Dockerfile.tools'
      - 'cmd/migrate/**'
      - 'cmd/backup/**'
      - 'internal/migrations/**'
      - 'scripts/check-chart-images*.sh'
      - 'scripts/ci-retry.sh'
      # kind-cell also builds identity-service and oauth-service from this
      # tree and runs them behind the pooler, the plane split and the cell
      # guard. Their Go sources are ci.yml's to test; what this workflow
      # proves is the CHART's cell shape with real binaries behind it, so it
      # re-runs when the chart or the two Dockerfiles change.
      - 'deployments/docker/Dockerfile.identity-service'
      - 'deployments/docker/Dockerfile.oauth-service'
  pull_request:
    branches: [main]
    paths:
      - 'deployments/kubernetes/helm/**'
      - '.github/workflows/helm.yml'
      # kind-install builds the tools image from this tree and runs `migrate
      # up` inside the cluster, so a change to any of these changes what the
      # job proves.
      - 'deployments/docker/Dockerfile.tools'
      - 'cmd/migrate/**'
      - 'cmd/backup/**'
      - 'internal/migrations/**'
      - 'scripts/check-chart-images*.sh'
      - 'scripts/ci-retry.sh'
      # kind-cell also builds identity-service and oauth-service from this
      # tree and runs them behind the pooler, the plane split and the cell
      # guard. Their Go sources are ci.yml's to test; what this workflow
      # proves is the CHART's cell shape with real binaries behind it, so it
      # re-runs when the chart or the two Dockerfiles change.
      - 'deployments/docker/Dockerfile.identity-service'
      - 'deployments/docker/Dockerfile.oauth-service'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-template:
    name: Lint & Template
    runs-on: ubuntu-latest
    env:
      CHART: deployments/kubernetes/helm/openidx
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      # Both the repo index and the subchart archives come from a CDN that
      # resets the connection often enough to have turned this job red on
      # commits that touched no chart. Retrying is not papering over a bug:
      # nothing in this repository can make someone else's CDN answer, and
      # ci-retry.sh still exits with helm's own status once it gives up.
      - name: Add chart repos
        run: bash scripts/ci-retry.sh 3 5 -- helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: bash scripts/ci-retry.sh 3 5 -- helm dependency build "$CHART"

      # For "The broker is safe by construction" below, which feeds the chart's
      # own rendered config to the real nats-server rather than trusting that a
      # valid Kubernetes manifest carries a valid broker config. Built from the
      # module proxy -- one static binary, no container runtime, and no trust
      # anchor beyond the one Go already uses.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install nats-server (its config parser is the gate)
        run: go install github.com/nats-io/nats-server/v2@v2.14.6

      - name: Lint
        run: helm lint "$CHART"

      # The global-scale plan (line 22) has said since 2026-09-13 that
      # `make k8s-chaos` (static) runs on every PR. Nothing ran it, and when
      # first run on 2026-09-18 it was red: the OPA Deployment lacked preStop,
      # terminationGracePeriodSeconds, topologySpreadConstraints and a
      # rollingUpdate strategy. kubeconform and promtool are what the drill
      # calls; without them it reports "not measured", which it counts as a
      # failure rather than a pass.
      - name: Install kubeconform and promtool (the static chaos drill calls both)
        run: |
          set -euo pipefail
          mkdir -p /tmp/k8sha
          bash scripts/ci-retry.sh 3 5 -- curl -sSL -o /tmp/k8sha/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/k8sha/kubeconform.tgz -C /tmp/k8sha kubeconform
          bash scripts/ci-retry.sh 3 5 -- curl -sSL -o /tmp/k8sha/prom.tgz \
            https://github.com/prometheus/prometheus/releases/download/v2.53.4/prometheus-2.53.4.linux-amd64.tar.gz
          tar -xzf /tmp/k8sha/prom.tgz --strip-components=1 -C /tmp/k8sha prometheus-2.53.4.linux-amd64/promtool
          /tmp/k8sha/kubeconform -v && /tmp/k8sha/promtool --version
      - name: Chaos drill, static half (global-scale plan line 22)
        run: bash scripts/k8s-chaos-drill.sh --static

      # The bundled PostgreSQL/Redis passwords are `required` (an empty one
      # rendered a DSN that could not authenticate), so a render has to supply
      # them. These are placeholders for a manifest that is thrown away.
      - name: Template (default values)
        run: |
          helm template openidx "$CHART" \
            --set secrets.postgresPassword=render-only-not-a-credential \
            --set secrets.redisPassword=render-only-not-a-credential \
            --set secrets.encryptionKey=render-only-not-a-credential32b \
            > /tmp/render-default.yaml

      # values-prod.yaml ships edge.originVerify.value as a REPLACE-WITH-
      # placeholder and the chart refuses to render one (templates/
      # no-placeholders.yaml): installed as shipped, the Ingress would compare
      # X-Azure-FDID against the literal and 403 every edge request. This
      # render never reaches a cluster, so it supplies the override here, on
      # the command line and not in a values file.
      - name: Template (production values)
        run: |
          helm template openidx "$CHART" -f "$CHART/values-prod.yaml" \
            --set edge.originVerify.value=render-only-placeholder-override \
            > /tmp/render-prod.yaml

      # The cell shape (values-ci-cell.yaml over values-ci.yaml): pooler,
      # transaction-local scope, streaming replica, plane split and cell id in
      # one render. Every interlock below is exercised on its own; this is the
      # one render where all of them are on at once, which is what the
      # kind-cell job then installs.
      - name: Template (cell shape)
        run: |
          helm template openidx "$CHART" -f "$CHART/values-ci.yaml" -f "$CHART/values-ci-cell.yaml" \
            > /tmp/render-cell.yaml
          python3 - /tmp/render-cell.yaml <<'PYEOF'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          def by(kind, name):
              for d in docs:
                  if d["kind"] == kind and d["metadata"]["name"] == name:
                      return d
              raise AssertionError(f"{kind}/{name} did not render")
          # Replication renames the primary's Service; every DSN has to follow.
          db = by("Secret", "openidx-db-url")["stringData"]
          assert "@openidx-postgresql-primary:5432/" in db["DATABASE_URL"], db["DATABASE_URL"]
          assert "@openidx-postgresql-read:5432/" in db["DATABASE_READ_URL"], db["DATABASE_READ_URL"]
          assert db["DATABASE_READ_URL"].startswith("postgres://openidx_app:"), \
              "the replica pool must be the same role as the pooled primary pool"
          toml = by("ConfigMap", "openidx-pgcat")["data"]["pgcat.toml"]
          assert '"openidx-postgresql-primary", 5432' in toml, "pgcat is not pointed at the replication-mode primary"
          boot = by("Job", "openidx-db-bootstrap")["spec"]["template"]["spec"]["containers"][0]["env"]
          env = {e["name"]: e for e in boot}
          assert env["PGHOST"]["value"] == "openidx-postgresql-primary", env["PGHOST"]
          assert env["OPENIDX_APP_PASSWORD"]["valueFrom"]["secretKeyRef"]["key"] == "app-password"
          auth = by("Secret", "openidx-datastore-auth")["stringData"]
          assert auth["app-password"] == "ci-pgcat-password", "the hook sets the pooler's upstream credential"
          assert "replication-password" in auth, "the read replica cannot stream without it"
          np = by("NetworkPolicy", "openidx-postgres-allow")["spec"]["podSelector"]
          comps = {v for e in np.get("matchExpressions", []) if e["key"] == "app.kubernetes.io/component" for v in e["values"]}
          assert comps == {"primary", "read"}, f"the Postgres policy covers {comps}, and the readers dial the replica"
          for half in ("auth", "admin"):
              dep = by("Deployment", f"openidx-identity-{half}")
              c = dep["spec"]["template"]["spec"]["containers"][0]
              e = {x["name"]: x for x in c["env"]}
              assert e["SERVICE_PROFILE"]["value"] == half
              assert e["DATABASE_URL"]["valueFrom"]["secretKeyRef"]["name"] == "openidx-pgcat-dsn"
          cm = by("ConfigMap", "openidx-config")["data"]
          assert cm["CELL_ID"] == "canary-1" and cm["RLS_MODE"] == "local", cm
          print("cell shape renders: replication-mode DSNs, pooler upstream, hook credential, replica policy, two planes, cell id")
          PYEOF

      # `| default N` on a replica count silently turns an operator's 0 back
      # into N, because Go templates treat 0 as empty. oauth-service, OPA and
      # both Ziti workloads did exactly that, and the kind job watched
      # oauth-service scale 0 -> 2 and crash-loop with every service pinned at
      # zero. Scaling a service to zero is a legitimate action; assert it.
      - name: replicaCount 0 means zero
        run: |
          set -euo pipefail
          for svc in identityService governanceService provisioningService \
                     auditService adminApi oauthService gatewayService \
                     accessService adminConsole; do
            got=$(helm template openidx "$CHART" \
              --set secrets.postgresPassword=render-only-not-a-credential \
              --set secrets.redisPassword=render-only-not-a-credential \
              --set secrets.encryptionKey=render-only-not-a-credential32b \
              --set "$svc.replicaCount=0" \
              | grep -c '^  replicas: 0' || true)
            test "$got" -ge 1 || { echo "$svc.replicaCount=0 did not render replicas: 0"; exit 1; }
          done
          echo "every service honours replicaCount 0"

      # Origin cloaking (global-scale plan task 1.2): the ingress must refuse a
      # caller that does not carry the edge profile's own header. A network
      # allow-list is not enough on its own -- an Azure service tag admits
      # every tenant's Front Door -- so this is what makes the origin OURS.
      # Three properties, each a way it has silently failed elsewhere:
      # unset renders no annotation (a local cluster still works), set renders
      # the refusal, and half-set fails the render instead of accepting any
      # value for the header.
      - name: The ingress enforces origin cloaking when configured
        run: |
          set -euo pipefail
          render() {
            helm template openidx "$CHART" \
              --set secrets.postgresPassword=render-only-not-a-credential \
              --set secrets.redisPassword=render-only-not-a-credential \
              --set secrets.encryptionKey=render-only-not-a-credential32b "$@"
          }
          # grep -q against a here-string, NOT `echo "$x" | grep -q`.
          # `grep -q` exits at the first match and closes the pipe; `echo` then
          # dies on SIGPIPE, and `set -o pipefail` (above) turns that into a
          # failed pipeline -- so the assertion FAILS precisely because it
          # matched. It is a race against how much output follows the match, so
          # it passed for months and then failed on every run once the chart
          # grew. A here-string has no pipe and no race.
          if grep -q 'configuration-snippet' <<<"$(render)"; then
            echo "origin-verify annotation rendered with no edge.originVerify.header set"; exit 1
          fi
          got=$(render --set edge.originVerify.header=X-Azure-FDID \
                       --set edge.originVerify.value=a-profile-guid)
          grep -q 'if ($http_x_azure_fdid != "a-profile-guid")' <<<"$got" \
            || { echo "origin-verify check did not render"; exit 1; }
          grep -q 'return 403;' <<<"$got" || { echo "origin-verify does not refuse"; exit 1; }
          if render --set edge.originVerify.header=X-Azure-FDID >/dev/null 2>&1; then
            echo "a header with no value rendered anyway; the origin would accept any value"; exit 1
          fi
          echo "ingress enforces origin cloaking, and refuses to render half-configured"

      # The runtime role openidx_app has to exist before migration v53 looks
      # for it, and the migration Job's own role cannot create it. That is
      # ordering, and ordering here is one annotation: a bootstrap hook at a
      # lower weight than the migration hook. Helm completes a weight before
      # starting the next, so getting these two numbers wrong is the whole
      # install failing -- silently, in a rendered manifest that looks fine.
      # The transaction pooler (global-scale plan task 2.2). Everything about it
      # is a combination that is fine alone and wrong together, which is exactly
      # what a rendered manifest hides:
      #   - a pooler in front of session-scoped tenant state hands one tenant's
      #     scope to the next client (measured:
      #     docs/evidence/2026-09-13-rls-transaction-pooling.md),
      #   - a pooler with no prepared-statement cache fails every pgx query,
      #   - a pooler nothing is routed to is a Deployment that does nothing,
      #   - a pooler the MIGRATION is routed through breaks the install, because
      #     an advisory lock is session-scoped.
      # Each is asserted below rather than left to a comment.
      # KEDA (task 3.6) scales on what a plane reports about its own pressure
      # rather than on CPU, which is a LAGGING indicator: a plane queues first
      # and burns CPU second, so utilisation crosses its target a minute after
      # the queue got deep.
      #
      # The hazard this asserts is not subtle once stated and invisible until
      # it happens: KEDA does not scale pods itself, it CREATES an HPA per
      # ScaledObject. A service with both KEDA and the chart's own HPA gets two
      # HorizontalPodAutoscalers on one Deployment, each computing a replica
      # count from different metrics and each writing it. The Deployment follows
      # whichever wrote last, and oscillates for as long as both exist.
      - name: Autoscaling has exactly one authority per Deployment
        run: |
          set -euo pipefail
          render() {
            helm template openidx "$CHART" \
              --set secrets.postgresPassword=render-only-not-a-credential \
              --set secrets.redisPassword=render-only-not-a-credential \
              --set secrets.encryptionKey=render-only-not-a-credential32b "$@"
          }

          # Off by default: the chart must not require a KEDA operator to install.
          if render | grep -q "kind: ScaledObject"; then
            echo "::error::keda is disabled by default but a ScaledObject rendered"; exit 1
          fi

          # And a values tree with no `keda` key at all must read as off rather
          # than failing the WHOLE chart with a nil-pointer that names no cause.
          if ! render --set keda=null >/dev/null 2>&1; then
            echo "::error::removing the keda values key breaks the render; absent must mean off"; exit 1
          fi

          # Both halves must be enabled together, or neither.
          if render --set keda.enabled=true --set keda.prometheusAddress=http://p:9090 \
                    --set oauthService.autoscaling.enabled=true >/dev/null 2>&1; then
            echo "::error::KEDA rendered alongside the chart's own HPA — two autoscalers on one Deployment"; exit 1
          fi
          if render --set keda.enabled=true >/dev/null 2>&1; then
            echo "::error::KEDA rendered with no prometheusAddress — every trigger would fail to evaluate"; exit 1
          fi

          cat > /tmp/keda-on.yaml <<'YAML'
          keda:
            enabled: true
            prometheusAddress: http://prometheus.monitoring:9090
            services:
              oauth-service: { enabled: true }
              access-service: { enabled: true }
              audit-service: { enabled: true }
          YAML
          render -f /tmp/keda-on.yaml > /tmp/render-keda.yaml

          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/render-keda.yaml')) if d]
          scaled = {d['metadata']['name']: d for d in docs if d.get('kind') == 'ScaledObject'}
          assert len(scaled) == 3, f"expected three ScaledObjects, got {sorted(scaled)}"

          # Each plane scales on the signal named for it, and the signal is one
          # the product actually emits.
          want = {
            'openidx-oauth-service': ('issue',  'openidx_admission_queue_wait_seconds_bucket'),
            'openidx-access-service': ('verify', 'openidx_http_requests_total'),
            'openidx-audit-service': ('event',  'openidx_outbox_relay_lag_seconds_bucket'),
          }
          for name, (plane, metric) in want.items():
            so = scaled[name]
            assert so['metadata']['labels']['openidx.io/plane'] == plane, f"{name} is not labelled {plane}"
            queries = ' '.join(t['metadata']['query'] for t in so['spec']['triggers'])
            assert metric in queries, f"{name} does not scale on {metric}: {queries}"

          # The whole point is to scale on something that moves BEFORE
          # utilisation. A cpu or memory trigger here puts the lagging
          # indicator back and nothing would look wrong.
          for name, so in scaled.items():
            for t in so['spec']['triggers']:
              assert t['type'] == 'prometheus', f"{name} has a non-prometheus trigger: {t['type']}"
              q = t['metadata']['query']
              assert 'cpu' not in q and 'memory' not in q, f"{name} scales on a lagging indicator: {q}"

          # And no service KEDA scales may also carry the chart's HPA. The
          # interlock above refuses to render that; this proves the render it
          # DID produce has one authority per Deployment.
          hpa_targets = {d['spec']['scaleTargetRef']['name']
                         for d in docs if d.get('kind') == 'HorizontalPodAutoscaler'}
          assert not (hpa_targets & set(scaled)), f"both autoscalers target: {hpa_targets & set(scaled)}"
          print(f"ok: {len(scaled)} ScaledObjects, one autoscaling authority per Deployment")
          PY

      # NATS JetStream (global-scale plan task 3.2). Six properties, and the
      # last one is the reason this step exists rather than leaning on
      # kubeconform: a chart can render a syntactically valid Kubernetes
      # manifest whose ConfigMap holds a config the SERVER refuses, and the
      # first person to find out is the kubelet. nats-server has a -t flag that
      # parses a config and exits, and its parser is strict at every depth
      # (measured: an unknown top-level field, a misspelled key inside
      # `permissions`, and `alow` for `allow` are each refused with a line and
      # column). So the real parser reads what the chart actually rendered.
      - name: The broker is safe by construction
        run: |
          set -euo pipefail
          base=(--set secrets.postgresPassword=render-only
                --set secrets.redisPassword=render-only
                --set secrets.encryptionKey=render-only-not-a-credential32b)
          on=(--set nats.enabled=true --set nats.relayPassword=render-only
              --set nats.consumerPassword=render-only)
          render() { helm template openidx "$CHART" "${base[@]}" "$@"; }
          refuses() {
            local why="$1"; shift
            if render "$@" >/dev/null 2>&1; then
              echo "::error::the chart rendered with $why"; exit 1
            fi
          }

          # 1. Default off. A chart that ships a broker nobody configured is a
          #    chart that fails to install.
          #
          #    Rendered to a FILE first, deliberately. Written as
          #    `if render | grep -q ...` this check passed for a template with
          #    the enabled gate removed: the render failed on a missing
          #    password, grep saw nothing, and "no NATS in the output" and "no
          #    output" are the same answer to a pipeline. set -e does not help
          #    inside an `if` condition. So the render has to succeed on its
          #    own line, where a failure is a failure.
          render > /tmp/render-nats-default.yaml
          if grep -qi 'component: nats' /tmp/render-nats-default.yaml; then
            echo "::error::NATS rendered with nats.enabled unset"; exit 1
          fi

          # 2. A replica count that cannot hold a majority is refused, not
          #    rounded. Raft commits on a majority: with 2 peers a majority is
          #    still 2, so losing one stops writes -- worse than the single
          #    node, which never promised otherwise.
          refuses 'nats.replicaCount=2' "${on[@]}" --set nats.replicaCount=2
          refuses 'nats.replicaCount=4' "${on[@]}" --set nats.replicaCount=4
          refuses 'nats.replicaCount=0' "${on[@]}" --set nats.replicaCount=0
          for n in 1 3 5; do
            render "${on[@]}" --set nats.replicaCount=$n >/dev/null \
              || { echo "::error::nats.replicaCount=$n was refused"; exit 1; }
          done

          # 3. Credentials and the store are required rather than defaulted.
          refuses 'no relayPassword' --set nats.enabled=true --set nats.consumerPassword=x
          refuses 'no consumerPassword' --set nats.enabled=true --set nats.relayPassword=x
          refuses 'an empty jetstream.size' "${on[@]}" --set nats.jetstream.size=""

          render "${on[@]}" > /tmp/render-nats.yaml
          render "${on[@]}" --set nats.replicaCount=5 > /tmp/render-nats-5.yaml
          python3 - /tmp/render-nats.yaml /tmp/render-nats-5.yaml <<'PYEOF'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          def by(kind):
              return next(d for d in docs if d["kind"] == kind
                          and d["metadata"]["labels"].get("app.kubernetes.io/component") == "nats")
          sts = by("StatefulSet")
          c = sts["spec"]["template"]["spec"]["containers"][0]

          # 4. Both halves of the command line. The image DOES carry an
          #    ENTRYPOINT -- the inverse of pgcat -- so args alone would work;
          #    spelling out command means what the kubelet execs does not depend
          #    on a shell script this repository has never run.
          assert c["command"] == ["nats-server"], c.get("command")
          assert c["args"] == ["--config", "/etc/nats/nats-server.conf"], c["args"]

          # 5. The store is a volume, because the container securityContext sets
          #    readOnlyRootFilesystem and a store the server cannot write is
          #    "[FTL] Can't start JetStream" and exit 1 -- not a quiet fallback
          #    to memory.
          assert c["securityContext"]["readOnlyRootFilesystem"] is True
          assert any(m["mountPath"] == "/data" for m in c["volumeMounts"]), c["volumeMounts"]
          assert sts["spec"]["volumeClaimTemplates"][0]["metadata"]["name"] == "data"

          # The Raft group's disruption budget follows the quorum, not a round
          # number: 3 peers tolerate 1 down, 5 tolerate 2.
          replicas = sts["spec"]["replicas"]
          assert by("PodDisruptionBudget")["spec"]["maxUnavailable"] == (replicas - 1) // 2

          conf = by("ConfigMap")["data"]["nats-server.conf"]
          assert conf.count("nats://") == replicas, "one route per peer"
          open("/tmp/rendered-nats.conf", "w").write(conf)

          # Read again at five peers, because at three the quorum budget and a
          # hardcoded 1 are the same number -- the assertion above would hold
          # for a template that had stopped computing it.
          docs = [d for d in yaml.safe_load_all(open(sys.argv[2])) if d]
          assert by("StatefulSet")["spec"]["replicas"] == 5
          assert by("PodDisruptionBudget")["spec"]["maxUnavailable"] == 2
          assert by("ConfigMap")["data"]["nats-server.conf"].count("nats://") == 5
          PYEOF

          # 6. And the real parser reads it. Strict at every depth, so a
          #    misspelled permission key cannot quietly become "no restriction".
          export NATS_SERVER_NAME=ci NATS_RELAY_PASSWORD=render-only NATS_CONSUMER_PASSWORD=render-only
          "$(go env GOPATH)/bin/nats-server" -t -c /tmp/rendered-nats.conf
          echo "the broker config the chart renders is one the server accepts"

      # The outbox relay (global-scale plan 3.1b). The property worth a CI step
      # is not that it renders: it is that the chart will not ship it WITHOUT a
      # broker. The binary refuses to start with no NATS_URL, deliberately --
      # a relay that starts and fails every publish looks healthy while the
      # backlog grows where nobody looks -- and rendering it anyway would move
      # that refusal into a CrashLoopBackOff instead of answering it at install.
      - name: The relay is deployed with a broker or not at all
        run: |
          set -euo pipefail
          base=(--set secrets.postgresPassword=render-only
                --set secrets.redisPassword=render-only
                --set secrets.encryptionKey=render-only-not-a-credential32b)
          broker=(--set nats.enabled=true --set nats.relayPassword=render-only
                  --set nats.consumerPassword=render-only)
          render() { helm template openidx "$CHART" "${base[@]}" "$@"; }

          # 1. Off by default. To a file, because `if render | grep` reads a
          #    failed render and an absent match as the same answer.
          render > /tmp/render-relay-default.yaml
          if grep -qi 'component: event-relay' /tmp/render-relay-default.yaml; then
            echo "::error::the relay rendered with eventRelay.enabled unset"; exit 1
          fi

          # 2. Enabled with nowhere to drain is refused, not rendered. No broker
          #    flags at all here -- that is the whole condition.
          if render --set eventRelay.enabled=true >/dev/null 2>&1; then
            echo "::error::the relay rendered with no broker configured"; exit 1
          fi

          # 3. With the chart's own broker, the wiring comes FROM the broker
          #    rather than being repeated next to it: a relay pointed at the
          #    wrong host, holding the wrong password, or publishing under a
          #    prefix its permissions do not cover is refused by the server on
          #    every event, and a values file is where that would be invisible.
          render "${broker[@]}" --set eventRelay.enabled=true > /tmp/render-relay.yaml
          python3 - /tmp/render-relay.yaml <<'PYEOF'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          def by(kind, component):
              return next(d for d in docs if d["kind"] == kind
                          and d["metadata"]["labels"].get("app.kubernetes.io/component") == component)

          c = by("Deployment", "event-relay")["spec"]["template"]["spec"]["containers"][0]
          env = {e["name"]: e for e in c["env"]}

          # The CLIENT Service, not the headless one. The headless Service is
          # how the peers find each other; pointing a client at it would hand
          # the relay one peer's address instead of the load-balanced set.
          client = next(d for d in docs
                        if d["kind"] == "Service"
                        and d["metadata"]["labels"].get("app.kubernetes.io/component") == "nats"
                        and d["spec"].get("clusterIP") != "None")
          svc = client["metadata"]["name"]
          assert env["NATS_URL"]["value"] == f"nats://{svc}:4222", (env["NATS_URL"], svc)

          secret = by("Secret", "nats")["metadata"]["name"]
          ref = env["NATS_PASSWORD"]["valueFrom"]["secretKeyRef"]
          assert ref == {"name": secret, "key": "NATS_RELAY_PASSWORD"}, ref

          conf = by("ConfigMap", "nats")["data"]["nats-server.conf"]
          prefix = env["EVENT_SUBJECT_PREFIX"]["value"]
          assert f'publish: {{ allow: ["{prefix}.>"' in conf, (prefix, conf[:200])

          # A worker, not a service: nothing routes to it.
          assert c["ports"][0]["containerPort"] == 8009
          PYEOF

          # 4. And an external broker is a supported answer to the same
          #    question, so the interlock is about HAVING one rather than about
          #    the chart owning it.
          #    To a file again, and not `render ... | grep -q`: grep -q closes
          #    the pipe on its first match, helm dies of SIGPIPE, and pipefail
          #    turns a SUCCESSFUL match into a failed step. Measured here, not
          #    reasoned about -- that pipeline reported the external URL missing
          #    while the render contained it.
          render --set eventRelay.enabled=true \
                 --set eventRelay.natsUrl=nats://broker.example:4222 > /tmp/render-relay-external.yaml
          grep -q 'nats://broker.example:4222' /tmp/render-relay-external.yaml \
            || { echo "::error::an external broker URL did not reach the relay"; exit 1; }

          echo "the relay ships with a broker, or does not ship"

      - name: Every service in a cell agrees on which cell it is
        run: |
          set -euo pipefail
          base=(--set secrets.postgresPassword=render-only
                --set secrets.redisPassword=render-only
                --set secrets.encryptionKey=render-only-not-a-credential32b)

          # Off by default: an install that never heard of cells must mint
          # unstamped tokens and refuse nothing.
          helm template cell-render-check "$CHART" "${base[@]}" > /tmp/render-cell-default.yaml
          # Set, and it has to LAND: the Go half reads CELL_ID, the guard is
          # mounted in five binaries, and none of that is reachable if the
          # value stops at the ConfigMap. So the assertion is which containers
          # actually consume it, not that the key rendered.
          helm template cell-render-check "$CHART" "${base[@]}" \
                 --set config.cellId=eu-1 > /tmp/render-cell-on.yaml
          python3 - /tmp/render-cell-default.yaml /tmp/render-cell-on.yaml <<'PYEOF'
          import sys, yaml

          def load(path):
              return [d for d in yaml.safe_load_all(open(path)) if d]

          default_docs, on_docs = load(sys.argv[1]), load(sys.argv[2])

          def config_map(docs):
              return next(d for d in docs if d["kind"] == "ConfigMap"
                          and d["metadata"]["name"].endswith("-config"))

          assert config_map(default_docs)["data"]["CELL_ID"] == "", "cells are not on by default"
          cm = config_map(on_docs)
          assert cm["data"]["CELL_ID"] == "eu-1", cm["data"]["CELL_ID"]

          # Which Deployments read that ConfigMap.
          reads = set()
          for d in on_docs:
              if d["kind"] != "Deployment":
                  continue
              component = d["metadata"]["labels"].get("app.kubernetes.io/component")
              for c in d["spec"]["template"]["spec"]["containers"]:
                  for src in c.get("envFrom") or []:
                      if src.get("configMapRef", {}).get("name") == cm["metadata"]["name"]:
                          reads.add(component)

          # The five that mount cell.Guard (cmd/cell_guard_census_test.go) plus
          # the issuer, which stamps the claim the guard reads. A guard with no
          # CELL_ID refuses nothing; an issuer with no CELL_ID mints tokens the
          # guards of OTHER cells cannot tell from pre-cell tokens, so both
          # halves have to receive it or the feature is off with the switch on.
          need = {"access-service", "admin-api", "audit-service",
                  "governance-service", "provisioning-service", "oauth-service"}
          missing = need - reads
          assert not missing, f"these never see CELL_ID: {sorted(missing)}"

          # verify-service is deliberately NOT here: it carries no envFrom at
          # all (see the step above) and mounts no guard -- it serves the key
          # set, which is the same in every cell.
          assert "verify-service" not in reads
          PYEOF

      - name: The verify tier holds nothing, and can reach the issuer
        run: |
          set -euo pipefail
          base=(--set secrets.postgresPassword=render-only
                --set secrets.redisPassword=render-only
                --set secrets.encryptionKey=render-only-not-a-credential32b)
          render() { helm template openidx "$CHART" "${base[@]}" "$@"; }

          # 1. Off by default, and off means absent. To a file, because
          #    `if render | grep` reads a failed render and an absent match as
          #    the same answer.
          render > /tmp/render-verify-default.yaml
          if grep -qi 'component: verify-service' /tmp/render-verify-default.yaml; then
            echo "::error::the verify tier rendered with verifyService.enabled unset"; exit 1
          fi

          # 2. Enabled with no issuer is refused, not rendered. A tier with no
          #    issuer comes up, passes its health check and answers every key
          #    fetch with a 503 -- healthy from outside, serving nothing.
          if render --set verifyService.enabled=true \
                    --set oauthService.enabled=false >/dev/null 2>&1; then
            echo "::error::the verify tier rendered with no issuer configured"; exit 1
          fi

          # 3. The whole claim of this tier is what it does NOT carry.
          #    Rendered under a release name that is NOT "openidx", deliberately:
          #    with the usual name a hardcoded "openidx-oauth-service" is
          #    byte-identical to the derived value, so the "it is derived"
          #    assertion below passed against a hardcoded URL. Measured -- that
          #    mutation stayed green until the release name stopped colliding.
          helm template verify-render-check "$CHART" "${base[@]}" \
                 --set verifyService.enabled=true \
                 --set networkPolicy.enabled=true > /tmp/render-verify.yaml
          python3 - /tmp/render-verify.yaml <<'PYEOF'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          def by(kind, component):
              return next(d for d in docs if d["kind"] == kind
                          and d["metadata"]["labels"].get("app.kubernetes.io/component") == component)

          dep = by("Deployment", "verify-service")
          c = dep["spec"]["template"]["spec"]["containers"][0]

          # No platform Secret and no database URL. Every other service mounts
          # both through envFrom; this one must not, because the binary skips
          # the platform production validator precisely so an operator is not
          # made to hand a vault KEK and an audit chain secret to the one pod
          # whose claim is that it carries neither.
          assert not c.get("envFrom"), c.get("envFrom")
          names = {e["name"] for e in c["env"]}
          assert names == {"APP_ENV", "LOG_LEVEL", "OAUTH_JWKS_URL"}, names
          for e in c["env"]:
              assert "valueFrom" not in e, e

          # The issuer URL is DERIVED from the issuer's own Service, so a
          # renamed service or a moved port cannot leave this pointing at
          # nothing that answers.
          svc = by("Service", "oauth-service")
          port = svc["spec"]["ports"][0]["port"]
          want = f'http://{svc["metadata"]["name"]}:{port}/.well-known/jwks.json'
          got = next(e["value"] for e in c["env"] if e["name"] == "OAUTH_JWKS_URL")
          assert got == want, (got, want)

          # Egress is the interesting half: DNS and the issuer, nothing else.
          # Two policies that are individually correct and jointly broken is
          # exactly what this checks -- the tier permitting a connection the
          # issuer refuses would render perfectly and serve 503 forever.
          def policy(component):
              return next(d for d in docs if d["kind"] == "NetworkPolicy"
                          and d["metadata"]["labels"].get("app.kubernetes.io/component") == component)

          verify = policy("verify-service")["spec"]
          assert set(verify["policyTypes"]) == {"Ingress", "Egress"}, verify["policyTypes"]
          reaches = set()
          for rule in verify["egress"]:
              for to in rule["to"]:
                  labels = to.get("podSelector", {}).get("matchLabels", {})
                  reaches.add(labels.get("app.kubernetes.io/component") or labels.get("k8s-app"))
          assert reaches == {"kube-dns", "oauth-service"}, reaches

          issuer = policy("oauth-service")["spec"]
          admits = {f["podSelector"]["matchLabels"].get("app.kubernetes.io/component")
                    for rule in issuer["ingress"] for f in rule["from"]}
          assert "verify-service" in admits, admits

          assert c["ports"][0]["containerPort"] == 8010
          PYEOF

          # 4. The routing, which is what makes the flag mean anything. Driven
          #    the way Kubernetes matches -- Exact first, then the longest
          #    Prefix -- rather than asserting a rule exists: what matters is
          #    where a REQUEST lands. /.well-known is a Prefix rule to the
          #    issuer, and everything except the key set must keep going there.
          helm template verify-render-check "$CHART" "${base[@]}" \
                 --set verifyService.enabled=true \
                 --set ingress.enabled=true > /tmp/render-verify-ingress-on.yaml
          render --set ingress.enabled=true > /tmp/render-verify-ingress-off.yaml
          python3 - /tmp/render-verify-ingress-on.yaml /tmp/render-verify-ingress-off.yaml <<'PYEOF'
          import sys, yaml

          def rules(path):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              ing = next(d for d in docs if d["kind"] == "Ingress"
                         and d["metadata"]["name"].endswith("-api"))
              return [(r["path"], r["pathType"], r["backend"]["service"]["name"])
                      for r in ing["spec"]["rules"][0]["http"]["paths"]]

          def router(paths):
              def route(p):
                  exact = [b for (path, t, b) in paths if t == "Exact" and path == p]
                  if exact:
                      return exact[0]
                  best, backend = -1, None
                  for (path, t, b) in paths:
                      if t == "Prefix" and (p == path.rstrip("/") or p.startswith(path.rstrip("/") + "/")):
                          if len(path) > best:
                              best, backend = len(path), b
                  return backend
              return route

          # The other well-known documents are produced from the database --
          # openid-configuration is built per tenant, the SSF metadata names
          # this issuer's streams, the app-association files come from config --
          # so a rule that swept them along with the key set would point them at
          # a tier that cannot answer any of them.
          stays = ["/.well-known/openid-configuration", "/.well-known/ssf-configuration",
                   "/.well-known/apple-app-site-association", "/.well-known/assetlinks.json",
                   "/oauth/token"]

          on = router(rules(sys.argv[1]))
          got = on("/.well-known/jwks.json")
          assert got and got.endswith("-verify-service"), \
              f"with the tier enabled, the key set still routes to {got}"
          for p in stays:
              got = on(p)
              assert got and got.endswith("-oauth-service"), f"{p} routed to {got}, want the issuer"

          # Exact, not Prefix, and this is the case that tells them apart: a
          # longest-prefix rule spelled /.well-known/jwks.json would ALSO claim
          # everything beneath it. Nothing serves a sub-path of the key set, so
          # the difference is only ever which pod gets to refuse it -- and the
          # tier that is meant to answer exactly one document should not be the
          # one fielding requests for paths that do not exist.
          got = on("/.well-known/jwks.json/anything")
          assert got and got.endswith("-oauth-service"), \
              f"a sub-path of the key set routed to {got}; the rule is Prefix where it should be Exact"

          # And with the flag off nothing moved: same edge as before the tier existed.
          off = router(rules(sys.argv[2]))
          for p in ["/.well-known/jwks.json"] + stays:
              got = off(p)
              assert got and got.endswith("-oauth-service"), f"{p} routed to {got} with the tier disabled"
          PYEOF

          echo "the verify tier carries nothing, reaches its issuer, and is what answers /.well-known/jwks.json"

      - name: The transaction pooler is safe by construction
        run: |
          set -euo pipefail
          render() {
            helm template openidx "$CHART" \
              --set secrets.postgresPassword=render-only-not-a-credential \
              --set secrets.redisPassword=render-only-not-a-credential \
              --set secrets.encryptionKey=render-only-not-a-credential32b "$@"
          }
          safe=(--set config.rlsMode=local --set pgcat.enabled=true
                --set pgcat.password=render-only --set pgcat.adminPassword=render-only
                --set pgcat.postgresHost=openidx-postgresql --set networkPolicy.enabled=true)

          # Off by default, and off means absent -- not a scaled-to-zero Deployment.
          # Here-string, not a pipe: see the note in the origin-cloaking step.
          if grep -q 'openidx-pgcat' <<<"$(render)"; then
            echo "the pooler rendered with pgcat.enabled unset"; exit 1
          fi

          # Enabled while the tenant scope is still session-scoped: refuse, and
          # say which knob makes it safe.
          if out=$(render --set pgcat.enabled=true --set pgcat.password=x \
                          --set pgcat.adminPassword=x --set pgcat.postgresHost=h 2>&1); then
            echo "the pooler rendered with config.rlsMode=session"; exit 1
          fi
          grep -q 'config.rlsMode' <<<"$out" \
            || { echo "the refusal does not name config.rlsMode: $out"; exit 1; }

          # A zero prepared-statement cache is pgcat's own default and it is a
          # fleet that cannot run one query. Refuse that too.
          if render "${safe[@]}" --set pgcat.preparedStatementsCacheSize=0 >/dev/null 2>&1; then
            echo "rendered with the prepared-statement cache disabled"; exit 1
          fi

          render "${safe[@]}" > /tmp/render-pgcat.yaml
          python3 - /tmp/render-pgcat.yaml <<'PYEOF'
          import sys, tomllib, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]

          def containers(o, out):
              if isinstance(o, dict):
                  out += (o.get("containers") or []) + (o.get("initContainers") or [])
                  for v in o.values():
                      containers(v, out)
              elif isinstance(o, list):
                  for v in o:
                      containers(v, out)

          pooled, direct = set(), set()
          for d in docs:
              cs = []
              containers(d, cs)
              for c in cs:
                  names = [e["name"] for e in (c.get("env") or [])]
                  (pooled if "DATABASE_URL" in names else direct).add((d["kind"], d["metadata"]["name"]))

          services = {("Deployment", f"openidx-{s}") for s in (
              "identity-service", "governance-service", "provisioning-service",
              "audit-service", "admin-api", "oauth-service", "gateway-service",
              "access-service")}
          missing = services - pooled
          assert not missing, f"these services still talk straight to Postgres: {sorted(missing)}"

          for job in (("Job", "openidx-migrate"), ("Job", "openidx-db-bootstrap")):
              assert job not in pooled, f"{job[1]} was routed through the pooler; its session state would not survive"

          cm = next(d for d in docs if d["kind"] == "ConfigMap" and d["metadata"]["name"] == "openidx-pgcat")
          cfg = tomllib.loads(cm["data"]["pgcat.toml"])
          pool = cfg["pools"]["openidx"]
          assert pool["pool_mode"] == "transaction", pool["pool_mode"]
          # Pool-level, not [general]: pgcat ignores unknown keys silently, so a
          # cache size in the wrong section reads as "configured" and is not.
          size = pool.get("prepared_statements_cache_size", 0)
          assert size > 0, "prepared_statements_cache_size is missing from the POOL section"
          assert "prepared_statements_cache_size" not in cfg["general"], \
              "prepared_statements_cache_size is in [general], where pgcat ignores it"
          # The pooler's pods are under the default-deny policy (they carry
          # part-of=openidx), so without an allow rule of their own every
          # service's dial to the pooler times out -- measured on kind, where
          # a healthy pooler sat unreachable for twelve minutes. The rule has
          # to admit exactly the services the DSN was repointed for.
          pol = next(d for d in docs if d["kind"] == "NetworkPolicy" and d["metadata"]["name"] == "openidx-pgcat-allow")
          assert pol["spec"]["podSelector"]["matchLabels"].get("app.kubernetes.io/component") == "pgcat"
          admitted = set()
          for rule in pol["spec"]["ingress"]:
              assert any(p["port"] == 6432 for p in rule["ports"]), rule
              for src in rule["from"]:
                  admitted.add(src["podSelector"]["matchLabels"]["app.kubernetes.io/component"])
          assert admitted == {s.split("openidx-", 1)[1] for (_, s) in services}, \
              f"the pooler admits {sorted(admitted)}, the DSN was repointed for {sorted(services)}"
          # Each pooled service waits for the pooler before its first connect;
          # without this the rollout that enables the pooler crash-loops for ten
          # minutes of growing back-off (measured on kind) and an --atomic
          # upgrade rolls it back.
          for d in docs:
              if (d["kind"], d["metadata"]["name"]) in services:
                  inits = [c["name"] for c in d["spec"]["template"]["spec"].get("initContainers") or []]
                  assert "wait-for-pooler" in inits, f"{d['metadata']['name']} does not wait for the pooler: {inits}"
          print(f"pooler routes {len(services)} services, leaves the Jobs direct, "
                f"transaction mode, statement cache {size}, admits exactly those {len(admitted)} services, "
                f"and each of them waits for it")

          # The issuer's policy has to admit every pod that verifies tokens
          # against its JWKS, or on an enforcing CNI each of them answers 401
          # to a token the issuer just minted while /health stays green --
          # measured on kind-cell, where identity-admin's JWKS fetch timed out.
          # Derived from the render, not listed: a consumer is a Deployment
          # whose containers set OAUTH_JWKS_URL or OAUTH_ISSUER, or envFrom the
          # ConfigMap that carries them; the issuer itself is not a consumer.
          cm_names = {d["metadata"]["name"] for d in docs
                      if d["kind"] == "ConfigMap" and "OAUTH_JWKS_URL" in (d.get("data") or {})}
          assert cm_names, "no ConfigMap carries OAUTH_JWKS_URL"
          consumers = set()
          for d in docs:
              if d["kind"] != "Deployment":
                  continue
              comp = d["spec"]["template"]["metadata"]["labels"]["app.kubernetes.io/component"]
              if comp == "oauth-service":
                  continue
              for c in d["spec"]["template"]["spec"].get("containers") or []:
                  names = {e["name"] for e in (c.get("env") or [])}
                  froms = {(ef.get("configMapRef") or {}).get("name") for ef in (c.get("envFrom") or [])}
                  if names & {"OAUTH_JWKS_URL", "OAUTH_ISSUER"} or froms & cm_names:
                      consumers.add(comp)
          assert consumers, "no Deployment consumes the issuer's URL; the derivation is broken"
          pol = next(d for d in docs if d["kind"] == "NetworkPolicy" and d["metadata"]["name"] == "openidx-oauth-service-allow")
          issuer_admits = set()
          for rule in pol["spec"]["ingress"]:
              if any(p["port"] == 8006 for p in rule["ports"]):
                  for src in rule["from"]:
                      issuer_admits.add(src["podSelector"]["matchLabels"]["app.kubernetes.io/component"])
          refused = consumers - issuer_admits
          assert not refused, f"these token verifiers cannot reach the issuer's JWKS: {sorted(refused)}"
          print(f"the issuer admits all {len(consumers)} services that verify against its JWKS: {sorted(consumers)}")
          PYEOF

      - name: Each plane connects as its own role, or none of them does
        run: |
          set -euo pipefail
          render() {
            helm template openidx "$CHART" \
              --set secrets.postgresPassword=render-only-not-a-credential \
              --set secrets.redisPassword=render-only-not-a-credential \
              --set secrets.encryptionKey=render-only-not-a-credential32b "$@"
          }
          on=(--set database.planeRoles.enabled=true
              --set database.planeRoles.password=render-only-not-a-credential)

          # Off by default, and off means the DSN keys do not exist at all --
          # not a Secret nobody reads. Here-string, not a pipe: see the note in
          # the origin-cloaking step.
          if grep -q 'DATABASE_URL_' <<<"$(render)"; then
            echo "a plane DSN rendered with database.planeRoles unset"; exit 1
          fi

          # Each interlock must refuse AND name the knob that resolves it. A
          # refusal an operator cannot act on is a wall, not a guard.
          refuses() {
            local want="$1"; shift
            if out=$(render "$@" 2>&1); then
              echo "rendered when it should have refused: $want"; exit 1
            fi
            grep -q "$want" <<<"$out" || { echo "the refusal does not name $want: $out"; exit 1; }
          }
          refuses 'pgcat.enabled' "${on[@]}" --set pgcat.enabled=true --set config.rlsMode=local \
                  --set pgcat.password=x --set pgcat.adminPassword=x --set pgcat.postgresHost=h
          refuses 'database.statementTimeout' "${on[@]}" --set database.statementTimeout=30s
          refuses 'database.planeRoles.password' --set database.planeRoles.enabled=true
          refuses 'issueUrl' --set database.planeRoles.enabled=true \
                  --set database.planeRoles.issueUrl=postgres://i --set database.planeRoles.adminUrl=postgres://a
          refuses 'postgresql.enabled' "${on[@]}" --set postgresql.enabled=false
          refuses 'not a plane' "${on[@]}" --set database.planeRoles.assignments.auditService=events

          render "${on[@]}" > /tmp/render-planes.yaml
          python3 - /tmp/render-planes.yaml <<'PYEOF'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]

          def containers(o, out):
              if isinstance(o, dict):
                  out += (o.get("containers") or []) + (o.get("initContainers") or [])
                  for v in o.values():
                      containers(v, out)
              elif isinstance(o, list):
                  for v in o:
                      containers(v, out)

          secret = next(d for d in docs if d["kind"] == "Secret"
                        and d["metadata"]["name"] == "openidx-plane-dsn")
          keys = set(secret["stringData"])
          assert keys == {"DATABASE_URL_ISSUE", "DATABASE_URL_ADMIN", "DATABASE_URL_EVENT"}, keys
          for k, role in (("DATABASE_URL_ISSUE", "openidx_issue"),
                          ("DATABASE_URL_ADMIN", "openidx_admin"),
                          ("DATABASE_URL_EVENT", "openidx_event")):
              assert f"://{role}:" in secret["stringData"][k], (k, "does not connect as", role)

          # The assignment table in values.yaml is the claim; this is the
          # rendered fact. A service silently left on the fleet-wide DSN is the
          # failure this task exists to remove, and it looks healthy.
          want = {
              "identity-service": "DATABASE_URL_ADMIN",
              "oauth-service": "DATABASE_URL_ISSUE",
              "access-service": "DATABASE_URL_ADMIN",
              "admin-api": "DATABASE_URL_ADMIN",
              "governance-service": "DATABASE_URL_ADMIN",
              "provisioning-service": "DATABASE_URL_ADMIN",
              "audit-service": "DATABASE_URL_EVENT",
              "gateway-service": "DATABASE_URL_ADMIN",
          }
          got = {}
          for d in docs:
              if d["kind"] != "Deployment":
                  continue
              name = d["metadata"]["name"].removeprefix("openidx-")
              cs = []
              containers(d, cs)
              for c in cs:
                  for e in (c.get("env") or []):
                      ref = (e.get("valueFrom") or {}).get("secretKeyRef") or {}
                      if e["name"] == "DATABASE_URL" and ref.get("name") == "openidx-plane-dsn":
                          got[name] = ref["key"]
          assert got == want, f"plane assignments differ: got {got}, want {want}"

          # The Jobs keep the owner DSN: the migration does DDL the runtime
          # roles do not have, and the bootstrap connects as the superuser.
          for d in docs:
              if d["kind"] != "Job":
                  continue
              cs = []
              containers(d, cs)
              for c in cs:
                  for e in (c.get("env") or []):
                      ref = (e.get("valueFrom") or {}).get("secretKeyRef") or {}
                      assert ref.get("name") != "openidx-plane-dsn", \
                          f"{d['metadata']['name']} was routed through a plane role; its DDL would be refused"
          print(f"{len(got)} services connect as their plane role; the Jobs stay on the owner DSN")
          PYEOF


      # Each half of the split can be pinned to its own node pool (task 3.4):
      # ADMIN load cannot starve ISSUE of CPU when the two Deployments do not
      # share nodes. nodeSelector is the pool's label and tolerations its
      # taint; with neither set nothing about scheduling changes, and that
      # absence is asserted too -- a rendered `nodeSelector: {}` is not the
      # same as none.
      - name: Each identity half can be pinned to its own node pool
        run: |
          set -euo pipefail
          render() {
            helm template openidx "$CHART" \
              --set secrets.postgresPassword=render-only-not-a-credential \
              --set secrets.redisPassword=render-only-not-a-credential \
              --set secrets.encryptionKey=render-only-not-a-credential32b \
              --set identityService.planeSplit.enabled=true "$@"
          }
          render > /tmp/render-unpinned.yaml
          render --set 'identityService.planeSplit.auth.nodeSelector.openidx\.io/plane=issue' \
                 --set 'identityService.planeSplit.admin.nodeSelector.openidx\.io/plane=admin' \
                 --set 'identityService.planeSplit.auth.tolerations[0].key=openidx.io/plane' \
                 --set 'identityService.planeSplit.auth.tolerations[0].operator=Equal' \
                 --set 'identityService.planeSplit.auth.tolerations[0].value=issue' \
                 --set 'identityService.planeSplit.auth.tolerations[0].effect=NoSchedule' \
                 --set 'identityService.planeSplit.admin.tolerations[0].key=openidx.io/plane' \
                 --set 'identityService.planeSplit.admin.tolerations[0].operator=Equal' \
                 --set 'identityService.planeSplit.admin.tolerations[0].value=admin' \
                 --set 'identityService.planeSplit.admin.tolerations[0].effect=NoSchedule' > /tmp/render-pinned.yaml
          python3 - /tmp/render-unpinned.yaml /tmp/render-pinned.yaml <<'PYEOF'
          import sys, yaml
          def load(path):
              return [d for d in yaml.safe_load_all(open(path)) if d]
          def pod(docs, half):
              for d in docs:
                  if d["kind"] == "Deployment" and d["metadata"]["name"] == f"openidx-identity-{half}":
                      return d["spec"]["template"]["spec"]
              raise AssertionError(f"Deployment/openidx-identity-{half} did not render")

          unpinned = load(sys.argv[1])
          for half in ("auth", "admin"):
              s = pod(unpinned, half)
              assert "nodeSelector" not in s and "tolerations" not in s, \
                  f"identity-{half} rendered node placement with none configured: {s.get('nodeSelector')} {s.get('tolerations')}"

          pinned = load(sys.argv[2])
          want = {"auth": "issue", "admin": "admin"}
          for half, pool in want.items():
              s = pod(pinned, half)
              assert s.get("nodeSelector") == {"openidx.io/plane": pool}, f"identity-{half} nodeSelector = {s.get('nodeSelector')}"
              tol = s.get("tolerations") or []
              assert any(t.get("key") == "openidx.io/plane" and t.get("value") == pool and t.get("effect") == "NoSchedule" for t in tol), \
                  f"identity-{half} does not tolerate its pool's taint: {tol}"
          assert pod(pinned, "auth")["nodeSelector"] != pod(pinned, "admin")["nodeSelector"], "both halves pinned to the same pool"
          print("unpinned: no placement rendered; pinned: auth -> issue pool, admin -> admin pool, each tolerating its own taint")
          PYEOF

      - name: The plane split sends every login path to the auth pod
        run: |
          set -euo pipefail
          render() {
            helm template openidx "$CHART" \
              --set secrets.postgresPassword=render-only-not-a-credential \
              --set secrets.redisPassword=render-only-not-a-credential \
              --set secrets.encryptionKey=render-only-not-a-credential32b \
              --set ingress.enabled=true --set ingress.hosts[0].host=openidx.example "$@"
          }

          # Off by default, and off means one Deployment -- not two with one
          # scaled to zero. Here-string, not a pipe: see the origin-cloaking step.
          if grep -q 'openidx-identity-auth' <<<"$(render)"; then
            echo "the split rendered with identityService.planeSplit unset"; exit 1
          fi

          render --set identityService.planeSplit.enabled=true \
                 --set identityService.autoscaling.enabled=true \
                 --set networkPolicy.enabled=true > /tmp/render-split.yaml
          python3 - /tmp/render-split.yaml deployments/kubernetes/helm/openidx/files/identity-planes.json <<'PYEOF'
          import json, sys, yaml
          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
          manifest = json.load(open(sys.argv[2]))

          def by(kind, name):
              for d in docs:
                  if d["kind"] == kind and d["metadata"]["name"] == name:
                      return d
              raise AssertionError(f"{kind}/{name} did not render")

          # Each half runs one profile, and BOTH keep the identity-service
          # component label. The NetworkPolicy, the ServiceMonitor and the PDB
          # all select on it; a rename would drop the pods out of all three, and
          # the NetworkPolicy is the one that matters.
          for half, profile in (("auth", "auth"), ("admin", "admin")):
              dep = by("Deployment", f"openidx-identity-{half}")
              labels = dep["spec"]["template"]["metadata"]["labels"]
              assert labels["app.kubernetes.io/component"] == "identity-service", labels
              assert labels["openidx.io/plane"] == half, labels
              env = {e["name"]: e.get("value") for e in dep["spec"]["template"]["spec"]["containers"][0]["env"]}
              assert env.get("SERVICE_PROFILE") == profile, env.get("SERVICE_PROFILE")
              # The Service must not select both halves.
              sel = by("Service", f"openidx-identity-{half}")["spec"]["selector"]
              assert sel.get("openidx.io/plane") == half, sel
              # An HPA names its target, so it has to have followed the rename.
              assert by("HorizontalPodAutoscaler", f"openidx-identity-{half}")["spec"]["scaleTargetRef"]["name"] \
                     == f"openidx-identity-{half}"

          npol = by("NetworkPolicy", "openidx-identity-service-allow")["spec"]["podSelector"]["matchLabels"]
          for half in ("auth", "admin"):
              labels = by("Deployment", f"openidx-identity-{half}")["spec"]["template"]["metadata"]["labels"]
              missing = {k: v for k, v in npol.items() if labels.get(k) != v}
              assert not missing, f"identity-{half} pods fall outside the NetworkPolicy: {missing}"

          # Now the routing itself, driven the way Kubernetes matches: Exact
          # first, then the longest Prefix. Every route in the manifest is
          # driven with a value in each parameter slot, because that is what
          # arrives -- the rule has to match the request, not the template.
          paths = []
          for rule in by("Ingress", "openidx-api")["spec"]["rules"][0]["http"]["paths"]:
              paths.append((rule["path"], rule["pathType"], rule["backend"]["service"]["name"]))

          def route(p):
              exact = [b for (path, t, b) in paths if t == "Exact" and path == p]
              if exact:
                  return exact[0]
              best, backend = -1, None
              for (path, t, b) in paths:
                  if t == "Prefix" and (p == path.rstrip("/") or p.startswith(path.rstrip("/") + "/")):
                      if len(path) > best:
                          best, backend = len(path), b
              return backend

          def concrete(path):
              return "/".join("0a1b2c3d-0000-4000-8000-000000000000" if s.startswith(":") else s
                              for s in path.split("/"))

          wrong = []
          for plane, want in (("issue", "openidx-identity-auth"), ("admin", "openidx-identity-admin")):
              for entry in manifest[plane]:
                  method, path = entry.split(" ", 1)
                  full = manifest["prefix"] + concrete(path)
                  got = route(full)
                  if got != want:
                      wrong.append(f"{entry} -> {full} routed to {got}, want {want}")
          assert not wrong, "the edge would send these to a pod that does not serve them:\n  " + "\n  ".join(wrong)
          print(f"{len(manifest['issue'])} ISSUE and {len(manifest['admin'])} ADMIN routes "
                f"reach the right plane through {len(paths)} Ingress rules")
          PYEOF


      - name: The bootstrap hook runs before the migration hook
        run: |
          set -euo pipefail
          render() {
            helm template openidx "$CHART" \
              --set secrets.postgresPassword=render-only-not-a-credential \
              --set secrets.redisPassword=render-only-not-a-credential \
              --set secrets.encryptionKey=render-only-not-a-credential32b "$@"
          }
          # The chain is script -> role -> schema: the ConfigMap must exist
          # before the Job that mounts it, and the role must exist before the
          # migration that assumes it. Helm completes a hook weight before
          # starting the next, so the whole ordering is three annotations --
          # easy to get silently wrong, and wrong means the install fails.
          render -s templates/db-bootstrap-job.yaml -s templates/migrate-job.yaml \
          | python3 -c '
          import sys, yaml
          w = {}
          for doc in yaml.safe_load_all(sys.stdin):
              if not doc:
                  continue
              ann = (doc.get("metadata") or {}).get("annotations") or {}
              if "helm.sh/hook-weight" in ann:
                  w[(doc["kind"], doc["metadata"]["name"])] = int(ann["helm.sh/hook-weight"])
          print("hook weights:", w)
          cm  = w[("ConfigMap", "openidx-db-bootstrap")]
          job = w[("Job", "openidx-db-bootstrap")]
          mig = w[("Job", "openidx-migrate")]
          assert cm < job, f"the bootstrap script ConfigMap ({cm}) must be created before the Job that mounts it ({job})"
          assert job < mig, f"the bootstrap Job ({job}) must run before the migration Job ({mig})"
          print("ordering holds: ConfigMap -> bootstrap Job -> migrate Job")
          '

          # An external database gets no bootstrap objects: the chart holds no
          # superuser credential for a server it does not run, and rendering
          # them would put a Job in the release that could only ever fail.
          if render --set postgresql.enabled=false | grep -q 'db-bootstrap'; then
            echo "db-bootstrap rendered with postgresql.enabled=false"; exit 1
          fi
          echo "external-database installs skip it"

      # The kubelet expands $(VAR) references in `command` and `args`, and its
      # escape for a literal dollar is a doubled one -- so a `$$` written there
      # reaches the container as a single `$`. The bootstrap script carried
      # v53's `DO $$ ... $$;` in args for one CI round and PostgreSQL answered
      # `syntax error at or near "$" at character 4`. Nothing at render time
      # could see it: the manifest was correct, the runtime rewrote it.
      #
      # A shell script belongs in a ConfigMap, which is mounted byte for byte.
      # This fails if one goes back into a command line.
      - name: No doubled dollar in a container command line
        run: |
          set -euo pipefail
          for values in "" "-f $CHART/values-prod.yaml" "-f $CHART/values-ci.yaml" \
                        "-f $CHART/values-ci.yaml -f $CHART/values-ci-cell.yaml"; do
            # shellcheck disable=SC2086
            helm template openidx "$CHART" \
              --set secrets.postgresPassword=render-only-not-a-credential \
              --set secrets.redisPassword=render-only-not-a-credential \
              --set secrets.encryptionKey=render-only-not-a-credential32b \
              --set edge.originVerify.value=render-only-placeholder-override \
              $values \
            | python3 -c '
          import sys, yaml
          bad = []
          def walk(o):
              if isinstance(o, dict):
                  for c in list(o.get("containers", [])) + list(o.get("initContainers", [])):
                      for field in ("command", "args"):
                          for entry in c.get(field) or []:
                              if "\$\$" in str(entry):
                                  bad.append((c.get("name"), field))
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
          for doc in yaml.safe_load_all(sys.stdin):
              walk(doc)
          if bad:
              for name, field in bad:
                  print(f"container {name}: {field} contains $$, which the kubelet rewrites to a single $")
              sys.exit(1)
          print("no container command line carries a doubled dollar")
          '
          done

  kind-install:
    name: Install on kind
    runs-on: ubuntu-latest
    env:
      CHART: deployments/kubernetes/helm/openidx
      NS: openidx-ci
      RELEASE: openidx
      TOOLS_IMAGE: ghcr.io/mhmtgngr/openidx/tools:ci
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      # Before the guard, not after: the guard renders the chart, and rendering
      # a chart whose subcharts have not been fetched fails with "missing in
      # charts/ directory" — which is how this job went red on its first run.
      - name: Add chart repos
        run: bash scripts/ci-retry.sh 3 5 -- helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: bash scripts/ci-retry.sh 3 5 -- helm dependency build "$CHART"

      # Cheap and static: catches the two ways this chart has named images that
      # do not exist, before spending a cluster on finding out.
      - name: Chart images resolve
        run: bash scripts/check-chart-images.sh --enforce

      - name: Self-test the image guard
        run: bash scripts/check-chart-images.test.sh

      - name: Create kind cluster
        id: kind
        uses: helm/kind-action@v1
        with:
          cluster_name: openidx-ci

      # The one image built from THIS tree. The migration Job runs it, so the
      # Job succeeding is the proof that this branch's migrations apply to an
      # empty database — which pulling main's published `latest` could never
      # show. The other services stay at replicaCount 0 (see values-ci.yaml).
      - name: Build the tools image (migrate + backup)
        run: docker build -f deployments/docker/Dockerfile.tools -t "$TOOLS_IMAGE" .

      - name: Load it into the cluster
        run: kind load docker-image "$TOOLS_IMAGE" --name openidx-ci

      # The bootstrap hook's psql client. Side-loaded rather than left to an
      # in-cluster pull: it is the first image the install needs, and an
      # anonymous Docker Hub rate limit there stalls the hook, which stalls
      # `helm --wait`, which reads as a chart failure.
      - name: Pre-load the bootstrap psql image
        run: |
          set -euo pipefail
          img=$(helm template openidx "$CHART" --values "$CHART/values-ci.yaml" \
            -s templates/db-bootstrap-job.yaml \
            | sed -n 's/^[[:space:]]*image:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -1)
          test -n "$img" || { echo "could not read the bootstrap image from the chart"; exit 1; }
          echo "bootstrap image: $img"
          bash scripts/ci-retry.sh 3 5 -- docker pull "$img"
          kind load docker-image "$img" --name openidx-ci

      # --wait blocks on every Deployment/StatefulSet becoming Ready and on the
      # post-install migration hook Job succeeding, so a green here already
      # means the data plane came up and the schema landed.
      - name: helm install --wait
        run: |
          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NS" --create-namespace \
            --values "$CHART/values-ci.yaml" \
            --wait --timeout 12m

      # Each of the four claims the readiness guide makes about this chart,
      # asserted against the running cluster rather than a rendered manifest.
      - name: The bootstrap hook Job ran before the migration and succeeded
        run: |
          set -euo pipefail
          succeeded=$(kubectl -n "$NS" get job "$RELEASE-db-bootstrap" -o jsonpath='{.status.succeeded}')
          test "${succeeded:-0}" -ge 1 || { echo "db-bootstrap Job did not succeed"; exit 1; }
          # It prints what it left behind; a Job that silently did nothing and
          # one that created the role have the same exit code.
          kubectl -n "$NS" logs "job/$RELEASE-db-bootstrap" --tail=5
          echo "db-bootstrap Job succeeded"

      - name: The migration hook Job ran and succeeded
        run: |
          set -euo pipefail
          succeeded=$(kubectl -n "$NS" get job "$RELEASE-migrate" -o jsonpath='{.status.succeeded}')
          test "${succeeded:-0}" -ge 1 || { echo "migrate Job did not succeed"; exit 1; }
          echo "migrate Job succeeded"

      - name: The schema actually landed
        run: |
          set -euo pipefail
          # `migrate up` exiting 0 on an empty database would satisfy the Job;
          # counting applied versions is what proves it did the work.
          applied=$(kubectl -n "$NS" exec "statefulset/$RELEASE-postgresql" -- \
            env PGPASSWORD=ci-postgres-password \
            psql -U openidx -d openidx -tAc 'SELECT count(*) FROM schema_migrations')
          echo "applied migrations: $applied"
          test "$applied" -gt 100 || { echo "expected the full migration set, got $applied"; exit 1; }

      # The migration Job connects as `openidx`, the plain LOGIN role the
      # PostgreSQL subchart creates -- not a superuser. Two migrations need
      # more than a plain role has, and both faults are invisible until an
      # install: v53 creates the openidx_app runtime role (a role without
      # CREATEROLE cannot, so templates/db-bootstrap-job.yaml creates it
      # first), and every seed after the v37 belt is refused by FORCE'd RLS
      # unless the transaction sets app.bypass_rls. The Job succeeding above
      # already covers the second; this covers the first, because a bootstrap
      # that silently did nothing would look identical.
      - name: The least-privileged owner got the runtime role it cannot create
        run: |
          set -euo pipefail
          role=$(kubectl -n "$NS" exec "statefulset/$RELEASE-postgresql" -- \
            env PGPASSWORD=ci-postgres-password \
            psql -U openidx -d openidx -tAc \
            "SELECT rolcanlogin::text || ',' || rolsuper::text || ',' || rolbypassrls::text FROM pg_roles WHERE rolname = 'openidx_app'")
          test "$role" = "true,false,false" || {
            echo "openidx_app is '$role', want 'true,false,false' (login, not superuser, not bypassrls)"; exit 1; }
          echo "openidx_app present and least-privileged"

      - name: OPA answers at the address config.opaUrl names
        run: |
          set -euo pipefail
          # config.opaUrl is http://opa:8281, and the Service is named literally
          # `opa` so that address resolves without configuration. Assert the
          # name and port the config depends on, then that it is really serving.
          port=$(kubectl -n "$NS" get svc opa -o jsonpath='{.spec.ports[0].port}')
          test "$port" = "8281" || { echo "opa Service is on $port, config.opaUrl says 8281"; exit 1; }
          kubectl -n "$NS" port-forward svc/opa 8281:8281 >/dev/null 2>&1 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8281/health >/dev/null 2>&1; then
              echo "opa:8281 is serving"; exit 0
            fi
            sleep 2
          done
          echo "opa did not answer /health"; exit 1

      - name: The backup CronJob and NetworkPolicies exist
        run: |
          set -euo pipefail
          kubectl -n "$NS" get cronjob "$RELEASE-backup" >/dev/null
          echo "backup CronJob present"
          policies=$(kubectl -n "$NS" get networkpolicy -o name | wc -l)
          test "$policies" -ge 10 || { echo "expected the NetworkPolicy set, got $policies"; exit 1; }
          kubectl -n "$NS" get networkpolicy "$RELEASE-default-deny-ingress" >/dev/null
          echo "$policies NetworkPolicies present, including default-deny-ingress"

      # A first red round should say what broke, not require a second push to
      # find out.
      - name: Diagnose
        if: failure() && steps.kind.conclusion == 'success'
        run: |
          kubectl -n "$NS" get all,networkpolicy,secret 2>&1 | head -100 || true
          echo "===== pods ====="
          kubectl -n "$NS" describe pods 2>&1 | tail -200 || true
          echo "===== db-bootstrap job ====="
          kubectl -n "$NS" describe job "$RELEASE-db-bootstrap" 2>&1 | tail -40 || true
          kubectl -n "$NS" logs "job/$RELEASE-db-bootstrap" --all-containers --tail=100 2>&1 || true
          echo "===== migrate job ====="
          kubectl -n "$NS" describe job "$RELEASE-migrate" 2>&1 | tail -60 || true
          kubectl -n "$NS" logs "job/$RELEASE-migrate" --all-containers --tail=200 2>&1 || true
          echo "===== postgres ====="
          kubectl -n "$NS" logs "statefulset/$RELEASE-postgresql" --tail=120 2>&1 || true
          echo "===== events ====="
          kubectl -n "$NS" get events --sort-by=.lastTimestamp 2>&1 | tail -80 || true

  # The CELL shape, installed and driven (global-scale plan 4.2/4.3, the half
  # this environment can measure). kind-install proves the chart installs and
  # the schema lands. This job layers values-ci-cell.yaml over the same values
  # and turns on every switch the plan added -- the transaction pooler with
  # RLS_MODE=local, a streaming read replica, the identity plane split, a cell
  # id -- with this tree's identity-service and oauth-service running behind
  # them, and asserts against the LIVE cluster what the lint job can only
  # assert against a render: that the switched-on positions work together.
  #
  # Two helm passes, deliberately. Migrations are a post-install hook, and
  # `helm --wait` waits for every Deployment to be Ready BEFORE it runs
  # post-install hooks; a service that needs the schema to become Ready would
  # therefore hold the install until the timeout, and the schema would never
  # land. THE POOLER IS IN THE SAME POSITION, and the first run of this job
  # measured it: pgcat validates its upstream pool at startup and exits when
  # Postgres refuses the login, and the login is refused until the bootstrap
  # hook creates openidx_app and gives it the password -- which is a
  # post-install hook, held by --wait, which was waiting for pgcat. Twelve
  # minutes of "Role openidx_app does not exist" and a CrashLoopBackOff, with
  # the hooks never created. So the first pass installs the data plane with
  # the services AND the pooler at zero (the hooks bootstrap the roles and
  # migrate), and the second pass scales them up -- a pre-upgrade hook re-runs
  # both Jobs as no-ops first. It is also the order an operator has to take on
  # a fresh cell with the bundled database and --wait (values.yaml, pgcat).
  #
  # kind enforces NetworkPolicy (kindnet ships kube-network-policies), so
  # this job also proves the chart's policies do not black-hole the cell
  # shape -- which the third run found they did: the pooler's pods sit under
  # the default-deny and had no allow rule, so every service's dial to it
  # timed out while the pooler itself reported healthy. The fourth run found
  # the rollout order: pooler and services rolled together, the services
  # dialled first, failed fast, and CrashLoopBackOff's growing delay put
  # convergence ten minutes out -- past --wait. Each pooled service now
  # carries an init container that waits for the pooler (openidx.waitForPooler).
  #
  # What it does NOT prove, and says so in values-ci-cell.yaml: load and
  # failover timing (no traffic, one node), three Redis roles on three
  # instances, database.planeRoles (interlocked with the pooler by design),
  # ingress and external secrets. Those wait for a real cell.
  kind-cell:
    name: A cell-shaped install on kind
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CHART: deployments/kubernetes/helm/openidx
      NS: openidx-cell
      # The release name is load-bearing: values-ci-cell.yaml names
      # openidx-oauth-service as the JWKS host, and every assertion below
      # names the resources the way this release renders them.
      RELEASE: openidx
      REGISTRY: ghcr.io/mhmtgngr/openidx
      # The default organization the migrations seed, which owns the seeded
      # api-service client; the misdirection case moves it between cells.
      ORG: 00000000-0000-0000-0000-000000000010
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - name: Add chart repos
        run: bash scripts/ci-retry.sh 3 5 -- helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build chart dependencies
        run: bash scripts/ci-retry.sh 3 5 -- helm dependency build "$CHART"

      - name: Create kind cluster
        id: kind
        uses: helm/kind-action@v1
        with:
          cluster_name: openidx-cell

      # Three images from THIS tree: the migration tools, and the two services
      # the cell shape runs. Pulling main's `latest` would test someone else's
      # binaries against this chart.
      - name: Build the tools, identity-service and oauth-service images
        run: |
          set -euo pipefail
          # Retried for the reason scripts/ci-retry.sh gives: this job's sixth run
          # died in the builder's `go mod download` on a proxy.golang.org stream
          # error, before a single chart step had run.
          for img in tools identity-service oauth-service; do
            bash scripts/ci-retry.sh 3 5 -- docker build -f "deployments/docker/Dockerfile.$img" -t "$REGISTRY/$img:ci" .
          done

      - name: Load them into the cluster
        run: |
          set -euo pipefail
          for img in tools identity-service oauth-service; do
            kind load docker-image "$REGISTRY/$img:ci" --name openidx-cell
          done

      # Side-loaded so an anonymous registry rate limit cannot stall the hooks,
      # which would stall `helm --wait` and read as a chart failure: the
      # bootstrap hook's psql client, the migration Job's wait-for-postgres
      # init image, and the pooler.
      - name: Pre-load the images the hooks and the pooler pull
        run: |
          set -euo pipefail
          render=$(helm template "$RELEASE" "$CHART" -f "$CHART/values-ci.yaml" -f "$CHART/values-ci-cell.yaml")
          imgs=$(printf '%s\n' "$render" \
            | sed -n 's/^[[:space:]]*image:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' \
            | grep -E '^(postgres:|busybox:|ghcr.io/postgresml/pgcat:)' | sort -u)
          test -n "$imgs" || { echo "could not read the hook and pooler images from the chart"; exit 1; }
          echo "$imgs"
          for img in $imgs; do
            bash scripts/ci-retry.sh 3 5 -- docker pull "$img"
            kind load docker-image "$img" --name openidx-cell
          done

      # Pass one: the data plane and the hooks, services and pooler at zero
      # (see the job header for why). --wait blocks on the primary, the
      # replica, Redis and OPA becoming Ready and on both hook Jobs succeeding.
      - name: helm install --wait (data plane, services and pooler at zero)
        run: |
          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NS" --create-namespace \
            -f "$CHART/values-ci.yaml" -f "$CHART/values-ci-cell.yaml" \
            --set identityService.replicaCount=0 \
            --set oauthService.replicaCount=0 \
            --set pgcat.replicaCount=0 \
            --wait --timeout 15m

      - name: The hooks ran, and the bootstrap gave the pooler its upstream credential
        run: |
          set -euo pipefail
          for job in db-bootstrap migrate; do
            succeeded=$(kubectl -n "$NS" get job "$RELEASE-$job" -o jsonpath='{.status.succeeded}')
            test "${succeeded:-0}" -ge 1 || { echo "$job Job did not succeed"; exit 1; }
          done
          logs=$(kubectl -n "$NS" logs "job/$RELEASE-db-bootstrap" --tail=20)
          echo "$logs"
          grep -q "openidx_app: password set" <<<"$logs" \
            || { echo "::error::the bootstrap hook did not set openidx_app's password; the pooler could never log in"; exit 1; }

      # The migration Job took the direct path and the services will take the
      # pooled one: neither is an accident of which Secret happened to win.
      - name: Migrations went direct; the services go through the pooler
        run: |
          set -euo pipefail
          direct=$(kubectl -n "$NS" get secret "$RELEASE-db-url" -o jsonpath='{.data.DATABASE_URL}' | base64 -d)
          pooled=$(kubectl -n "$NS" get secret "$RELEASE-pgcat-dsn" -o jsonpath='{.data.DATABASE_URL}' | base64 -d)
          grep -q "@$RELEASE-postgresql-primary:5432/" <<<"$direct" || { echo "direct DSN does not name the replication-mode primary"; exit 1; }
          grep -q "@$RELEASE-pgcat:6432/" <<<"$pooled" || { echo "pooled DSN does not name the pooler"; exit 1; }
          from=$(kubectl -n "$NS" get job "$RELEASE-migrate" -o jsonpath='{.spec.template.spec.containers[0].envFrom[*].secretRef.name}')
          grep -q "$RELEASE-db-url" <<<"$from" || { echo "the migration Job does not read the direct DSN: $from"; exit 1; }
          override=$(kubectl -n "$NS" get job "$RELEASE-migrate" -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="DATABASE_URL")].name}')
          test -z "$override" || { echo "the migration Job carries a DATABASE_URL env override; it would go through the pooler"; exit 1; }
          echo "migrate: direct ($RELEASE-postgresql-primary); services: pooled ($RELEASE-pgcat)"

      # A replica that is up is not a replica that is streaming. Ask the
      # replica whether it is in recovery, then whether the schema the primary
      # just received has arrived -- the same count on both sides.
      - name: The replica streams, and the schema arrived on it
        run: |
          set -euo pipefail
          psql_on() { # psql_on <statefulset> <sql>
            kubectl -n "$NS" exec "statefulset/$1" -- \
              env PGPASSWORD=ci-postgres-password psql -U openidx -d openidx -tAc "$2"
          }
          recovery=$(psql_on "$RELEASE-postgresql-read" 'SELECT pg_is_in_recovery()')
          test "$recovery" = "t" || { echo "the read replica is not in recovery (got '$recovery'): it is a second primary, not a replica"; exit 1; }
          primary=$(psql_on "$RELEASE-postgresql-primary" 'SELECT count(*) FROM schema_migrations')
          test "$primary" -gt 100 || { echo "expected the full migration set on the primary, got $primary"; exit 1; }
          for _ in $(seq 1 30); do
            replica=$(psql_on "$RELEASE-postgresql-read" 'SELECT count(*) FROM schema_migrations' 2>/dev/null || echo 0)
            if [ "$replica" = "$primary" ]; then
              echo "replica in recovery, $replica migrations on both sides"; exit 0
            fi
            sleep 2
          done
          echo "::error::the replica holds $replica migrations after 60s, the primary $primary"; exit 1

      # Pass two: the pooler and the services. A pre-upgrade hook re-runs the
      # bootstrap and the migration as no-ops, then pgcat comes up against a
      # role that can now log in, and the two identity halves and oauth roll
      # out and have to become Ready through it.
      - name: helm upgrade --wait (pooler and services up)
        run: |
          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NS" \
            -f "$CHART/values-ci.yaml" -f "$CHART/values-ci-cell.yaml" \
            --wait --timeout 12m

      # The belt THROUGH the pooler, as the role the fleet runs as. This is the
      # measured hazard of docs/evidence/2026-09-13-rls-transaction-pooling.md:
      # a session-scoped tenant handed to the next client. Under RLS_MODE=local
      # the scope is transaction-local, so on a fresh statement openidx_app
      # sees nothing, inside a transaction with a local bypass it sees the
      # seeded rows, and on the statement after that transaction it sees
      # nothing again.
      #
      # Driven from a probe pod wearing identity-service's labels, and that is
      # a claim too: kind enforces NetworkPolicy, the pooler is under the
      # chart's default-deny, and its allow rule admits the eight services --
      # so a pod that is not one of them cannot reach it (the Postgres pod
      # this step first used could not), and a pod that is, can.
      - name: The tenant belt holds through the pooler
        run: |
          set -euo pipefail
          kubectl -n "$NS" run belt-probe --image=postgres:16-alpine --restart=Never \
            --labels="app.kubernetes.io/name=openidx,app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=identity-service" \
            --command -- sleep 1800
          kubectl -n "$NS" wait --for=condition=Ready pod/belt-probe --timeout=180s
          via_pool() { # via_pool <user> <password> <db> <sql>
            kubectl -n "$NS" exec belt-probe -- \
              env PGPASSWORD="$2" psql -h "$RELEASE-pgcat" -p 6432 -U "$1" -d "$3" -v ON_ERROR_STOP=1 -qtAc "$4"
          }
          pools=$(via_pool pgcat ci-pgcat-admin-password pgcat 'SHOW POOLS')
          echo "$pools"
          grep -q 'openidx' <<<"$pools" && grep -q 'transaction' <<<"$pools" \
            || { echo "::error::pgcat is not pooling openidx in transaction mode"; exit 1; }

          bare=$(via_pool openidx_app ci-pgcat-password openidx 'SELECT count(*) FROM users')
          test "$bare" = "0" || { echo "::error::openidx_app with no tenant scope sees $bare users through the pooler; the belt is not FORCE'd against it"; exit 1; }
          # A multi-statement -c runs on one backend, and psql prints EVERY result of
          # it, not only the last: without -q the first run of this step printed
          # "BEGIN", "on", "5" for the query below. -q drops the command tags;
          # tail -n1 keeps the count, which is the last SELECT's single row.
          inside=$(via_pool openidx_app ci-pgcat-password openidx \
            "BEGIN; SELECT set_config('app.bypass_rls','on',true); SELECT count(*) FROM users" | tail -n1)
          test "$inside" -ge 1 || { echo "::error::a transaction-local bypass shows $inside users; the seeded admin is missing or the scope did not apply"; exit 1; }
          after=$(via_pool openidx_app ci-pgcat-password openidx \
            "BEGIN; SELECT set_config('app.bypass_rls','on',true); COMMIT; SELECT count(*) FROM users" | tail -n1)
          test "$after" = "0" || { echo "::error::the scope outlived its transaction through the pooler: $after users visible after COMMIT"; exit 1; }
          echo "belt holds through the pooler: bare=0, inside a local bypass=$inside, after COMMIT=0"

      - name: Two identity planes and the issuer are Ready through the pooler and read the replica
        run: |
          set -euo pipefail
          for dep in identity-auth identity-admin oauth-service pgcat; do
            ready=$(kubectl -n "$NS" get deploy "$RELEASE-$dep" -o jsonpath='{.status.readyReplicas}')
            test "${ready:-0}" -ge 1 || { echo "$dep has ${ready:-0} ready replicas"; exit 1; }
          done
          for half in auth admin; do
            profile=$(kubectl -n "$NS" get deploy "$RELEASE-identity-$half" \
              -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="SERVICE_PROFILE")].value}')
            test "$profile" = "$half" || { echo "identity-$half runs SERVICE_PROFILE=$profile"; exit 1; }
          done
          # Live health, not the manifest: database (through pgcat) and
          # database_replica (the read Service) both up, on all three pods.
          check() { # check <deployment> <port>
            kubectl -n "$NS" port-forward "deploy/$RELEASE-$1" "$2:$2" >/dev/null 2>&1 &
            local pf=$!
            local body=""
            for _ in $(seq 1 20); do
              body=$(curl -sS "http://127.0.0.1:$2/health" 2>/dev/null || true)
              [ -n "$body" ] && break
              sleep 1
            done
            kill $pf 2>/dev/null || true
            wait $pf 2>/dev/null || true
            echo "$1: $body"
            test "$(jq -r '.components.database.status' <<<"$body")" = "up" \
              || { echo "::error::$1: database is not up through the pooler"; exit 1; }
            test "$(jq -r '.components.database_replica.status' <<<"$body")" = "up" \
              || { echo "::error::$1: the read replica is not up"; exit 1; }
            if jq -r '.components.database_replica.details' <<<"$body" | grep -q 'no read replica configured'; then
              echo "::error::$1 has no read replica configured; DATABASE_READ_URL did not reach it"; exit 1
            fi
          }
          check identity-auth 8001
          check identity-admin 8001
          check oauth-service 8006

      # The split, live: a route is served by exactly one half. /users is
      # ADMIN (401 from the admin pod: registered, wants a token; 404 from the
      # auth pod: not registered there). The WebAuthn credential list is ISSUE
      # and the mirror image. Anything else -- 404 on both, 401 on both --
      # means the profile did not take.
      - name: Each identity half serves only its own plane
        run: |
          set -euo pipefail
          code_on() { # code_on <deployment> <path>
            kubectl -n "$NS" port-forward "deploy/$RELEASE-$1" 18001:8001 >/dev/null 2>&1 &
            local pf=$!
            for _ in $(seq 1 20); do
              curl -s -o /dev/null http://127.0.0.1:18001/health 2>/dev/null && break
              sleep 1
            done
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18001$2")
            kill $pf 2>/dev/null || true
            wait $pf 2>/dev/null || true
            echo "$code"
          }
          admin_route=/api/v1/identity/users
          issue_route=/api/v1/identity/mfa/webauthn/credentials
          a_admin=$(code_on identity-auth  "$admin_route");  m_admin=$(code_on identity-admin "$admin_route")
          a_issue=$(code_on identity-auth  "$issue_route");  m_issue=$(code_on identity-admin "$issue_route")
          echo "GET $admin_route: auth=$a_admin admin=$m_admin"
          echo "GET $issue_route: auth=$a_issue admin=$m_issue"
          test "$m_admin" = "401" || { echo "::error::the admin half does not serve $admin_route (got $m_admin)"; exit 1; }
          test "$a_admin" = "404" || { echo "::error::the auth half serves $admin_route (got $a_admin); the plane split did not take"; exit 1; }
          test "$a_issue" = "401" || { echo "::error::the auth half does not serve $issue_route (got $a_issue)"; exit 1; }
          test "$m_issue" = "404" || { echo "::error::the admin half serves $issue_route (got $m_issue); the plane split did not take"; exit 1; }

      # The cell claim, live, both ways. A token minted here for a tenant the
      # directory has not placed carries this cell, and a live admin pod serves
      # it. Then the tenant is PLACED in another cell (the directory is
      # internal/common/celldir; org_cells is belted, so the write runs under a
      # transaction-local bypass on the direct connection), the issuer stamps
      # the tenant's home cell instead of its own, and the same pod answers 421
      # Misdirected Request naming the cell that answered. No forged token: the
      # signature is the issuer's, and only the placement changed.
      - name: A token names its cell, and a token for a tenant placed elsewhere gets 421
        run: |
          set -euo pipefail
          kubectl -n "$NS" port-forward "deploy/$RELEASE-oauth-service" 18006:8006 >/dev/null 2>&1 &
          pf_oauth=$!
          kubectl -n "$NS" port-forward "deploy/$RELEASE-identity-admin" 18002:8001 >/dev/null 2>&1 &
          pf_admin=$!
          trap 'kill $pf_oauth $pf_admin 2>/dev/null || true' EXIT
          for port in 18006 18002; do
            for _ in $(seq 1 20); do
              curl -s -o /dev/null "http://127.0.0.1:$port/health" 2>/dev/null && break
              sleep 1
            done
          done

          mint() {
            curl -fsS -X POST http://127.0.0.1:18006/oauth/token \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              -d 'grant_type=client_credentials&client_id=api-service&client_secret=api-service-secret&scope=openid api' \
              | jq -r '.access_token'
          }
          claim() { # claim <jwt> <name>
            local payload
            payload=$(cut -d. -f2 <<<"$1" | tr '_-' '/+')
            case $(( ${#payload} % 4 )) in 2) payload="$payload==";; 3) payload="$payload=";; esac
            base64 -d <<<"$payload" 2>/dev/null | jq -r ".$2 // empty"
          }
          place() { # place <cell>  -- upsert the default org's placement on the direct connection
            # The read-back sits INSIDE the transaction. org_cells is FORCE RLS and
            # the owner is not a superuser, so once the transaction-local bypass
            # ends with COMMIT the belt hides the row from the role that wrote it:
            # this job's eighth run read back "COMMIT" (psql's last command tag,
            # the SELECT having returned no row). -q drops the tags; tail keeps
            # the SELECT's one row.
            kubectl -n "$NS" exec "statefulset/$RELEASE-postgresql-primary" -- \
              env PGPASSWORD=ci-postgres-password psql -U openidx -d openidx -v ON_ERROR_STOP=1 -qtAc \
              "BEGIN; SELECT set_config('app.bypass_rls','on',true);
               INSERT INTO org_cells (org_id, cell_id, region) VALUES ('$ORG', '$1', 'ci')
                 ON CONFLICT (org_id) DO UPDATE SET cell_id = EXCLUDED.cell_id, updated_at = NOW();
               SELECT cell_id FROM org_cells WHERE org_id = '$ORG'; COMMIT" 2>&1 | tail -1
          }
          ask_admin() { # ask_admin <jwt> -> "<code> <X-OpenIDX-Cell header or ->"
            local hdr code
            hdr=$(mktemp)
            code=$(curl -s -o /dev/null -D "$hdr" -w '%{http_code}' -H "Authorization: Bearer $1" http://127.0.0.1:18002/api/v1/identity/users)
            echo "$code $(sed -n 's/^[Xx]-[Oo]pen[Ii][Dd][Xx]-[Cc]ell:[[:space:]]*//p' "$hdr" | tr -d '\r' | head -1)"
          }

          home=$(mint); test -n "$home" || { echo "::error::could not mint a client_credentials token"; exit 1; }
          cell=$(claim "$home" cell)
          test "$cell" = "canary-1" || { echo "::error::a token minted in canary-1 carries cell='$cell'"; exit 1; }
          read -r code hdr <<<"$(ask_admin "$home")"
          case "$code" in
            421) echo "::error::a same-cell token was refused as misdirected"; exit 1;;
            401) echo "::error::the admin pod did not accept the issuer's token (401): JWKS not reachable?"; exit 1;;
          esac
          echo "same cell: token cell=$cell, admin pod answered $code"

          placed=$(place eu-1)
          test "$placed" = "eu-1" || { echo "::error::could not place $ORG in eu-1: $placed"; exit 1; }
          away=$(mint)
          cell=$(claim "$away" cell)
          test "$cell" = "eu-1" || { echo "::error::after placing the tenant in eu-1 the issuer stamped cell='$cell'; the directory was not consulted"; exit 1; }
          read -r code hdr <<<"$(ask_admin "$away")"
          test "$code" = "421" || { echo "::error::a token for a tenant placed in eu-1 was answered $code by canary-1, want 421"; exit 1; }
          test "$hdr" = "canary-1" || { echo "::error::421 without X-OpenIDX-Cell naming the answering cell (got '$hdr')"; exit 1; }
          echo "misdirected: token cell=eu-1, canary-1 answered 421 with X-OpenIDX-Cell: $hdr"

          # And back: the placement, not the pod, decides.
          place canary-1 >/dev/null
          back=$(mint)
          read -r code hdr <<<"$(ask_admin "$back")"
          test "$code" != "421" || { echo "::error::after placing the tenant back in canary-1 the pod still refuses"; exit 1; }
          echo "placed back: token cell=$(claim "$back" cell), admin pod answered $code"

      - name: Diagnose
        if: failure() && steps.kind.conclusion == 'success'
        run: |
          kubectl -n "$NS" get all,networkpolicy,secret 2>&1 | head -120 || true
          echo "===== pods ====="
          kubectl -n "$NS" describe pods 2>&1 | tail -250 || true
          for job in db-bootstrap migrate; do
            echo "===== $job job ====="
            kubectl -n "$NS" describe job "$RELEASE-$job" 2>&1 | tail -40 || true
            kubectl -n "$NS" logs "job/$RELEASE-$job" --all-containers --tail=120 2>&1 || true
          done
          for dep in pgcat identity-auth identity-admin oauth-service; do
            echo "===== $dep ====="
            kubectl -n "$NS" logs "deploy/$RELEASE-$dep" --all-containers --tail=150 2>&1 || true
          done
          echo "===== postgres primary ====="
          kubectl -n "$NS" logs "statefulset/$RELEASE-postgresql-primary" --tail=120 2>&1 || true
          echo "===== postgres read ====="
          kubectl -n "$NS" logs "statefulset/$RELEASE-postgresql-read" --tail=120 2>&1 || true
          echo "===== events ====="
          kubectl -n "$NS" get events --sort-by=.lastTimestamp 2>&1 | tail -100 || true
