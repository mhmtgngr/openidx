name: Go CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read
  checks: write

env:
  # A CACHE-KEY component only. setup-go is given go-version-file: go.mod so it
  # installs the exact `toolchain` line, and the pin therefore lives in one
  # place. Asking for '1.26' here is what made every job download a toolchain:
  # the runner's cache holds 1.26.7, setup-go reported "Successfully set up Go
  # version 1.26", and the next `go` command fetched go1.26.8 from
  # proxy.golang.org -- ~70 MB per job, unretried. One of those TLS handshakes
  # timed out and took Unit Tests (internal/notifications) down with it.
  GO_VERSION: '1.26'
  CACHE_VERSION: v1

jobs:
  # Site-specific internal addresses are not credentials, so the secret
  # scanners never flag them -- but this repository is public, and a real
  # gateway plus its subnet layout is an internal network map. This runs on
  # docs too, which is why it sits outside the detect-changes skip.
  no-internal-topology:
    name: No internal topology
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs the PR against its base, so the base commit must
          # be present; a shallow checkout would make it silently scan nothing.
          fetch-depth: 0
      - name: Verify the checker itself works
        # A guard that cannot go red is worse than no guard: the first version
        # of this script used an invalid grep flag and passed on a repository
        # that DID contain internal addresses.
        run: bash scripts/check-no-internal-topology.test.sh
      - name: Scan changed lines
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to diff against; sweeping the tree (advisory)"
            bash scripts/check-no-internal-topology.sh --all || true
            exit 0
          fi
          bash scripts/check-no-internal-topology.sh --range "$base"

  # `bash -n` cannot catch this class. A comment in run-fault-matrix.sh lost
  # its leading '#' during an edit; the file stayed syntactically VALID, the
  # suite still printed 6/6, and the only trace was one line on stderr. It
  # survived two merged PRs. A script that reports success while silently
  # running garbage is the dangerous shape, so it gets a permanent guard.
  shell-prose:
    name: No prose running as shell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify the checker itself works
        # Mutation test: it must go red on the real defect and stay green on
        # working code (an early version flagged `rm -rf build dist`, and a
        # checker that flags a working line just teaches --no-verify).
        run: bash scripts/check-shell-prose.test.sh
      - name: Scan shell scripts
        run: bash scripts/check-shell-prose.sh
      - name: Verify the docs-drift guard can go red
        # Same mutation discipline: it must flag a citation that does not
        # resolve AND stay green on globs, brace sets, elisions and Go symbols
        # -- a guard that flags `internal/oauth/**` gets switched off.
        run: bash scripts/check-docs-drift.test.sh
      - name: No document may cite a path that is not there
        run: bash scripts/check-docs-drift.sh --enforce
      - name: Verify the detached-write guard can go red
        # Same discipline again: it must flag a background pool call with no
        # tenant AND stay green on conn.Close, a direct pgx.Connect outside the
        # app pool, and a context that never reaches the database.
        run: bash scripts/check-detached-org-writes.test.sh
      - name: A detached database call must name its tenant
        run: bash scripts/check-detached-org-writes.sh --enforce

  # CI jobs here used to go red on other people's outages -- a Docker Hub 502
  # on a base-image manifest, a reset connection to the chart CDN, a Docker Hub
  # auth timeout while BOOTING THE BUILDER, and cdn.cocoapods.org declining the
  # probe that decides whether it is a CDN, so CocoaPods tried to `git clone` it
  # and the macOS client build died on `fatal: repository
  # 'https://cdn.cocoapods.org/' not found` -- every one of them before a line
  # of this repo was compiled, on commits that changed nothing related. Those
  # steps now retry, and the retries are load-bearing enough to need guarding
  # four ways: a retry wrapper that swallows the final exit code turns every
  # red into a slow green; a duplicated block that drifts makes the second
  # attempt run something the first never tried; `continue-on-error` with no
  # retry left consuming it is a step that simply fails in silence; and a
  # macOS Flutter build added without the CocoaPods priming step is exposed
  # again from the day it lands. None of the four would be visible in a passing
  # run, which is exactly why they are gates.
  #
  # A fifth belongs here because it is the same failure wearing CI's own
  # clothes: `go test -race` without an explicit `-timeout` inherits a
  # ten-minute per-package default meant for uninstrumented tests, so on a slow
  # runner the Race Detector check goes red with no data race in it at all --
  # a control reporting a diagnosis it did not make.
  ci-resilience-guards:
    name: Retries can still go red
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify the retry wrapper preserves failure
        run: bash scripts/ci-retry.test.sh
      - name: Verify the drift guard works
        run: bash scripts/check-docker-retry-drift.test.sh
      - name: A retried step must stay identical and never fail silently
        run: bash scripts/check-docker-retry-drift.sh
      - name: Verify the CocoaPods priming survives a blip and not an outage
        # The prime is a retry like the others, so it carries the same risk:
        # a `|| true` added to "stop the macOS job being flaky" would make
        # every CDN outage look like a healthy prime. The suite fails if it
        # ever exits 0 on a command that never succeeded.
        run: bash scripts/ci-prime-cocoapods.test.sh
      - name: Verify the CocoaPods priming guard can go red
        # Same mutation discipline as the guards above: it must flag a macOS
        # Flutter build with no priming step AND one that primes after the
        # build, and stay green on Android legs and on prose that merely names
        # a macOS runner.
        run: bash scripts/check-macos-pod-priming.test.sh
      - name: A macOS Flutter build must create its spec source first
        run: bash scripts/check-macos-pod-priming.sh
      - name: Verify the iOS URL-scheme registration works and is idempotent
        # `flutter create` regenerates ios/ from a template with no
        # CFBundleURLTypes, so the scheme is set by a step rather than by a
        # committed file, and a step is a thing to forget. The configure script
        # is tested here (it must refuse a missing plist rather than no-op, and
        # must not eat the keys Flutter generated) and the guard below is what
        # notices the next iOS job that skips it.
        run: bash scripts/ci-configure-ios-deeplinks.test.sh
      - name: Verify the iOS deep-link guard can go red
        run: bash scripts/check-ios-deeplink-config.test.sh
      - name: An iOS runner must register the URL scheme it was built to receive
        run: bash scripts/check-ios-deeplink-config.sh --enforce
      - name: Verify the toolchain-pin guard can go red
        run: bash scripts/check-go-toolchain-pin.test.sh
      - name: Every setup-go step installs the toolchain go.mod pins
        run: bash scripts/check-go-toolchain-pin.sh --enforce
      - name: Verify the run-block guard can go red
        run: bash scripts/check-run-blocks-can-fail.test.sh
      - name: A gate in a run block without -e must exit 1 itself
        # Added because a gate added to this very file could not fail: the
        # integration step opens `set -uo pipefail` (no -e), so a bare failing
        # command is skipped over and the step's status comes from the LAST
        # command. A checker that cannot fail is the defect this repository
        # keeps finding, and the checking file is where it is easiest to write.
        run: bash scripts/check-run-blocks-can-fail.sh --enforce
      - name: Verify the race-timeout guard can go red
        # Same mutation discipline: it must flag a bare `-race`, including one
        # split across a line continuation where the first line looks complete,
        # and stay green on both spellings of the flag and on a commented-out
        # example.
        run: bash scripts/check-race-timeout.test.sh
      - name: A race run must choose its own timeout
        run: bash scripts/check-race-timeout.sh

  # The files under .github/ decide what CI runs and who reviews it, and both
  # had defects that made them describe a process that was not happening.
  #
  # A workflow GitHub cannot parse takes ITSELF out of CI: it does not skip the
  # file, it creates a run named after the file path, schedules zero jobs, and
  # marks it failed. client-desktop-build.yml shipped that way in #814
  # (`run: echo "TODO: ..."`, a plain scalar containing ": ") and the desktop
  # client went unbuilt on every commit since, behind a red check with no job
  # and no log to read.
  #
  # CODEOWNERS named eighteen @openidx/* teams in a repository under a personal
  # namespace, which cannot have teams — so under code-owner review either
  # every rule no-ops or every PR is unclearable. And the required-checks
  # aggregate listed seven of this workflow's jobs; every guard added since,
  # plus the frontend tests, could go red without Required Checks noticing.
  github-config:
    name: GitHub config is runnable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The runner that lets a contributor run this job's guards -- and the
      # other jobs' -- before pushing rather than after. Its own cases run here
      # because a runner that reports "all guards pass" having found none is a
      # green light nobody earned, and that is not a failure CI would otherwise
      # notice: it would simply stop catching things.
      - name: The guard runner can still tell a pass from a pass it did not make
        run: bash scripts/run-ci-guards.test.sh

      - name: Verify the workflow guard can go red
        run: bash scripts/check-workflows-parse.test.sh
      - name: Every workflow must be one GitHub can run
        run: bash scripts/check-workflows-parse.sh
      - name: Verify the CODEOWNERS guard can go red
        run: bash scripts/check-codeowners.test.sh
      - name: CODEOWNERS must name owners that can review
        run: bash scripts/check-codeowners.sh
      - name: Verify the required-checks guard can go red
        run: bash scripts/check-required-checks.test.sh
      - name: Every CI job must be required or declared informational
        run: bash scripts/check-required-checks.sh
      - name: Verify the version-sync guard can go red
        run: bash scripts/check-version-sync.test.sh
      - name: Every artifact declares the version in VERSION
        run: bash scripts/check-version-sync.sh --enforce
      - name: Verify the release-signing guard can go red
        run: bash scripts/check-release-signing.test.sh
      - name: A release artifact must not claim a signature it lacks
        run: bash scripts/check-release-signing.sh --enforce
      - name: Verify the release-dispatch guard can go red
        run: bash scripts/check-release-dispatch.test.sh
      - name: A dispatched release must stamp images like a tagged one
        run: bash scripts/check-release-dispatch.sh --enforce
      - name: Verify the test-reachability guard can go red
        run: bash scripts/check-test-reachability.test.sh
      - name: No database-backed test may be unreachable from CI
        run: bash scripts/check-test-reachability.sh --enforce
      - name: Verify the inert-test guard can go red
        run: bash scripts/check-inert-tests.test.sh
      - name: No test may be one unconditional skip
        run: bash scripts/check-inert-tests.sh --enforce
      - name: Verify the OpenAPI guard can go red
        run: bash scripts/check-openapi-parses.test.sh
      - name: Every OpenAPI spec must parse and resolve
        run: bash scripts/check-openapi-parses.sh --enforce
      - name: The CodeQL alert summary really names the high-severity rule
        run: bash scripts/codeql-alert-summary.test.sh

  # The README's quick start is two commands, and nothing had ever run either
  # of them: generate-secrets.sh aborted on SIGPIPE, it omitted two variables
  # compose declares required, and compose could not see the .env it wrote.
  # Three separate stoppers in the first thing a new operator does, all of them
  # invisible because no job exercised the path.
  first-run:
    name: The documented first run works
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run the README quick start and check compose resolves
        run: bash scripts/check-first-run.test.sh

  ui-safety-guards:
    name: UI safety guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Guard self-tests (must go red on a real regression)
        run: |
          bash scripts/check-query-error-coverage.test.sh
          bash scripts/check-destructive-confirm.test.sh
          bash scripts/check-no-raw-neutral-literals.test.sh
          bash scripts/check-no-handrolled-tables.test.sh
          bash scripts/check-keyboard-reachable.test.sh
          bash scripts/check-control-names.test.sh
          bash scripts/check-e2e-suite.test.sh
      - name: Enforce UI safety guards
        run: |
          bash scripts/check-query-error-coverage.sh --enforce
          bash scripts/check-destructive-confirm.sh --enforce
          bash scripts/check-no-raw-neutral-literals.sh --enforce
          bash scripts/check-no-handrolled-tables.sh --enforce
          bash scripts/check-keyboard-reachable.sh --enforce
          bash scripts/check-control-names.sh --enforce
          bash scripts/check-e2e-suite.sh --enforce

  # The self-heal loop is the ONLY thing allowed to restart box services on its
  # own, so its collectors, ledger dedup, and (most importantly) the remediator
  # safety envelope must stay green. Every check-*.sh here is paired with a
  # hermetic *.test.sh that injects fake probes/actions -- no live box needed --
  # so a regression in the mode-gate/kill-switch/anti-flap/dry-run guards fails
  # CI before it can ever touch a running service.
  selfheal:
    name: Self-heal loop tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run selfheal unit tests
        run: |
          for t in scripts/selfheal/*.test.sh; do
            echo "== $t =="; bash "$t"
          done

  # The fault matrix used to run only on a developer's machine, which is the
  # same defect the prose checker had: a gate nobody runs cannot fail, so the
  # pipeline's error handling could rot silently. It needs no Ziti, no network
  # and no secrets -- it drives the REAL pipeline step (extracted from the
  # Azure YAML) against a local fake origin -- so it belongs in CI.
  # Deliberately outside the docs-only skip: this file is the thing it guards.
  fault-matrix:
    name: Pipeline reacts correctly to every failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        # The step is extracted from the pipeline YAML rather than copied, so
        # a drift between what CI tests and what Azure runs is impossible.
        run: python3 -m pip install --quiet pyyaml
      - name: Run the fault matrix
        # Fails if ANY case fails: wrong exit code or wrong diagnosis. The
        # message matters as much as the code -- blaming the wrong layer sends
        # the on-call to another team.
        run: |
          out="$(bash deployments/ci/faulttest/run-fault-matrix.sh 2>&1)"
          echo "$out"
          res="$(echo "$out" | grep -o 'FAULT_MATRIX=[0-9]*/[0-9]*' | tail -1)"
          pass="${res#FAULT_MATRIX=}"; tot="${pass#*/}"; pass="${pass%/*}"
          # An empty matrix must not pass: 0/0 is not evidence.
          if [ -z "$tot" ] || [ "$tot" -lt 1 ] || [ "$pass" != "$tot" ]; then
            echo "::error::fault matrix failed: ${res:-no result}"; exit 1
          fi

  # Every fix in this area was reverted at least once by a well-meaning edit
  # elsewhere, and the scoreboard that proves they still hold was a script on
  # one developer's machine. That is the SAME defect as the prose checker and
  # the fault matrix above: a gate nobody runs cannot fail. So it runs here.
  #
  # It re-runs the fault matrix, which the job above also runs. That overlap is
  # deliberate: the matrix job proves the ratio, this one proves the ratio is
  # still being MEASURED alongside the other ten guarantees. Dropping either
  # would let a regression through in the gap between them.
  field-fix-scoreboard:
    name: Field fixes still hold
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Run the scoreboard
        # Any metric off target fails the build. The script prints WHICH one,
        # so the failure names the regression instead of a bare exit code --
        # the same rule the pipeline steps themselves now follow.
        run: |
          out="$(bash scripts/field-fix-score.sh 2>&1)"
          echo "$out"
          res="$(echo "$out" | grep -o 'SCORE=[0-9]*/[0-9]*' | tail -1)"
          got="${res#SCORE=}"; tot="${got#*/}"; got="${got%/*}"
          # 0/0 is not evidence: an empty scoreboard must not pass.
          if [ -z "$tot" ] || [ "$tot" -lt 1 ] || [ "$got" != "$tot" ]; then
            echo "::error::field-fix scoreboard failed: ${res:-no result}"
            echo "$out" | grep EKSIK || true
            exit 1
          fi

  # Conditional: Skip CI for documentation-only changes
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_ci: ${{ steps.changes.outputs.skip_ci }}
      go_changed: ${{ steps.changes.outputs.go_changed }}
      frontend_changed: ${{ steps.changes.outputs.frontend_changed }}
    steps:
      # fetch-depth: 0 is REQUIRED — the change detection below diffs two
      # arbitrary commits, and the default shallow (depth-1) checkout
      # doesn't contain the base commit, making `git diff <base> <head>`
      # fail with exit 128 and red-X the whole pipeline on every PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect what changed
        id: changes
        run: |
          # Resolve the diff base for the current event.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # When the base is missing (first push to a branch reports an
          # all-zero before-SHA), or otherwise unresolvable even with full
          # history (force-push, etc.), fall back to running the full
          # pipeline. Over-running CI is always safe; a hard `git diff`
          # failure here would block every downstream job.
          ZERO="0000000000000000000000000000000000000000"
          if [[ -z "$BASE" || "$BASE" == "$ZERO" ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Diff base '$BASE' is unavailable — running full CI"
            echo "skip_ci=false" >> "$GITHUB_OUTPUT"
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Run CI unless every changed path is docs-only (.github/, docs/,
          # or a *.md / *.txt file anywhere). -q so we don't echo matches.
          if echo "$CHANGED_FILES" | grep -qvE '^(\.github/|docs/)|\.(md|txt)$'; then
            echo "skip_ci=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_ci=true" >> "$GITHUB_OUTPUT"
          fi

          # Go code changed?
          if echo "$CHANGED_FILES" | grep -qE '\.(go|mod|sum)$'; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "go_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Frontend code changed?
          if echo "$CHANGED_FILES" | grep -qE '^web/'; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Build matrix for different Go versions
  build-matrix:
    name: Build (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Names the job ("Build (Go 1.26)") and keys its cache. It is NOT the
        # toolchain: setup-go below reads go.mod, so the pin lives in one place.
        # The value stays a minor version deliberately -- this string is part of
        # a check name that branch protection may require, and a required check
        # that changes its name stops reporting.
        go-version: ['1.26']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ matrix.go-version }}-
            ${{ runner.os }}-go-build-

      - name: Download dependencies
        run: go mod download

      - name: Build services
        run: |
          for service in identity-service governance-service provisioning-service audit-service gateway-service admin-api oauth-service access-service; do
            if [ -d "./cmd/$service" ]; then
              echo "Building $service..."
              go build -o bin/$service ./cmd/$service
            fi
          done

      # Compile the build-tagged integration suite so it can't silently rot.
      # (The full run, which needs the services up, lives in test-integration.)
      - name: Compile integration tests
        run: go vet -tags=integration ./test/integration/...

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.go-version }}
          path: bin/
          retention-days: 7

  # Parallel test execution by package.
  #
  # `package` is the label the check carries; `paths` is what actually runs.
  # They were one field until this list was found to be missing cmd/ entirely —
  # seven production-config gate tests, one per service, red for several pushes
  # and reported by nothing here. Splitting the two lets one entry cover several
  # small packages without inventing a directory that does not exist, and
  # tools/testmatrix fails the build when a package holding tests is named by
  # neither this list nor its register. Keep the two halves consistent: the
  # guard reads `paths`, a human reads `package`.
  test-unit:
    name: Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: internal/access
            paths: ./internal/access/...
          - package: internal/admin
            paths: ./internal/admin/...
          - package: internal/apikeys
            paths: ./internal/apikeys/...
          - package: internal/audit
            paths: ./internal/audit/...
          - package: internal/auth
            paths: ./internal/auth/...
          - package: internal/common
            paths: ./internal/common/...
          - package: internal/directory
            paths: ./internal/directory/...
          - package: internal/email
            paths: ./internal/email/...
          - package: internal/gateway
            paths: ./internal/gateway/...
          - package: internal/governance
            paths: ./internal/governance/...
          - package: internal/health
            paths: ./internal/health/...
          - package: internal/identity
            paths: ./internal/identity/...
          - package: internal/metrics
            paths: ./internal/metrics/...
          - package: internal/middleware
            paths: ./internal/middleware/...
          - package: internal/migrations
            paths: ./internal/migrations/...
          - package: internal/notifications
            paths: ./internal/notifications/...
          - package: internal/oauth
            paths: ./internal/oauth/...
          - package: internal/organization
            paths: ./internal/organization/...
          - package: internal/portal
            paths: ./internal/portal/...
          - package: internal/provisioning
            paths: ./internal/provisioning/...
          - package: internal/risk
            paths: ./internal/risk/...
          - package: internal/server
            paths: ./internal/server/...
          - package: internal/webhooks
            paths: ./internal/webhooks/...
          - package: pkg/
            paths: ./pkg/...
          # Every service's main package. Each carries a
          # *_ProductionConfigValidation test that is the only automated proof
          # that that service accepts a correctly configured production start
          # and refuses a weak one; all seven were red for several pushes with
          # no job here to say so.
          - package: cmd
            paths: ./cmd/...
          # The gates' own self-tests. The lint jobs below `go run` these tools;
          # until this entry existed, nothing ran `go test` on the registers
          # that keep their verdicts honest.
          #
          # -short, and it is the only entry that needs a flag. Two of these
          # tools -- deadconfig and deadservice -- answer a question about the
          # WHOLE MODULE, so their tests call packages.Load over every package
          # in it with NeedTypes|NeedSyntax. Both already guard that half behind
          # testing.Short(), and both have a dedicated job further down this
          # file that runs `go test -short ./tools/X/` and then the tool itself
          # over the whole module as a hard gate -- so nothing here is skipped
          # that CI does not prove anyway, in a job whose name says what broke.
          #
          # Without the flag this job builds ./tools/... and then the load
          # inside the test has to build the rest of the module from scratch.
          # Measured on this branch: 8.8 GB of peak toolchain memory for
          # ./tools/deadconfig alone under -race. The job died with
          # `exit code 143` and "the runner has received a shutdown signal" on
          # five consecutive pushes, always at the same package boundary, and
          # never printed a test failure -- which is why it read as
          # infrastructure and went unread for five runs.
          - package: tools
            paths: ./tools/...
            flags: -short
          # The five leaf packages that decide whether access is allowed,
          # elevated, revoked or must be re-proved. Small enough to share a
          # runner, load-bearing enough that they must not share one with
          # something unrelated.
          - package: internal/abac+appaccess+jitgrant+revocation+stepup
            paths: ./internal/abac/... ./internal/appaccess/... ./internal/jitgrant/... ./internal/revocation/... ./internal/stepup/...
          - package: internal/vault+credentials+signingkeys
            paths: ./internal/vault/... ./internal/credentials/... ./internal/signingkeys/...
          - package: internal/ai+api+backup+intelligence+scimclient+selfheal+sms
            paths: ./internal/ai/... ./internal/api/... ./internal/backup/... ./internal/intelligence/... ./internal/scimclient/... ./internal/selfheal/... ./internal/sms/...
          # Go tests that assert things about the deployment surface and the
          # published specs rather than about a service.
          - package: deploy+deployments+test/openapi
            paths: ./deploy/... ./deployments/... ./test/openapi/...

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openidx_test
          POSTGRES_USER: openidx
          POSTGRES_PASSWORD: test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openidx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-build-

      # The matrix label reads like a path ("internal/metrics", "pkg/"), so it
      # cannot go into a filename as-is: -coverprofile=coverage_internal/metrics.out
      # asks Go to write into a directory that does not exist, and it fails in
      # under a second, before compiling a single package. That is what the old
      # `|| true` was really hiding — not flaky tests, but a command that could
      # never run. Flatten the separators once and reuse the slug below.
      - name: Derive coverage file name
        id: cov
        run: |
          slug='${{ matrix.package }}'
          slug="${slug%/}"
          echo "slug=${slug//\//_}" >> "$GITHUB_OUTPUT"

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgres://openidx:test_secret@localhost:5432/openidx_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          # A failing test MUST fail this job. This step carried `|| true` for a
          # long time, which meant test-unit reported success no matter what —
          # and since test-unit is one of the Required Checks (see the gate job
          # at the bottom of this file), the whole per-package matrix was a
          # green light that could never turn red. Only test-race, which runs
          # the whole repo without these service containers, was a real gate.
          #
          # Keep this a hard failure: it is the fast, per-package signal, and
          # it is the only job that runs with the Postgres/Redis services
          # attached, so it covers tests test-race cannot.
          # -timeout for the same reason test-race carries one: Go's default
          # ten minutes per package is a bound for uninstrumented tests, and
          # under -race it stops distinguishing a hang from a slow runner.
          #
          # matrix.flags is empty for every entry but `tools`, which passes
          # -short; the reason is written out beside that entry above.
          go test -v -race -timeout 20m ${{ matrix.flags }} -coverprofile=coverage_${{ steps.cov.outputs.slug }}.out -covermode=atomic ${{ matrix.paths }}

      # Upload whatever coverage was produced even when the tests failed, so a
      # red run still yields a coverage artifact to inspect.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ steps.cov.outputs.slug }}
          path: coverage_${{ steps.cov.outputs.slug }}.out
          if-no-files-found: ignore

  # Integration tests
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, build-matrix]
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openidx_test
          POSTGRES_USER: openidx
          POSTGRES_PASSWORD: test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openidx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: elasticsearch:8.13.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-build-

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://openidx:test_secret@localhost:5432/openidx_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          set -uo pipefail

          # ----- migrations -----
          # Guarded explicitly: this block runs under `set -uo pipefail` with no
          # -e, so a bare failing command does NOT stop the script -- the step's
          # exit code is whatever the LAST command returns. Every failure path
          # in this block has to say `exit 1` itself, which is why the health
          # wait below does. A failed migration would otherwise surface sixty
          # seconds later as "services did not become ready", naming the wrong
          # cause.
          echo "::group::Migrate DB"
          if ! go run ./cmd/migrate up; then
            echo "::error::migrations failed; the schema the rest of this job needs does not exist"
            exit 1
          fi
          echo "::endgroup::"

          # ----- every SQL literal in the tree, planned by the real database --
          # This job is the only place with a migrated PostgreSQL, and it is the
          # only place this class can be caught: a query naming a column that
          # does not exist compiles, reviews clean, and fails at runtime into a
          # handler that discards the error. A green run of THIS job printed
          # `column "request_count" does not exist` into the Postgres log while
          # reporting success. sqlprepare PREPAREs each statement -- parse,
          # name resolution and planning, no execution -- and fails on anything
          # its register does not already carry. See tools/sqlprepare.
          echo "::group::SQL prepares against the migrated schema"
          if ! go run ./tools/sqlprepare -fail; then
            echo "::error::sqlprepare: SQL this database refuses to plan. A NEW finding is a query that cannot succeed; a STALE entry is one that was fixed and whose register line must go. See tools/sqlprepare/known.go."
            exit 1
          fi
          echo "::endgroup::"

          # ----- build services the integration tests hit -----
          # gateway-service is here because TestCrossOrgSpoofing needs it and
          # nothing was starting it. That test asserts the gateway STRIPS a
          # client-supplied X-Org-Slug -- forge the header, read another
          # tenant's user by id, get refused. Its own comment said "it runs
          # fully in CI"; it did not. helpers_test.go defaults GATEWAY_URL to
          # localhost:8008, nothing listened there, and the test skipped on
          # every run since it was merged, so a cross-tenant spoofing defence
          # was proven nowhere. It passes with a gateway up, and fails with a
          # gateway whose Header.Del("X-Org-Slug") is removed -- both checked
          # before this line was added.
          #
          # admin-api is here for the same reason, one layer down.
          # TestCrossOrgIsolation's platform-admin subtest skipped on every run
          # since it was written ("admin is not a platform admin in this
          # environment"), so the MANDATORY cross-org audit trail -- the row
          # that makes a platform admin crossing a tenant boundary accountable
          # -- had never been written by a test. Chasing that skip found why it
          # could not pass where it was aimed: TenantResolver is mounted before
          # route-level auth on identity-service (and five others), so the
          # platform-admin predicate sees no roles and the X-Org-ID path is
          # unreachable there. admin-api mounts it on /api/v1 AFTER auth, which
          # is the one place the control is live -- so that is where it is now
          # tested, and both halves are asserted (a super_admin crosses and is
          # audited; a plain admin does not).
          #
          # access-service and audit-service are here for J5. The privileged-access
          # journey's credential half ends at POST /pam/entries/:id/reveal, which
          # access-service serves and whose audit row audit-service writes -- in a
          # different process, over HTTP. Driving vault.Service directly (which
          # jit_checkout_test.go does, and says so in its header) reaches the
          # mechanics and none of the controls: the org predicate, the
          # allow_reveal flag, the ACL for non-admins and the audit row all live
          # in the handler. Standing both up is what turned up that the ingest
          # endpoint had been refusing every event access-service ever sent it.
          echo "::group::Build identity-service + oauth-service + gateway-service + admin-api + governance-service + access-service + audit-service"
          for svc in identity-service oauth-service gateway-service admin-api governance-service access-service audit-service; do
            if ! go build -o "/tmp/$svc" "./cmd/$svc"; then
              echo "::error::$svc failed to build; without it the wait below would report" \
                   "'services did not become ready' sixty seconds from now and name the wrong cause"
              exit 1
            fi
          done
          echo "::endgroup::"

          # ----- start services in background -----
          # Both services share the same DATABASE_URL / REDIS_URL the test job
          # already exports. JWKS URL points at oauth-service's own metadata.
          export OAUTH_JWKS_URL=http://localhost:8006/.well-known/jwks.json
          export APP_ENV=test
          export OAUTH_ISSUER=http://localhost:8006
          # The suite is single-org: most tests log in the seeded admin via the
          # OAuth flow without an X-Org-Slug/subdomain signal, so they need the
          # default-org fallback on (config default is false as of v1.7.0). The
          # cross-org test sends X-Org-Slug explicitly, so it still validates
          # isolation under this posture.
          export DEFAULT_ORG_FALLBACK=true
          # Tests hammer /oauth/login from a single IP — the production-default
          # auth-path limit of 20/min (RATE_LIMIT_AUTH_REQUESTS) hits 429 partway
          # through the suite. Raise the limit only for the integration test
          # run; the rate-limit middleware itself is still exercised.
          export RATE_LIMIT_AUTH_REQUESTS=10000
          export RATE_LIMIT_REQUESTS=10000
          # The Definition of Done's posture (§6.2): assignment is a GRANT, not
          # a catalogue. Every existing test keeps passing under it because the
          # gate only denies when the application row has require_assignment=true
          # (migration v137, default false), and no seeded application sets it —
          # enforced_posture_test.go creates one that does. Before this, nothing
          # in test/ or .github/ mentioned this variable at all, so the flip the
          # DoD turns on had never been exercised.
          export ACCESS_ASSIGNMENT_ENFORCE=true
          # There is one login UI and it is not served by this process. The
          # harness never follows the redirect; the enforced-posture test only
          # asserts the Location it points at.
          export OAUTH_LOGIN_URL=http://localhost:3000/login
          # admin-api fail-closes at startup without a 32-byte key (its vault
          # keyring refuses to come up), which is correct and is why this is
          # exported rather than left unset. Test-only value; the same shape the
          # other jobs in this file already use.
          export ENCRYPTION_KEY="0123456789abcdef0123456789abcdef"
          # audit-service seals its hash chain with this; exported here so the
          # sealer runs in the integration stack rather than only in unit tests,
          # and so a J5 credential reveal is written into a chained trail.
          export AUDIT_CHAIN_SECRET="integration-audit-chain-secret-00"
          # And swept often, because one test waits for a real sweep.
          # audit_chain_test.go posts an audit event through the ingest endpoint
          # and waits for the RUNNING sealer to chain it before doctoring the
          # row — that wait is what makes it a proof about the deployed sealer
          # rather than about one constructed in a unit test. The default
          # interval is 60s and the sealer ignores rows younger than chainGrace
          # (30s, a constant), so at the default this test would spend up to a
          # minute and a half sleeping. At 5s it is the grace period plus a tick.
          export AUDIT_CHAIN_INTERVAL=5s

          /tmp/identity-service > /tmp/identity.log 2>&1 &
          IDENTITY_PID=$!
          /tmp/oauth-service    > /tmp/oauth.log    2>&1 &
          OAUTH_PID=$!
          # The gateway needs no configuration beyond what is already exported
          # above; it listens on 8008, which is what GATEWAY_URL defaults to.
          /tmp/gateway-service  > /tmp/gateway.log  2>&1 &
          GATEWAY_PID=$!
          # admin-api listens on 8005, which is what ADMIN_API_URL defaults to.
          /tmp/admin-api        > /tmp/admin-api.log 2>&1 &
          ADMIN_API_PID=$!
          # governance-service listens on 8002. It is here for J6: the DoD's
          # governance journey ends in "revoke propagates", and that step is a
          # write in THIS process read by oauth-service in another one. The two
          # once spelled the shared Redis key differently, so an access review
          # could revoke somebody and they kept working until their token
          # expired; internal/revocation exists because of it, and
          # governance_loop_test.go is the only place the two are actually
          # separate processes and the path can be driven end to end.
          /tmp/governance-service > /tmp/governance.log 2>&1 &
          GOVERNANCE_PID=$!
          # access-service listens on 8007 and audit-service on 8004. J5's reveal
          # is served by the first and audited by the second: access-service posts
          # every audit event over HTTP, so without audit-service running the
          # event is warned about and dropped, and the assertion that a credential
          # reveal is recorded would pass over an empty trail.
          /tmp/access-service   > /tmp/access.log   2>&1 &
          ACCESS_PID=$!
          /tmp/audit-service    > /tmp/audit.log    2>&1 &
          AUDIT_PID=$!
          echo "identity-service pid=$IDENTITY_PID, oauth-service pid=$OAUTH_PID, gateway-service pid=$GATEWAY_PID, admin-api pid=$ADMIN_API_PID, governance-service pid=$GOVERNANCE_PID, access-service pid=$ACCESS_PID, audit-service pid=$AUDIT_PID"

          cleanup() {
            echo "::group::identity-service log"; cat /tmp/identity.log  || true; echo "::endgroup::"
            echo "::group::oauth-service log";    cat /tmp/oauth.log     || true; echo "::endgroup::"
            echo "::group::gateway-service log";  cat /tmp/gateway.log   || true; echo "::endgroup::"
            echo "::group::admin-api log";        cat /tmp/admin-api.log || true; echo "::endgroup::"
            echo "::group::governance-service log"; cat /tmp/governance.log || true; echo "::endgroup::"
            echo "::group::access-service log";      cat /tmp/access.log    || true; echo "::endgroup::"
            echo "::group::audit-service log";       cat /tmp/audit.log     || true; echo "::endgroup::"
            kill "$IDENTITY_PID" "$OAUTH_PID" "$GATEWAY_PID" "$ADMIN_API_PID" "$GOVERNANCE_PID" "$ACCESS_PID" "$AUDIT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # ----- wait for all seven to be healthy -----
          # Each is waited for rather than probed opportunistically: a service
          # that fails to start must fail this job, not send the test that needs
          # it back to skipping quietly, which is the state both the gateway and
          # the admin-api tests spent their whole lives in.
          echo "::group::Wait for service health"
          for i in $(seq 1 60); do
            id_ok=0; oa_ok=0; gw_ok=0; ad_ok=0; go_ok=0; ac_ok=0; au_ok=0
            curl -sf http://localhost:8001/health/ready >/dev/null 2>&1 && id_ok=1
            curl -sf http://localhost:8006/health/ready >/dev/null 2>&1 && oa_ok=1
            curl -sf http://localhost:8008/health       >/dev/null 2>&1 && gw_ok=1
            curl -sf http://localhost:8005/health       >/dev/null 2>&1 && ad_ok=1
            curl -sf http://localhost:8002/health       >/dev/null 2>&1 && go_ok=1
            curl -sf http://localhost:8007/health       >/dev/null 2>&1 && ac_ok=1
            curl -sf http://localhost:8004/health       >/dev/null 2>&1 && au_ok=1
            if [ "$id_ok" = "1" ] && [ "$oa_ok" = "1" ] && [ "$gw_ok" = "1" ] && [ "$ad_ok" = "1" ] && [ "$go_ok" = "1" ] && [ "$ac_ok" = "1" ] && [ "$au_ok" = "1" ]; then
              echo "all seven services ready after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" = "60" ]; then
              echo "::error::services did not become ready within 60s (identity_ok=$id_ok oauth_ok=$oa_ok gateway_ok=$gw_ok admin_api_ok=$ad_ok governance_ok=$go_ok access_ok=$ac_ok audit_ok=$au_ok)"
              exit 1
            fi
          done
          echo "::endgroup::"

          # ----- run integration tests -----
          # Promoted to a hard gate as of PR #114 — the full suite (24/24
          # top-level tests) is green on main. The earlier `|| true` was
          # informational while PRs #102, #105, #106, #107, #108, #110,
          # #112, and #114 worked through the layered bugs that the
          # foundation surfaced.
          #
          # cmd/rekey is here rather than in the unit matrix because its only
          # test file is behind the same `integration` tag, so every job that
          # does not pass -tags compiles zero tests out of that package and
          # reports success. It had never run anywhere: a 294-line end-to-end
          # proof that a KEK rotation re-seals every encrypted value under the
          # new key and leaves the plaintext intact — the tool an operator uses
          # after a key compromise — going through CI as an empty package.
          go test -v -tags=integration -timeout=20m ./test/integration/... ./cmd/rekey/...

  # Benchmark regression detection
  # status-check: informational — publishes a comparison comment; a slower
  # benchmark is a report to read, not a reason to block a merge, and the
  # numbers move with the runner it landed on.
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 15
    # The workflow-level permissions block is read-only; this job posts the
    # benchstat comparison as a PR comment, which needs write.
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-build-

      - name: Run benchmarks on base branch
        run: |
          git checkout ${{ github.event.pull_request.base.ref }}
          go test -bench=. -benchmem -run=^$ ./... > base_bench.txt 2>&1 || true

      - name: Run benchmarks on PR branch
        run: |
          git checkout ${{ github.sha }}
          go test -bench=. -benchmem -run=^$ ./... > pr_bench.txt 2>&1 || true

      - name: Compare benchmarks
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          benchstat base_bench.txt pr_bench.txt | tee benchstat_output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: |
            base_bench.txt
            pr_bench.txt
            benchstat_output.txt

      - name: Comment benchmark results on PR
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('benchstat_output.txt', 'utf8');
            const body = `### Benchmark Results\n\n\`\`\`\n${output}\n\`\`\``;
            // The comment is a nicety — never fail the job over it (a fork
            // PR's token stays read-only; results live in the artifact).
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (e) {
              core.warning(`Could not post benchmark comment: ${e.message}`);
            }

  # Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-build-

      # Formatting is gated here, with the toolchain go.mod pins, rather than by
      # golangci-lint's gofmt formatter. golangci-lint's gofmt is whatever the
      # linter BINARY was built with (v2.13.2 = go1.27), which is not the Go
      # that builds this module -- and gofmt's alignment heuristics changed
      # between the two, so the linter demanded a layout `gofmt -w` never
      # produces here. This step can only ever ask for what a contributor's own
      # gofmt gives them.
      - name: gofmt
        run: |
          # Scope: the packages of THIS module, which is what golangci-lint's
          # formatter covered -- a like-for-like swap, not a wider gate. `./...`
          # deliberately stops at agent/ (its own module, its own Go version,
          # and it vendors third_party/ sources that must not be reformatted).
          mapfile -t dirs < <(go list -f '{{.Dir}}' ./...)
          unformatted="$(gofmt -l "${dirs[@]}")"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean under $(go version):"
            echo "$unformatted"
            echo
            echo "Fix with: gofmt -w <file>..."
            exit 1
          fi
          echo "gofmt clean under $(go version) across ${#dirs[@]} packages"

      - name: Run golangci-lint
        # v7+ of the action runs golangci-lint v2, which is built with a recent
        # enough Go to analyze this go1.26 module (v1 cannot). The pin must stay
        # ahead of the module's go directive: a linter built with an older Go
        # refuses the module outright ('language version ... is lower than the
        # targeted Go version'). v2.13.2 ships built with go1.27.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  # orgscope is the v2.0-multi-tenancy static helper: it walks
  # internal/ looking for SQL statements that target a scoped table
  # without an org_id mention. As of v1.7.0 every service is org-scope
  # aware (0 findings), so this is a HARD GATE: the job runs the tool
  # with -fail and the build goes red on any reintroduced unscoped query.
  orgscope:
    name: Org-scope lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run orgscope (hard gate)
        run: |
          set +e
          go run ./tools/orgscope -fail ./internal > orgscope.out 2> orgscope.err
          rc=$?
          set -e
          count=$(tail -n1 orgscope.err 2>/dev/null | grep -oE '^orgscope: [0-9]+' | awk '{print $2}' || echo "?")
          # The census is the tenant-boundary state of the whole schema. Print
          # it in the summary so a drifting classification is visible on the PR
          # that causes it, not a release later.
          go run ./tools/orgscope -census > census.out 2> census.err || true
          {
            echo "## orgscope — tenant boundary"
            echo
            echo "**Blocking findings:** ${count}"
            echo
            echo "$(tail -n1 census.err)"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "❌ **Gate failed** — either a table is not classified (see tools/orgscope/scoped.go) or a query touching a tenant-scoped table does not filter/populate org_id (or carry an //orgscope:ignore <reason>)."
            else
              echo "✅ Every table is classified and no unscoped tenant query was found."
            fi
            echo
            echo "### Findings"
            echo
            echo '```'
            head -200 orgscope.out
            if [ "$(wc -l < orgscope.out)" -gt 200 ]; then
              echo "... (truncated; $(wc -l < orgscope.out) lines total)"
            fi
            echo '```'
            echo
            echo "<details><summary>Table census</summary>"
            echo
            echo '```'
            cat census.out
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # Propagate the tool's exit code — non-zero fails the build.
          exit $rc

  # inerttests finds Go tests that execute nothing: every statement assigns to
  # the blank identifier from an expression that calls nothing, so the function
  # under test never runs. `_ = service.AuthenticateUser` is a method VALUE, not
  # a call. Nine of these were in the tree -- seven over the directory
  # authentication router, one named after a function it never called, one that
  # read fields off a zero value it had built itself -- and all nine passed on
  # every CI run of their lives.
  #
  # scripts/check-inert-tests.sh cannot see them: that guard looks for an
  # unconditional t.Skip, and these do not skip. They run and report a tick.
  inerttests:
    name: Inert-test lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Self-test the tool first
        # A guard whose own cases do not pass has no standing to fail a build.
        run: go test ./tools/inerttests/

      - name: Run inerttests (hard gate)
        run: |
          set +e
          go run ./tools/inerttests -fail ./internal ./cmd ./pkg ./tools ./test ./deploy > inert.out 2> inert.err
          rc=$?
          set -e
          {
            echo "## inerttests — tests that execute nothing"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "❌ **Gate failed.** A test whose every statement is \`_ = <something that is not called>\` runs no code. Call the thing and assert on it, or delete the test."
            else
              echo "✅ $(tail -n1 inert.err 2>/dev/null || echo 'every test runs something')"
            fi
            echo
            echo '```'
            head -50 inert.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # routereach holds the router's route table next to the handlers the packages
  # define. Two findings, both invisible to everything else here:
  #
  #   - a handler reads c.Param("x") and no route it is mounted on declares x.
  #     gin returns "" for a name the matched route does not have, so
  #     `DELETE /users/:id/bypass-codes` asked the database to revoke the empty
  #     user's MFA break-glass codes and got `invalid input syntax for type
  #     uuid: ""` -- a 400, worded as if the administrator had sent something
  #     wrong, on every call this endpoint has ever received.
  #   - a func(*gin.Context) that no route mounts and no non-test line
  #     references. _test.go is deliberately not scanned: a handler whose only
  #     caller is a test that mounts it on a router the test built is the
  #     sharpest form of this, and that is how internal/oauth's second OIDC
  #     discovery document -- 415 lines of passing test, served to nobody --
  #     came to light.
  routereach:
    name: Route-reachability lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Self-test the tool first
        # A guard whose own cases do not pass has no standing to fail a build.
        run: go test ./tools/routereach/

      - name: Run routereach (hard gate)
        run: |
          set +e
          go run ./tools/routereach -fail ./internal ./cmd ./pkg > rr.out 2> rr.err
          rc=$?
          set -e
          {
            echo "## routereach — parameters with no route, handlers with no router"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "❌ **Gate failed.** A PARAM finding is a handler reading a name its route does not declare: gin hands it \`\"\"\`, so the request acts on the empty id. A NEW unmounted handler is code no request can reach. A STALE entry is a handler a route reaches now, and its line in \`tools/routereach/known.go\` must go. A BLIND route declares parameters and resolves to no handler, which means the census stopped covering it."
            else
              echo "✅ $(tail -n1 rr.err 2>/dev/null || echo 'every route parameter is declared and every handler has a verdict')"
            fi
            echo
            echo '```'
            head -60 rr.out
            tail -n1 rr.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # zeroanswer finds the aggregate queries whose failure is reported as a
  # number. A one-row aggregate -- COUNT, SUM, AVG, MAX, EXISTS -- always
  # returns exactly one row, so a discarded Scan error there never means "there
  # is no data": it means the query did not run, and the destination keeps its
  # zero. The caller then prints that zero on a dashboard, puts it in a
  # compliance report, or decides a control passed.
  #
  # Nothing else in this repository can see it. The SQL is valid, so sqlprepare
  # plans it; the tenant predicate is there, so orgscope passes it; the handler
  # answers 200 with a well-formed body, so the contract test passes it; and
  # COUNT over no rows is 0, indistinguishable in the destination from the zero
  # a broken query leaves behind. Only the error told them apart.
  zeroanswer:
    name: Zero-answer lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Self-test the tool first
        # A guard whose own cases do not pass has no standing to fail a build.
        run: go test ./tools/zeroanswer/

      - name: Run zeroanswer (hard gate)
        run: |
          set +e
          go run ./tools/zeroanswer -fail ./internal ./cmd > za.out 2> za.err
          rc=$?
          set -e
          {
            echo "## zeroanswer — a failed measurement reported as zero"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "❌ **Gate failed.** A NEW finding is an aggregate whose error is discarded: read what the caller does with the zero, fix it, or add a line to \`tools/zeroanswer/known.go\` saying what the zero does. A STALE entry is one that no longer reproduces, and its line must go — the register only shrinks."
            else
              echo "✅ $(tail -n1 za.err 2>/dev/null || echo 'no new zero answers')"
            fi
            echo
            echo '```'
            head -60 za.out
            tail -n1 za.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # deadservice holds the call graph next to the code: Rapid Type Analysis from
  # every binary's main, against every service type the tree declares. A type
  # whose constructor is never called and not one of whose methods is reachable
  # is a feature that cannot run -- and it is the version a reader finds first.
  #
  # internal/governance/request.go is 676 lines of access-request workflow with
  # an escalation sweep, tests, and two migrations for the table only it writes.
  # NewRequestService is called nowhere; the live workflow is a different
  # implementation in workflows.go. An earlier fix in this repository spent its
  # effort on a bug inside that escalation sweep -- code that has never run.
  #
  # Nothing else in this repository could see it: it compiles, its SQL is valid
  # and carries its tenant predicate, its tests are real tests exercising real
  # code, and tablewriters counts its INSERT as a writer because a census of SQL
  # literals cannot tell a statement that runs from one that cannot.
  deadservice:
    name: Unreachable-service lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Self-test the tool first
        # A guard whose own cases do not pass has no standing to fail a build.
        run: go test -short ./tools/deadservice/

      - name: Run deadservice (hard gate)
        run: |
          set +e
          go run ./tools/deadservice -fail > ds.out 2> ds.err
          rc=$?
          set -e
          {
            echo "## deadservice — whole services no binary can reach"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "❌ **Gate failed.** A NEW finding is a service type whose constructor is never called and none of whose methods any binary reaches: it looks finished in review, it may have tests and migrations, and it cannot run. Wire it, delete it, or record the verdict in \`tools/deadservice/known.go\`. A STALE entry is one a binary reaches now, and its line must go — the register only shrinks."
            else
              echo "✅ $(tail -n1 ds.err 2>/dev/null || echo 'every service type is reachable or carries a verdict')"
            fi
            echo
            echo '```'
            head -60 ds.out
            tail -n1 ds.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # testmatrix holds this file next to the tree: every directory that contains a
  # _test.go, against every path the unit matrix above actually names.
  #
  # The matrix was a hand-written list of internal/* and pkg/. It did not name
  # cmd/, so the ten service main packages had no job — including the seven
  # *_ProductionConfigValidation tests, one per service, each being that
  # service's only automated proof that it accepts a correct production start
  # and refuses a weak one. When AUDIT_CHAIN_SECRET became required, all seven
  # went red and stayed red across several pushes with nothing on the pull
  # request to say so.
  #
  # They were not unverified — test-race runs `go test -race ./...` over the
  # whole module — but that arrives twenty minutes in under a check named "Race
  # Detector", and a red tick with that name reads as a concurrency problem, not
  # as "the config gate is broken in seven services". A signal that late and
  # that misnamed is most of the way to no signal.
  #
  # The gate also refuses to accept coverage that compiles nothing: cmd/rekey
  # sits under ./cmd/... and its only test file is behind `//go:build
  # integration`, so it had gone through CI its whole life as an empty package —
  # a 294-line proof that a KEK rotation re-seals every encrypted value while
  # leaving the plaintext readable, never once executed.
  testmatrix:
    name: Every tested package has a job
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Self-test the tool first
        # A guard whose own cases do not pass has no standing to fail a build.
        run: go test ./tools/testmatrix/

      - name: Run testmatrix (hard gate)
        run: |
          set +e
          go run ./tools/testmatrix -fail > tm.out 2> tm.err
          rc=$?
          set -e
          {
            echo "## testmatrix — packages whose tests no job runs"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "❌ **Gate failed.** A package here holds tests that no named job runs, or is covered only by a job that passes no build tag and so compiles none of them. Add it to the \`test-unit\` matrix as a \`package\`/\`paths\` pair (one entry may list several directories), or name it in the command of the job that does run it and record that in \`tools/testmatrix/known.go\`."
            else
              echo "✅ $(tail -n1 tm.out 2>/dev/null || echo 'every package holding tests is run by a named job')"
            fi
            echo
            echo '```'
            head -40 tm.out
            tail -n1 tm.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # tablewriters holds the schema next to the code: every table the migration
  # registry creates, against every table a SQL literal in the product writes.
  # A table with no writer is a measurement that cannot measure -- the Usage
  # Analytics card reads api_usage_metrics for requests, latency and error rate,
  # nothing has ever inserted a row, and all three have read 0 on every install.
  #
  # Nothing else in this repository can see it. The SQL is valid, so sqlprepare
  # passes it; the tenant predicate is there, so orgscope passes it; the handler
  # returns 200 with a well-formed body, so the contract test passes it; and
  # COUNT(*) of an empty table is 0, not an error, so nothing is logged.
  tablewriters:
    name: Unwritten-table lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Self-test the tool first
        # A guard whose own cases do not pass has no standing to fail a build.
        run: go test ./tools/tablewriters/

      - name: Run tablewriters (hard gate)
        run: |
          set +e
          go run ./tools/tablewriters -fail ./internal ./cmd ./pkg > tw.out 2> tw.err
          rc=$?
          set -e
          {
            echo "## tablewriters — tables nothing writes"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "❌ **Gate failed.** A NEW finding is a table the schema creates that no production code writes: if something reads it, the numbers it shows are zeros presented as measurements. A STALE entry is a table that has gained a writer, and its line in \`tools/tablewriters/known.go\` must go."
            else
              echo "✅ $(tail -n1 tw.err 2>/dev/null || echo 'every live table has a writer or a verdict')"
            fi
            echo
            echo '```'
            head -60 tw.out
            tail -n1 tw.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # posturevocab holds each posture check next to the operating systems it can
  # actually examine, across both clients that report posture.
  #
  # Seven of the Go engine's ten checks dispatched on runtime.GOOS with cases
  # for linux, darwin and windows and answered anything else with a warning.
  # The companion app IS anything else -- gomobile builds it as GOOS=android
  # and GOOS=ios -- and warnings did not count against compliance, so a phone
  # whose disk encryption (severity: critical) had never been examined was
  # reported COMPLIANT, in green, on its owner's home screen.
  #
  # Nothing else here could see that. The code compiles for Android; the tests
  # pass on the Linux runner, where those same checks take a real branch; the
  # JSON is well-formed; and "0 failures" is perfectly true of a device nobody
  # looked at. Only holding coverage next to platform can see it.
  posturevocab:
    name: Posture-coverage lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Self-test the tool first
        # A guard whose own cases do not pass has no standing to fail a build.
        run: go test ./tools/posturevocab/

      - name: Run posturevocab (hard gate)
        run: |
          set +e
          go run ./tools/posturevocab -fail > pv.out 2> pv.err
          rc=$?
          go run ./tools/posturevocab -census > pv.census 2>/dev/null
          set -e
          {
            echo "## posturevocab — which client checks what, where"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "❌ **Gate failed.** A NEW finding is one check_type implemented by BOTH clients for the same platform: two implementations of one word, in two languages, reporting to one column. A STALE entry is a collision that has been resolved, and its line in \`tools/posturevocab/known.go\` must go."
            else
              echo "✅ $(tail -n1 pv.err 2>/dev/null || echo 'one implementation per check per platform')"
            fi
            echo
            echo '```'
            head -40 pv.out
            tail -n1 pv.err
            echo '```'
            echo
            echo "<details><summary>Coverage matrix</summary>"
            echo
            echo '```'
            cat pv.census
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # deadconfig holds the settings an operator can set next to the settings the
  # code reads, in both directions.
  #
  # A field with a mapstructure tag, a default and a line in a shipped config
  # file, that nothing consults, is a switch the operator flips and the product
  # ignores -- ENABLE_MFA=false got you MFA, PUSH_MFA_ENABLED=false got you push
  # MFA, SMS_OTP_LENGTH=8 got you six-digit codes, and JWT_SECRET was a required
  # production secret that signed nothing.
  #
  # The mirror is the one an operator meets first: a settings table in the
  # documentation naming a variable nothing binds. The published configuration
  # reference carried 63 of them -- PASSWORD_MIN_LENGTH, the four OAUTH_*_TTL,
  # RATE_LIMIT_RPS, MAX_SESSIONS_PER_USER -- and one was misspelled, which is the
  # clearest evidence that nobody had ever tried it.
  #
  # Nothing else here can see either. The field parses, so the compiler is happy;
  # the viper default makes it non-zero, so no empty-value check fires; the docs
  # are prose; and nothing fails at runtime, because the product does what it did
  # before.
  deadconfig:
    name: Unread-config lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Self-test the tool first
        # A guard whose own cases do not pass has no standing to fail a build.
        # -short skips the whole-module half, which the gate step runs anyway.
        run: go test -short ./tools/deadconfig/

      - name: Run deadconfig (hard gate)
        run: |
          set +e
          go run ./tools/deadconfig -fail > dc.out 2> dc.err
          rc=$?
          set -e
          {
            echo "## deadconfig — settings nothing reads"
            echo
            if [ "$rc" -ne 0 ]; then
              echo "❌ **Gate failed.** A NEW finding is a field an operator can set that no production code reads: they set it, nothing changes, and nothing tells them. Give it a reader, or retire it in \`internal/common/config/retired.go\` so an operator who still sets it is told at startup what to set instead. A DOC finding is a settings table naming an environment variable nothing binds: correct the name, point the row at where the setting really lives, or delete it. A STALE entry is a field that has gained a reader, and its line in \`tools/deadconfig/known.go\` must go."
            else
              echo "✅ $(head -n1 dc.out)"
            fi
            echo
            echo '```'
            head -60 dc.out
            tail -n3 dc.err 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # Security vulnerability check
  vulnerability-check:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Go build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ env.GO_VERSION }}-
            ${{ runner.os }}-go-build-

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # The agent is a separate module with a separate pin, and it needs its own
      # toolchain rather than inheriting the root one.
      #
      # WHY, because this cost a red run. `go-version-file` reads the `go`
      # directive, not `toolchain`: root go.mod says `go 1.26.0` (with
      # `toolchain go1.26.8`), so setup-go installs 1.26.0. For the ROOT scan
      # that is harmless — the toolchain directive makes the go command re-exec
      # 1.26.8. For the agent it is not, because Go only ever switches UP: the
      # agent pins go1.25.13, 1.26.0 is newer, so no switch happens and the
      # agent was analysed against the go1.26.0 standard library. That release
      # carries 19 advisories fixed in 1.26.1 — including two crypto/x509 ones
      # the agent's own SSO path reaches — and govulncheck reported every one
      # of them. Before the toolchain commit the loose '1.26' spec happened to
      # resolve to the runner's cached 1.26.7, which is why this was green.
      # Each module is now scanned with the toolchain it actually pins.
      - name: Set up Go for the agent module
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false

      # `./...` stops at the module boundary, so this gate never looked at the
      # agent — its own module — and reported "0 reachable vulnerabilities"
      # while the agent's stdlib carried 29 the agent's own code reached. It
      # ships on endpoints, so it gets exactly the same blocking gate.
      - name: Run govulncheck (agent module)
        working-directory: agent
        run: govulncheck ./...

  # Coverage reporting with codecov
  # status-check: informational — uploads to an external service, so its
  # result depends on codecov being reachable rather than on this repository
  # being correct. The tests it summarises are required jobs in their own
  # right (test-unit, test-race).
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [detect-changes, test-unit]
    if: always() && needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage/

      - name: Merge coverage profiles
        run: |
          go install github.com/wadey/gocovmerge@latest
          find coverage -name "*.out" -type f | xargs gocovmerge > coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Frontend tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/admin-console/package-lock.json

      - name: Install dependencies
        working-directory: web/admin-console
        run: npm ci

      - name: Run linter
        working-directory: web/admin-console
        run: npm run lint

      - name: Run type check
        working-directory: web/admin-console
        run: npm run type-check

      - name: Run tests
        working-directory: web/admin-console
        run: npm test -- run --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./web/admin-console/coverage/lcov.info
          flags: frontend
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Race detector — enforces that `go test -race ./...` is clean. The test-unit
  # job runs -race per package but swallows failures with `|| true` (it exists
  # for coverage collection), so it can't catch races; this job does.
  #
  # THE TIMEOUT IS EXPLICIT ON PURPOSE, and it is the fix for a red tick that
  # said "Race Detector" and meant something else. This job failed with:
  #
  #   FAIL github.com/openidx/openidx/internal/access  600.077s
  #
  # 600s is Go's DEFAULT per-package timeout, not a race report. There was no
  # `WARNING: DATA RACE` anywhere in the log — just the panic dump `go test`
  # prints when a package runs out of time, some fifty goroutines deep, of
  # which forty-eight were parked in `testing.(*T).Parallel` behind the one
  # serial test still running. The commit it landed on changed no Go code at
  # all (two shell scripts, three workflows and a doc paragraph), and the same
  # package was green under -race on the commit before it.
  #
  # That default is calibrated for uninstrumented tests. Under -race everything
  # costs several times more, and internal/access starts a fresh Postgres
  # container per database-backed test on top of that; the same run measured
  # internal/identity at 379s and internal/admin at 283s, so the package that
  # crossed the line was simply the one closest to it. With a ten-minute bound,
  # "this runner was slow" and "this test hung" produce the identical failure,
  # and the check reports the diagnosis it did not make.
  #
  # 20m keeps a genuine hang catchable -- more than three times the slowest
  # legitimate package here -- while removing the false signal, and the job's
  # own timeout-minutes remains the outer bound. The underlying cost (a
  # container per test rather than per package) is worth attacking separately;
  # it is not what makes this check lie.
  #
  # AND IT LIED A SECOND TIME, IN MEMORY RATHER THAN IN TIME. On run 2448 this
  # job ended:
  #
  #   ok  github.com/openidx/openidx/internal/health  1.032s
  #   ##[error]The runner has received a shutdown signal.
  #   ##[error]Process completed with exit code 143.
  #
  # No FAIL, no WARNING: DATA RACE, neither timeout reached -- the runner died.
  # `./...` includes ./tools/..., and two gates there load and type-check the
  # whole module. Measured on a 4-CPU / 16 GB machine, the runner's own shape:
  # deadconfig peaks at 8.04 GB under -race, deadservice at 13.03 GB, and the
  # two together (which -p 4 permits, and which is chance, not design) reached
  # 14.22 GB before the OOM killer took both test binaries. That is why the
  # crash landed at a package boundary with no failing test near it, and why
  # the same command passes locally under -p 1.
  #
  # The fix is in the tests, not here: both skip their whole-module half when
  # the race detector is compiled in, and tools/racecost derives from `go list`
  # which test binaries must do that, so a third analyzer is named before this
  # job has to die for it. Nothing stops being proven -- the deadconfig and
  # deadservice jobs below run the same analysis uninstrumented as a hard gate
  # on every push, and both are in the Required Checks list.
  test-race:
    name: Race Detector
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race detector
        run: go test -race -timeout 20m ./...

  # The Definition of Done's §6.1 exit test, which nothing had ever run.
  #
  # scripts/smoke-test.sh has existed since long before this branch, wired to a
  # Makefile target and to no workflow, under the belief that it needed a Docker
  # daemon. It does not: what it needs is the eight services listening on their
  # ports, and building them with `go build` and starting them as processes is
  # the same harness test-integration already uses for two of them.
  #
  # Running it for the first time found two dead assertions, now fixed in the
  # script: it authenticated with a client_credentials token and expected to
  # list users, which has been a 403 since the admin API became deny-by-default
  # (the check now asserts the refusal, and does the admin work with a real
  # login); and Phase 4 needed a console to be served at all.
  #
  # Elasticsearch is deliberately absent: audit-service starts and answers
  # without it, so the smoke stack stays two dependencies rather than three.
  # Ziti, BrowZer and continuous verification are off — none is reachable from a
  # runner, and the smoke test is about the core stack coming up.
  smoke:
    name: The stack answers end to end
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true' || needs.detect-changes.outputs.frontend_changed == 'true'
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openidx
          POSTGRES_USER: openidx
          POSTGRES_PASSWORD: smoke_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openidx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://openidx:smoke_secret@localhost:5432/openidx?sslmode=disable
      REDIS_URL: redis://localhost:6379
      APP_ENV: development
      DEFAULT_ORG_FALLBACK: "true"
      DEFAULT_ORG_ID: 00000000-0000-0000-0000-000000000010
      ACCESS_SESSION_SECRET: smoke-test-access-session-secret-000
      # 32 bytes: governance-service, admin-api and access-service refuse to
      # start without a vault keyring, by design (fail-closed).
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      # Runs the audit hash-chain sealer in the smoke stack, so the startup
      # path that seals events is exercised rather than only unit-tested.
      AUDIT_CHAIN_SECRET: smoke-test-audit-chain-secret-000
      OAUTH_ISSUER: http://localhost:8006
      OAUTH_JWKS_URL: http://localhost:8006/.well-known/jwks.json
      OAUTH_LOGIN_URL: http://localhost:3000/login
      ZITI_ENABLED: "false"
      BROWZER_ENABLED: "false"
      CONTINUOUS_VERIFY_ENABLED: "false"
      OPENIDX_ENABLE_RATE_LIMIT: "false"
      GIN_MODE: release
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/admin-console/package-lock.json

      - name: Migrate the database
        run: go run ./cmd/migrate up

      - name: Build the services
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke-bin
          for s in identity-service governance-service provisioning-service \
                   audit-service admin-api oauth-service access-service gateway-service; do
            go build -o "/tmp/smoke-bin/$s" "./cmd/$s"
          done

      - name: Build the admin console
        working-directory: web/admin-console
        run: |
          npm ci
          npm run build

      - name: Start the stack
        run: |
          set -uo pipefail
          mkdir -p /tmp/smoke-logs
          for s in identity-service governance-service provisioning-service \
                   audit-service admin-api oauth-service access-service gateway-service; do
            nohup "/tmp/smoke-bin/$s" > "/tmp/smoke-logs/$s.log" 2>&1 &
            echo "$s pid=$!"
          done
          # The console is a static bundle; the smoke test only asks whether it
          # is being served, so any static server will do.
          ( cd web/admin-console/dist && nohup python3 -m http.server 3000 --bind 127.0.0.1 > /tmp/smoke-logs/console.log 2>&1 & )

      - name: Wait for the stack
        run: |
          set -uo pipefail
          for i in $(seq 1 90); do
            ready=1
            for p in 8001 8002 8003 8004 8005 8006 8007 8008 3000; do
              curl -sf "http://localhost:$p/health" >/dev/null 2>&1 || \
                { [ "$p" = "3000" ] && curl -sf "http://localhost:3000/" >/dev/null 2>&1; } || ready=0
            done
            if [ "$ready" = "1" ]; then
              echo "stack ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the stack did not come up within 90s"
          for f in /tmp/smoke-logs/*.log; do
            echo "::group::$f"; tail -40 "$f"; echo "::endgroup::"
          done
          exit 1

      - name: Run the smoke test
        env:
          GATEWAY_URL: http://localhost:8008
          OAUTH_URL: http://localhost:8006
          SMOKE_TOKEN_OUT: /tmp/smoke-admin-token
        run: make smoke-test

      # The console declares, at each api.get<{...}>() site, the response keys
      # it is going to read. tools/contractcheck diffs those declarations
      # against what the running services actually return: a key the backend
      # stopped sending is a page that renders undefined/NaN with every request
      # answering 200, which no status code and no type-check can catch.
      #
      # -local because CI has no edge router: the tool routes each path to the
      # service APISIX would forward it to. Against one base URL instead, 54 of
      # 76 endpoints answer 404 and the run reports a wall of "unverified".
      - name: Frontend/backend response shapes agree
        run: go run ./tools/contractcheck -probe -local -token-file /tmp/smoke-admin-token

      - name: Service logs
        if: always()
        run: |
          for f in /tmp/smoke-logs/*.log; do
            echo "::group::$f"; tail -60 "$f"; echo "::endgroup::"
          done

  # The Playwright suite, against a real stack.
  #
  # It had never run anywhere: no workflow invoked it, and it could not have
  # passed if one had. playwright.config.ts declared no `setup` project and no
  # storageState, and `auth.setup.ts` does not match Playwright's default
  # testMatch -- so the sign-in step never executed and every "authenticated"
  # spec ran signed out. (The specs that deliberately want no session say so
  # with `test.use({ storageState: { cookies: [], origins: [] } })`, which only
  # makes sense against an authenticated default.) The setup also typed a
  # password, `admin123`, that matches nothing; the seeded admin is Admin@123.
  #
  # CORRECTION to what this comment said before: it claimed the suite was then
  # green at 418 passed / 0 failed. It is not, and never was — that number was
  # read off a truncated tail of a local run, and the first CI run of this job
  # went red with well over a hundred failures. Running the suite for the first
  # time is what surfaced them, which is the point of running it; what was
  # wrong was the claim, not the job.
  #
  # Three of the causes were mechanical and are fixed in the specs themselves
  # (a `page.evaluate(localStorage…)` in beforeEach, which throws on the
  # about:blank a fresh page starts on; a hand-assembled `mock-signature` JWT
  # that overwrote the real session with one the backend rejects; a goto of
  # /audit/audit-dashboard, a route App.tsx does not register). What is left is
  # a long tail of specs written against a MOCKED console: fixture users no
  # seed creates, DOM shapes the components no longer have.
  #
  # So this job runs the register in web/admin-console/e2e/suite.txt, which
  # names every spec file as `run` or as `hold <reason>`. The held ones are not
  # deleted and not `test.skip`'d — `npm run test:e2e` still runs the lot — and
  # scripts/check-e2e-suite.sh (self-tested, wired into UI safety guards) fails
  # if a spec file is missing from the register, if a hold carries no reason,
  # or if a listed file is renamed away. An exclusion nobody can see is how a
  # gate stops covering things quietly; this one has to be read to be changed.
  e2e:
    name: The console's journeys work in a browser
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changed == 'true' || needs.detect-changes.outputs.frontend_changed == 'true'
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openidx
          POSTGRES_USER: openidx
          POSTGRES_PASSWORD: e2e_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openidx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://openidx:e2e_secret@localhost:5432/openidx?sslmode=disable
      REDIS_URL: redis://localhost:6379
      APP_ENV: development
      DEFAULT_ORG_FALLBACK: "true"
      DEFAULT_ORG_ID: 00000000-0000-0000-0000-000000000010
      ACCESS_SESSION_SECRET: e2e-test-access-session-secret-0000
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      OAUTH_ISSUER: http://localhost:8006
      OAUTH_JWKS_URL: http://localhost:8006/.well-known/jwks.json
      # The console IS the login UI, and the seeded admin-console client
      # registers http://localhost:3000/login -- which is why the dev server
      # binds 3000 with strictPort.
      OAUTH_LOGIN_URL: http://localhost:3000/login
      ZITI_ENABLED: "false"
      BROWZER_ENABLED: "false"
      CONTINUOUS_VERIFY_ENABLED: "false"
      OPENIDX_ENABLE_RATE_LIMIT: "false"
      GIN_MODE: release
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/admin-console/package-lock.json

      - name: Migrate the database
        run: go run ./cmd/migrate up

      - name: Build the services
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-bin
          for s in identity-service governance-service provisioning-service \
                   audit-service admin-api oauth-service access-service gateway-service; do
            go build -o "/tmp/e2e-bin/$s" "./cmd/$s"
          done

      - name: Install console dependencies
        working-directory: web/admin-console
        run: npm ci

      - name: Install Chromium
        working-directory: web/admin-console
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        run: |
          set -uo pipefail
          mkdir -p /tmp/e2e-logs
          for s in identity-service governance-service provisioning-service \
                   audit-service admin-api oauth-service access-service gateway-service; do
            nohup "/tmp/e2e-bin/$s" > "/tmp/e2e-logs/$s.log" 2>&1 &
            echo "$s pid=$!"
          done

      - name: Wait for the stack
        run: |
          set -uo pipefail
          for i in $(seq 1 90); do
            ready=1
            for p in 8001 8002 8003 8004 8005 8006 8007 8008; do
              curl -sf "http://localhost:$p/health" >/dev/null 2>&1 || ready=0
            done
            if [ "$ready" = "1" ]; then
              echo "stack ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the stack did not come up within 90s"
          for f in /tmp/e2e-logs/*.log; do
            echo "::group::$f"; tail -40 "$f"; echo "::endgroup::"
          done
          exit 1

      # PLAYWRIGHT_BASE_URL is deliberately NOT set: that is the signal for
      # playwright.config.ts to start `npm run dev` itself on :3000, so the
      # console reaches every service through Vite's proxy (which mirrors the
      # deployed edge route table) rather than sending the whole API surface to
      # one of them.
      - name: Run the browser journeys
        working-directory: web/admin-console
        run: |
          set -euo pipefail
          mapfile -t specs < <(awk '$1 == "run" { print $2 }' e2e/suite.txt)
          echo "running ${#specs[@]} registered spec file(s)"
          npx playwright test --project=chromium "${specs[@]}"
        env:
          CI: "true"

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/admin-console/playwright-report
          retention-days: 7

      - name: Service logs
        if: always()
        run: |
          for f in /tmp/e2e-logs/*.log; do
            echo "::group::$f"; tail -60 "$f"; echo "::endgroup::"
          done

  # Required status checks.
  #
  # `needs` is the ONLY list. It used to be written twice — once here and once
  # as a hand-maintained bash array below — and the two had drifted: the array
  # named seven jobs, so test-frontend and every guard job this repository has
  # added since (first-run, ui-safety-guards, selfheal, shell-prose,
  # ci-resilience-guards, fault-matrix, field-fix-scoreboard,
  # no-internal-topology, github-config) could go red without Required Checks
  # noticing. The loop below now walks toJSON(needs), so adding a job to
  # `needs` is the whole change, and scripts/check-required-checks.sh fails the
  # build if a job in this workflow is in neither `needs` nor the informational
  # register.
  status-check:
    name: Required Checks
    needs:
      - build-matrix
      - ci-resilience-guards
      - deadconfig
      - deadservice
      - detect-changes
      - e2e
      - fault-matrix
      - field-fix-scoreboard
      - first-run
      - github-config
      - inerttests
      - lint
      - no-internal-topology
      - orgscope
      - posturevocab
      - routereach
      - selfheal
      - shell-prose
      - smoke
      - tablewriters
      - test-frontend
      - test-integration
      - test-race
      - test-unit
      - testmatrix
      - ui-safety-guards
      - vulnerability-check
      - zeroanswer
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check all required jobs passed
        env:
          # The results of every job in `needs`, as {"job": {"result": ...}}.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # A gated job that detect-changes skipped (e.g. a docs-only or
          # frontend-only PR where go_changed=false) reports result
          # "skipped", which is a PASS for the gate — not a failure. Only
          # genuine "failure" / "cancelled" results should block. Treating
          # "skipped" as failure (the old behavior) made Required Checks
          # red on every PR that didn't touch Go code, defeating the
          # change-detection optimization entirely.
          failed=0
          checked=0
          while IFS=$'\t' read -r name result; do
            checked=$((checked + 1))
            case "$result" in
              success|skipped) ;;
              *) echo "Required check '$name' did not pass: $result"; failed=1 ;;
            esac
          done < <(printf '%s' "$NEEDS" | jq -r 'to_entries | sort_by(.key)[] | "\(.key)\t\(.value.result // "missing")"')
          if [[ "$checked" -eq 0 ]]; then
            # An empty needs object means the expression did not expand —
            # passing on zero checks is exactly the silent hole this job is
            # supposed to close.
            echo "No job results to check: the needs list did not expand"
            exit 1
          fi
          if [[ "$failed" -ne 0 ]]; then
            echo "Required checks failed"
            exit 1
          fi
          echo "All $checked required checks passed (success or skipped)"
