name: OIDC conformance

# The OpenID Foundation conformance suite against an OpenIDX stack started in
# CI, nightly and on demand (#958). Four certification plans run:
# Basic OP, Config OP, RP-Initiated Logout OP and Back-Channel Logout OP. The
# plan list is test/conformance/plans.txt; docs/OAUTH-OIDC.md ("Conformance
# testing") explains the setup, the results and how to run it locally.
#
# THE STACK is started the way ci.yml's smoke job ("The stack answers end to
# end") starts it: Postgres and Redis as service containers, the eight
# services built with `go build` and run as processes. Two things differ, and
# both are what the suite needs: the issuer is https://op.openidx.test, served
# by an nginx front (test/conformance/compose.yml) that also serves the login
# page, and oauth-service trusts this run's throwaway CA so it can deliver
# back-channel logout tokens to the suite over TLS.
#
# THE SUITE runs from the release pinned in test/conformance/suite.env: its
# images by digest (compose.yml), its runner scripts by commit.
#
# RESULTS. The runner's exit code decides whether the job is red: any failure,
# warning or skip that no dated entry in test/conformance/waivers/ covers,
# any waiver that matched nothing, or a module that did not finish. The
# summary goes on the run page, and the per-module logs are uploaded with the
# run's generated secrets removed. On main, the report job opens or updates
# ONE tracking issue while the run fails, and closes it when a run passes.
#
# PERMISSIONS. Read-only for the workflow. Only the report job can write, and
# only to issues; it checks out nothing and runs no repository code.
#
# The actions are pinned to commits, as display-equals-enforcement.yml's are.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oidc-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: Basic, Config, RP-Initiated and Back-Channel Logout OP
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openidx
          POSTGRES_USER: openidx
          POSTGRES_PASSWORD: conformance_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openidx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # The smoke job's environment, with the issuer and the login page moved
    # behind the HTTPS front. These values configure a throwaway stack that
    # exists for the length of this job.
    env:
      DATABASE_URL: postgres://openidx:conformance_secret@localhost:5432/openidx?sslmode=disable
      REDIS_URL: redis://localhost:6379
      APP_ENV: development
      DEFAULT_ORG_FALLBACK: "true"
      DEFAULT_ORG_ID: 00000000-0000-0000-0000-000000000010
      ACCESS_SESSION_SECRET: conformance-access-session-secret-00
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      AUDIT_CHAIN_SECRET: conformance-audit-chain-secret-0000
      OAUTH_ISSUER: https://op.openidx.test
      OAUTH_JWKS_URL: http://localhost:8006/.well-known/jwks.json
      OAUTH_LOGIN_URL: https://op.openidx.test/login
      ZITI_ENABLED: "false"
      BROWZER_ENABLED: "false"
      CONTINUOUS_VERIFY_ENABLED: "false"
      OPENIDX_ENABLE_RATE_LIMIT: "false"
      GIN_MODE: release
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the suite pin
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          . test/conformance/suite.env
          for image in registry.gitlab.com/openid/conformance-suite registry.gitlab.com/openid/conformance-suite/nginx; do
            if ! grep -qF "image: ${image}:${CONFORMANCE_SUITE_TAG}@sha256:" test/conformance/compose.yml; then
              echo "::error::compose.yml does not pin ${image}:${CONFORMANCE_SUITE_TAG} by digest; it and suite.env disagree"
              exit 1
            fi
          done
          {
            echo "CONFORMANCE_SUITE_TAG=$CONFORMANCE_SUITE_TAG"
            echo "CONFORMANCE_SUITE_COMMIT=$CONFORMANCE_SUITE_COMMIT"
            echo "CONFORMANCE_TLS_DIR=$RUNNER_TEMP/conformance-tls"
            echo "CONFORMANCE_RESULTS=$RUNNER_TEMP/conformance-results"
          } >>"$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Migrate the database
        run: go run ./cmd/migrate up

      - name: Build the services
        run: |
          set -euo pipefail
          mkdir -p /tmp/conformance-bin
          for s in identity-service governance-service provisioning-service \
                   audit-service admin-api oauth-service access-service gateway-service; do
            go build -o "/tmp/conformance-bin/$s" "./cmd/$s"
          done

      # A CA and certificate for this run only, and the two host names mapped to
      # this machine so the host resolves them the way the suite's containers do.
      - name: Make the TLS material and map the host names
        run: |
          set -euo pipefail
          bash test/conformance/gen-certs.sh "$CONFORMANCE_TLS_DIR"
          echo "127.0.0.1 op.openidx.test localhost.emobix.co.uk" | sudo tee -a /etc/hosts >/dev/null

      - name: Start the stack
        run: |
          set -uo pipefail
          mkdir -p /tmp/conformance-logs
          # SSL_CERT_FILE: the system roots plus this run's CA. oauth-service
          # needs it to deliver logout tokens to the suite; for the others it
          # changes nothing.
          export SSL_CERT_FILE="$CONFORMANCE_TLS_DIR/ca-bundle.pem"
          for s in identity-service governance-service provisioning-service \
                   audit-service admin-api oauth-service access-service gateway-service; do
            nohup "/tmp/conformance-bin/$s" > "/tmp/conformance-logs/$s.log" 2>&1 &
            echo "$s pid=$!"
          done

      - name: Wait for the stack
        run: |
          set -uo pipefail
          for i in $(seq 1 90); do
            ready=1
            for p in 8001 8002 8003 8004 8005 8006 8007 8008; do
              curl -sf "http://localhost:$p/health" >/dev/null 2>&1 || ready=0
            done
            if [ "$ready" = "1" ]; then
              echo "stack ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the stack did not come up within 90s"
          for f in /tmp/conformance-logs/*.log; do
            echo "::group::$f"; tail -40 "$f"; echo "::endgroup::"
          done
          exit 1

      - name: Start the conformance suite and the HTTPS front
        run: |
          set -euo pipefail
          bash scripts/ci-retry.sh 3 10 -- docker compose -f test/conformance/compose.yml pull --quiet
          docker compose -f test/conformance/compose.yml up -d

      - name: Wait for the suite and the HTTPS front
        run: |
          set -uo pipefail
          ca="$CONFORMANCE_TLS_DIR/ca.crt"
          for i in $(seq 1 120); do
            if curl -sf --cacert "$ca" https://localhost.emobix.co.uk:8443/api/runner/available >/dev/null 2>&1 &&
               curl -sf --cacert "$ca" https://op.openidx.test/.well-known/openid-configuration >/dev/null 2>&1; then
              issuer="$(curl -sf --cacert "$ca" https://op.openidx.test/.well-known/openid-configuration | jq -r .issuer)"
              if [ "$issuer" != "$OAUTH_ISSUER" ]; then
                echo "::error::discovery through the front names issuer $issuer, not $OAUTH_ISSUER"
                exit 1
              fi
              echo "suite and HTTPS front ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the conformance suite or the HTTPS front did not come up within 240s"
          docker compose -f test/conformance/compose.yml ps
          docker compose -f test/conformance/compose.yml logs --no-color --tail 60
          exit 1

      - name: Fetch the suite's runner at the pinned commit
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/conformance-suite"
          bash scripts/ci-retry.sh 3 10 -- bash -c \
            'rm -rf "$1" && git clone --quiet --depth 1 --branch "$2" https://gitlab.com/openid/conformance-suite.git "$1"' \
            _ "$dir" "$CONFORMANCE_SUITE_TAG"
          got="$(git -C "$dir" rev-parse HEAD)"
          if [ "$got" != "$CONFORMANCE_SUITE_COMMIT" ]; then
            echo "::error::$CONFORMANCE_SUITE_TAG is $got, not the pinned $CONFORMANCE_SUITE_COMMIT"
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/conformance-venv"
          bash scripts/ci-retry.sh 3 10 -- "$RUNNER_TEMP/conformance-venv/bin/pip" install --quiet \
            --require-hashes -r test/conformance/requirements.txt
          echo "CONFORMANCE_SUITE_DIR=$dir" >>"$GITHUB_ENV"

      # Creates one user per plan and the plans' static clients through the
      # admin APIs, and renders the plan configurations. Every generated secret
      # is masked in this log before anything else is printed.
      - name: Register the test users and clients
        run: |
          set -euo pipefail
          python3 test/conformance/setup_openidx.py \
            --out "$RUNNER_TEMP/conformance-plans" \
            --secrets-file "$RUNNER_TEMP/conformance-secrets.txt"

      - name: Run the conformance plans
        id: plans
        continue-on-error: true
        env:
          PYTHON: ${{ runner.temp }}/conformance-venv/bin/python
        run: bash test/conformance/run-plans.sh "$CONFORMANCE_SUITE_DIR" "$RUNNER_TEMP/conformance-plans" "$CONFORMANCE_RESULTS"

      - name: Summarize the results
        if: always()
        env:
          PLANS_OUTCOME: ${{ steps.plans.outcome }}
        run: |
          set -uo pipefail
          results="${CONFORMANCE_RESULTS:-$RUNNER_TEMP/conformance-results}"
          mkdir -p "$results"
          python3 test/conformance/summarize.py \
            --out "$results" \
            --cafile "${CONFORMANCE_TLS_DIR:-}/ca.crt" \
            --runner-outcome "$PLANS_OUTCOME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat "$results/summary.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Collect the logs and remove the run's secrets
        if: always()
        run: |
          set -uo pipefail
          results="${CONFORMANCE_RESULTS:-$RUNNER_TEMP/conformance-results}"
          mkdir -p "$results/logs"
          cp /tmp/conformance-logs/*.log "$results/logs/" 2>/dev/null || true
          if [ -n "${CONFORMANCE_TLS_DIR:-}" ]; then
            for svc in server nginx edge mongodb; do
              docker compose -f test/conformance/compose.yml logs --no-color --tail 3000 "$svc" \
                >"$results/logs/suite-$svc.log" 2>&1 || true
            done
          fi
          python3 test/conformance/redact.py --secrets-file "$RUNNER_TEMP/conformance-secrets.txt" "$results"

      - name: Keep the summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: oidc-conformance-summary
          path: |
            ${{ runner.temp }}/conformance-results/results.json
            ${{ runner.temp }}/conformance-results/summary.md
            ${{ runner.temp }}/conformance-results/issue.md
          if-no-files-found: warn
          retention-days: 30

      - name: Keep the results and logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: oidc-conformance-results
          path: ${{ runner.temp }}/conformance-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when a plan did not pass
        if: steps.plans.outcome != 'success'
        env:
          PLANS_OUTCOME: ${{ steps.plans.outcome }}
        run: |
          echo "::error::The conformance plans did not pass (outcome: $PLANS_OUTCOME). The summary is on this run's page; the logs are in the oidc-conformance-results artifact."
          exit 1

  # The only job that can write, and only to issues. It reads the summary the
  # job above uploaded and runs no repository code. Runs on main only: a
  # manual run on a branch says nothing about main.
  report:
    name: Open, update or close the tracking issue
    needs: conformance
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # gh issue create / edit / comment / reopen / close
    steps:
      - name: Fetch the summary
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oidc-conformance-summary
          path: summary

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          JOB_RESULT: ${{ needs.conformance.result }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "OIDC conformance: the nightly run is failing"
        run: |
          set -euo pipefail
          status="no summary"
          if [ "$FETCH_OUTCOME" = "success" ] && [ -f summary/results.json ]; then
            status="$(jq -r '.status' summary/results.json)"
          fi
          failing=1
          if [ "$JOB_RESULT" = "success" ] && [ "$status" = "passed" ]; then
            failing=0
          fi

          # One issue, found by its exact title, open or closed.
          found="$(gh issue list --state all --search "in:title \"$TITLE\"" --limit 20 \
            --json number,state,title \
            --jq '[.[] | select(.title == env.TITLE)] | sort_by(.number) | last // empty | "\(.number) \(.state)"')"
          number="${found%% *}"
          state="${found#* }"

          if [ "$failing" -eq 1 ]; then
            body="$RUNNER_TEMP/issue.md"
            if [ "$FETCH_OUTCOME" = "success" ] && [ -s summary/issue.md ]; then
              cp summary/issue.md "$body"
            else
              printf 'The nightly OpenID conformance run did not produce a summary (job result: %s). See %s.\n' \
                "$JOB_RESULT" "$RUN_URL" >"$body"
            fi
            if [ -z "$number" ]; then
              gh issue create --title "$TITLE" --body-file "$body"
            else
              if [ "$state" = "CLOSED" ]; then
                gh issue reopen "$number"
              fi
              gh issue edit "$number" --body-file "$body"
              gh issue comment "$number" --body "The nightly run failed ($status, job $JOB_RESULT): $RUN_URL"
            fi
          elif [ -n "$number" ] && [ "$state" = "OPEN" ]; then
            gh issue comment "$number" --body "The nightly run passed: every module passed or matched a dated waiver. $RUN_URL"
            gh issue close "$number" --reason completed
          else
            echo "The run passed and no tracking issue is open."
          fi
