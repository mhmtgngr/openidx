name: client-desktop-build

# Verifies the Flutter desktop client (client/) against the Flutter SDK:
# materializes the SDK-generated platform runners, then analyzes, tests, and
# builds on macOS, Linux, and Windows. The runner directories (macos/, linux/,
# windows/) are intentionally not committed — they are generated here.

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-desktop-build.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-desktop-build.yml"
  workflow_dispatch:

concurrency:
  group: client-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            build_target: macos
          - os: ubuntu-latest
            platform: linux
            build_target: linux
          - os: windows-latest
            platform: windows
            build_target: windows

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux desktop toolchain required by `flutter build linux`. GTK + ninja +
      # clang are the SDK's own baseline; libsecret and jsoncpp are what the
      # plugins pull in -- flutter_secure_storage_linux's CMakeLists does
      # `pkg_check_modules(REQUIRED libsecret-1>=0.18.4)` and `jsoncpp`, and
      # without the -dev packages CMake stops at "The following required
      # packages were not found" before a single object is compiled.
      - name: Install Linux desktop build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config \
            libsecret-1-dev libjsoncpp-dev
        working-directory: ${{ github.workspace }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable desktop
        run: flutter config --enable-${{ matrix.platform }}-desktop

      # Materialize the SDK-generated runner directory for this OS (not committed).
      - name: Materialize platform runner
        run: flutter create --platforms=${{ matrix.platform }} .

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Placeholder: bundle the openidx-agent sidecar binary into the app
      # payload here (download the Phase 0 release artifact for this OS/arch and
      # copy it next to the built executable, or into the app's bin/ directory,
      # so the supervisor can spawn it). Left as a no-op for the scaffold.
      - name: Bundle openidx-agent sidecar (placeholder)
        # Block scalar, not a plain one: `run: echo "TODO: ...` is invalid YAML
        # (a plain scalar may not contain ": "), and GitHub answered by failing
        # the whole workflow before it scheduled a single job -- a run with no
        # jobs, named after the file, red on every push since #814. Nothing was
        # building the desktop client and the red check said nothing about why.
        run: |
          echo "TODO: fetch + stage openidx-agent sidecar for ${{ matrix.platform }}"

      - name: Build
        run: flutter build ${{ matrix.build_target }} --release

      # Success only. Under `if: always()` a failed configure still matched the
      # glob and published a 114 MB half-built tree under the same name a real
      # build gets -- an artifact that looks shippable and is not.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openidx-client-${{ matrix.platform }}
          path: |
            client/build/${{ matrix.platform }}/**/Release/**
            client/build/${{ matrix.platform }}/**/release/**
          if-no-files-found: ignore
          retention-days: 7
