name: Scorecard

# OpenSSF Scorecard (#959). Scorecard checks the repository's supply-chain
# practices: branch protection, pinned actions, token permissions, signed
# releases, and others. This workflow uploads its findings to code scanning
# and publishes the result to the OpenSSF API. The README badge reads that
# published result, so the badge shows nothing until this workflow has run
# once on main.
#
# This is the upstream recommended configuration. ossf/scorecard-action's
# README names ossf/scorecard's .github/workflows/scorecard-analysis.yml as
# the current example. GitHub's starter workflow for Scorecard adds the
# branch_protection_rule trigger. The actions are pinned to the commits of
# the tags that example names, as renovate.json's pinDigests asks.
#
# publish_results: true makes the OpenSSF API check this file before it
# accepts a result. A change that breaks one of these rules fails the
# "Run analysis" step:
#   - no top-level `env` or `defaults`, and no write permission at the
#     workflow level;
#   - only the job that runs ossf/scorecard-action may hold id-token: write;
#   - that job has no `env`, `defaults`, `container` or `services`, and runs
#     on a GitHub-hosted Ubuntu runner;
#   - its steps use only actions/checkout, actions/upload-artifact,
#     github/codeql-action/upload-sarif, ossf/scorecard-action and
#     step-security/harden-runner. A `run:` step is not allowed.
# The rules are listed at
# https://github.com/ossf/scorecard-action#workflow-restrictions.
#
# The Branch-Protection check reads repository rulesets with the default
# GITHUB_TOKEN. It cannot read classic branch protection rules without a
# fine-grained token (`repo_token`), which this workflow does not use.

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Refreshes the Maintained check, and the published result, every week.
  schedule:
    - cron: '27 5 * * 1' # Mondays at 05:27 UTC
  push:
    branches: [main]

# Read-only for every job unless the job asks for more.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to code scanning.
      security-events: write
      # Sign the published result with the GitHub OIDC token.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF REST API. The README badge needs this.
          publish_results: true

      # Keeps the SARIF on the run page for five days, for anyone debugging a
      # result without access to code scanning.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
