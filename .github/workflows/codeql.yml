name: CodeQL Analysis

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 06:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # A pull request analyses only the languages it changes (#967). Pushes to
  # main and dev and the weekly schedule analyse both, so main's alerts stay
  # complete. A skipped analysis reports "skipped", which a required check
  # accepts.
  changes:
    name: Code changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.changes.outputs.go }}
      javascript: ${{ steps.changes.outputs.javascript }}
    steps:
      # Full history: the diff below compares two arbitrary commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect what changed
        id: changes
        run: |
          # Only a pull request is filtered. A push, a tag, a schedule or a
          # manual run always runs everything, as does a diff base that
          # cannot be resolved: over-running is safe, under-running is not.
          if [[ "${{ github.event_name }}" != "pull_request" ]] ||
             ! git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}" 2>/dev/null; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "javascript=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          # A change to this workflow re-runs both.
          if echo "$files" | grep -qE '\.(go|mod|sum)$|^\.github/workflows/codeql\.yml$'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '\.(js|jsx|ts|tsx|mjs|cjs)$|^web/|^\.github/workflows/codeql\.yml$'; then
            echo "javascript=true" >> "$GITHUB_OUTPUT"
          else
            echo "javascript=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-go:
    name: Analyze Go
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # No config-file here, and specifically no `paths-ignore`. This branch
      # tried one, to drop the nine `go/incorrect-integer-conversion` results
      # in the vendored `agent/third_party/gopsutil` tree, and the run that
      # followed it produced all nine anyway: a Go database is whatever the
      # build compiled, and the agent compiles that package, so a path filter
      # in the config cannot remove it. The filter is honoured for interpreted
      # languages only. A config that says it excludes a tree and does not is
      # the exact thing this branch spent itself deleting, so it is gone --
      # those nine carry a written verdict in docs/evidence/codeql-triage.md
      # and a dismissal in the code-scanning UI instead. If you reach for a
      # config-file to quieten a Go alert, read that file first.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:go'

      # The results check can fail a PR while this job is green: it fails on a
      # single alert with a security severity of 7.0 or higher, and names only
      # a count. The SARIF that would name the rule is on disk here and was
      # being thrown away with the runner. Print it. Diagnostic only -- the
      # gate is the code-scanning check, and this step never fails the build.
      - name: What CodeQL found
        if: always()
        run: bash scripts/codeql-alert-summary.sh "${GITHUB_WORKSPACE}/../results"

  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    needs: [changes]
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

      - name: What CodeQL found
        if: always()
        run: bash scripts/codeql-alert-summary.sh "${GITHUB_WORKSPACE}/../results"
