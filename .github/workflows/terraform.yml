name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'deployments/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deployments/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the runs of the one before it.
# Those runs' results are not what the PR is reviewed on, and with this
# repository's ~20 concurrent jobs they hold runners the new head needs.
# Every other event (a push to main, dev or a tag, a schedule, a manual run)
# gets a group of its own (run_id), so it is never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: fmt & validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - deployments/terraform
          - deployments/terraform/bootstrap
          # Edge (global-scale plan task 1.1): the root selects the provider
          # and exercises all three modules, which also covers edge-aws (it
          # needs the root's aliased us-east-1 provider). The two modules that
          # validate standalone are checked on their own as well.
          - deployments/terraform/edge
          - deployments/terraform/modules/edge-cloudflare
          - deployments/terraform/modules/edge-azure
          # The Azure root and the four data-plane modules were never in this
          # matrix. Validated standalone for the first time on 2026-09-18, two
          # of them were broken: openziti's and audit-service's `set {}` blocks
          # are the helm 2.x provider syntax and neither module pinned a
          # provider (they only ever validated through the root, which does),
          # audit-service defined `production_safe` twice, and its ConfigMap
          # wrote label keys with dots unquoted, which HCL reads as a resource
          # reference. No root calls audit-service, so no job had ever parsed
          # it. A directory that no
          # job validates is a directory whose next edit is checked by whoever
          # runs `terraform apply`.
          - deployments/terraform/azure
          - deployments/terraform/modules/rds
          - deployments/terraform/modules/elasticache
          - deployments/terraform/modules/openziti
          - deployments/terraform/modules/audit-service
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}

      # -backend=false installs providers/modules without touching the real
      # S3 backend, so validate runs without AWS credentials.
      #
      # Retried for the same reason `helm dependency build` is (scripts/
      # ci-retry.sh): this step downloads provider binaries from someone else's
      # CDN, and it has died with
      #   Error while installing cloudflare/cloudflare v4.52.9: ...
      #   read tcp ...:443: read: connection reset by peer
      # on a commit that touched no Terraform. Nothing in this repository can
      # make that CDN answer, and ci-retry.sh still exits with terraform's own
      # status once it gives up -- a slower red, never a false green.
      - name: Init (no backend)
        run: bash "${{ github.workspace }}/scripts/ci-retry.sh" 3 5 -- terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}
