name: Release

on:
  push:
    tags: ['v*']
  # Dispatchable path for environments that cannot push tags (e.g. remote
  # sessions with branch-scoped git credentials): the release action below
  # creates the tag at the chosen commit when it doesn't exist yet.
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.16.0)"
        required: true

permissions:
  contents: write
  packages: write
  # Keyless cosign signing: the job's GitHub OIDC token is exchanged for a
  # short-lived Sigstore certificate, so there is no signing key to store.
  id-token: write

env:
  # Tag being released: the pushed tag, or the dispatch input.
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version input
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            echo "::error::version must look like v1.2.3, got '$RELEASE_VERSION'"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Build Linux binaries
        run: |
          for service in identity-service governance-service provisioning-service audit-service gateway-service admin-api oauth-service access-service; do
            GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=${RELEASE_VERSION} -X main.CommitHash=$(git rev-parse --short HEAD)" \
              -o dist/${service}-linux-amd64 ./cmd/$service
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # One keyless signature over SHA256SUMS covers every binary: verify the
      # signature, then verify each binary against the checksum file. The
      # certificate pins this workflow's identity, so a signature minted
      # anywhere else fails verification.
      - name: Sign checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          generate_release_notes: true
          append_body: true
          body: |
            ### Verify the binaries

            ```sh
            cosign verify-blob \
              --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@' \
              SHA256SUMS
            sha256sum --ignore-missing -c SHA256SUMS
            ```
          files: dist/*
