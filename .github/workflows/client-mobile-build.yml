name: client-mobile-build

# Verifies the Phase-2b Flutter MOBILE client: builds the gomobile engine
# bindings from ./agent/mobile, wires them into the openidx_engine plugin,
# materializes the SDK platform runners (`flutter create`), then analyzes,
# tests, and builds for Android + iOS. Nothing here is built in the repo
# checkout — this workflow is the source of truth that the code compiles.

on:
  push:
    branches: ["**"]
    paths:
      - "client/**"
      - "agent/**"
      - ".github/workflows/client-mobile-build.yml"
      - "scripts/ci-prime-cocoapods.sh"
      - "scripts/ci-retry.sh"
  pull_request:
    paths:
      - "client/**"
      - "agent/**"
      - ".github/workflows/client-mobile-build.yml"
      - "scripts/ci-prime-cocoapods.sh"
      - "scripts/ci-retry.sh"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"
  # Tracks agent/go.mod, which pins `toolchain go1.25.13` -- NOT the root
  # module's go1.26; nothing here builds the root module, gomobile binds
  # ./agent/mobile only. `1.25.x` resolves to the latest 1.25 patch, so it
  # satisfies that toolchain floor. Keep the two decoupled, and raise this only
  # for a reason: the stdlib advisories the agent reached are all fixed inside
  # the 1.25 line, which the toolchain pin guarantees, so 1.26 buys nothing
  # here today. The link failure that used to make it costly is fixed --
  # go1.26's darwin resolver pulls libresolv (_res_9_ninit and friends) into
  # the gomobile static framework, and the openidx_engine podspec now links it
  # -- so a future move is a version bump, not an investigation.
  GO_VERSION: "1.25.x"

# A newer push to a pull request supersedes the runs of the one before it.
# Those runs' results are not what the PR is reviewed on, and with this
# repository's ~20 concurrent jobs they hold runners the new head needs.
# Every other event (a push to main, dev or a tag, a schedule, a manual run)
# gets a group of its own (run_id), so it is never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Build the Android engine.aar with gomobile and upload it as an artifact.
  # ---------------------------------------------------------------------------
  gomobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v4 with an explicit package list, the shape ci-android.yml already
      # uses. v3 with no list asks sdkmanager for the legacy `tools` package,
      # which the SDK repository stopped offering: on 2026-09-18 this job died
      # in setup with "Failed to find package 'tools'" before a single build
      # step ran, on a commit that changed only a version number.
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            ndk;26.1.10909125

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250606033058-a2a15c67f36f
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250606033058-a2a15c67f36f
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init

      - name: Build engine.aar
        # Must run inside the agent module (its go.mod requires golang.org/x/mobile);
        # from the repo root, gobind can't resolve x/mobile/bind for ./agent/mobile.
        working-directory: agent
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: gomobile bind -target=android -androidapi 21 -ldflags=-checklinkname=0 -o ../engine.aar ./mobile

      - uses: actions/upload-artifact@v4
        with:
          name: engine-aar
          path: engine.aar

  # ---------------------------------------------------------------------------
  # Build the iOS Engine.xcframework with gomobile (macOS runner).
  # ---------------------------------------------------------------------------
  gomobile-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250606033058-a2a15c67f36f
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250606033058-a2a15c67f36f
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init

      - name: Build Engine.xcframework
        # Run inside the agent module (see the android job for why).
        working-directory: agent
        run: gomobile bind -target=ios -ldflags=-checklinkname=0 -o ../Engine.xcframework ./mobile

      - name: Zip framework (preserve symlinks)
        run: zip -ry Engine.xcframework.zip Engine.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: engine-xcframework
          path: Engine.xcframework.zip

  # ---------------------------------------------------------------------------
  # Analyze + test (no native artifact required for the pure-Dart test suite).
  # ---------------------------------------------------------------------------
  flutter-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Materialize platform runners
        working-directory: client
        run: flutter create --platforms=ios,android --project-name openidx_client .

      # `flutter create` regenerates ios/ from Flutter's template on every job,
      # and that template has no CFBundleURLTypes -- so without this the build
      # cannot receive openidx://oauth-callback and the login never completes on
      # the device. scripts/check-ios-deeplink-config.sh fails CI if a new
      # iOS-materializing job forgets it.
      - name: Register the iOS URL scheme
        run: bash scripts/ci-configure-ios-deeplinks.sh

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze

      - name: Test
        working-directory: client
        run: flutter test

  # ---------------------------------------------------------------------------
  # Full Android APK build with the real engine.aar linked in.
  # ---------------------------------------------------------------------------
  build-android:
    needs: gomobile-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download engine.aar
        uses: actions/download-artifact@v4
        with:
          name: engine-aar
          path: client/plugins/openidx_engine/android/libs

      - name: Materialize platform runners
        working-directory: client
        run: flutter create --platforms=ios,android --project-name openidx_client .

      # `flutter create` regenerates ios/ from Flutter's template on every job,
      # and that template has no CFBundleURLTypes -- so without this the build
      # cannot receive openidx://oauth-callback and the login never completes on
      # the device. scripts/check-ios-deeplink-config.sh fails CI if a new
      # iOS-materializing job forgets it.
      - name: Register the iOS URL scheme
        run: bash scripts/ci-configure-ios-deeplinks.sh

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      # Every runner generated its own ~/.android/debug.keystore, so each build
      # was signed with a different key and could not update the app already on
      # a phone (INSTALL_FAILED_UPDATE_INCOMPATIBLE): every test build meant an
      # uninstall, which drops the sign-in and the push registration with it.
      # ANDROID_DEBUG_KEYSTORE_B64 pins one debug key (alias androiddebugkey,
      # store and key password "android", Gradle's debug defaults) for every
      # build. Without the secret the build still runs, with a fresh key.
      - name: Pin the debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is not set: this APK is signed with a fresh debug key and cannot update an installed build"
            exit 0
          fi
          # Dropping the file at ~/.android/debug.keystore did not take: the
          # APKs still carried fresh keys. Gradle is told instead, through an
          # init script, exactly which keystore, alias and passwords the debug
          # signing config uses, so the generated build.gradle.kts stays
          # untouched and no default path is relied on.
          ks="$RUNNER_TEMP/pinned-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$ks"
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/pin-debug-key.gradle <<GRADLE
          allprojects {
              // During evaluation, as soon as the Android plugin has created
              // the debug signing config: in afterEvaluate AGP has already
              // read it and refuses the change.
              plugins.withId('com.android.application') {
                  def debug = android.signingConfigs.getByName('debug')
                  debug.storeFile = file('$ks')
                  debug.storeType = 'pkcs12'
                  debug.storePassword = 'android'
                  debug.keyAlias = 'androiddebugkey'
                  debug.keyPassword = 'android'
              }
          }
          GRADLE
          cert=$(openssl pkcs12 -in "$ks" -passin pass:android -nokeys \
                   | openssl x509 -outform DER | sha256sum | cut -d' ' -f1)
          echo "PINNED_DEBUG_CERT=$cert" >> "$GITHUB_ENV"
          echo "debug signing pinned through ~/.gradle/init.d/pin-debug-key.gradle"

      - name: Build APK
        working-directory: client
        run: flutter build apk --debug

      # The build succeeds with any key, so a pin that did not take is only
      # found when a phone refuses the update. Read the signer out of the APK.
      - name: Verify the APK carries the pinned key
        if: env.PINNED_DEBUG_CERT != ''
        run: python3 scripts/apk-signer-cert.py client/build/app/outputs/flutter-apk/app-debug.apk --expect "$PINNED_DEBUG_CERT"

      - uses: actions/upload-artifact@v4
        with:
          name: openidx-android-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk

  # ---------------------------------------------------------------------------
  # Full iOS build (no code signing) with the real Engine.xcframework linked.
  # ---------------------------------------------------------------------------
  build-ios:
    needs: gomobile-ios
    # macos-15 (Xcode 16). The original reason was firebase-ios-sdk needing
    # Swift 6; that dependency is gone (push-MFA delivers over ntfy), but the
    # runner stays current rather than pinned backwards to macos-14.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download Engine.xcframework
        uses: actions/download-artifact@v4
        with:
          name: engine-xcframework
          path: client/plugins/openidx_engine/ios/Frameworks

      - name: Unzip framework
        working-directory: client/plugins/openidx_engine/ios/Frameworks
        run: |
          unzip -q Engine.xcframework.zip
          rm Engine.xcframework.zip

      - name: Materialize platform runners
        working-directory: client
        run: flutter create --platforms=ios,android --project-name openidx_client .

      # `flutter create` regenerates ios/ from Flutter's template on every job,
      # and that template has no CFBundleURLTypes -- so without this the build
      # cannot receive openidx://oauth-callback and the login never completes on
      # the device. scripts/check-ios-deeplink-config.sh fails CI if a new
      # iOS-materializing job forgets it.
      - name: Register the iOS URL scheme
        run: bash scripts/ci-configure-ios-deeplinks.sh

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      # Before the build, not during it: see scripts/ci-prime-cocoapods.sh.
      - name: Prime the CocoaPods spec source
        run: bash scripts/ci-prime-cocoapods.sh

      - name: Build iOS (no codesign)
        working-directory: client
        run: flutter build ios --no-codesign --debug
