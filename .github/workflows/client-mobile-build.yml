name: client-mobile-build

# Verifies the Phase-2b Flutter MOBILE client: builds the gomobile engine
# bindings from ./agent/mobile, wires them into the openidx_engine plugin,
# materializes the SDK platform runners (`flutter create`), then analyzes,
# tests, and builds for Android + iOS. Nothing here is built in the repo
# checkout — this workflow is the source of truth that the code compiles.

on:
  push:
    branches: ["**"]
    paths:
      - "client/**"
      - "agent/**"
      - ".github/workflows/client-mobile-build.yml"
  pull_request:
    paths:
      - "client/**"
      - "agent/**"
      - ".github/workflows/client-mobile-build.yml"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"
  # Tracks agent/go.mod, which pins `toolchain go1.25.13` -- NOT the root
  # module's go1.26; nothing here builds the root module, gomobile binds
  # ./agent/mobile only. `1.25.x` resolves to the latest 1.25 patch, so it
  # satisfies that toolchain floor. Keep the two decoupled: go1.26's darwin
  # resolver pulls libresolv (_res_9_ninit and friends) into the gomobile
  # static framework, and the Xcode app target links no -lresolv, so
  # `flutter build ios` fails with undefined symbols. Raising this needs that
  # link flag added to the openidx_engine podspec first -- and there is no
  # security reason to: the stdlib advisories the agent reached are all fixed
  # inside the 1.25 line, which the toolchain pin now guarantees.
  GO_VERSION: "1.25.x"

jobs:
  # ---------------------------------------------------------------------------
  # Build the Android engine.aar with gomobile and upload it as an artifact.
  # ---------------------------------------------------------------------------
  gomobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250606033058-a2a15c67f36f
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250606033058-a2a15c67f36f
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init

      - name: Build engine.aar
        # Must run inside the agent module (its go.mod requires golang.org/x/mobile);
        # from the repo root, gobind can't resolve x/mobile/bind for ./agent/mobile.
        working-directory: agent
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: gomobile bind -target=android -androidapi 21 -ldflags=-checklinkname=0 -o ../engine.aar ./mobile

      - uses: actions/upload-artifact@v4
        with:
          name: engine-aar
          path: engine.aar

  # ---------------------------------------------------------------------------
  # Build the iOS Engine.xcframework with gomobile (macOS runner).
  # ---------------------------------------------------------------------------
  gomobile-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20250606033058-a2a15c67f36f
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20250606033058-a2a15c67f36f
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init

      - name: Build Engine.xcframework
        # Run inside the agent module (see the android job for why).
        working-directory: agent
        run: gomobile bind -target=ios -ldflags=-checklinkname=0 -o ../Engine.xcframework ./mobile

      - name: Zip framework (preserve symlinks)
        run: zip -ry Engine.xcframework.zip Engine.xcframework

      - uses: actions/upload-artifact@v4
        with:
          name: engine-xcframework
          path: Engine.xcframework.zip

  # ---------------------------------------------------------------------------
  # Analyze + test (no native artifact required for the pure-Dart test suite).
  # ---------------------------------------------------------------------------
  flutter-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Materialize platform runners
        working-directory: client
        run: flutter create --platforms=ios,android --project-name openidx_client .

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze

      - name: Test
        working-directory: client
        run: flutter test

  # ---------------------------------------------------------------------------
  # Full Android APK build with the real engine.aar linked in.
  # ---------------------------------------------------------------------------
  build-android:
    needs: gomobile-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download engine.aar
        uses: actions/download-artifact@v4
        with:
          name: engine-aar
          path: client/plugins/openidx_engine/android/libs

      - name: Materialize platform runners
        working-directory: client
        run: flutter create --platforms=ios,android --project-name openidx_client .

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      - name: Build APK
        working-directory: client
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: openidx-android-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk

  # ---------------------------------------------------------------------------
  # Full iOS build (no code signing) with the real Engine.xcframework linked.
  # ---------------------------------------------------------------------------
  build-ios:
    needs: gomobile-ios
    # macos-15 ships Xcode 16 / Swift 6, required by the firebase-ios-sdk pulled
    # in by firebase_messaging (uses `sending`, AccessLevelOnImport). macos-14
    # (Xcode 15) fails to compile it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download Engine.xcframework
        uses: actions/download-artifact@v4
        with:
          name: engine-xcframework
          path: client/plugins/openidx_engine/ios/Frameworks

      - name: Unzip framework
        working-directory: client/plugins/openidx_engine/ios/Frameworks
        run: |
          unzip -q Engine.xcframework.zip
          rm Engine.xcframework.zip

      - name: Materialize platform runners
        working-directory: client
        run: flutter create --platforms=ios,android --project-name openidx_client .

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: client
        run: flutter build ios --no-codesign --debug
