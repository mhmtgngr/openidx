name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'web/admin-console/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'web/admin-console/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: web/admin-console

# A newer push to a pull request supersedes the runs of the one before it.
# Those runs' results are not what the PR is reviewed on, and with this
# repository's ~20 concurrent jobs they hold runners the new head needs.
# Every other event (a push to main, dev or a tag, a schedule, a manual run)
# gets a group of its own (run_id), so it is never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/admin-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run
