name: OpenIDX CodeQL config

# Vendored third-party source is excluded from analysis.
#
# agent/third_party/gopsutil is a vendored copy of a library this project does
# not maintain. Analysing it produced nine `go/incorrect-integer-conversion`
# results at severity 8.1 -- every one in /proc parsing nobody here can act on,
# because patching a vendored tree in place is how a vendored tree stops being
# updatable. Nine findings nobody can act on are nine findings between a reader
# and the ones they can: see docs/evidence/codeql-triage.md.
#
# This narrows WHAT IS SCANNED, never how a finding is treated. Nothing under
# internal/, cmd/, tools/, web/ or the agent's own source is excluded, and no
# query is disabled.
paths-ignore:
  - agent/third_party
