# Alertmanager for the full compose stack (docker-compose.yml and
# docker-compose.infra.yml).
#
# Alertmanager does not expand ${VAR} in its configuration, so mail settings
# cannot come from the environment here. This file used to write them as
# ${SMTP_HOST:-localhost}-style placeholders, which Alertmanager refuses to
# load, and their fallbacks mailed alerts from and to addresses at a domain
# the project does not own. Critical alerts go to the webhook below. To mail
# them as well, give the critical-alerts receiver an email_configs entry with
# literal values: your smarthost, a From address at a domain you own, and
# your recipients.
global:
  resolve_timeout: 5m

route:
  receiver: webhook-default
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: critical-alerts
      match:
        severity: critical
      group_wait: 10s
      repeat_interval: 1h
    - receiver: webhook-default
      match:
        severity: warning

receivers:
  - name: webhook-default
    webhook_configs:
      - url: 'http://admin-api:8005/api/v1/alerts/webhook'
        send_resolved: true

  - name: critical-alerts
    webhook_configs:
      - url: 'http://admin-api:8005/api/v1/alerts/webhook'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'service']
