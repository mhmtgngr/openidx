# The admin console's nginx config for the lite install
# (deployments/docker/docker-compose.lite.yml mounts it over the image's
# default.conf).
#
# In the lite install there is no APISIX: the console's own nginx is the edge.
# It serves the built SPA and sends every API prefix straight to the service
# that owns it, so the browser talks to one origin (same-origin API, no CORS).
# The prefixes and their owners are the edge route table:
# deployments/apisix-edge/seed-edge-routes.sh, the Vite dev proxy in
# web/admin-console/vite.config.ts and tools/contractcheck/edge.go.
#
# Only these prefixes are proxied. /health, /ready, /metrics and /debug/pprof
# live at each service's root, so they are never reachable through this port;
# they stay on the services' loopback-only ports.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects nginx makes itself (a directory without its slash) must not
    # carry the container port 8080 to a browser that reached us on another.
    absolute_redirect off;
    client_max_body_size 10m;

    # Docker's embedded DNS. Each upstream is a variable, so it is resolved per
    # request: nginx starts before the services do, and follows a restarted
    # container to its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/xml+rss image/svg+xml;

    # Every proxied location inherits these, so each block below is only its
    # upstream. Host keeps the port the browser used; the Upgrade pair lets the
    # audit stream and the access-service sockets through.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    # Long enough for the audit stream's 30-second pings.
    proxy_read_timeout 300s;

    # Every proxy_pass below goes to a fixed service name, never to anything
    # taken from the request; $upstream only defers the DNS lookup to request
    # time, so a service left out by a profile answers 502 instead of stopping
    # nginx at startup. These locations are the public API, so `internal`
    # (which makes a location answer 404 to clients) is wrong here, and
    # Semgrep's missing-internal rule is silenced on each line.
    #
    # nginx picks the longest matching prefix, so the specific /api/v1/<svc>/
    # rules win over the /api/ catch-all, as they do at the edge. ^~ stops the
    # static-asset regex further down from taking an API path that happens to
    # end in .png or .js.
    location ^~ /api/v1/identity/ {
        set $upstream http://identity-service:8001;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    location ^~ /api/v1/governance/ {
        set $upstream http://governance-service:8002;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    location ^~ /api/v1/provisioning/ {
        set $upstream http://provisioning-service:8003;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    location ^~ /api/v1/audit/ {
        set $upstream http://audit-service:8004;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    location ^~ /api/v1/access/ {
        set $upstream http://access-service:8007;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    location ^~ /api/v1/oauth/ {
        set $upstream http://oauth-service:8006;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    location ^~ /api/v1/saml/ {
        set $upstream http://oauth-service:8006;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    # Everything else under /api/ is admin-api.
    location ^~ /api/ {
        set $upstream http://admin-api:8005;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }

    # Sign-in, tokens and discovery. The issuer is this origin
    # (OAUTH_ISSUER in the compose file), so these answer here.
    location ^~ /oauth/ {
        set $upstream http://oauth-service:8006;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    location ^~ /.well-known/ {
        set $upstream http://oauth-service:8006;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    location ^~ /saml/ {
        set $upstream http://oauth-service:8006;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }
    location ^~ /scim/v2/ {
        set $upstream http://provisioning-service:8003;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }

    # Guacamole, for the optional `guacamole` profile. Without the profile the
    # name does not resolve and this answers 502.
    location ^~ /guacamole/ {
        set $upstream http://guacamole:8080;
        proxy_pass $upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # The container's own liveness probe, answered by nginx.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Hashed build output: immutable for a year. add_header in a location
    # replaces the inherited set, so the security headers are repeated.
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # The entry document is never cached: it decides which build a browser runs.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # SPA fallback: every other path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
