# ============================================================================
# OpenIDX Production nginx Configuration
# Domain: openidx.tdv.org
# SSL Termination and Reverse Proxy
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Slow-request hardening (global-scale plan task 0.3). A slowloris client
    # needs no bandwidth, only a server willing to wait: nginx's defaults hold a
    # half-sent request for 60s and a stalled body for 60s per read. Ten seconds
    # is generous for a real client and starves a trickle. reset_timedout_connection
    # frees the socket immediately instead of lingering in FIN_WAIT.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    reset_timedout_connection on;

    # Per-source concurrent-connection ceiling. Keyed on the TCP peer, which is
    # the client when THIS nginx is the true edge (the compose default). When a
    # CDN/anycast provider sits in front, every peer is the provider: enable the
    # realip block below with the provider's published ranges first, or this
    # ceiling throttles the whole world as one client (the same collapse as
    # design finding B3). 100 concurrent connections is far above any browser
    # (HTTP/2 uses one) and far below what a flood needs.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn perip 100;
    limit_conn_status 429;
    limit_conn_log_level warn;
    # realip (uncomment behind an edge provider; keep the list in step with
    # OIDX_EDGE_TRUSTED_CIDRS — see files/edge-cidr-sync.sh OUTPUT=file):
    #   set_real_ip_from 173.245.48.0/20;   # ...one line per provider CIDR
    #   real_ip_header X-Forwarded-For;
    #   real_ip_recursive on;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SSL session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Edge response cache (global-scale plan task 1.3). The site config's
    # /.well-known/jwks.json and openid-configuration locations carried
    # proxy_cache_valid for years with NO cache zone — and proxy_cache_valid
    # without proxy_cache is a comment: every discovery and JWKS request went
    # to the oauth-service. A JWKS flood is the cheapest way to make the edge
    # hammer the ISSUE plane. Small, memory-keyed, short-lived: the two objects
    # it holds are public and identical for every caller.
    proxy_cache_path /var/cache/nginx/openidx levels=1:2 keys_zone=openidx_edge:10m
                     max_size=64m inactive=10m use_temp_path=off;

    # Upstream definitions
    upstream admin_console {
        server admin-console:3000;
        keepalive 32;
    }

    upstream apisix_gateway {
        server apisix:9080;
        keepalive 32;
    }

    upstream oauth_service {
        server oauth-service:8006;
        keepalive 32;
    }

    upstream access_service {
        server access-service:8007;
        keepalive 32;
    }

    # Include site configurations
    include /etc/nginx/conf.d/*.conf;
}
