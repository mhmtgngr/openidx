# Production nginx configuration for OpenIDX Admin Console
# Serves at openidx.tdv.org

server {
    listen 8080;
    server_name openidx.tdv.org _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for production. The proxied /api/ and /oauth/ answers
    # get these; they do not get the Content-Security-Policy, which is the
    # console's own and is set on each location below that serves the
    # console's files. The services answer some requests with pages of their
    # own, such as a SAML response that posts a form to another origin, and
    # the console's policy would stop them.
    #
    # The policy is what keeps script someone else wrote from running in the
    # console, which keeps its access and refresh tokens in localStorage:
    #   - script-src: the console's own bundle, plus the origin of the
    #     Turnstile challenge the login page loads. No 'unsafe-inline': the
    #     build emits no inline script, and inline script is what injected
    #     markup would run. No 'unsafe-eval'.
    #   - object-src 'none', base-uri 'self', form-action 'self', and
    #     frame-ancestors 'none': nothing frames the console.
    #   - connect-src is open: the API and sign-in origins are build settings
    #     (VITE_API_URL, VITE_OAUTH_URL) and need not be this one.
    #   - img-src is open: organizations brand the console with logos hosted
    #     anywhere.
    #   - frame-src 'self': the PAM viewer frames Guacamole on this origin.
    #     The email-template preview is a sandboxed srcdoc frame, which
    #     frame-src does not govern.
    # The locations that never serve the login page leave the Turnstile origin
    # out. scripts/check-console-csp.sh fails CI if a location serving the
    # console lacks the policy or loosens it.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Remove server info
    server_tokens off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # Brotli compression (if module available)
    # brotli on;
    # brotli_static on;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Static assets with caching. add_header in a location replaces the whole
    # inherited set, so the security headers are repeated here, and in the
    # console locations below.
    #
    # A block for service workers stood here, after this one. nginx takes the
    # first regular expression that matches, and this one matches every .js,
    # so that block never answered a request; the console registers no
    # service worker.
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src * ws: wss:; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        access_log off;
    }

    # API proxy - forward to APISIX gateway
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://apisix:9080;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        proxy_cache_bypass $http_upgrade;
    }

    # OAuth endpoint proxy
    location /oauth/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://apisix:9080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # The entry document is never cached (task 1.3): hashed assets above are
    # immutable for a year, so index.html is the ONLY file whose freshness
    # decides which build a browser runs. A cached index.html after a deploy
    # points at chunks that no longer exist.
    #
    # nginx add_header does not merge — any add_header in a location replaces
    # the whole inherited set — so the security headers are repeated here.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src * ws: wss:; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # SPA fallback - all other requests go to index.html, which the block
    # above answers. Files that exist are answered here.
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src * ws: wss:; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        return 503 "Service temporarily unavailable";
    }
}
