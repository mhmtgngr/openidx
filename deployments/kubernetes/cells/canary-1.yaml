# Cell canary-1 -- layered over values-prod.yaml by .github/workflows/rollout-cell.yml.
#
# config.cellId is what every service in the cell stamps into the tokens it
# mints and what cell.Guard compares an arriving token against (plan 4.1).
# The rollout refuses this file if the id below does not match the file name,
# and refuses the cell if the deployed ConfigMap does not answer with it.
config:
  cellId: "canary-1"

# The small-cell profile (plan 4.2): one replica per service is enough for a
# cell whose job is to take the release first, and cheap enough to keep.
identityService:
  replicaCount: 1
oauthService:
  replicaCount: 1
accessService:
  replicaCount: 1


# Not set here, and the chart refuses the rollout until it is:
# edge.originVerify.value, the Front Door profile GUID this cell's Ingress
# checks X-Azure-FDID against. values-prod.yaml carries a REPLACE-WITH-
# placeholder, and installing it as shipped would give an Ingress that answers
# 403 to every request arriving through the edge. Put the cell's real value
# here (`terraform output -raw origin_verification`), or pass it with --set
# from a secret, before the first rollout of this cell.
