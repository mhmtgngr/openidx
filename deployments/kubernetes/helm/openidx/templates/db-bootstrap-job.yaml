{{- if and .Values.migrations.enabled .Values.postgresql.enabled .Values.migrations.roleBootstrap.enabled }}
# Bootstrap hook — creates the one role the migrations cannot create themselves.
#
# Migration v53 provisions `openidx_app`, the NOSUPERUSER NOBYPASSRLS runtime
# role the v37 RLS belt is FORCE'd against. The migration Job connects as the
# database OWNER (`openidx`), which the PostgreSQL subchart creates as a plain
# LOGIN role, and a role without CREATEROLE cannot create another role:
#
#   ERROR:  permission denied to create role
#   DETAIL: Only roles with the CREATEROLE attribute may create roles.
#   CONTEXT: SQL statement "CREATE ROLE openidx_app ..."
#
# That is the whole migration Job failing, which is the whole install failing,
# and it is invisible to `helm lint`, `helm template` and every unit test —
# a privilege the statement only needs against a real server.
#
# Why a Job and not `postgresql.primary.initdb.scripts`
# -----------------------------------------------------
# Two reasons, one of which cost a CI round to learn:
#
#   1. The subchart runs `.sql` init scripts as POSTGRESQL_INITSCRIPTS_USERNAME,
#      which defaults to $POSTGRESQL_USER — here `openidx`, the same role that
#      cannot create a role. An initdb script therefore fails with the exact
#      error above, inside a phase whose server log is a background stream
#      nobody reads. Pointing it at the superuser means `primary.initdb.password`,
#      which the subchart renders as a plaintext env value in the StatefulSet
#      pod spec.
#   2. initdb scripts run only on the first boot of an empty data directory.
#      An existing install upgrading into this chart version would never get
#      the role.
#
# This hook runs on install AND upgrade, reads the superuser password from the
# Secret that already holds it, and is gone as soon as it succeeds. Bootstrap
# is a privileged, one-time act; doing it in the open beats giving `openidx`
# CREATEROLE permanently to fix a one-time problem.
#
# Why the script is a ConfigMap and not `args`
# --------------------------------------------
# It was `args` for exactly one CI round. The kubelet expands `$(VAR)`
# references in `command` and `args`, and its escape for a literal dollar is a
# doubled one — so it rewrote the `$$` of v53's `DO $$ … $$;` to a single `$`
# and PostgreSQL answered `syntax error at or near "$" at character 4`. A
# ConfigMap is mounted byte for byte, which also makes the rendered chart the
# thing you can run: extract this key from `helm template` and it is the script
# the container executes.
#
# hook-weight orders the two: the ConfigMap at -2, this Job at -1, the
# migration Job at 0. Helm completes a weight before starting the next.
#
# The role stays passwordless, exactly as v53 leaves it — nothing logs in as
# openidx_app until an operator sets a password out of band and points
# DATABASE_URL at it — with ONE exception: pgcat.enabled. The pooler's upstream
# credential IS openidx_app, so with the bundled database this hook sets the
# role's password to pgcat.password (see the script), or the pooler could never
# log in and every service behind it would be down with the install green.
# With an external database (postgresql.enabled=false) neither object renders,
# so there the DSN the migration Job uses must itself be able to CREATE ROLE,
# or openidx_app must already exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openidx.fullname" . }}-db-bootstrap
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-bootstrap
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  bootstrap.sh: |
    set -eu
    export PGPASSWORD="$POSTGRES_SUPERUSER_PASSWORD"

    # On a fresh install the PostgreSQL StatefulSet is a chart resource, so this
    # hook can win the race with it. Wait for a server that ANSWERS, not just a
    # port that is open.
    i=0
    until psql -U postgres -tAc 'SELECT 1' >/dev/null 2>&1; do
      i=$((i + 1))
      if [ "$i" -gt 150 ]; then
        echo "postgresql at $PGHOST did not accept connections within 5m"
        exit 1
      fi
      echo "waiting for postgresql..."
      sleep 2
    done

    # Byte for byte the CREATE ROLE from migration v53, so the two cannot drift
    # into disagreeing about what the runtime role is. v53's own IF NOT EXISTS
    # then makes its copy a no-op.
    psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
    DO
    $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openidx_app') THEN
        CREATE ROLE openidx_app LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
      END IF;
    END
    $$;
    SQL

    # The per-plane roles (migration v189), here for the same reason openidx_app
    # is: CREATE ROLE, GRANT and ALTER ROLE ... SET all need a privilege the
    # migration Job's owner role does not have. v189 guards every one of these
    # with "is it already so?", so once this has run its copy is a no-op that
    # only reads pg_roles and pg_db_role_setting.
    #
    # IN ROLE openidx_app is the load-bearing part: it carries openidx_app's
    # grants AND the v37 FORCE RLS policies, which are granted TO openidx_app
    # and apply to every role holding its privileges. NOBYPASSRLS is spelled out
    # because a plane role that bypassed the belt would not fail -- it would
    # return every tenant's rows.
    #
    # Passwordless, like openidx_app: the password is set out of band at deploy
    # time, so no secret lands in git.
    psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
    DO
    $$
    DECLARE
      r record;
    BEGIN
      FOR r IN
        SELECT * FROM (VALUES
          ('openidx_issue', '2s',  '60s'),
          ('openidx_admin', '10s', '120s'),
          ('openidx_event', '30s', '300s')
        ) AS t(rolename, stmt_timeout, idle_timeout)
      LOOP
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = r.rolename) THEN
          EXECUTE format(
            'CREATE ROLE %I LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE INHERIT IN ROLE openidx_app',
            r.rolename);
        END IF;
        EXECUTE format('ALTER ROLE %I SET statement_timeout = %L', r.rolename, r.stmt_timeout);
        EXECUTE format('ALTER ROLE %I SET idle_in_transaction_session_timeout = %L', r.rolename, r.idle_timeout);
      END LOOP;
    END
    $$;
    SQL

    # The pooler's upstream credential. pgcat logs in to Postgres as openidx_app
    # with pgcat.password, and nothing else ever sets that role's password on
    # the bundled database -- so with pgcat.enabled this hook does, from the
    # same value the pooler was given (templates/secrets.yaml, app-password).
    # psql's :'var' quoting, not shell interpolation: the value is a credential
    # and must never be pasted into SQL text.
    if [ -n "${OPENIDX_APP_PASSWORD:-}" ]; then
      psql -U postgres -v ON_ERROR_STOP=1 -v pw="$OPENIDX_APP_PASSWORD" \
        -c "ALTER ROLE openidx_app PASSWORD :'pw'"
      echo "openidx_app: password set (the pooler's upstream credential)"
    fi

    # Say what was left behind. A bootstrap that silently did nothing and one
    # that worked have the same exit code.
    psql -U postgres -v ON_ERROR_STOP=1 -tAc \
      "SELECT rolname || ': login=' || rolcanlogin || ' superuser=' || rolsuper || ' bypassrls=' || rolbypassrls
         FROM pg_roles
        WHERE rolname IN ('openidx_app', 'openidx_issue', 'openidx_admin', 'openidx_event')
        ORDER BY rolname"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openidx.fullname" . }}-db-bootstrap
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-bootstrap
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.roleBootstrap.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        {{- include "openidx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.serviceAccount.name | default "openidx" }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: bootstrap-script
          configMap:
            name: {{ include "openidx.fullname" . }}-db-bootstrap
      containers:
        - name: create-runtime-role
          image: {{ .Values.migrations.roleBootstrap.image | quote }}
          imagePullPolicy: {{ .Values.migrations.roleBootstrap.pullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          volumeMounts:
            - name: bootstrap-script
              mountPath: /scripts
              readOnly: true
          env:
            - name: PGHOST
              value: {{ include "openidx.postgresHost" . }}
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.postgresql.auth.database | default "openidx" }}
            # The subchart's auth.secretKeys.adminPasswordKey, from the Secret
            # this chart already creates for it (templates/secrets.yaml).
            - name: POSTGRES_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openidx-datastore-auth
                  key: postgres-password
            # The runtime role's password, present only when the pooler is on
            # (templates/secrets.yaml). Optional so the key's absence is the
            # signal, not a failed pod.
            - name: OPENIDX_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openidx-datastore-auth
                  key: app-password
                  optional: true
          resources:
            {{- toYaml .Values.migrations.roleBootstrap.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
