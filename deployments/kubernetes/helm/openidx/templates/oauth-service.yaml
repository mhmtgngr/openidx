{{- if .Values.oauthService.enabled | default true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openidx.fullname" . }}-oauth-service
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-service
spec:
  # `| default N` would be wrong here: Go templates treat 0 as empty, so an
  # operator scaling this to zero silently got N back — which is how the
  # kind-install job, whose values-ci.yaml sets every service to 0, still
  # watched oauth-service scale 0 -> 2 and crash-loop. `dig` returns the value
  # when the key is present, including 0, and the default only when absent.
  replicas: {{ dig "replicaCount" 2 (.Values.oauthService | default dict) }}
  {{- include "openidx.rollingStrategy" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "openidx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: oauth-service
  template:
    metadata:
      labels:
        {{- include "openidx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: oauth-service
    spec:
      {{- include "openidx.gracefulTermination" . | nindent 6 }}
      {{- include "openidx.topologySpread" (dict "ctx" . "component" "oauth-service") | nindent 6 }}
      serviceAccountName: {{ include "openidx.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.podAntiAffinity.weight | default 100 }}
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: oauth-service
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- include "openidx.waitForPooler" . | nindent 6 }}
      containers:
        - name: oauth-service
          image: "{{ include "openidx.imageRegistry" . }}/{{ .Values.oauthService.image.repository | default "oauth-service" }}:{{ .Values.oauthService.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.oauthService.image.pullPolicy | default "IfNotPresent" }}
          {{- include "openidx.preStopHook" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8006
              protocol: TCP
          env:
            # Per-replica share of the auth rate limit while the rate-limit
            # Redis is unavailable (task 0.7): replicas cannot see each other's
            # local counters, so the fleet divides the quota by this hint.
            - name: RATE_LIMIT_REPLICA_HINT
              value: {{ dig "autoscaling" "minReplicas" .Values.oauthService.replicaCount .Values.oauthService | quote }}
            - name: APP_ENV
              value: {{ .Values.global.environment | default "production" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.global.logLevel | default "info" | quote }}
            - name: PORT
              value: "8006"
            - name: ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidx.fullname" . }}-config
                  key: OAUTH_ISSUER
            {{- if .Values.serviceTLS.enabled }}
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_FILE
              value: "/tls/tls.crt"
            - name: TLS_KEY_FILE
              value: "/tls/tls.key"
            {{- if .Values.serviceTLS.caSecret }}
            - name: TLS_CA_FILE
              value: "/tls-ca/ca.crt"
            {{- end }}
            {{- end }}
          {{- if .Values.pgcat.enabled }}
          # Through the transaction pooler, not straight at Postgres (task 2.2).
          # This replaces the direct DSN in -db-url; see openidx.pooledDatabaseUrl.
          {{- include "openidx.pooledDatabaseUrl" . | nindent 12 }}
          {{- else if .Values.database.planeRoles.enabled }}
          # As this service's availability plane, so an expensive query is
          # bounded by the server and not by the service (task 2.4).
          {{- include "openidx.planeDatabaseUrl" (dict "ctx" . "service" "oauthService") | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "openidx.fullname" . }}-db-url
            - secretRef:
                name: {{ include "openidx.fullname" . }}-secrets
            - configMapRef:
                name: {{ include "openidx.fullname" . }}-config
            # Edge provider CIDRs, unioned into the trusted-proxy list by the
            # services (OIDX_EDGE_TRUSTED_CIDRS). Rendered statically from
            # edge.trustedCidrs, or owned by the edge-cidr-sync CronJob when
            # edge.cidrSync.enabled — optional so a first boot before the first
            # sync still starts.
            - configMapRef:
                name: {{ include "openidx.fullname" . }}-edge-cidrs
                optional: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              {{- if .Values.serviceTLS.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              {{- if .Values.serviceTLS.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml (.Values.oauthService.resources | default .Values.identityService.resources) | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.serviceTLS.enabled }}
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            {{- if .Values.serviceTLS.caSecret }}
            - name: tls-ca
              mountPath: /tls-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if .Values.serviceTLS.enabled }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ .Values.serviceTLS.certSecret }}
        {{- if .Values.serviceTLS.caSecret }}
        - name: tls-ca
          secret:
            secretName: {{ .Values.serviceTLS.caSecret }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openidx.fullname" . }}-oauth-service
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-service
spec:
  type: {{ .Values.oauthService.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.oauthService.service.port | default 8006 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openidx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-service
{{- end }}
