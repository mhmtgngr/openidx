{{- if .Values.identityService.enabled }}
{{- /*
identity-service renders once, or twice.

Once is today: one Deployment serving both availability planes. Twice is
identityService.planeSplit.enabled, which is the deployment half of task 3.4 --
an `-identity-auth` Deployment running SERVICE_PROFILE=auth (the ISSUE plane:
the login surface and the caller's own authentication factors) and an
`-identity-admin` Deployment running SERVICE_PROFILE=admin (user/role/group
CRUD, policies, analytics, and the portal). ADMIN is the first plane shed under
load, and shedding it buys nothing while one process serves both.

The component label stays "identity-service" on both halves ON PURPOSE: the
NetworkPolicy, the ServiceMonitor and the PodDisruptionBudget all select on it,
and a rename would silently drop the pods out of all three -- the NetworkPolicy
being the one that matters. The halves are told apart by an extra
`openidx.io/plane` label, which is absent when the split is off, so an existing
Deployment's (immutable) selector is unchanged.
*/}}
{{- $planes := list (dict "name" "identity-service" "profile" "" "plane" "" "replicas" .Values.identityService.replicaCount "resources" .Values.identityService.resources) }}
{{- if .Values.identityService.planeSplit.enabled }}
{{- $auth := .Values.identityService.planeSplit.auth }}
{{- $admin := .Values.identityService.planeSplit.admin }}
{{- $planes = list
      (dict "name" "identity-auth"  "profile" "auth"  "plane" "auth"
            "replicas" ($auth.replicaCount  | default .Values.identityService.replicaCount)
            "resources" ($auth.resources  | default .Values.identityService.resources)
            "nodeSelector" ($auth.nodeSelector | default dict)
            "tolerations" ($auth.tolerations | default list))
      (dict "name" "identity-admin" "profile" "admin" "plane" "admin"
            "replicas" ($admin.replicaCount | default .Values.identityService.replicaCount)
            "resources" ($admin.resources | default .Values.identityService.resources)
            "nodeSelector" ($admin.nodeSelector | default dict)
            "tolerations" ($admin.tolerations | default list)) }}
{{- end }}
{{- range $p := $planes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openidx.fullname" $ }}-{{ $p.name }}
  labels:
    {{- include "openidx.labels" $ | nindent 4 }}
    app.kubernetes.io/component: identity-service
spec:
  replicas: {{ $p.replicas }}
  {{- include "openidx.rollingStrategy" $ | nindent 2 }}
  selector:
    matchLabels:
      {{- include "openidx.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: identity-service
      {{- if $p.plane }}
      openidx.io/plane: {{ $p.plane }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "openidx.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: identity-service
        {{- if $p.plane }}
        openidx.io/plane: {{ $p.plane }}
        {{- end }}
    spec:
      {{- include "openidx.gracefulTermination" $ | nindent 6 }}
      {{- include "openidx.topologySpread" (dict "ctx" $ "component" "identity-service") | nindent 6 }}
      serviceAccountName: {{ include "openidx.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- /* This half's own node pool (task 3.4). Rendered only when set, so
             an install that never named a pool schedules exactly as before. */}}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ $.Values.podAntiAffinity.weight | default 100 }}
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: identity-service
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: identity-service
          image: "{{ include "openidx.imageRegistry" $ }}/{{ $.Values.identityService.image.repository }}:{{ $.Values.identityService.image.tag }}"
          imagePullPolicy: {{ $.Values.identityService.image.pullPolicy }}
          {{- include "openidx.preStopHook" $ | nindent 10 }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            {{- if $p.profile }}
            # Which availability plane this process serves (task 3.4). An
            # unrecognised value is fatal at startup, not a fall back to "all".
            - name: SERVICE_PROFILE
              value: {{ $p.profile | quote }}
            {{- end }}
            # Per-replica share of the auth rate limit while the rate-limit
            # Redis is unavailable (task 0.7): replicas cannot see each other's
            # local counters, so the fleet divides the quota by this hint.
            - name: RATE_LIMIT_REPLICA_HINT
              value: {{ dig "autoscaling" "minReplicas" $.Values.identityService.replicaCount $.Values.identityService | quote }}
            - name: APP_ENV
              value: {{ $.Values.global.environment | default "production" | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.global.logLevel | default "info" | quote }}
            - name: OPA_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidx.fullname" $ }}-config
                  key: OPA_URL
            - name: OAUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "openidx.fullname" $ }}-config
                  key: OAUTH_ISSUER
            {{- if $.Values.serviceTLS.enabled }}
            - name: TLS_ENABLED
              value: "true"
            - name: TLS_CERT_FILE
              value: "/tls/tls.crt"
            - name: TLS_KEY_FILE
              value: "/tls/tls.key"
            {{- if $.Values.serviceTLS.caSecret }}
            - name: TLS_CA_FILE
              value: "/tls-ca/ca.crt"
            {{- end }}
            {{- end }}
          {{- if $.Values.pgcat.enabled }}
          # Through the transaction pooler, not straight at Postgres (task 2.2).
          # This replaces the direct DSN in -db-url; see openidx.pooledDatabaseUrl.
          {{- include "openidx.pooledDatabaseUrl" $ | nindent 12 }}
          {{- else if $.Values.database.planeRoles.enabled }}
          # As this service's availability plane, so an expensive query is
          # bounded by the server and not by the service (task 2.4).
          {{- include "openidx.planeDatabaseUrl" (dict "ctx" $ "service" "identityService") | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "openidx.fullname" $ }}-db-url
            - secretRef:
                name: {{ include "openidx.fullname" $ }}-secrets
            - configMapRef:
                name: {{ include "openidx.fullname" $ }}-config
            # Edge provider CIDRs, unioned into the trusted-proxy list by the
            # services (OIDX_EDGE_TRUSTED_CIDRS). Rendered statically from
            # edge.trustedCidrs, or owned by the edge-cidr-sync CronJob when
            # edge.cidrSync.enabled — optional so a first boot before the first
            # sync still starts.
            - configMapRef:
                name: {{ include "openidx.fullname" $ }}-edge-cidrs
                optional: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              {{- if $.Values.serviceTLS.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              {{- if $.Values.serviceTLS.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          {{- if $.Values.serviceTLS.enabled }}
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            {{- if $.Values.serviceTLS.caSecret }}
            - name: tls-ca
              mountPath: /tls-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if $.Values.serviceTLS.enabled }}
      volumes:
        - name: tls-certs
          secret:
            secretName: {{ $.Values.serviceTLS.certSecret }}
        {{- if $.Values.serviceTLS.caSecret }}
        - name: tls-ca
          secret:
            secretName: {{ $.Values.serviceTLS.caSecret }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openidx.fullname" $ }}-{{ $p.name }}
  labels:
    {{- include "openidx.labels" $ | nindent 4 }}
    app.kubernetes.io/component: identity-service
spec:
  type: {{ $.Values.identityService.service.type }}
  ports:
    - port: {{ $.Values.identityService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "openidx.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: identity-service
    {{- if $p.plane }}
    openidx.io/plane: {{ $p.plane }}
    {{- end }}
{{- end }}
{{- end }}
