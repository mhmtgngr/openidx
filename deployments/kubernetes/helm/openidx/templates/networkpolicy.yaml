###############################################################################
# Admin Console (port 80)
# Receives traffic from: APISIX gateway / ingress controller
###############################################################################
{{- if .Values.adminConsole.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openidx.fullname" . }}-admin-console-allow
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-console
spec:
  podSelector:
    matchLabels:
      {{- include "openidx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin-console
  policyTypes:
    - Ingress
  ingress:
    # APISIX gateway / ingress controller
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: apisix
      ports:
        - protocol: TCP
          port: 80
    # Allow ingress controller (nginx)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
{{- end }}
---
###############################################################################
# pgcat, the transaction pooler (pgcat.port, default 6432)
# Receives traffic from: the eight request-serving services -- the same set
# templates/_helpers.tpl's openidx.pooledDatabaseUrl repoints at it.
#
# This policy did not exist for the pooler's first two chart versions, and it
# was measured rather than reasoned (helm.yml, kind-cell): the pooler's pods
# carry app.kubernetes.io/part-of=openidx, which is what the default-deny
# policy above selects, so with networkPolicy.enabled and no allow rule the
# pooler was healthy, held upstream connections, and every service's dial to
# it timed out. A pooler nobody can reach is every service down behind a
# green rollout, which is the shape this chart exists to refuse. The migration
# Job, the bootstrap hook and the backup CronJob are deliberately absent: they
# keep the direct DSN (see pgcat.yaml).
###############################################################################
{{- if .Values.pgcat.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openidx.fullname" . }}-pgcat-allow
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgcat
spec:
  podSelector:
    matchLabels:
      {{- include "openidx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgcat
  policyTypes:
    - Ingress
  ingress:
    # identity-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: identity-service
      ports:
        - protocol: TCP
          port: {{ .Values.pgcat.port }}
    # governance-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: governance-service
      ports:
        - protocol: TCP
          port: {{ .Values.pgcat.port }}
    # provisioning-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: provisioning-service
      ports:
        - protocol: TCP
          port: {{ .Values.pgcat.port }}
    # audit-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: audit-service
      ports:
        - protocol: TCP
          port: {{ .Values.pgcat.port }}
    # admin-api
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: admin-api
      ports:
        - protocol: TCP
          port: {{ .Values.pgcat.port }}
    # oauth-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: oauth-service
      ports:
        - protocol: TCP
          port: {{ .Values.pgcat.port }}
    # gateway-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: gateway-service
      ports:
        - protocol: TCP
          port: {{ .Values.pgcat.port }}
    # access-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: access-service
      ports:
        - protocol: TCP
          port: {{ .Values.pgcat.port }}
{{- end }}
---
###############################################################################
# PostgreSQL (port 5432)
# Receives traffic from: all backend services
###############################################################################
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openidx.fullname" . }}-postgres-allow
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
    # The primary, and -- with postgresql.architecture=replication -- the read
    # replicas the services' read pool dials (database.bundledReadReplica).
    # A policy that covered only the primary would let the install come up
    # and then refuse every offloaded read on a CNI that enforces policy,
    # which the readers would report as a replica outage and fall back from,
    # so the replica would be paid for and never used.
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [primary, read]
  policyTypes:
    - Ingress
  ingress:
    # identity-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: identity-service
      ports:
        - protocol: TCP
          port: 5432
    # governance-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: governance-service
      ports:
        - protocol: TCP
          port: 5432
    # provisioning-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: provisioning-service
      ports:
        - protocol: TCP
          port: 5432
    # audit-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: audit-service
      ports:
        - protocol: TCP
          port: 5432
    # admin-api
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: admin-api
      ports:
        - protocol: TCP
          port: 5432
    # oauth-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: oauth-service
      ports:
        - protocol: TCP
          port: 5432
    # access-service
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: access-service
      ports:
        - protocol: TCP
          port: 5432
    # migration Job (post-install/pre-upgrade hook) — without this the
    # hardened profile breaks its own schema bootstrap
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: migrate
      ports:
        - protocol: TCP
          port: 5432
    # backup CronJob
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: backup
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
