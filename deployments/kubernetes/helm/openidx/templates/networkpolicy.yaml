  ingress:
    # audit-service only
    - from:
        - podSelector:
            matchLabels:
              {{- include "openidx.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: audit-service
      ports:
        - protocol: TCP
          port: 9200
    # Elasticsearch inter-node communication (transport)
    - from:
        - podSelector:
            matchLabels:
              app: elasticsearch-master
      ports:
        - protocol: TCP
          port: 9300
{{- end }}
{{- end }}
