{{- /*
The passwords of the two roles the services connect as, computed once for the
whole file: on a first install each include is a new random value, and the
-db-roles hook Secret, the -db-app-url DSNs and the bootstrap hook must agree.
With the pooler on, openidx_app's password IS pgcat.password: pgcat logs in
upstream as openidx_app, so a second, different password could not be right.
*/ -}}
{{- $appPw := "" -}}
{{- $bypassPw := "" -}}
{{- if not .Values.externalSecrets.enabled -}}
{{- $appSet := .Values.secrets.appPassword | default "" -}}
{{- if .Values.pgcat.enabled -}}
{{- $pg := required "pgcat.password is required when pgcat.enabled" .Values.pgcat.password -}}
{{- if and $appSet (ne $appSet $pg) -}}
{{- fail "secrets.appPassword and pgcat.password differ while pgcat.enabled. The pooler logs in to Postgres as openidx_app with pgcat.password, so that IS openidx_app's password: leave secrets.appPassword empty, or set it to the same value." -}}
{{- end -}}
{{- $appSet = $pg -}}
{{- end -}}
{{- $appPw = include "openidx.dbRolePassword" (dict "ctx" . "key" "app-password" "value" $appSet) -}}
{{- $bypassPw = include "openidx.dbRolePassword" (dict "ctx" . "key" "bypass-password" "value" (.Values.secrets.bypassPassword | default "")) -}}
{{- end -}}
# INTERNAL_SERVICE_TOKEN, in both secret modes: the services prove to one
# another that a call with no user behind it comes from the platform --
# access-service's policy checks against governance, and the events it writes
# into the audit trail, which the audit service refuses without it. Mounted by
# access-service, audit-service and governance-service BEFORE -secrets, so a
# value the operator keeps in -secrets (or in the external store behind it)
# wins over this one. See openidx.internalServiceToken for where it comes from.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openidx.fullname" . }}-internal-token
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
type: Opaque
data:
  INTERNAL_SERVICE_TOKEN: {{ include "openidx.internalServiceToken" . | b64enc | quote }}
---
{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openidx.fullname" . }}-secrets
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.postgresPassword }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.guacamoleAdminPassword }}
  GUACAMOLE_ADMIN_PASSWORD: {{ .Values.secrets.guacamoleAdminPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.guacamoleZitiAdminPassword }}
  GUACAMOLE_ZITI_ADMIN_PASSWORD: {{ .Values.secrets.guacamoleZitiAdminPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.pamGuacDbPassword }}
  PAM_GUAC_DB_PASSWORD: {{ .Values.secrets.pamGuacDbPassword | b64enc | quote }}
  {{- end }}
---
{{- if or .Values.postgresql.enabled .Values.redis.enabled }}
# Credentials for the BUNDLED data plane, in the key names the Bitnami
# subcharts read (postgresql: auth.secretKeys.*; redis:
# auth.existingSecretPasswordKey). values.yaml points both at this secret.
#
# Before this existed the chart had two unrelated passwords for one database.
# `secrets.postgresPassword` went into DATABASE_URL below, while
# `postgresql.auth.postgresPassword` stayed empty — and an empty value makes
# the Bitnami chart GENERATE a random password and keep it in its own secret.
# The DSN also named a role `openidx` that nothing ever created, because
# `postgresql.auth.username` was never set either. So the bundled PostgreSQL
# came up with a random superuser password and no application role, and every
# service — the migration Job first — failed to authenticate. Redis had the
# same split. `helm lint` and `helm template` cannot see any of it; only
# installing can, which is what the kind-install job now does.
#
# The name is fixed rather than fullname-derived because subchart values
# cannot be templated. Two OpenIDX releases in one namespace would collide —
# as they already do on the `opa` Service, which is fixed for the same reason
# (its address is baked into config.opaUrl).
apiVersion: v1
kind: Secret
metadata:
  name: openidx-datastore-auth
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
type: Opaque
stringData:
  # postgresql: auth.secretKeys.adminPasswordKey / userPasswordKey. Both carry
  # the same value so an operator has one knob (secrets.postgresPassword);
  # the application connects as the non-superuser role.
  postgres-password: {{ required "secrets.postgresPassword is required when postgresql.enabled" .Values.secrets.postgresPassword | quote }}
  password: {{ required "secrets.postgresPassword is required when postgresql.enabled" .Values.secrets.postgresPassword | quote }}
  # redis: auth.existingSecretPasswordKey
  redis-password: {{ required "secrets.redisPassword is required when redis.enabled" .Values.secrets.redisPassword | quote }}
  {{- if .Values.postgresql.enabled }}
  # postgresql: auth.secretKeys.replicationPasswordKey. Read only when
  # postgresql.architecture is "replication" (the read replicas stream from the
  # primary as repl_user); harmless otherwise, and present always so flipping
  # the architecture on is one knob and not a second secret.
  replication-password: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
{{- end }}
---
# The passwords of openidx_app and openidx_bypass, for the bootstrap hook Job
# to set on the server. Migration v53 and the hook create both roles
# passwordless; with the bundled database nobody else
# is there to set them, and the services cannot log in until somebody does.
#
# A HOOK, not an ordinary resource, and that is the point: on an upgrade the
# bootstrap Job runs pre-upgrade, before Helm applies the release's ordinary
# resources, so an ordinary Secret would still be the PREVIOUS release's copy
# at that moment -- the first upgrade that moves the services to openidx_app
# would roll them with a password the server had never been given. Weight -3
# puts it ahead of the bootstrap ConfigMap (-2) and Job (-1). Helm does not
# delete hook resources on uninstall, so a reinstall onto a kept volume finds
# the passwords the server already has (openidx.dbRolePassword reads it back).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openidx.fullname" . }}-db-roles
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-roles
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  app-password: {{ $appPw | quote }}
  bypass-password: {{ $bypassPw | quote }}
---
# The OWNER's DSN: the migration Job and the backup CronJob, and nothing else.
# Migrations create and alter every table and pg_dump must read every row, so
# both need the owner; a request-serving service must not have it, because
# the owner is the role FORCE RLS is easiest to lift for -- and once the
# bootstrap gives it BYPASSRLS (as compose does, so migration 231 can drop the
# app.bypass_rls clause) a service connected as the owner would see every
# tenant. The services read -db-app-url below.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openidx.fullname" . }}-db-url
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgres://{{ .Values.postgresql.auth.username | default "openidx" }}:{{ .Values.secrets.postgresPassword }}@{{ include "openidx.postgresHost" . }}:5432/{{ .Values.postgresql.auth.database | default "openidx" }}?sslmode={{ .Values.database.sslMode | default "disable" }}"
---
# What every service connects with. DATABASE_URL is openidx_app, the
# NOSUPERUSER NOBYPASSRLS role the v37 FORCE RLS belt applies to, exactly as
# compose runs them; DATABASE_BYPASS_URL is openidx_bypass, the BYPASSRLS role
# background work reads across tenants with instead of setting a session GUC
# the application role could also set (#964). Production refuses to start
# without the latter (ValidateProduction).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openidx.fullname" . }}-db-app-url
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgres://openidx_app:{{ $appPw }}@{{ include "openidx.postgresHost" . }}:5432/{{ .Values.postgresql.auth.database | default "openidx" }}?sslmode={{ .Values.database.sslMode | default "disable" }}"
  DATABASE_BYPASS_URL: "postgres://openidx_bypass:{{ $bypassPw }}@{{ include "openidx.postgresHost" . }}:5432/{{ .Values.postgresql.auth.database | default "openidx" }}?sslmode={{ .Values.database.sslMode | default "disable" }}"
  {{- if .Values.database.bundledReadReplica }}
  {{- if not .Values.postgresql.enabled }}
  {{- fail "database.bundledReadReplica points DATABASE_READ_URL at the BUNDLED PostgreSQL's read Service. With an external database (postgresql.enabled=false) use externalSecrets.readReplica and store the reader endpoint in the secret store instead." }}
  {{- end }}
  {{- if ne (.Values.postgresql.architecture | default "standalone") "replication" }}
  {{- fail "database.bundledReadReplica needs postgresql.architecture=replication (and readReplicas.replicaCount >= 1): in standalone mode the subchart renders no read Service, so DATABASE_READ_URL would name a host that does not exist -- and the services would report the replica down on every health check while every offloaded read fell back to the primary." }}
  {{- end }}
  # The bundled streaming replica (global-scale plan task 2.3, the in-cluster
  # shape). Services open their read pool against it; a replica outage falls
  # back to the primary (internal/common/database/readerfallback.go). The
  # credential matches DATABASE_URL's: the fleet is openidx_app, with or
  # without the pooler, so the replica pool is too -- the same role, the same
  # belt. (The password replicates with the role, since pg_authid is part of
  # the cluster the replica streams.)
  DATABASE_READ_URL: "postgres://{{ ternary .Values.pgcat.username "openidx_app" .Values.pgcat.enabled }}:{{ $appPw }}@{{ include "openidx.postgresReadHost" . }}:5432/{{ .Values.postgresql.auth.database | default "openidx" }}?sslmode={{ .Values.database.sslMode | default "disable" }}"
  {{- end }}
  REDIS_URL: "redis://:{{ .Values.secrets.redisPassword }}@{{ include "openidx.fullname" . }}-redis-master:6379"
  {{- with .Values.redis.roles.rateLimitUrl }}
  REDIS_RATELIMIT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.redis.roles.revocationUrl }}
  REDIS_REVOCATION_URL: {{ . | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "openidx.fullname" . }}-secrets
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "openidx.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/postgres-password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/redis-password
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/encryption-key
---
# Connection strings, in external-secrets mode (the plaintext versions above
# render only when externalSecrets is disabled). Two secrets, two roles:
#
#   -db-url      <remoteKeyPrefix>/database-url, the database OWNER. Read by
#                the migration Job and the backup CronJob only. Its meaning is
#                what it always was, so the migration hook of the upgrade that
#                introduces -db-app-url still finds it.
#   -db-app-url  <remoteKeyPrefix>/database-app-url (openidx_app, NOBYPASSRLS)
#                and /database-bypass-url (openidx_bypass, BYPASSRLS), plus the
#                read replica and Redis. Every service reads this one.
#
# Store all three before upgrading: a missing key fails the sync of the whole
# -db-app-url secret, and the services wait for it rather than start as the
# owner.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "openidx.fullname" . }}-db-url
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "openidx.fullname" . }}-db-url
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "openidx.fullname" . }}-db-app-url
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "openidx.fullname" . }}-db-app-url
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/database-app-url
    - secretKey: DATABASE_BYPASS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/database-bypass-url
    {{- if .Values.externalSecrets.readReplica }}
    # Optional read-replica / reader-endpoint URL. When present, services open a
    # second read-only pool and serve read-mostly, lag-tolerant queries from it
    # (PostgresDB.Reader()); a replica outage transparently falls back to the
    # primary. Store <remoteKeyPrefix>/database-read-url pointing at the RDS
    # reader endpoint, as openidx_app like database-app-url.
    - secretKey: DATABASE_READ_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/database-read-url
    {{- end }}
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/redis-url
    {{- if .Values.externalSecrets.redisRoles }}
    # Dedicated Redis instances per loss profile (design §4.4.2). The rate-limit
    # instance is the only one an attacker can fill (one key per source
    # address); keeping it apart means a counter flood can neither OOM the
    # login path nor evict a revocation marker. Store the two connection strings
    # under <remoteKeyPrefix>/redis-ratelimit-url and /redis-revocation-url
    # (managed cache endpoints: ratelimit = small, volatile-lru/allkeys-lru;
    # revocation = noeviction, persistent). Services alias a missing role to
    # REDIS_URL, so this can be enabled per environment.
    - secretKey: REDIS_RATELIMIT_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/redis-ratelimit-url
    - secretKey: REDIS_REVOCATION_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/redis-revocation-url
    {{- end }}
{{- end }}
