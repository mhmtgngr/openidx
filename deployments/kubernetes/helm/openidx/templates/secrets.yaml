{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openidx.fullname" . }}-secrets
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.postgresPassword }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.guacamoleAdminPassword }}
  GUACAMOLE_ADMIN_PASSWORD: {{ .Values.secrets.guacamoleAdminPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.guacamoleZitiAdminPassword }}
  GUACAMOLE_ZITI_ADMIN_PASSWORD: {{ .Values.secrets.guacamoleZitiAdminPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.pamGuacDbPassword }}
  PAM_GUAC_DB_PASSWORD: {{ .Values.secrets.pamGuacDbPassword | b64enc | quote }}
  {{- end }}
---
{{- if or .Values.postgresql.enabled .Values.redis.enabled }}
# Credentials for the BUNDLED data plane, in the key names the Bitnami
# subcharts read (postgresql: auth.secretKeys.*; redis:
# auth.existingSecretPasswordKey). values.yaml points both at this secret.
#
# Before this existed the chart had two unrelated passwords for one database.
# `secrets.postgresPassword` went into DATABASE_URL below, while
# `postgresql.auth.postgresPassword` stayed empty — and an empty value makes
# the Bitnami chart GENERATE a random password and keep it in its own secret.
# The DSN also named a role `openidx` that nothing ever created, because
# `postgresql.auth.username` was never set either. So the bundled PostgreSQL
# came up with a random superuser password and no application role, and every
# service — the migration Job first — failed to authenticate. Redis had the
# same split. `helm lint` and `helm template` cannot see any of it; only
# installing can, which is what the kind-install job now does.
#
# The name is fixed rather than fullname-derived because subchart values
# cannot be templated. Two OpenIDX releases in one namespace would collide —
# as they already do on the `opa` Service, which is fixed for the same reason
# (its address is baked into config.opaUrl).
apiVersion: v1
kind: Secret
metadata:
  name: openidx-datastore-auth
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
type: Opaque
stringData:
  # postgresql: auth.secretKeys.adminPasswordKey / userPasswordKey. Both carry
  # the same value so an operator has one knob (secrets.postgresPassword);
  # the application connects as the non-superuser role.
  postgres-password: {{ required "secrets.postgresPassword is required when postgresql.enabled" .Values.secrets.postgresPassword | quote }}
  password: {{ required "secrets.postgresPassword is required when postgresql.enabled" .Values.secrets.postgresPassword | quote }}
  # redis: auth.existingSecretPasswordKey
  redis-password: {{ required "secrets.redisPassword is required when redis.enabled" .Values.secrets.redisPassword | quote }}
  {{- if .Values.postgresql.enabled }}
  # postgresql: auth.secretKeys.replicationPasswordKey. Read only when
  # postgresql.architecture is "replication" (the read replicas stream from the
  # primary as repl_user); harmless otherwise, and present always so flipping
  # the architecture on is one knob and not a second secret.
  replication-password: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
  {{- if and .Values.postgresql.enabled .Values.pgcat.enabled }}
  # The runtime role's password, for the bootstrap hook to set. pgcat
  # authenticates UPSTREAM as openidx_app with pgcat.password, and migration
  # v53 -- like the bootstrap hook that mirrors it -- creates that role
  # passwordless. With an external database an operator sets it out of band;
  # with the bundled one there is nobody out of band, so the hook does it from
  # this key (templates/db-bootstrap-job.yaml), and the pooler can log in.
  app-password: {{ required "pgcat.password is required when pgcat.enabled" .Values.pgcat.password | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openidx.fullname" . }}-db-url
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgres://{{ .Values.postgresql.auth.username | default "openidx" }}:{{ .Values.secrets.postgresPassword }}@{{ include "openidx.postgresHost" . }}:5432/{{ .Values.postgresql.auth.database | default "openidx" }}?sslmode={{ .Values.database.sslMode | default "disable" }}"
  {{- if .Values.database.bundledReadReplica }}
  {{- if not .Values.postgresql.enabled }}
  {{- fail "database.bundledReadReplica points DATABASE_READ_URL at the BUNDLED PostgreSQL's read Service. With an external database (postgresql.enabled=false) use externalSecrets.readReplica and store the reader endpoint in the secret store instead." }}
  {{- end }}
  {{- if ne (.Values.postgresql.architecture | default "standalone") "replication" }}
  {{- fail "database.bundledReadReplica needs postgresql.architecture=replication (and readReplicas.replicaCount >= 1): in standalone mode the subchart renders no read Service, so DATABASE_READ_URL would name a host that does not exist -- and the services would report the replica down on every health check while every offloaded read fell back to the primary." }}
  {{- end }}
  # The bundled streaming replica (global-scale plan task 2.3, the in-cluster
  # shape). Services open their read pool against it; a replica outage falls
  # back to the primary (internal/common/database/readerfallback.go). The
  # credential matches DATABASE_URL's: through the pooler the fleet is
  # openidx_app, so the replica pool is too -- the same role, the same belt.
  {{- if .Values.pgcat.enabled }}
  DATABASE_READ_URL: "postgres://{{ .Values.pgcat.username }}:{{ required "pgcat.password is required when pgcat.enabled" .Values.pgcat.password }}@{{ include "openidx.postgresReadHost" . }}:5432/{{ .Values.postgresql.auth.database | default "openidx" }}?sslmode={{ .Values.database.sslMode | default "disable" }}"
  {{- else }}
  DATABASE_READ_URL: "postgres://{{ .Values.postgresql.auth.username | default "openidx" }}:{{ .Values.secrets.postgresPassword }}@{{ include "openidx.postgresReadHost" . }}:5432/{{ .Values.postgresql.auth.database | default "openidx" }}?sslmode={{ .Values.database.sslMode | default "disable" }}"
  {{- end }}
  {{- end }}
  REDIS_URL: "redis://:{{ .Values.secrets.redisPassword }}@{{ include "openidx.fullname" . }}-redis-master:6379"
  {{- with .Values.redis.roles.rateLimitUrl }}
  REDIS_RATELIMIT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.redis.roles.revocationUrl }}
  REDIS_REVOCATION_URL: {{ . | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "openidx.fullname" . }}-secrets
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "openidx.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/postgres-password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/redis-password
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/encryption-key
---
# Connection strings. Every service deployment mounts the -db-url secret via
# envFrom, so it must exist in external-secrets mode too (the plaintext
# version above is only rendered when externalSecrets is disabled). Store the
# full DATABASE_URL / REDIS_URL — pointing at managed RDS/ElastiCache in
# production — under these keys in the secret store.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "openidx.fullname" . }}-db-url
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "openidx.fullname" . }}-db-url
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/database-url
    {{- if .Values.externalSecrets.readReplica }}
    # Optional read-replica / reader-endpoint URL. When present, services open a
    # second read-only pool and serve read-mostly, lag-tolerant queries from it
    # (PostgresDB.Reader()); a replica outage transparently falls back to the
    # primary. Store <remoteKeyPrefix>/database-read-url pointing at the RDS
    # reader endpoint.
    - secretKey: DATABASE_READ_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/database-read-url
    {{- end }}
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/redis-url
    {{- if .Values.externalSecrets.redisRoles }}
    # Dedicated Redis instances per loss profile (design §4.4.2). The rate-limit
    # instance is the only one an attacker can fill (one key per source
    # address); keeping it apart means a counter flood can neither OOM the
    # login path nor evict a revocation marker. Store the two connection strings
    # under <remoteKeyPrefix>/redis-ratelimit-url and /redis-revocation-url
    # (managed cache endpoints: ratelimit = small, volatile-lru/allkeys-lru;
    # revocation = noeviction, persistent). Services alias a missing role to
    # REDIS_URL, so this can be enabled per environment.
    - secretKey: REDIS_RATELIMIT_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/redis-ratelimit-url
    - secretKey: REDIS_REVOCATION_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeyPrefix | default "openidx" }}/redis-revocation-url
    {{- end }}
{{- end }}
