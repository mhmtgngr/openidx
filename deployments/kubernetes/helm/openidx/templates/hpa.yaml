{{- /*
HorizontalPodAutoscalers for every request-serving deployment (global-scale
plan task 0.5). access-service and gateway-service were missing from this
list, so values-prod.yaml's `autoscaling: { enabled: true }` for them rendered
nothing and the two proxies ran at a fixed replica count under load.

Scaling behaviour is asymmetric on purpose: an attack or a launch arrives in
seconds, so scale-up doubles every minute with no stabilisation window; the
quiet after it can be a lull between waves, so scale-down waits five minutes
and sheds a quarter at a time. Without the down-side window an HPA flaps
between waves and each flap is a cold start under fire.
*/}}
{{- $services := dict
  "identity-service" .Values.identityService
  "governance-service" .Values.governanceService
  "provisioning-service" .Values.provisioningService
  "audit-service" .Values.auditService
  "admin-api" .Values.adminApi
  "oauth-service" .Values.oauthService
  "gateway-service" .Values.gatewayService
  "access-service" .Values.accessService
  "admin-console" .Values.adminConsole
}}
{{- $beh := .Values.autoscaling.behavior }}

{{- range $name, $svc := $services }}
{{- if and $svc.enabled (dig "autoscaling" "enabled" false $svc) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "openidx.fullname" $ }}-{{ $name }}
  labels:
    {{- include "openidx.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "openidx.fullname" $ }}-{{ $name }}
  minReplicas: {{ dig "autoscaling" "minReplicas" 2 $svc }}
  maxReplicas: {{ dig "autoscaling" "maxReplicas" 10 $svc }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ dig "autoscaling" "targetCPUUtilizationPercentage" 80 $svc }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ dig "autoscaling" "targetMemoryUtilizationPercentage" 80 $svc }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ $beh.scaleUp.stabilizationWindowSeconds }}
      selectPolicy: Max
      policies:
        - type: Percent
          value: {{ $beh.scaleUp.percent }}
          periodSeconds: {{ $beh.scaleUp.periodSeconds }}
        - type: Pods
          value: {{ $beh.scaleUp.pods }}
          periodSeconds: {{ $beh.scaleUp.periodSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ $beh.scaleDown.stabilizationWindowSeconds }}
      selectPolicy: Min
      policies:
        - type: Percent
          value: {{ $beh.scaleDown.percent }}
          periodSeconds: {{ $beh.scaleDown.periodSeconds }}
{{- end }}
{{- end }}
