{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openidx.fullname" . }}-api
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.edge.originVerify.header }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.edge.originVerify.header }}
    # Origin cloaking, application half (global-scale plan task 1.2, §5.2).
    # The network layer (NSG service tag on Azure, security group on AWS) says
    # "only the edge provider's ranges may connect" — but a service tag admits
    # EVERY tenant's Front Door and a CloudFront range every distribution. This
    # demands the header only OUR edge profile sends, and refuses without it,
    # before any service sees the request. Requires the controller to run with
    # allow-snippet-annotations=true (set in ingress-nginx-values.yaml).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($http_{{ .Values.edge.originVerify.header | lower | replace "-" "_" }} != "{{ required "edge.originVerify.value is required when edge.originVerify.header is set" .Values.edge.originVerify.value }}") {
        return 403;
      }
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # Identity Service
          {{- if $.Values.identityService.planeSplit.enabled }}
          # The plane split (task 3.4). These rules are GENERATED from the same
          # table the process registers routes with -- files/identity-planes.json,
          # written by `go run ./tools/identityplanes` -- because the split is
          # not a prefix: POST /users/forgot-password is ISSUE while GET /users
          # is ADMIN, and an Ingress cannot match on the method at all.
          #
          # Exact takes precedence over Prefix in Kubernetes path matching, so
          # the catch-all below only gets what no rule above claimed. That is
          # deliberate: a route added to the service and not yet classified
          # lands on ADMIN, which answers it (ProfileAdmin serves every
          # unclassified route) rather than 404ing it.
          {{- range $rule := ($.Files.Get "files/identity-planes.json" | fromJson).issue_rules }}
          - path: {{ $rule.path }}
            pathType: {{ $rule.type }}
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-identity-auth
                port:
                  name: http
          {{- end }}
          - path: /api/v1/identity
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-identity-admin
                port:
                  name: http
          {{- else }}
          - path: /api/v1/identity
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-identity-service
                port:
                  name: http
          {{- end }}
          # Governance Service
          - path: /api/v1/governance
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-governance-service
                port:
                  name: http
          # Provisioning Service — SCIM
          - path: /scim
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-provisioning-service
                port:
                  name: http
          # Provisioning Service — rules API
          - path: /api/v1/provisioning
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-provisioning-service
                port:
                  name: http
          # Audit Service
          - path: /api/v1/audit
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-audit-service
                port:
                  name: http
          # Admin API
          - path: /api/v1/dashboard
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-admin-api
                port:
                  name: http
          - path: /api/v1/settings
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-admin-api
                port:
                  name: http
          - path: /api/v1/applications
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-admin-api
                port:
                  name: http
          - path: /api/v1/directories
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-admin-api
                port:
                  name: http
          - path: /api/v1/mfa
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-admin-api
                port:
                  name: http
          # OAuth/OIDC Service
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-oauth-service
                port:
                  name: http
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-oauth-service
                port:
                  name: http
    {{- end }}
{{- end }}
---
{{- if and .Values.adminConsole.enabled .Values.adminConsole.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openidx.fullname" . }}-admin-console
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
  {{- with .Values.adminConsole.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.adminConsole.ingress.className }}
  ingressClassName: {{ .Values.adminConsole.ingress.className }}
  {{- end }}
  {{- if .Values.adminConsole.ingress.tls }}
  tls:
    {{- range .Values.adminConsole.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.adminConsole.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "openidx.fullname" $ }}-admin-console
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
