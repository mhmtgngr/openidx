apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openidx.fullname" . }}-config
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
data:
  OPA_URL: {{ .Values.config.opaUrl | default "http://opa:8281" | quote }}
  ELASTICSEARCH_URL: {{ .Values.config.elasticsearchUrl | default "http://elasticsearch:9200" | quote }}
  OAUTH_ISSUER: {{ .Values.config.oauthIssuer | default "http://oauth-service:8006" | quote }}
  OAUTH_JWKS_URL: {{ .Values.config.oauthJwksUrl | default "http://oauth-service:8006/.well-known/jwks.json" | quote }}
  VITE_API_URL: {{ .Values.config.viteApiUrl | default "https://api.openidx.io" | quote }}
  VITE_OAUTH_URL: {{ .Values.config.viteOauthUrl | default "https://auth.openidx.io" | quote }}
  VITE_OAUTH_CLIENT_ID: {{ .Values.config.viteOauthClientId | default "admin-console" | quote }}
  # Multi-tenancy (v1.6+). TENANT_BASE_DOMAIN enables per-tenant subdomain/issuer
  # resolution. DEFAULT_ORG_FALLBACK MUST stay false for multi-tenant installs
  # (single-tenant installs set it true). See docs/v2-multitenancy-design.md.
  TENANT_BASE_DOMAIN: {{ .Values.config.tenantBaseDomain | default "" | quote }}
  DEFAULT_ORG_FALLBACK: {{ .Values.config.defaultOrgFallback | default false | quote }}
  DEFAULT_ORG_ID: {{ .Values.config.defaultOrgId | default "00000000-0000-0000-0000-000000000010" | quote }}
  # Which hops may set the client's address in X-Forwarded-For. Empty trusts
  # loopback only — and under Helm the ingress controller is a different pod, so
  # an empty value means every service resolves each request to the ingress pod's
  # address: one shared per-IP rate-limit bucket, audit records that all name the
  # ingress, and known-IP device trust and geo rules comparing against it. Set
  # config.trustedProxies to the ingress controller's pod CIDR. Services warn
  # once per hop and export openidx_forwarded_for_from_untrusted_hop_total until
  # it matches. Never "*".
  OIDX_TRUSTED_PROXIES: {{ .Values.config.trustedProxies | default "" | quote }}
  # How the tenant scope reaches Postgres (global-scale plan task 2.1):
  #   session (default) — stamped on the pooled connection at checkout.
  #   local             — stamped on each transaction (SET LOCAL), which is the
  #                       ONLY mode a transaction pooler may sit in front of.
  # pgcat.enabled requires "local"; the chart refuses to render otherwise.
  RLS_MODE: {{ .Values.config.rlsMode | default "session" | quote }}
  # The cell this install serves (global-scale plan task 4.1). Empty is a
  # single-cell install, which is every install today, and empty changes
  # nothing. Set, the issuer stamps it into the `cell` claim of every access
  # token, and the services answer 421 Misdirected Request to a token stamped
  # with a DIFFERENT cell instead of a 404 from a database that does not hold
  # that tenant. It belongs in this shared ConfigMap rather than per service
  # BECAUSE every service in one cell must agree on the answer: a cell where
  # one service refuses a foreign token and another serves it is worse than one
  # where none do, since the behaviour then depends on which endpoint was hit.
  CELL_ID: {{ .Values.config.cellId | default "" | quote }}
  # Bot gate at the login door (global-scale plan task 1.4): off | observe |
  # enforce. Start in observe and read the bot_gate audit rows before enforce.
  BOT_GATE: {{ .Values.config.botGate | default "off" | quote }}
  # Application assignment as a grant (#956): an unassigned user is refused at
  # /oauth/authorize, the access proxy and the Ziti dial. true on a fresh
  # install; an upgrade keeps what the running release has, and a release
  # that predates this key stays report-only until the operator sets it.
  ACCESS_ASSIGNMENT_ENFORCE: {{ include "openidx.installDefault" (dict "ctx" . "key" "ACCESS_ASSIGNMENT_ENFORCE" "value" .Values.config.accessAssignmentEnforce "install" "true" "upgrade" "false") | quote }}
  # Attribute-based policies (#956): off | observe | enforce. A fresh install
  # evaluates and audits in observe; an upgrade keeps its current mode.
  ABAC_ENFORCE: {{ include "openidx.installDefault" (dict "ctx" . "key" "ABAC_ENFORCE" "value" .Values.config.abacEnforce "install" "observe" "upgrade" "off") | quote }}
  LOGIN_FAIL_CHALLENGE_AFTER: {{ .Values.config.loginFailChallengeAfter | default 5 | quote }}
  LOGIN_FAIL_WINDOW_SECONDS: {{ .Values.config.loginFailWindowSeconds | default 900 | quote }}
  # Per-tenant device-enrolment quota (rolling hour, every mint site). 0 = off,
  # reported as an open gate at startup. Shared because the count is per
  # tenant, not per replica: every access-service pod must enforce one number.
  # NOT `| default 100`: Helm's default treats 0 as empty and would silently
  # turn an operator's explicit 0 back into 100, making the "0 = off" promise
  # a lie. Only an ABSENT value falls back.
  {{- $quota := .Values.config.agentEnrollmentQuotaPerHour }}
  AGENT_ENROLLMENT_QUOTA_PER_HOUR: {{ if kindIs "invalid" $quota }}"100"{{ else }}{{ $quota | toString | quote }}{{ end }}
  # The PUBLIC half of Turnstile. It is here rather than in the secret store on
  # purpose: it is served to every browser the bot gate challenges, and the
  # login page cannot render the widget without it. The SECRET half stays in
  # the secret store. Either one missing means a challenged account waits out
  # the window instead, and the refusal says so.
  TURNSTILE_SITE_KEY: {{ .Values.config.turnstileSiteKey | default "" | quote }}
  # The externally reachable name of the access proxy. It is the host of every
  # temporary vendor-access link, so an unset value (in-code default:
  # "localhost") issues links that point at the RECIPIENT'S machine. Services
  # with APP_ENV=production refuse to start on a loopback value for that reason.
  # Falls back to the API ingress host, and to empty when there is none — empty
  # makes link issuance refuse with a message naming this setting, which is the
  # correct outcome for an install that has not said where it is reachable.
  {{- $accessProxyDomain := .Values.config.accessProxyDomain | default "" }}
  {{- if and (not $accessProxyDomain) .Values.ingress .Values.ingress.hosts }}
  {{- $accessProxyDomain = (first .Values.ingress.hosts).host | default "" }}
  {{- end }}
  ACCESS_PROXY_DOMAIN: {{ $accessProxyDomain | quote }}
  # PostgreSQL TLS mode. Services with APP_ENV=production refuse to start when
  # this is 'disable' — production must set 'require' or stronger.
  DATABASE_SSL_MODE: {{ .Values.database.sslMode | default "disable" | quote }}
  {{- if .Values.database.connectTimeout }}
  # Bound a single dial so a DB failover fails fast and the pool re-dials the
  # promoted primary instead of hanging (in-code default 5s when unset).
  DB_CONNECT_TIMEOUT: {{ .Values.database.connectTimeout | quote }}
  {{- end }}
  {{- if .Values.database.statementTimeout }}
  # Server-side per-statement cap so a query stuck on a degraded primary can't
  # pin a connection indefinitely (in-code default: off when unset).
  DB_STATEMENT_TIMEOUT: {{ .Values.database.statementTimeout | quote }}
  {{- end }}
{{- if and (not .Values.edge.cidrSync.enabled) .Values.edge.trustedCidrs }}
---
# Edge provider address ranges the services trust as forwarding hops, in
# addition to config.trustedProxies (global-scale plan task 0.2). Static form:
# the list is whatever the chart was installed with. When edge.cidrSync.enabled
# is true this object is NOT rendered — the CronJob owns it and keeps it at the
# provider's current ranges, so Helm never overwrites a fresher list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openidx.fullname" . }}-edge-cidrs
  labels:
    {{- include "openidx.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
data:
  OIDX_EDGE_TRUSTED_CIDRS: {{ join "," .Values.edge.trustedCidrs | quote }}
  PROVIDER: "static"
{{- end }}
