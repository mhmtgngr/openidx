# Audit Service
auditService:
  enabled: true
  replicaCount: 2
  image:
    repository: audit-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8004
  # WebSocket origin validation for audit stream
  # Controls which origins can connect to the real-time audit event stream
  # Prevents Cross-Site WebSocket Hijacking (CSWSH) attacks
  allowedOrigins: []
  # Examples:
  #   allowedOrigins:
  #     - https://admin.example.com
  #     - https://audit.example.com
  #   allowedOrigins:
  #     - https://*.example.com  # Wildcard subdomain
  # When empty (default), enforces same-origin policy
  enableSecurityLogging: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  pdb:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

