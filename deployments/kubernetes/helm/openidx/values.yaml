# PAM dedicated session brokers (two Guacamole stacks + a ziti-tunnel sidecar +
# a shared recordings PVC). Disabled by default; enable to make brokered PAM
# RDP/SSH/VNC launches work. When enabled, the access-service Deployment is
# pointed at these brokers and mounts the recordings PVC.
pamBroker:
  enabled: false
  guacd:
    image: guacamole/guacd:1.6.0
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  guacamole:
    image: guacamole/guacamole:1.6.0
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  zitiTunnel:
    image: openziti/ziti-edge-tunnel:1.16.2
    # Secret holding the enrolled #pam-broker-dialers identity (pam-broker.json).
    # When empty an emptyDir is used and you enroll into it out-of-band.
    identitySecret: ""
    # Override if the access-service is reachable at a non-default name.
    bindingsUrl: ""
  db:
    # A Postgres reachable from the cluster with the Guacamole JDBC schema loaded
    # into directDatabase + zitiDatabase. Point at the bundled postgres or a
    # dedicated instance; password comes from secrets.pamGuacDbPassword.
    hostname: openidx-postgresql
    user: guacamole
    directDatabase: guac_direct
    zitiDatabase: guac_ziti
  recordings:
    size: 20Gi
    accessMode: ReadWriteMany
    storageClass: ""

# OpenZiti fabric (Wave D3) — run the zero-trust overlay's control + data plane
# in-cluster. Disabled by default; enabling renders the controller StatefulSet
# (HA/Raft-ready), edge router Deployment, and their Services. Wiring the app
# services to the overlay (ZITI_CTRL_URL, identity enrollment) remains an operator
# step. See templates/ziti-fabric.yaml and docs/OPENIDX_ZITI_ARCHITECTURE.md.
zitiFabric:
  enabled: false
  controller:
    # Pinned to the version the embedded sdk-golang is verified against — the
    # same discipline as the compose stack (docs/OPENIDX_ZITI_ARCHITECTURE.md
    # §9 on version skew). Bump together with the SDK, never to :latest.
    image: openziti/ziti-controller:1.6.12
    # Set to 3 (or any odd number) for a Raft HA quorum. 1 = single controller.
    # With >1 replicas the chart also adds a PDB (maxUnavailable: 1) and soft
    # node anti-affinity; point the app at every member for management-API
    # failover: ZITI_CTRL_URLS=https://<pod-0-dns>:1280,https://<pod-1-dns>:1280,...
    replicas: 1
    advertisedAddress: ziti-controller
    port: 1280
    # Keep an operator-provisioned server cert from being regenerated on restart.
    autoRenewCerts: false
    service:
      type: ClusterIP
    persistence:
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  router:
    # Pinned with the controller (see note above).
    image: openziti/ziti-router:1.6.12
    # 2+ gives a redundant data plane (PDB minAvailable:1 + anti-affinity are
    # added automatically); the #all edge-router policies mean new routers
    # serve traffic with zero policy changes.
    replicas: 1
    advertisedAddress: ziti-router
    port: 3022
    mode: host
    browzer:
      enabled: false
      port: 3023
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Admin Console
adminConsole:
  enabled: true
  replicaCount: 2
  image:
    repository: admin-console
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: admin.openidx.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: admin-console-tls
        hosts:
          - admin.openidx.io
  pdb:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 80

# OPA — the policy engine the governance service consults (config.opaUrl).
# This renders a real Deployment + Service (templates/opa.yaml); the Service
# is named literally `opa` so the default opaUrl resolves. Policies load from
# a ConfigMap you create from the repo's policy bundle, e.g.:
#   kubectl create configmap opa-policies --from-file=deployments/docker/opa/policies/
# With policyConfigMap empty, OPA starts with no policies (every query returns
# undefined) — fine for evaluation, not for enforcing governance rules.
opa:
  enabled: true
  replicas: 2
  image: openpolicyagent/opa:0.61.0   # pinned with the compose stack
  policyConfigMap: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ----- Database migrations (in-chart) -----
# A Helm hook Job (templates/migrate-job.yaml) runs `migrate up` from the
# tools image: post-install (after the bundled PostgreSQL exists) and
# pre-upgrade (schema-first, before new pods roll). Services may crash-loop
# for a few seconds on a fresh install until the schema lands — that is the
# Job racing the Deployments, and it converges. Disable only if you run
# migrations out-of-band.
migrations:
  enabled: true
  image:
    repository: tools
    tag: latest
    pullPolicy: IfNotPresent
  backoffLimit: 6
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # The one thing the migrations cannot do for themselves: create the
  # openidx_app runtime role. Migrations connect as the database OWNER, and a
  # role without CREATEROLE cannot create a role, so v53's CREATE ROLE fails
  # and takes the whole install with it. templates/db-bootstrap-job.yaml runs
  # first (hook-weight -1) as the superuser and creates it; the full reasoning,
  # including why this is not an initdb script, is in that file's header.
  #
  # Only renders with the bundled PostgreSQL. With an external database
  # (postgresql.enabled=false) the migration DSN must itself be able to
  # CREATE ROLE, or openidx_app must already exist — see
  # docs/deployment/kubernetes.md.
  roleBootstrap:
    enabled: true
    # A psql client, nothing more. Docker Official, and 16 matches the
    # PostgreSQL the subchart pins (16.2). Override it for an air-gapped
    # registry; any image carrying psql will do.
    image: postgres:16-alpine
    pullPolicy: IfNotPresent
    backoffLimit: 3
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi

# ----- Scheduled database backups -----
# CronJob running `backup create` from the tools image (cmd/backup: encrypted,
# retention-pruned, optional S3 offload). Disabled by default because a backup
# needs a destination decision: either a PVC (pvc.create) or S3 (s3.*).
# BACKUP_ENCRYPTION_KEY reuses secrets.encryptionKey via the chart secret.
backup:
  enabled: false
  schedule: "0 3 * * *"
  retentionCount: 7
  image:
    repository: tools
    tag: latest
    pullPolicy: IfNotPresent
  pvc:
    create: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  s3:
    bucket: ""
    region: ""
    endpoint: ""
    # Secret with BACKUP_S3_ACCESS_KEY / BACKUP_S3_SECRET_KEY keys.
    credentialsSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Database connection options (applied to the generated DATABASE_URL secret)
database:
  # TLS mode for the PostgreSQL connection: disable | require | verify-ca | verify-full.
  # Defaults to 'disable' for in-cluster dev. Production MUST set 'require' or stronger —
  # services started with APP_ENV=production refuse to boot when this is 'disable'.
  sslMode: disable
  # Availability tuning (Tier 1). Left empty to use the in-code defaults; set to
  # override fleet-wide. Both are Go durations (e.g. "5s", "30s").
  #   connectTimeout   bounds a single dial so an RDS/Patroni failover fails fast
  #                    and the pool re-dials the promoted primary (code default 5s).
  #   statementTimeout server-side per-query cap so a query stuck on a degraded
  #                    primary can't hold a connection open forever (code default
  #                    off). WARNING: applies to ALL services sharing this config —
  #                    keep generous enough for audit/governance reports, and do
  #                    NOT set it so low that legitimate bulk work is aborted.
  #                    The chart's migration Job (migrations.enabled) runs with
  #                    its own connection and is not subject to this cap.
  connectTimeout: ""
  statementTimeout: ""

  # Per-plane Postgres roles (global-scale plan task 2.4, ADR-2).
  #
  # Migration v189 creates openidx_issue / openidx_admin / openidx_event, each
  # IN ROLE openidx_app (so it inherits v53's DML grants and, with them, the
  # v37 FORCE RLS policies) and each carrying its own budget on the SERVER:
  # statement_timeout 2s / 10s / 30s, idle_in_transaction_session_timeout
  # 60s / 120s / 300s. Attaching the budget to the role rather than to a DSN
  # means an operator cannot lose it by editing a secret, and it holds for a
  # psql session opened as that role too.
  #
  # Why it matters: every service connects as one role today with NO query time
  # limit, so one expensive ADMIN or EVENT query is indistinguishable to
  # Postgres from the login path and holds a backend for as long as it likes.
  # Once a query is RUNNING, the database cancelling it is the only layer that
  # can stop it -- cancelling a Go context abandons the call while the backend
  # keeps burning CPU and holding locks.
  #
  # OFF by default because the roles ship passwordless: turning this on means
  # giving them credentials. Measured in
  # internal/migrations/plane_roles_test.go against a real database with the
  # full chain: all three roles reach all 220 tables and every sequence, none
  # can escape the tenant belt, and an 8s query as openidx_issue is cancelled
  # after 2s with SQLSTATE 57014.
  planeRoles:
    enabled: false

    # Bundled PostgreSQL: one password for the three roles. They all inherit
    # openidx_app, so three different passwords would not narrow the blast
    # radius of a leak -- they would only be three things to rotate.
    # Set it on the server too (the roles are created passwordless):
    #   ALTER ROLE openidx_issue PASSWORD '...';  (and openidx_admin, openidx_event)
    password: ""

    # External or managed database: the three DSNs in full, instead of
    # `password`. All three must be set together.
    issueUrl: ""
    adminUrl: ""
    eventUrl: ""

    # Which plane each service connects as. The design (§4.3) draws the planes
    # by availability class, not by data ownership.
    #
    # identityService is `admin` rather than `issue` because one unsplit
    # identity-service serves BOTH planes -- the login surface and the console
    # -- so it has to take the looser budget or admin queries would be
    # cancelled at 2s. Once SERVICE_PROFILE splits it into two deployments the
    # auth half moves to `issue`.
    #
    # accessService is `admin` because its VERIFY paths (forward-auth) touch no
    # database at all, while its PAM and kill-switch work does.
    assignments:
      identityService: admin
      oauthService: issue
      accessService: admin
      adminApi: admin
      governanceService: admin
      provisioningService: admin
      auditService: event
      gatewayService: admin

# PostgreSQL
postgresql:
  enabled: true
  # Bitnami moved every pinned tag out of docker.io/bitnami in August 2025;
  # the free namespace now serves `latest` only. The tag this chart version
  # pins (see charts/postgresql) answers 404 there and 200 under
  # docker.io/bitnamilegacy — the same image, archived coordinates. Without
  # this override the bundled PostgreSQL never pulls, which `helm lint` and
  # `helm template` cannot see because the name is only wrong at pull time.
  # Follow-up: move off Bitnami's free tier rather than tracking its archive.
  image:
    repository: bitnamilegacy/postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  auth:
    # The application role. It must be named here or the subchart never
    # creates it, and DATABASE_URL (templates/secrets.yaml) has always named
    # `openidx`. Passwords come from the chart's own openidx-datastore-auth
    # secret so `secrets.postgresPassword` is the single knob; leaving
    # auth.postgresPassword empty here would make the subchart generate a
    # random one that the DSN could never match.
    username: openidx
    database: openidx
    existingSecret: openidx-datastore-auth
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      size: 20Gi

# Redis
redis:
  enabled: true
  # Bitnami moved every pinned tag out of docker.io/bitnami in August 2025;
  # the free namespace now serves `latest` only. The tag this chart version
  # pins (see charts/redis) answers 404 there and 200 under
  # docker.io/bitnamilegacy — the same image, archived coordinates. Without
  # this override the bundled Redis never pulls, which `helm lint` and
  # `helm template` cannot see because the name is only wrong at pull time.
  # Follow-up: move off Bitnami's free tier rather than tracking its archive.
  image:
    repository: bitnamilegacy/redis
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  auth:
    enabled: true
    # Same story as PostgreSQL above: an empty password makes the subchart
    # generate one, and REDIS_URL would then carry a different one.
    existingSecret: openidx-datastore-auth
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      size: 5Gi
  sentinel:
    enabled: false
    masterName: "mymaster"
    # When sentinel.enabled=true, deploy Redis in Sentinel mode for HA failover.
    # Sentinel addresses are auto-discovered from the Helm chart's headless service.
  # Role instances (design §4.4.2, plan task 0.1). The in-cluster subchart above
  # is the SESSION role. Point these at separate instances to move rate-limit
  # counters (the flood-able role; run it allkeys-lru) and revocation markers
  # (must never be evicted; run it noeviction + persistence) off the session
  # instance. Empty = alias REDIS_URL. In externalSecrets mode use
  # externalSecrets.redisRoles instead and store the URLs in the secret store.
  roles:
    rateLimitUrl: ""
    revocationUrl: ""

# Elasticsearch
elasticsearch:
  enabled: true
  # Bitnami moved every pinned tag out of docker.io/bitnami in August 2025;
  # the free namespace now serves `latest` only. The tag this chart version
  # pins (see charts/elasticsearch) answers 404 there and 200 under
  # docker.io/bitnamilegacy — the same image, archived coordinates. Without
  # this override the bundled Elasticsearch never pulls, which `helm lint` and
  # `helm template` cannot see because the name is only wrong at pull time.
  # Follow-up: move off Bitnami's free tier rather than tracking its archive.
  image:
    repository: bitnamilegacy/elasticsearch
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  # The kernel-settings init container is a separate image with the same fate.
  sysctlImage:
    repository: bitnamilegacy/os-shell
  replicas: 3
  minimumMasterNodes: 2
  volumeClaimTemplate:
    resources:
      requests:
        storage: 30Gi

# Monitoring — assumes a prometheus-operator (kube-prometheus-stack) or
# compatible CRDs in the cluster; the chart does not deploy Prometheus itself.
# monitoring.enabled gates the PrometheusRule alert bundle; serviceMonitor
# gates a ServiceMonitor scraping /metrics on every enabled OpenIDX service
# (all eight expose it on their HTTP port).
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels for Prometheus instance selection (e.g. release: kube-prometheus-stack)
    labels: {}

  # Alert delivery.
  #
  # The alert rules decide what is worth waking someone for; this decides where
  # those alerts go. Without a route they evaluate, fire, and then sit in the
  # Prometheus UI where nobody is looking — a quietly expensive failure, because
  # everyone assumes someone is being paged.
  #
  # Left disabled by default: an install cannot guess your channel, and a
  # half-configured receiver drops alerts just as silently as no receiver.
  # Enable it and fill in exactly one delivery method (or several).
  alerting:
    enabled: false
    defaultReceiver: openidx-default
    # Optional separate destination for severity=critical (for example a pager
    # rotation while everything else goes to a chat channel). Leave empty to
    # send everything to defaultReceiver.
    criticalReceiver: ""

    # Wait before the first notification so a rollout or node failure arrives as
    # one message instead of one per replica.
    groupWait: 30s
    groupInterval: 5m
    # Re-send while still firing: long enough not to be noise, short enough that
    # a forgotten incident resurfaces.
    repeatInterval: 4h
    criticalRepeatInterval: 1h

    # Simplest option, and the one that needs no secret: post to an HTTP
    # endpoint. OpenIDX's own webhook subscriptions can receive these.
    webhook:
      enabled: false
      url: ""
      sendResolved: true

    # Secrets are referenced, never inlined: a chat webhook URL is a credential
    # and does not belong in values.yaml or in git.
    slack:
      enabled: false
      channel: "#alerts"
      secretName: alertmanager-slack
      secretKey: webhook-url
      sendResolved: true

    email:
      enabled: false
      to: ""
      from: ""
      smarthost: ""
      secretName: alertmanager-smtp
      secretKey: password
      sendResolved: true

    # Applied to criticalReceiver when one is configured.
    criticalWebhook:
      enabled: false
      url: ""
      sendResolved: true

    pagerduty:
      enabled: false
      secretName: alertmanager-pagerduty
      secretKey: routing-key
      sendResolved: true

# ----- Autoscaling behaviour (global-scale plan task 0.5) -----
# Shared by every per-service HPA (templates/hpa.yaml). Per-service blocks set
# min/max and the utilisation targets; this sets HOW the controller moves.
# Up fast, down slowly: a login flood or a launch arrives in seconds, the quiet
# after it may be a lull between waves. CPU targets default to 60% rather than
# 80% because identity traffic saturates connections and database waits before
# CPU — by the time CPU reads 80%, p99 has already gone. KEDA replaces the CPU
# signal with queue-wait and request-rate triggers in plan task 3.6.
autoscaling:
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      percent: 100      # may double...
      pods: 4           # ...or add four pods, whichever is more (selectPolicy: Max)
      periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      percent: 25       # shed at most a quarter per period
      periodSeconds: 60

# ----- Transaction pooler (global-scale plan task 2.2) -----
# pgcat decouples the fleet's client connections from Postgres backends. Without
# it the backend count is services x replicas x DB_MAX_CONNS and autoscaling
# multiplies it; with it the budget is replicaCount x poolSize, a constant.
#
# DISABLED by default, and the chart REFUSES TO RENDER if it is enabled while
# config.rlsMode is not "local": a transaction pooler with session-scoped tenant
# state hands one tenant's scope to the next client. That is measured, not
# theoretical — docs/evidence/2026-09-13-rls-transaction-pooling.md.
#
# Before enabling: run config.rlsMode=local on a canary cell for two weeks with
# the isolation suite green (the plan's gate), then turn this on. The chart
# repoints the request-serving services at <release>-pgcat itself -- leaving
# that to an operator meant a pooler could render with nothing using it, or
# with half the fleet using it. The migration Job, the bootstrap hook and the
# backup CronJob keep the DIRECT DSN: none of the three survives transaction
# pooling (session-scoped advisory locks, one snapshot per dump).
pgcat:
  enabled: false
  replicaCount: 2
  port: 6432
  # pgcat's Prometheus exporter (pgcat_pools_* gauges). Its own port, scraped by
  # its own ServiceMonitor; see the OpenIDXPooler* alerts.
  metricsPort: 9930
  # The fleet's Postgres backend budget, PER REPLICA. replicaCount x poolSize is
  # what Postgres sees; keep it comfortably under max_connections with room for
  # migrations, psql and monitoring. At the defaults: 2 x 40 = 80 backends,
  # CONSTANT -- it does not move when a service scales out, which is the whole
  # reason this exists. Without the pooler the same fleet is
  # 8 services x replicas x DB_MAX_CONNS (=10), so 80 at one replica each and
  # 400 at five.
  #
  # DB_MAX_CONNS keeps its meaning on the service side but stops being the
  # thing that protects Postgres: it then sizes cheap client connections to the
  # pooler. Raise it for a hot service without renegotiating max_connections
  # with every other service (internal/common/database/database.go says the
  # same next to the default).
  poolSize: 40
  minPoolSize: 5
  workerThreads: 4
  # pgx caches prepared statements; a pooler that does not track them fails
  # every query with SQLSTATE 42P05. pgcat's own default is 0, which means
  # disabled, so this is not optional and the chart refuses to render a zero.
  preparedStatementsCacheSize: 500
  # Connection details for the UPSTREAM Postgres. username/password must be the
  # unprivileged application role (openidx_app), never the owner or a superuser:
  # a superuser bypasses every RLS policy, which would make the tenant belt
  # decorative.
  postgresHost: ""
  postgresPort: 5432
  databaseName: openidx
  username: openidx_app
  # password and adminPassword are deliberately NOT declared with an empty
  # default. templates/pgcat.yaml `required`s both, and `required` fails on a
  # missing key exactly as it fails on an empty string -- so the behaviour is
  # identical while the file no longer carries a literal blank credential for
  # a scanner (or a reader) to take at face value. Supply them with --set or a
  # values file:
  #   --set pgcat.password=... --set pgcat.adminPassword=...
  # Client -> pooler, inside the cluster. pgcat here terminates no TLS, so this
  # is "disable" and not database.sslMode: a "require" that nothing serves is a
  # fleet that cannot connect. Give the pooler a certificate first, then raise
  # this.
  sslMode: disable
  image:
    # v1.2.0 is the only released tag in this registry -- everything else is a
    # commit SHA or a branch. Verified against the registry, because a tag that
    # does not exist is invisible until the kubelet tries to pull it.
    repository: ghcr.io/postgresml/pgcat
    tag: "v1.2.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# ----- Edge provider (global-scale plan task 0.2) -----
# The client-IP chain behind an anycast/CDN edge. Every per-IP control in the
# services (the auth-path rate limiter, audit actor IPs, known-IP device trust,
# geo rules) reads gin's ClientIP, which is only the client when the hop that
# forwarded the request is trusted. Behind a provider, that hop is one of the
# provider's published ranges — and those change on the provider's schedule.
edge:
  # Static list of provider CIDRs, unioned into the services' trusted-proxy
  # set via OIDX_EDGE_TRUSTED_CIDRS. Ignored when cidrSync.enabled (the job
  # owns the list then). config.trustedProxies still carries YOUR hops (the
  # ingress controller's pod CIDR); this carries the provider's.
  trustedCidrs: []
  # Keep the list at the provider's current ranges with a CronJob
  # (files/edge-cidr-sync.sh). On a changed list it rolls the service
  # deployments, since env from a ConfigMap is read at pod start. Any fetch,
  # parse or sanity failure leaves the current list untouched and fails the
  # Job (alert OpenIDXEdgeCidrSyncFailed). Trigger the first run by hand:
  #   kubectl create job --from=cronjob/<release>-edge-cidr-sync edge-cidr-sync-now
  # Origin cloaking, application half (task 1.2). The edge proves WHICH edge it
  # is with a header only our profile sends; the ingress refuses anything
  # without it. Network-layer allow-lists are not enough on their own: an Azure
  # service tag covers every tenant's Front Door, a CloudFront range every
  # distribution.
  #   Azure Front Door : header "X-Azure-FDID", value = the profile's resource
  #                      GUID (terraform output origin_verification).
  #   AWS CloudFront   : header "X-Edge-Origin-Verify", value = the module's
  #                      generated secret (keep it in the secret store).
  #   Cloudflare       : leave EMPTY — mTLS (Authenticated Origin Pulls) proves
  #                      it on the listener, which is stronger than a header.
  # Empty header disables the check entirely (local clusters, no edge).
  originVerify:
    header: ""
    value: ""
  cidrSync:
    enabled: false
    # cloudflare | aws-cloudfront | static (static uses trustedCidrs above)
    provider: cloudflare
    schedule: "17 */6 * * *"
    image:
      repository: alpine/k8s
      tag: "1.31.1"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: api.openidx.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.openidx.io

# Service Account
serviceAccount:
  create: true
  name: openidx
  annotations: {}

# Pod Security
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Pod anti-affinity — spread replicas across nodes
podAntiAffinity:
  enabled: true
  weight: 100

# Zero-downtime termination.
#
# Kubernetes removes a Pod from Service endpoints and sends SIGTERM at the same
# time; those two propagate independently. Without a pause the container can be
# gone while some nodes still forward to it, which shows up as 502s during an
# otherwise healthy rolling update.
#
# preStopSeconds must cover endpoint propagation; gracePeriodSeconds must cover
# preStop plus the application's own drain (shutdown_timeout_seconds, 30s by
# default) or Kubernetes SIGKILLs mid-drain and cuts live requests.
gracefulTermination:
  enabled: true
  preStopSeconds: 5
  gracePeriodSeconds: 45

# Spread replicas across availability zones.
#
# podAntiAffinity above keeps replicas off one node; this keeps them out of one
# zone. ScheduleAnyway is deliberate: DoNotSchedule leaves pods Pending on a
# single-zone cluster, trading an availability gain for an outage. Set it to
# DoNotSchedule on a genuinely multi-zone cluster if you want the hard rule.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

# Rolling update capacity.
#
# Kubernetes defaults to maxUnavailable=25%: a deploy can remove a quarter of
# the fleet before replacements are Ready. maxUnavailable=0 with maxSurge=1
# means a new pod must be Ready before an old one goes, so capacity never dips
# during a deploy. Costs one extra pod for the length of the rollout.
rollingUpdate:
  enabled: true
  maxUnavailable: 0
  maxSurge: 1

# Network Policy — zero-trust network segmentation
networkPolicy:
  enabled: false

# TLS for inter-service communication (opt-in)
serviceTLS:
  enabled: false
  # Secret containing tls.crt and tls.key for service certificates
  certSecret: ""
  # Secret containing ca.crt for CA certificate (enables mTLS verification)
  caSecret: ""
