# OpenIDX Helm Chart Values

nameOverride: ""
fullnameOverride: ""

# ----- Secrets -----
# Provide values here for development/testing only.
# For production, use externalSecrets (below) or --set flags.
secrets:
  postgresPassword: ""      # REQUIRED
  redisPassword: ""          # REQUIRED
  encryptionKey: ""          # REQUIRED - exactly 32 bytes
  smtpPassword: ""
  # PAM dedicated brokers (pamBroker.enabled). REST admin credentials for the
  # direct + ziti Guacamole brokers, and the brokers' Postgres password.
  guacamoleAdminPassword: ""
  guacamoleZitiAdminPassword: ""
  pamGuacDbPassword: ""

# ----- External Secrets Operator -----
# Enable this to pull secrets from AWS Secrets Manager, HashiCorp Vault, etc.
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  remoteKeyPrefix: "openidx"
  # When true, also pull <remoteKeyPrefix>/database-read-url into DATABASE_READ_URL
  # so services open a read-replica pool (PostgresDB.Reader()). Off by default;
  # a replica outage transparently falls back to the primary.
  readReplica: false
  # When true, also pull <remoteKeyPrefix>/redis-ratelimit-url and
  # /redis-revocation-url so rate-limit counters and revocation markers run on
  # their own instances (see redis.roles below and design §4.4.2). Off by
  # default; a missing role aliases REDIS_URL.
  redisRoles: false

global:
  # Image namespace for OpenIDX's OWN images. Matches the GHCR pipeline in
  # .github/workflows/docker.yml, which publishes
  # ghcr.io/mhmtgngr/openidx/<service>.
  # Empty means the chart default (ghcr.io/mhmtgngr/openidx). It is left
  # empty rather than pre-filled so that an operator who set only the old
  # `imageRegistry` key still gets their images from it — pre-filling here
  # would satisfy the lookup first and make that fallback dead code.
  openidxRegistry: ""

  # Must stay empty. This key belongs to the Bitnami subchart contract
  # (postgresql, redis, elasticsearch): their `common.images.image` helper
  # prefers the global over each chart's own image.registry, so any value
  # here is prefixed onto THEIR images too. It used to hold the OpenIDX
  # namespace, which rendered the bundled data plane as
  # ghcr.io/mhmtgngr/openidx/bitnami/postgresql:16.2.0-... — an image that
  # does not exist, so a default `helm install` could never start Postgres.
  # Set it only if you mirror the Bitnami images somewhere, and then set
  # openidxRegistry too. See templates/_helpers.tpl `openidx.imageRegistry`.
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  environment: "production"
  logLevel: "info"

# ----- Service URLs (ConfigMap) -----
config:
  opaUrl: "http://opa:8281"
  elasticsearchUrl: "http://elasticsearch:9200"
  oauthIssuer: "https://auth.openidx.io"
  oauthJwksUrl: "http://oauth-service:8006/.well-known/jwks.json"
  viteApiUrl: "https://api.openidx.io"
  viteOauthUrl: "https://auth.openidx.io"
  viteOauthClientId: "admin-console"
  # Multi-tenancy. Leave tenantBaseDomain empty for single-tenant installs (and
  # set defaultOrgFallback: true). Multi-tenant installs set the base domain and
  # keep defaultOrgFallback: false so unresolved requests fail closed.
  tenantBaseDomain: ""
  defaultOrgFallback: true
  defaultOrgId: "00000000-0000-0000-0000-000000000010"
  # Hops allowed to set the client's address in X-Forwarded-For (comma-separated
  # CIDRs or IPs). Empty trusts loopback only, which in Kubernetes means NO hop:
  # the ingress controller runs in its own pod, so every service resolves each
  # request to that pod's address and the client's real IP never arrives. That
  # collapses per-IP rate-limit buckets, audit IPs, known-IP device trust and geo
  # rules onto one address. Set this to your cluster's pod network CIDR (the
  # --pod-network-cidr the cluster was built with); `kubectl get pod -n
  # ingress-nginx -o wide` prints the address that has to be covered. Services
  # warn once per hop and export openidx_forwarded_for_from_untrusted_hop_total
  # until it is right; "*" is not a fix, it restores gin's trust-everything
  # default and lets any caller name its own client IP.
  trustedProxies: ""
  # Bot gate at the login door (task 1.4). Per-account failure counter across
  # every source address; after loginFailChallengeAfter failures in
  # loginFailWindowSeconds the next attempt answers challenge_required.
  # off (default) | observe (record who would be challenged) | enforce.
  # Turnstile has two halves and they are not interchangeable: TURNSTILE_SECRET
  # (the verifier) belongs in the secret store, and turnstileSiteKey (the public
  # key the login page renders the widget with) belongs here, because every
  # challenged browser receives it anyway. With either missing a challenged
  # account waits out the window and the refusal says to wait rather than
  # asking for a challenge that cannot be shown.
  turnstileSiteKey: ""
  # Tenant-scope transport (task 2.1): session | local. Default session is
  # today's behaviour. "local" is required before any transaction pooler
  # (pgcat below) may be put in front of Postgres.
  rlsMode: "session"
  # The cell this install serves (task 4.1). Empty = a single-cell install,
  # which is every install today; nothing changes until it is set. When it is,
  # every service in the cell reads the SAME value from the shared ConfigMap,
  # and a token minted in another cell gets 421 with X-OpenIDX-Cell naming this
  # one. It is a backstop behind the edge's routing decision, not the routing.
  cellId: ""
  botGate: "off"
  # Application assignment as a grant (#956). Empty means true on a fresh
  # install and unchanged on upgrade. Set true or false to decide it
  # explicitly, which you must do when the chart is rendered with
  # `helm template` (a GitOps tool, for example), because that cannot see
  # the running release.
  accessAssignmentEnforce: ""
  # ABAC mode (#956): off | observe | enforce. Empty means observe on a fresh
  # install and unchanged on upgrade. The chart never chooses enforce, by
  # decision: set it yourself once the access.abac.would_deny audit records
  # name only the people a policy is meant to stop.
  abacEnforce: ""
  loginFailChallengeAfter: 5
  loginFailWindowSeconds: 900
  # How many device-enrolment tokens one tenant may mint in a rolling hour,
  # across the admin endpoint, the Android QR and the onboarding wizard. The
  # next request is refused with 429 and a Retry-After. 0 turns the quota off
  # (a lab), and startup then reports it as an open gate.
  agentEnrollmentQuotaPerHour: 100
  # Externally reachable host of the access proxy — the host every temporary
  # vendor-access link is built from. Leave empty to inherit the API ingress
  # host (ingress.hosts[0].host). It must be a name the OUTSIDE party can
  # resolve: the in-code default is "localhost", which produces links that open
  # the recipient's own machine, and services started with APP_ENV=production
  # refuse to boot on a loopback value.
  accessProxyDomain: ""

# Identity Service
identityService:
  # Split this service into two Deployments, one per availability plane
  # (global-scale plan task 3.4, ADR-2). Off by default: one Deployment serving
  # both planes is what every install has today.
  #
  # On, it renders `-identity-auth` with SERVICE_PROFILE=auth (the ISSUE plane)
  # and `-identity-admin` with SERVICE_PROFILE=admin, and the Ingress sends the
  # ISSUE paths to the first and everything else to the second. The path rules
  # are GENERATED from the same table the process registers routes with
  # (files/identity-planes.json, `go run ./tools/identityplanes`) -- they are
  # not a prefix, because POST /users/forgot-password is ISSUE while GET /users
  # is ADMIN.
  #
  # Why it is worth two Deployments: ADMIN is the first plane shed under load,
  # and shedding it buys nothing while the same process also answers logins.
  #
  # Each half can be pinned to its own node pool (plan 3.4: ADMIN load must not
  # be able to starve ISSUE of CPU, and two Deployments on the same nodes still
  # share them). nodeSelector is the pool's label, tolerations its taint; both
  # are empty by default and then nothing about scheduling changes. A pool
  # that carries a taint needs BOTH -- a selector alone leaves the pods
  # Pending against the taint, a toleration alone lets them land anywhere.
  #   auth:
  #     nodeSelector: { openidx.io/plane: issue }
  #     tolerations: [{ key: openidx.io/plane, operator: Equal, value: issue, effect: NoSchedule }]
  planeSplit:
    enabled: false
    auth:
      # Both fall back to identityService.replicaCount / .resources when unset.
      replicaCount: null
      resources: null
      nodeSelector: {}
      tolerations: []
    admin:
      replicaCount: null
      resources: null
      nodeSelector: {}
      tolerations: []
  enabled: true
  replicaCount: 2
  image:
    repository: identity-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  pdb:
    enabled: true
    maxUnavailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 80

