# HTTPS front for OpenIDX in the conformance run (test/conformance/compose.yml).
#
# It plays the part nginx plays in the production layout: the login page and
# the issuer are served from ONE origin, https://op.openidx.test. That matters
# beyond tidiness. The single sign-on cookie is Secure and is set on the login
# page's same-origin request to /oauth/login, so the prompt=none, id_token_hint
# and max_age modules only mean something when both sit behind one host.
#
# /login is the scripted login page (login.html); everything else goes to
# oauth-service on the host.
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    # Request objects and long state values travel in the query string.
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;

    server {
        listen 443 ssl;
        server_name op.openidx.test;

        ssl_certificate     /etc/openidx-conformance/tls.crt;
        ssl_certificate_key /etc/openidx-conformance/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location = /login {
            alias /usr/share/openidx-conformance/login.html;
            default_type text/html;
            add_header Cache-Control "no-store" always;
        }

        location / {
            proxy_pass http://host.docker.internal:8006;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 60s;
        }
    }
}
