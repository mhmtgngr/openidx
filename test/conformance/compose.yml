# The OpenID Foundation conformance suite, plus the HTTPS front OpenIDX needs
# to be tested by it. Used by .github/workflows/oidc-conformance.yml and by the
# local run described in docs/OAUTH-OIDC.md ("Conformance testing").
#
# OpenIDX itself does not run here. Its services run on the host, built and
# started the way ci.yml's smoke job starts them, and `edge` reaches
# oauth-service on the host's port 8006.
#
# Two host names matter, and each must resolve the same way for the suite
# (inside this network) and for the host:
#
#   op.openidx.test          the OpenIDX issuer. Inside the network it is an
#                            alias of `edge`; on the host it must map to
#                            127.0.0.1 (the workflow adds it to /etc/hosts).
#   localhost.emobix.co.uk   the suite's own public name, the suite's default.
#                            Public DNS maps it to 127.0.0.1; inside the
#                            network it is an alias of `nginx`, as in the
#                            suite's docker-compose-prebuilt.yml.
#
# The suite checks that every endpoint in the discovery document is https, so
# the issuer cannot be plain http. Both nginx services present one certificate
# issued by a throwaway CA that test/conformance/gen-certs.sh makes for each
# run; CONFORMANCE_TLS_DIR names the directory it wrote. The suite accepts any
# certificate, but OpenIDX's back-channel logout client verifies the suite's,
# so oauth-service is started with that CA in its trust bundle.
#
# Images are pinned by digest. The suite's two images come from the release
# named in suite.env; bump them together with it.
name: openidx-conformance

services:
  mongodb:
    image: mongo:6.0.13@sha256:b415b12f638e2685d06c58ab7fb5943577c50fadec6d9340ef67d21aeac72070
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    image: registry.gitlab.com/openid/conformance-suite:release-v5.3.1@sha256:69495f453a920c262f66e5e72abd12501c33e05ce88051cddf300c00621a4d70
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      # The dev profile turns on the suite's devmode: its API answers without
      # a login, which is how run-test-plan.py drives a private instance.
      SPRING_PROFILES_ACTIVE: dev
      # The image passes these to the JVM unconditionally. They configure the
      # suite's own "log in with Google/GitLab" UI, which nothing here uses;
      # the values are the placeholders docker-compose-prebuilt.yml uses.
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    depends_on:
      mongodb:
        condition: service_healthy

  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:release-v5.3.1@sha256:6ea3f4b8854f1f3626c81350900962d9e5f86424791d8e72b378a26ee2f4c105
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      # Replaces the self-signed certificate baked into the image (CN=localhost,
      # no subjectAltName), which no Go client will accept for this host name.
      - ${CONFORMANCE_TLS_DIR:?set CONFORMANCE_TLS_DIR to the directory gen-certs.sh wrote}/tls.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ${CONFORMANCE_TLS_DIR:?set CONFORMANCE_TLS_DIR to the directory gen-certs.sh wrote}/tls.key:/etc/ssl/private/nginx-selfsigned.key:ro
    networks:
      default:
        aliases:
          - localhost.emobix.co.uk
    depends_on:
      - server

  edge:
    image: nginx:1.30.5-alpine@sha256:bf3201ab56f23e5954646379c775d511fc466e9f11376d9725361064ad07ed35
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/login.html:/usr/share/openidx-conformance/login.html:ro
      - ${CONFORMANCE_TLS_DIR:?set CONFORMANCE_TLS_DIR to the directory gen-certs.sh wrote}/tls.crt:/etc/openidx-conformance/tls.crt:ro
      - ${CONFORMANCE_TLS_DIR:?set CONFORMANCE_TLS_DIR to the directory gen-certs.sh wrote}/tls.key:/etc/openidx-conformance/tls.key:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - op.openidx.test
